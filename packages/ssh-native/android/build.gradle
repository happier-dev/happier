plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.happier.ssh'
version = '0.0.0'

android {
  namespace "dev.happier.ssh"
  defaultConfig {
    versionCode 1
    versionName version
  }

  sourceSets {
    main {
      jniLibs.srcDirs += ["${buildDir}/generated/rustJniLibs"]
    }
  }
}

tasks.register("buildHappierSshRustAndroid", Exec) {
  workingDir projectDir.parentFile
  commandLine "bash", "scripts/build-rust-android.sh"
}

preBuild.dependsOn(tasks.named("buildHappierSshRustAndroid"))
