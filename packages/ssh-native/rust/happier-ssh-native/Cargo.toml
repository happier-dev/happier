[package]
name = "happier-ssh-native"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "happier_ssh_native"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "0.22"
once_cell = "1"
russh = { version = "0.60.2", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
