appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
# Transcript-proof half of the New Session handoff. Runs only after the owning
# CLI has armed exact cleanup from the creation/send fact, so a failure here
# can no longer leak the armed disposable Session.
- extendedWaitUntil:
    visible: ${HAPPIER_E2E_CURRENT_SOURCE_TRANSCRIPT_SENTINEL}
    timeout: 120000
- assertVisible: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_ATTACHMENT_LABEL}
- assertVisible:
    id: "transcript-composer-attachment:.*"
- takeScreenshot: plugin-platform-current-source-public-transcript-${HAPPIER_E2E_MOBILE_PLATFORM}
