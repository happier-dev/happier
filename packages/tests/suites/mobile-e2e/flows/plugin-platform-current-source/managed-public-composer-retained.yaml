appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
# The v2 plugin projection has already replaced v1 while this accepted Session
# remains mounted. Its transcript presentation must stay immutable and must not
# require the retired contributor to execute again.
- extendedWaitUntil:
    visible: ${HAPPIER_E2E_CURRENT_SOURCE_TRANSCRIPT_SENTINEL}
    timeout: 30000
- assertVisible: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_ATTACHMENT_LABEL}
- assertVisible:
    id: "transcript-composer-attachment:.*"
- takeScreenshot: plugin-platform-current-source-public-transcript-retained-${HAPPIER_E2E_MOBILE_PLATFORM}
