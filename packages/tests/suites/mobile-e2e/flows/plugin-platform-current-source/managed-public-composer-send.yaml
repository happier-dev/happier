appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
# Create/send half of the New Session handoff. The QA-owned deep-link draft
# opens the exact New Session draft; this flow ends at the send's own custody
# proof (the composer screen is dismissed by the created Session's route) and
# never asserts the transcript. Exact cleanup for the created Session is armed
# by the owning CLI immediately after this flow and before the transcript flow
# runs.
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_NEW_SESSION_URL}
- extendedWaitUntil:
    visible:
      id: new-session-composer-input
    timeout: 60000
- tapOn:
    id: new-session-agent-dropdown-trigger
- extendedWaitUntil:
    visible: ${HAPPIER_E2E_CURRENT_SOURCE_AGENT_TITLE}
    timeout: 30000
- tapOn: ${HAPPIER_E2E_CURRENT_SOURCE_AGENT_TITLE}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_CONTROL_ID}
    timeout: 120000
- assertVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_REGION_ID}
- assertVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_SECONDARY_CONTROL_ID}
# Adjacent composed controls are independently tappable on the real native
# row. Owner geometry tests remain the exact 44pt/48dp measurement.
- tapOn:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_SECONDARY_CONTROL_ID}
- extendedWaitUntil:
    visible: Keep current QA facts
    timeout: 30000
- tapOn: Keep current QA facts
- tapOn:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_CONTROL_ID}
- extendedWaitUntil:
    visible: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_CHOICE_LABEL}
    timeout: 30000
- tapOn: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_CHOICE_LABEL}
- extendedWaitUntil:
    visible: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_ATTACHMENT_LABEL}
    timeout: 30000
- assertVisible: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_REFERENCE_LABEL}
- takeScreenshot: plugin-platform-current-source-public-composer-${HAPPIER_E2E_MOBILE_PLATFORM}
- tapOn:
    id: new-session-composer-send
# Send custody proof: a landed send leaves the New Session screen for the
# created Session's route. A failed launch keeps the composer mounted.
- extendedWaitUntil:
    notVisible:
      id: new-session-composer-input
    timeout: 120000
