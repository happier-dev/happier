appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_SENTINEL}
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_READY_ID}
    timeout: 120000
- assertNotVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_PREVIOUS_HOSTED_READY_ID}
- assertNotVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_PREVIOUS_HOSTED_SENTINEL}
- takeScreenshot: plugin-platform-current-source-hosted-transition-${HAPPIER_E2E_MOBILE_PLATFORM}
