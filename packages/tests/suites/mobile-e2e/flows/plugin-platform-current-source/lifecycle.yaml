appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
# Current-development-source Plugin UI lifecycle. The runner performs a full
# no-dev Metro reload and native-module probe before this flow; this file owns
# only app-visible behavior and uses no packaged/archive identity.
- launchApp:
    clearState: false
    clearKeychain: false

- runFlow:
    file: ../_shared/connectDevClientIfNeeded.yaml

# The caller prepares one public source plugin on the connected daemon. Its
# three renderer routes deliberately share the normal PluginSurfaceHost.
- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/plugins
- extendedWaitUntil:
    visible:
      id: settings.plugins.marketplace.installed.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}
    timeout: 120000

- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SENTINEL}
    timeout: 120000
- takeScreenshot: plugin-platform-current-source-rn-${HAPPIER_E2E_MOBILE_PLATFORM}

- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: plugin-hosted-web-frame
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_SENTINEL}
    timeout: 120000
# Create a real guest-history entry. Native Back must first be offered to the
# exact Swift/Kotlin hosted-frame cell and return the guest to its prior page.
- tapOn:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_HISTORY_ACTION_ID}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_HISTORY_SENTINEL}
    timeout: 120000
- back
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_SENTINEL}
    timeout: 30000
- assertNotVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_HISTORY_SENTINEL}
- takeScreenshot: plugin-platform-current-source-hosted-${HAPPIER_E2E_MOBILE_PLATFORM}

- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_TARGETED_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_TARGETED_SENTINEL}
    timeout: 120000
- takeScreenshot: plugin-platform-current-source-targeted-${HAPPIER_E2E_MOBILE_PLATFORM}

# Exercise the mounted Composer rather than a direct callback fixture. The two
# adjacent controls are tapped separately; source owner tests measure their
# 44pt iOS / 48dp Android physical frames because Maestro cannot read geometry.
- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///
- runFlow:
    file: ../_shared/gotoNewSessionComposer.yaml
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_ACTION_ID}
    timeout: 120000
- assertVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_CONTROL_ID}
- tapOn:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_CONTROL_ID}
- tapOn:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_ACTION_ID}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_ACTION_RESULT_ID}
    timeout: 120000
- assertVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_ATTACHMENT_ID}
- assertVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_REFERENCE_ID}
- assertVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_COMPOSER_REGION_ID}
- takeScreenshot: plugin-platform-current-source-composer-${HAPPIER_E2E_MOBILE_PLATFORM}
- tapOn:
    id: new-session-composer-input
- inputText: "PLUGIN_UI_CURRENT_SOURCE_NATIVE"
- tapOn:
    id: new-session-composer-send
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_TRANSCRIPT_SENTINEL}
    timeout: 240000
- back

# Update is catalog-driven. The prepared current-source row supplies v1 as the
# installed generation and v2 as the available source generation.
- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/plugins
- extendedWaitUntil:
    visible:
      id: settings.plugins.marketplace.action.update.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}
    timeout: 120000
- tapOn:
    id: settings.plugins.marketplace.action.update.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}
- extendedWaitUntil:
    visible:
      id: web-modal-button-0
    timeout: 120000
- tapOn:
    id: web-modal-button-0
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SENTINEL_AFTER_UPDATE}
    timeout: 120000
- assertNotVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SENTINEL}
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: plugin-hosted-web-frame
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_SENTINEL_AFTER_UPDATE}
    timeout: 120000
- assertNotVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_HOSTED_SENTINEL}
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_TARGETED_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_TARGETED_SENTINEL_AFTER_UPDATE}
    timeout: 120000
- assertNotVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_TARGETED_SENTINEL}

# Disable/enable proves current mounted work retires and the same public source
# capability returns without a private first-party path.
- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/plugins
- tapOn:
    id: settings.plugins.marketplace.installed.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}.action.disable
- extendedWaitUntil:
    visible:
      id: web-modal-button-0
    timeout: 120000
- tapOn:
    id: web-modal-button-0
- extendedWaitUntil:
    visible:
      id: settings.plugins.marketplace.installed.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}.action.enable
    timeout: 120000
# The exact public surface has retired; do not credit the Settings label alone.
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: plugin-surface-unavailable
    timeout: 120000
- assertNotVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SENTINEL_AFTER_UPDATE}
- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/plugins
- tapOn:
    id: settings.plugins.marketplace.installed.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}.action.enable
- extendedWaitUntil:
    visible:
      id: web-modal-button-0
    timeout: 120000
- tapOn:
    id: web-modal-button-0
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SENTINEL_AFTER_UPDATE}
    timeout: 120000

# Background/foreground covers retained native mount continuity. Deliberate
# daemon reconnect and Account switching remain separate loaded rows because
# this flow must not stop or rewrite the human-owned managed Stack.
- pressKey: HOME
- launchApp:
    clearState: false
    clearKeychain: false
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SENTINEL_AFTER_UPDATE}
    timeout: 120000

# Uninstall/reinstall is intentionally last. It uses the normal marketplace
# owner and requires the prepared current-source catalog entry to be installable.
- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/plugins
- tapOn:
    id: settings.plugins.marketplace.installed.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}
- extendedWaitUntil:
    visible:
      id: settings.plugins.detail.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}.action.uninstall
    timeout: 120000
- tapOn:
    id: settings.plugins.detail.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}.action.uninstall
- extendedWaitUntil:
    visible:
      id: web-modal-button-0
    timeout: 120000
- tapOn:
    id: web-modal-button-0
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: plugin-surface-unavailable
    timeout: 120000
- assertNotVisible:
    id: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SENTINEL_AFTER_UPDATE}
- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/plugins
- extendedWaitUntil:
    visible:
      id: settings.plugins.marketplace.action.install.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}
    timeout: 120000
- tapOn:
    id: settings.plugins.marketplace.action.install.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}
- extendedWaitUntil:
    visible:
      id: web-modal-button-0
    timeout: 120000
- tapOn:
    id: web-modal-button-0
- extendedWaitUntil:
    visible:
      id: settings.plugins.marketplace.installed.${HAPPIER_E2E_CURRENT_SOURCE_PLUGIN_ID}
    timeout: 120000
- openLink: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SURFACE_URL}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_CURRENT_SOURCE_RN_SENTINEL_AFTER_UPDATE}
    timeout: 120000
- takeScreenshot: plugin-platform-current-source-lifecycle-${HAPPIER_E2E_MOBILE_PLATFORM}
