appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
- launchApp:
    clearState: false

- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/plugins
- extendedWaitUntil:
    visible:
      id: settings.plugins.management.view:installed
    timeout: 120000

- assertVisible:
    id: settings.plugins.appPanels
- tapOn:
    id: settings.plugins.appPanels
- extendedWaitUntil:
    visible:
      id: settings.plugins.appPanels.host
    timeout: 120000
- tapOn:
    id: ${HAPPIER_E2E_PLUGIN_TAB_ID}
- extendedWaitUntil:
    visible:
      id: candidate-native-surface
    timeout: 120000
- assertVisible:
    id: ${HAPPIER_E2E_PLUGIN_SENTINEL_V1}
- extendedWaitUntil:
    visible:
      id: candidate-native-host-api-ok
    timeout: 120000
- tapOn:
    id: candidate-native-crash-trigger
- extendedWaitUntil:
    visible:
      id: plugin-rn-ui-unavailable
    timeout: 120000
- tapOn:
    id: app-scope-right-sidebar-tab:plugin:happier.inspector:inspector-app
- extendedWaitUntil:
    visible:
      id: inspector-surface
    timeout: 120000
- tapOn:
    id: ${HAPPIER_E2E_PLUGIN_TAB_ID}
- extendedWaitUntil:
    visible:
      id: ${HAPPIER_E2E_PLUGIN_SENTINEL_V1}
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: candidate-native-host-api-ok
    timeout: 120000
- tapOn:
    id: app-scope-right-sidebar-tab:plugin:happier.inspector:inspector-app
- extendedWaitUntil:
    visible:
      id: inspector-surface
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: inspector-plugin-${HAPPIER_E2E_PLUGIN_ID}
    timeout: 120000
- tapOn:
    id: inspector-plugin-${HAPPIER_E2E_PLUGIN_ID}
- extendedWaitUntil:
    visible:
      id: inspector-reload-selected-${HAPPIER_E2E_PLUGIN_ID}
    timeout: 120000
- tapOn:
    id: inspector-reload-selected-${HAPPIER_E2E_PLUGIN_ID}
- extendedWaitUntil:
    visible:
      id: inspector-last-reload
    timeout: 120000
- takeScreenshot: plugin-platform-inspector-mounted-${HAPPIER_E2E_MOBILE_PLATFORM}

- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/plugins
- extendedWaitUntil:
    visible:
      id: settings.plugins.marketplace.installed.${HAPPIER_E2E_PLUGIN_ID}
    timeout: 120000
- tapOn:
    id: settings.plugins.marketplace.installed.${HAPPIER_E2E_PLUGIN_ID}.action.disable
- extendedWaitUntil:
    visible:
      id: web-modal-button-0
    timeout: 120000
- tapOn:
    id: web-modal-button-0
- extendedWaitUntil:
    visible:
      id: settings.plugins.marketplace.installed.${HAPPIER_E2E_PLUGIN_ID}.action.enable
    timeout: 120000
- tapOn:
    id: settings.plugins.marketplace.installed.${HAPPIER_E2E_PLUGIN_ID}.action.enable
- extendedWaitUntil:
    visible:
      id: web-modal-button-0
    timeout: 120000
- tapOn:
    id: web-modal-button-0

- tapOn:
    id: settings.plugins.appPanels
- tapOn:
    id: app-scope-right-sidebar-tab:plugin:happier.inspector:inspector-app
- extendedWaitUntil:
    visible:
      id: inspector-plugin-${HAPPIER_E2E_PLUGIN_ID}
    timeout: 120000
- tapOn:
    id: inspector-plugin-${HAPPIER_E2E_PLUGIN_ID}
- extendedWaitUntil:
    visible:
      id: inspector-reload-selected-${HAPPIER_E2E_PLUGIN_ID}
    timeout: 120000
- tapOn:
    id: inspector-reload-selected-${HAPPIER_E2E_PLUGIN_ID}
- extendedWaitUntil:
    visible:
      id: inspector-last-reload
    timeout: 120000

- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/plugins
- tapOn:
    id: settings.plugins.management.view:diagnostics
- assertVisible:
    id: settings.plugins.management.diagnostics.live
- takeScreenshot: plugin-platform-install-enable-reload-${HAPPIER_E2E_MOBILE_PLATFORM}

# This public packed contributor shares the exact candidate's client artifact
# loader with Voice. Leave its deliberately delayed invocation active so the
# replacement phase can prove that the retiring generation rejects it locally.
- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///settings/voice
- extendedWaitUntil:
    visible:
      id: settings.voice.provider.examples.packed-targeted-projection-contributor%2Fpacked-conversation.default
    timeout: 120000
- tapOn:
    id: settings.voice.provider.examples.packed-targeted-projection-contributor%2Fpacked-conversation.default
- extendedWaitUntil:
    visible:
      id: settings.voice.ui.activityFeedEnabled
    timeout: 120000
- tapOn:
    id: settings.voice.ui.activityFeedEnabled

- openLink: ${HAPPIER_E2E_MOBILE_APP_SCHEME}:///plugins/examples.packed-targeted-projection-contributor/packed-provider-page
- extendedWaitUntil:
    visible:
      id: packed-targeted-provider-title
    timeout: 120000
- assertVisible:
    id: packed-targeted-context-action
- assertVisible:
    id: packed-targeted-stale-context-action
- assertVisible:
    id: packed-targeted-context-result
- assertVisible:
    id: packed-targeted-web-only-context-action
- tapOn:
    id: packed-targeted-web-only-context-action
- extendedWaitUntil:
    visible: "platform-unavailable"
    timeout: 120000
- tapOn:
    id: packed-targeted-context-action
- extendedWaitUntil:
    visible: "page:ui"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: voice-surface-toggle:sidebar
    timeout: 120000
- tapOn:
    id: voice-surface-toggle:sidebar
- extendedWaitUntil:
    visible:
      id: voice-surface-status:sidebar:connected
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: voice-surface-activity-toggle:sidebar
    timeout: 120000
- tapOn:
    id: voice-surface-activity-toggle:sidebar
- extendedWaitUntil:
    visible: "Packed Voice action completed for packed-provider-detail."
    timeout: 120000
# Keep the v1 Voice leaf connected while the lifecycle owner installs v2. The
# replacement flow must observe this exact attempt retire rather than proving
# only the separately delayed client Action.
- tapOn:
    id: packed-targeted-stale-context-action
# The daemon installs v2 between this flow and the replacement flow. Keep the
# request pending while the app is backgrounded, then foreground it only after
# the lifecycle owner has retired the v1 generation.
- pressKey: HOME
