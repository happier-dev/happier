appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: _shared/connectDevClientIfNeeded.yaml

- runFlow:
    file: _shared/configureServerIfNeeded.yaml

- runFlow:
    file: _shared/loginCreateAccount.yaml

- tapOn:
    id: main-header-start-new-session

- runFlow:
    file: _shared/dismissExpoDevMenuOverlayMaybe.yaml

- extendedWaitUntil:
    visible:
      id: setupWizard-machine-arrival-stack
    timeout: 60000

- assertVisible:
    id: setupWizard-machine-arrival-stack
- assertVisible:
    id: setupWizard-machine-arrival
- assertVisible:
    id: setupWizard-machine-arrival-desktop-app-download-cta
