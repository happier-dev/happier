[package]
name = "happier-session-holder"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

# The per-Session holder: owns one Agent's stdio pipes and process group so the
# Session runner can crash, restart or update without ending the Agent. It has
# no Account, keys, server connection or plugin runtime. Built and shipped by the
# iroh-native native builder (`scripts/build-node-addon.mjs`) beside the addon.

[[bin]]
name = "happier-session-holder"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
