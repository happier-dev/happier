global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: happier-api
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/happier-api.yml

  - job_name: happier-worker
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/happier-worker.yml
