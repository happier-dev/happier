<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Protect path-carried invitation, verification, and reset bearers even when the web app is hosted separately from a Home. -->
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <!-- Match standalone browser chrome to the canonical sidebar canvas without owning the app background. -->
    <meta name="theme-color" content="#F5F5F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131111" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- Keep this in sync with Expo's SPA template. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <link rel="preload" as="image" href="/launch-planet-light.png" media="(prefers-color-scheme: light)" />
    <link rel="preload" as="image" href="/launch-planet-dark.png" media="(prefers-color-scheme: dark)" />
    <style>
      html.launch-shell body { margin: 0; }
      /* The launch planet's Still frame: on #root from the first byte until the app's launch curtain has gone,
         and inside that curtain until its live planet has painted. One image, one rect. It breathes on the
         Loading planet's own cycle (loadingPlanetBreathS and loadingPlanetBreathScale in the brand's glyph scene: a
         sine over 4.8 s, 6% wider at the top), and the live planet picks up the breath's phase from this animation.
         Reduced motion keeps it still. */
      @keyframes launch-planet-breath {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      html.launch-planet #root { background-color: #f5f5f5; }
      html.launch-planet #root::before,
      .launch-planet-still {
        content: "";
        inset: 0;
        pointer-events: none;
        background: url("/launch-planet-light.png") center / 320px no-repeat;
        animation: launch-planet-breath 4.8s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }
      html.launch-planet #root::before { position: fixed; }
      .launch-planet-still { position: absolute; }
      .launch-planet-still[data-theme="dark"] {
        background-image: url("/launch-planet-dark.png");
      }
      @media (prefers-color-scheme: dark) {
        html.launch-planet #root { background-color: #141212; }
        html.launch-planet #root::before { background-image: url("/launch-planet-dark.png"); }
      }
      @media (prefers-reduced-motion: reduce) {
        html.launch-planet #root::before,
        .launch-planet-still { animation: none; }
      }
    </style>
    <script>
      // Embed previews and desktop auxiliary webviews own their canvas, including transparent presenters.
      if (!location.pathname.startsWith('/desktop/') && !location.pathname.startsWith('/embed/')) {
        document.documentElement.classList.add('launch-shell', 'launch-planet');
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
