<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- interactive-widget=resizes-content: the layout viewport itself ends at the software
         keyboard top (Chrome default; Firefox 132+ honors it, Safari ignores it). This makes
         window.innerHeight the true unoccluded height, kills sub-keyboard drag-panning, and
         makes the visual-viewport keyboard baseline resolve to a ~0 inset on these browsers —
         the same content-resizing contract the composer's keyboard geometry already handles. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Match standalone browser chrome to the canonical sidebar canvas without owning the app background. -->
    <meta name="theme-color" content="#F5F5F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131111" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- Keep this in sync with Expo's SPA template. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
