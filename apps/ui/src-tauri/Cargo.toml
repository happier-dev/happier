[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
devtools = ["wry/devtools"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
flate2 = "1.1"
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
url = "2"
log = "0.4"
libc = "0.2"
flate2 = "1.1"
tauri = { version = "2.12.1", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-http = "=2.5.2"
tauri-plugin-notification = "2"
tauri-plugin-mcp-bridge = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
wry = "0.55.1"
base64 = "0.22"
percent-encoding = "2.3"
sha2 = "0.10"
png = "0.17.16"
tempfile = "3.20"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
keyring = "4.2.0"
happier-iroh-native = { path = "../../../packages/iroh-native/rust/happier-iroh-native" }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "=2.4.0"
tauri-plugin-updater = "2.9"

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6.1"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.1", features = ["NSAccessibility", "NSApplication", "NSBitmapImageRep", "NSEvent", "NSImage", "NSImageRep", "NSResponder", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-core-graphics = "0.3.1"
objc2-foundation = { version = "0.3.1", features = ["block2", "NSData", "NSDate", "NSDictionary", "NSError", "NSKeyValueObserving", "NSNotification", "NSObject", "NSOperation", "NSRunLoop", "NSString"] }
objc2-web-kit = { version = "0.3.1", features = ["WKSnapshotConfiguration", "WKWebView", "block2", "objc2-app-kit"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
window-vibrancy = "=0.8.1"

[target."cfg(target_os = \"windows\")".dependencies]
webview2-com = "0.38"
# The tray reads the taskbar theme from the registry; already in the tree via hyper-util.
windows-registry = "0.6"
windows = { version = "0.62.2", features = ["Foundation", "UI_ViewManagement", "Win32_Graphics_Dwm"] }

[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"
webkit2gtk = "=2.0.2"

[patch.crates-io]
tauri-plugin-mcp-bridge = { path = "vendor/tauri-plugin-mcp-bridge" }
wry = { path = "vendor/wry" }
