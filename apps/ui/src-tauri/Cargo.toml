[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
devtools = ["wry/devtools"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
flate2 = "1.1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
url = "2"
log = "0.4"
libc = "0.2"
flate2 = "1.1"
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-http = "=2.5.2"
tauri-plugin-notification = "2"
tauri-plugin-mcp-bridge = "0.10"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
wry = "0.55.1"
base64 = "0.22"
percent-encoding = "2.3"
sha2 = "0.10"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.9"

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6.1"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.1", features = ["NSBitmapImageRep", "NSEvent", "NSImage", "NSImageRep", "NSScreen", "NSWindow"] }
objc2-core-graphics = "0.3.1"
objc2-foundation = { version = "0.3.1", features = ["NSData", "NSDate", "NSDictionary", "NSError", "NSKeyValueObserving", "NSObject", "NSRunLoop", "NSString"] }
objc2-web-kit = { version = "0.3.1", features = ["WKSnapshotConfiguration", "WKWebView", "block2", "objc2-app-kit"] }
png = "0.17.16"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[dev-dependencies]
tempfile = "3.20"

[patch.crates-io]
tauri-plugin-mcp-bridge = { path = "vendor/tauri-plugin-mcp-bridge" }
wry = { path = "vendor/wry" }
