name: Install Yarn Dependencies
description: Restore workspace dependencies and install with retry handling on cache misses

inputs:
  args:
    description: Arguments forwarded to yarn install before standard CI resilience flags
    required: false
    default: --frozen-lockfile --ignore-engines

runs:
  using: composite
  steps:
    - name: Resolve dependency cache identity
      id: runtime
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.args }}
      run: |
        echo "node=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"
        # Key on the flags that change the installed tree. --frozen-lockfile and --ignore-engines
        # only validate, so installs that differ by them share one modules cache entry.
        tree=default
        for flag in $INSTALL_ARGS; do
          case "$flag" in
            --frozen-lockfile|--ignore-engines) ;;
            *) tree="$tree+$flag" ;;
          esac
        done
        echo "tree=$tree" >> "$GITHUB_OUTPUT"
        # Cache keys cannot contain commas; scoped installs list packages comma-separated.
        scope="${HAPPIER_INSTALL_SCOPE:-}"
        echo "scope=${scope//,/+}" >> "$GITHUB_OUTPUT"
    - name: Restore installed dependencies
      id: dependencies
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        # Exact keys only: never restore a tree installed for another lockfile,
        # patch set, Node runtime, architecture, or install scope.
        key: modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ steps.runtime.outputs.tree }}-${{ steps.runtime.outputs.scope }}-${{ hashFiles('yarn.lock', '.yarnrc*', '.node-version', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/modules/*/package.json', 'apps/*/patches/**', 'packages/*/patches/**', 'scripts/postinstall/**', 'apps/ui/tools/**', 'apps/cli/scripts/postinstall/**') }}
    - name: Drop restored workspace bundle copies
      if: steps.dependencies.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # apps/*/node_modules/@happier-dev holds bundled workspace copies written by builds and
        # packing, never by yarn install. The cache key covers only manifests, so a restored copy can
        # predate the current source, and app sources resolve it before the workspace package.
        # Removing it leaves the tree a fresh install produces; third-party packages stay cached.
        rm -rf apps/*/node_modules/@happier-dev
    - name: Verify restored dependencies and refresh workspace setup
      if: steps.dependencies.outputs.cache-hit == 'true'
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      run: |
        set -euo pipefail
        if ! yarn install ${{ inputs.args }} --offline --non-interactive; then
          echo "::warning::Offline dependency verification failed; repairing with the canonical installer"
          bash scripts/ci/yarn-install-with-retry.sh ${{ inputs.args }} --network-timeout 600000 --prefer-offline --non-interactive
        fi
        # Yarn's no-op install does not regenerate outputs outside node_modules.
        # Delegate that setup to the same workspace postinstall owners as a miss.
        node scripts/ci/refresh-workspace-postinstall.mjs ${{ inputs.args }}
    - name: Install dependencies with retry
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      run: |
        set -euo pipefail
        bash scripts/ci/yarn-install-with-retry.sh ${{ inputs.args }} --network-timeout 600000 --prefer-offline --non-interactive
