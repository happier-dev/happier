name: Install Tauri Linux dependencies
description: Install the canonical native and packaging dependencies required by Tauri Linux bundling

runs:
  using: composite
  steps:
    - name: Install native and packaging dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          pkg-config \
          libssl-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          desktop-file-utils \
          gstreamer1.0-tools \
          gstreamer1.0-plugins-base \
          squashfs-tools \
          patchelf \
          xvfb \
          weston \
          rpm

        # linuxdeploy is distributed as an AppImage. Some runner images need
        # FUSE libraries or utilities even when extraction mode is available.
        fuse_pkg=""
        if apt-cache show libfuse2 >/dev/null 2>&1; then
          fuse_pkg="libfuse2"
        elif apt-cache show libfuse2t64 >/dev/null 2>&1; then
          fuse_pkg="libfuse2t64"
        fi
        if [ -n "${fuse_pkg}" ]; then
          sudo apt-get install -y --no-install-recommends "${fuse_pkg}"
        fi

        fuse_utils=""
        if apt-cache show fuse >/dev/null 2>&1; then
          fuse_utils="fuse"
        elif apt-cache show fuse3 >/dev/null 2>&1; then
          fuse_utils="fuse3"
        fi
        if [ -n "${fuse_utils}" ]; then
          sudo apt-get install -y --no-install-recommends "${fuse_utils}"
        fi

        # Tauri's mirrored linuxdeploy can bundle host-coupled Wayland libraries.
        # Install a pinned upstream build that honors LINUXDEPLOY_EXCLUDED_LIBRARIES.
        linuxdeploy_version="1-alpha-20251107-1"
        linuxdeploy_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/tauri"
        mkdir -p "${linuxdeploy_dir}"
        linuxdeploy_path="${linuxdeploy_dir}/linuxdeploy-x86_64.AppImage"
        curl -L --fail --show-error --retry 3 \
          "https://github.com/linuxdeploy/linuxdeploy/releases/download/${linuxdeploy_version}/linuxdeploy-x86_64.AppImage" \
          -o "${linuxdeploy_path}"
        printf '%s  %s\n' \
          'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d' \
          "${linuxdeploy_path}" | sha256sum --check --strict
        chmod +x "${linuxdeploy_path}"
        APPIMAGE_EXTRACT_AND_RUN=1 "${linuxdeploy_path}" --appimage-version
