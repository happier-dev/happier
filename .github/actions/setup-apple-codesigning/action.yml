name: Setup Apple code signing
description: Import Happier's Developer ID Application identity into an isolated runner keychain

inputs:
  certificate:
    description: Base64-encoded Apple Developer ID certificate bundle
    required: true
  certificate-password:
    description: Password for the Apple certificate bundle
    required: true

outputs:
  identity:
    description: Resolved Developer ID Application identity
    value: ${{ steps.setup.outputs.identity }}
  keychain-path:
    description: Temporary keychain path for cleanup
    value: ${{ steps.setup.outputs.keychain_path }}
  certificate-path:
    description: Temporary certificate path for cleanup
    value: ${{ steps.setup.outputs.certificate_path }}

runs:
  using: composite
  steps:
    - name: Import certificate and resolve identity
      id: setup
      shell: bash
      env:
        APPLE_CERTIFICATE: ${{ inputs.certificate }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" != "macOS" ]; then
          echo "Apple code signing setup must run on macOS." >&2
          exit 1
        fi
        if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
          echo "Apple code signing certificate and password are required." >&2
          exit 1
        fi

        keychain_id="$(uuidgen)"
        keychain_path="${RUNNER_TEMP}/happier-build-${keychain_id}.keychain-db"
        keychain_password="$(uuidgen)"
        cert_path="${RUNNER_TEMP}/happier-apple-cert-${keychain_id}.p12"
        echo "keychain_path=${keychain_path}" >> "$GITHUB_OUTPUT"
        echo "certificate_path=${cert_path}" >> "$GITHUB_OUTPUT"
        echo "${APPLE_CERTIFICATE}" | base64 --decode > "${cert_path}"
        chmod 600 "${cert_path}"

        security create-keychain -p "${keychain_password}" "${keychain_path}"
        security set-keychain-settings -lut 21600 "${keychain_path}"
        security unlock-keychain -p "${keychain_password}" "${keychain_path}"
        existing_keychains=()
        while IFS= read -r line; do
          existing_keychains+=("${line}")
        done < <(security list-keychains -d user | tr -d '"')
        security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"
        security import "${cert_path}" -k "${keychain_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"

        identity="$(security find-identity -v -p codesigning "${keychain_path}" 2>&1 | awk '/Developer ID Application:/ { print $2; exit }')"
        if [[ ! "${identity:-}" =~ ^[0-9A-Fa-f]{40}$ ]]; then
          echo "Unable to resolve a Developer ID Application certificate hash from the imported keychain." >&2
          exit 1
        fi
        echo "identity=${identity}" >> "$GITHUB_OUTPUT"
