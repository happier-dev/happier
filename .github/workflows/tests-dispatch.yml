name: CI — Tests (manual dispatch)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile — fast feedback, release ship-path evidence, deep source certification, or custom"
        required: true
        default: fast
        type: choice
        options:
          - fast
          - release
          - deep
          - custom
      runner_pool:
        description: "Runner pool — GitHub is the default; Blacksmith accelerates approved non-secret Linux test lanes"
        required: true
        default: github
        type: choice
        options:
          - github
          - blacksmith-linux-4vcpu
          - blacksmith-linux-8vcpu
      custom_checks:
        description: "Custom — Comma-separated checks used only when profile=custom (ui,ui_e2e,wsrepl_lima,mobile_e2e_android,mobile_e2e_ios,shared_packages,server,cli,stack,typecheck,daemon_e2e,e2e_core,e2e_core_slow,server_db_contract,providers,stress,release_contracts,installers_smoke,binary_smoke,build_smoke,daemon_continuity,session_continuity,cli_update_continuity,release_assets_docker,self_host_systemd,self_host_launchd,self_host_schtasks,self_host_daemon,extended_db)"
        required: false
        default: ""
        type: string
      ui_e2e_specs:
        description: "UI E2E — Optional comma-separated repo-relative *.spec.ts paths; blank runs all shards"
        required: false
        default: ""
        type: string
      network_transfer:
        description: "Also run the network transfer workload"
        required: false
        default: false
        type: boolean
      network_transfer_enforce:
        description: "Enforce calibrated network ceilings in this run"
        required: false
        default: false
        type: boolean
      installers_channel:
        description: "Installers — Channel for installer smoke tests"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - preview
          - dev
      installers_source:
        description: "Installers — Test the published channel or this run's shared CLI build"
        required: true
        default: published-channel
        type: choice
        options:
          - published-channel
          - local-build
      cli_update_to_source:
        description: "CLI update — Target source for explicit continuity checks"
        required: false
        default: local-build
        type: string
      cli_update_to_ref:
        description: "CLI update — Target ref for explicit continuity checks"
        required: false
        default: "."
        type: string
      providers_preset:
        description: "Providers — Preset (when providers enabled)"
        required: true
        default: all
        type: choice
        options:
          - all
          - claude
          - codex
          - opencode
          - cursor
      providers_tier:
        description: "Providers — Tier (when providers enabled)"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - extended

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve flags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_ui_e2e: ${{ steps.flags.outputs.run_ui_e2e }}
      ui_e2e_specs: ${{ steps.flags.outputs.ui_e2e_specs }}
      run_wsrepl_lima: ${{ steps.flags.outputs.run_wsrepl_lima }}
      run_mobile_e2e_android: ${{ steps.flags.outputs.run_mobile_e2e_android }}
      run_mobile_e2e_ios: ${{ steps.flags.outputs.run_mobile_e2e_ios }}
      run_ui: ${{ steps.flags.outputs.run_ui }}
      run_shared_packages: ${{ steps.flags.outputs.run_shared_packages }}
      run_server: ${{ steps.flags.outputs.run_server }}
      run_cli: ${{ steps.flags.outputs.run_cli }}
      run_stack: ${{ steps.flags.outputs.run_stack }}
      run_typecheck: ${{ steps.flags.outputs.run_typecheck }}
      run_cli_daemon_e2e: ${{ steps.flags.outputs.run_cli_daemon_e2e }}
      run_e2e_core: ${{ steps.flags.outputs.run_e2e_core }}
      run_e2e_core_slow: ${{ steps.flags.outputs.run_e2e_core_slow }}
      run_server_db_contract: ${{ steps.flags.outputs.run_server_db_contract }}
      run_providers: ${{ steps.flags.outputs.run_providers }}
      run_stress: ${{ steps.flags.outputs.run_stress }}
      run_release_contracts: ${{ steps.flags.outputs.run_release_contracts }}
      run_installers_smoke: ${{ steps.flags.outputs.run_installers_smoke }}
      run_binary_smoke: ${{ steps.flags.outputs.run_binary_smoke }}
      run_build_smoke: ${{ steps.flags.outputs.run_build_smoke }}
      run_cli_update_continuity: ${{ steps.flags.outputs.run_cli_update_continuity }}
      run_daemon_continuity: ${{ steps.flags.outputs.run_daemon_continuity }}
      run_session_continuity: ${{ steps.flags.outputs.run_session_continuity }}
      run_release_assets_docker: ${{ steps.flags.outputs.run_release_assets_docker }}
      run_self_host_systemd: ${{ steps.flags.outputs.run_self_host_systemd }}
      run_self_host_launchd: ${{ steps.flags.outputs.run_self_host_launchd }}
      run_self_host_schtasks: ${{ steps.flags.outputs.run_self_host_schtasks }}
      run_self_host_daemon: ${{ steps.flags.outputs.run_self_host_daemon }}
      run_extended_db: ${{ steps.flags.outputs.run_extended_db }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Compute flags
        id: flags
        env:
          PROFILE: ${{ inputs.profile }}
          CUSTOM: ${{ inputs.custom_checks }}
          UI_E2E_SPECS: ${{ inputs.ui_e2e_specs }}
        run: node scripts/pipeline/checks/resolve-checks-plan.mjs --target hosted

  release_actor_guard:
    needs: [trusted_ref_guard]
    name: Release actor guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  trusted_ref_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Admit trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_FILE: tests-dispatch.yml
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/main") ;;
            *) echo "Untrusted workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  tests:
    name: Tests (reusable)
    needs: [resolve, release_actor_guard]
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit
    with:
      select_jobs_explicitly: true
      runner_pool: ${{ inputs.runner_pool }}
      run_ui_e2e: ${{ needs.resolve.outputs.run_ui_e2e == 'true' }}
      run_network_transfer: ${{ inputs.network_transfer || inputs.network_transfer_enforce }}
      network_transfer_enforce: ${{ inputs.network_transfer_enforce }}
      ui_e2e_specs: ${{ needs.resolve.outputs.ui_e2e_specs }}
      run_mobile_e2e_android: ${{ needs.resolve.outputs.run_mobile_e2e_android == 'true' }}
      run_mobile_e2e_ios: ${{ needs.resolve.outputs.run_mobile_e2e_ios == 'true' }}
      run_ui: ${{ needs.resolve.outputs.run_ui == 'true' }}
      run_shared_packages: ${{ needs.resolve.outputs.run_shared_packages == 'true' }}
      run_server: ${{ needs.resolve.outputs.run_server == 'true' }}
      run_cli: ${{ needs.resolve.outputs.run_cli == 'true' }}
      run_stack: ${{ needs.resolve.outputs.run_stack == 'true' }}
      run_typecheck: ${{ needs.resolve.outputs.run_typecheck == 'true' }}
      run_cli_daemon_e2e: ${{ needs.resolve.outputs.run_cli_daemon_e2e == 'true' }}
      run_e2e_core: ${{ needs.resolve.outputs.run_e2e_core == 'true' }}
      run_e2e_core_slow: ${{ needs.resolve.outputs.run_e2e_core_slow == 'true' }}
      run_server_db_contract: ${{ needs.resolve.outputs.run_server_db_contract == 'true' }}
      run_providers: ${{ needs.resolve.outputs.run_providers == 'true' }}
      providers_preset: ${{ inputs.providers_preset }}
      providers_tier: ${{ inputs.providers_tier }}
      run_stress: ${{ needs.resolve.outputs.run_stress == 'true' }}
      run_release_contracts: ${{ needs.resolve.outputs.run_release_contracts == 'true' }}
      run_installers_smoke: ${{ needs.resolve.outputs.run_installers_smoke == 'true' }}
      installers_channel: ${{ inputs.installers_channel }}
      installers_source: ${{ inputs.installers_source }}
      installers_ref: ${{ inputs.installers_source == 'local-build' && '.' || inputs.installers_channel }}
      run_binary_smoke: ${{ needs.resolve.outputs.run_binary_smoke == 'true' }}
      run_build_smoke: ${{ needs.resolve.outputs.run_build_smoke == 'true' }}
      run_cli_update_continuity: ${{ needs.resolve.outputs.run_cli_update_continuity == 'true' }}
      cli_update_to_source: ${{ inputs.cli_update_to_source }}
      cli_update_to_ref: ${{ inputs.cli_update_to_ref }}
      run_daemon_continuity: ${{ needs.resolve.outputs.run_daemon_continuity == 'true' }}
      run_session_continuity: ${{ needs.resolve.outputs.run_session_continuity == 'true' }}
      run_release_assets_docker: ${{ needs.resolve.outputs.run_release_assets_docker == 'true' }}
      run_self_host_systemd: ${{ needs.resolve.outputs.run_self_host_systemd == 'true' }}
      run_self_host_launchd: ${{ needs.resolve.outputs.run_self_host_launchd == 'true' }}
      run_self_host_schtasks: ${{ needs.resolve.outputs.run_self_host_schtasks == 'true' }}
      run_self_host_daemon: ${{ needs.resolve.outputs.run_self_host_daemon == 'true' }}

  ui-e2e-wsrepl-lima:
    name: UI E2E (WSREPL Lima matrix)
    needs: [resolve, release_actor_guard]
    if: ${{ needs.resolve.outputs.run_wsrepl_lima == 'true' }}
    runs-on:
      - self-hosted
      - macOS
      - wsrepl-lima
    timeout-minutes: 90
    env:
      HAPPIER_UI_VENDOR_WEB_ASSETS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Verify Lima host prerequisites
        run: |
          limactl --version
          sw_vers

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run WSREPL Lima matrix
        run: yarn -s test:e2e:ui:wsrepl:lima

      - name: Upload WSREPL Lima artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-e2e-wsrepl-lima-artifacts
          path: |
            apps/stack/output/wsrepl-lima-matrix
            .project/logs/e2e/*ui-e2e*
          if-no-files-found: ignore

  extended_db:
    name: Extended database certification
    needs: [resolve, release_actor_guard]
    if: ${{ needs.resolve.outputs.run_extended_db == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/extended-db-tests.yml
    with:
      select_jobs_explicitly: true
      run_e2e_postgres: true
      run_e2e_mysql: true
      run_db_contract_postgres: true
      run_db_contract_mysql: true
