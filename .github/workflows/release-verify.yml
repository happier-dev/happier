name: RELEASE — Verify artifacts (post-build)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Target — Channel to verify (dev/preview use their channel refs; production uses main ref by default)"
        required: true
        type: choice
        default: preview
        options:
          - dev
          - preview
          - production
      validation_profile:
        description: "Validation — Bounded public release profile"
        required: false
        default: integrated
        type: choice
        options:
          - integrated
          - stable
      risk_cli_upgrade:
        description: "Risk — changed daemon/update seam requires released-to-candidate continuity"
        required: false
        default: false
        type: boolean
      risk_session_continuity:
        description: "Risk — changed runtime/session seam requires restart continuity"
        required: false
        default: false
        type: boolean
      risk_relay_upgrade:
        description: "Risk — changed relay persistence/startup seam requires container upgrade"
        required: false
        default: false
        type: boolean
      include_validation_suites:
        description: "Validation — additional suite IDs to require (comma-separated)"
        required: false
        default: ""
        type: string
      waive_validation_suites:
        description: "Maintainer override — risk-selected suite IDs to waive (comma-separated)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      validation_profile:
        required: false
        default: ''
        type: string
      risk_cli_upgrade:
        required: false
        default: false
        type: boolean
      risk_session_continuity:
        required: false
        default: false
        type: boolean
      risk_relay_upgrade:
        required: false
        default: false
        type: boolean
      include_validation_suites:
        required: false
        default: ''
        type: string
      waive_validation_suites:
        required: false
        default: ''
        type: string
      candidate_source_sha:
        required: false
        default: ''
        type: string
      candidate_cli_version:
        required: false
        default: ''
        type: string
      candidate_stack_version:
        required: false
        default: ''
        type: string
      candidate_server_version:
        required: false
        default: ''
        type: string
      candidate_ui_web_version:
        required: false
        default: ''
        type: string
      server_api_version_url:
        required: false
        default: ''
        type: string
      verify_deploy_server:
        required: false
        default: false
        type: boolean
      verify_stack_release:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-verify-${{ inputs.channel }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_candidate:
    name: Verify exact immutable candidate artifacts
    if: ${{ inputs.candidate_source_sha != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Install minisign from trusted control bytes
        uses: ./.release-control/.github/actions/bootstrap-minisign

      - name: Require requested HStack verification identity
        if: ${{ inputs.verify_stack_release && inputs.candidate_stack_version == '' }}
        run: |
          echo 'Stack release verification requires candidate_stack_version.' >&2
          exit 1
      - name: Verify CLI candidate
        id: verify_cli
        if: ${{ always() && inputs.candidate_cli_version != '' }}
        uses: ./.release-control/.github/actions/verify-immutable-release-candidate
        with:
          repository: ${{ github.repository }}
          channel: ${{ inputs.channel }}
          candidate_source_sha: ${{ inputs.candidate_source_sha }}
          product: cli
          version: ${{ inputs.candidate_cli_version }}
      - name: Verify HStack candidate
        id: verify_stack
        if: ${{ always() && inputs.candidate_stack_version != '' }}
        uses: ./.release-control/.github/actions/verify-immutable-release-candidate
        with:
          repository: ${{ github.repository }}
          channel: ${{ inputs.channel }}
          candidate_source_sha: ${{ inputs.candidate_source_sha }}
          product: hstack
          version: ${{ inputs.candidate_stack_version }}
      - name: Verify server candidate
        id: verify_server
        if: ${{ always() && inputs.candidate_server_version != '' }}
        uses: ./.release-control/.github/actions/verify-immutable-release-candidate
        with:
          repository: ${{ github.repository }}
          channel: ${{ inputs.channel }}
          candidate_source_sha: ${{ inputs.candidate_source_sha }}
          product: server
          version: ${{ inputs.candidate_server_version }}
      - name: Verify UI-web candidate
        id: verify_ui_web
        if: ${{ always() && inputs.candidate_ui_web_version != '' }}
        uses: ./.release-control/.github/actions/verify-immutable-release-candidate
        with:
          repository: ${{ github.repository }}
          channel: ${{ inputs.channel }}
          candidate_source_sha: ${{ inputs.candidate_source_sha }}
          product: ui-web
          version: ${{ inputs.candidate_ui_web_version }}

      - name: Verify loaded server API revision
        if: ${{ inputs.verify_deploy_server }}
        env:
          SERVER_API_VERSION_URL: ${{ inputs.server_api_version_url }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          set -euo pipefail
          test -n "$SERVER_API_VERSION_URL"
          node "$GITHUB_WORKSPACE/.release-control/scripts/pipeline/release/verify-loaded-release-revision.mjs" \
            --url "$SERVER_API_VERSION_URL" \
            --expected-source-sha "$CANDIDATE_SOURCE_SHA"

  resolve_validation_profile:
    name: Resolve bounded validation profile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_installers_smoke: ${{ steps.profile.outputs.run_installers_smoke }}
      run_binary_smoke: ${{ steps.profile.outputs.run_binary_smoke }}
      run_cli_update_continuity: ${{ steps.profile.outputs.run_cli_update_continuity }}
      run_daemon_continuity: ${{ steps.profile.outputs.run_daemon_continuity }}
      run_session_continuity: ${{ steps.profile.outputs.run_session_continuity }}
      run_release_assets_docker: ${{ steps.profile.outputs.run_release_assets_docker }}
      run_self_host_systemd: ${{ steps.profile.outputs.run_self_host_systemd }}
      run_self_host_launchd: ${{ steps.profile.outputs.run_self_host_launchd }}
      run_self_host_schtasks: ${{ steps.profile.outputs.run_self_host_schtasks }}
      run_self_host_daemon: ${{ steps.profile.outputs.run_self_host_daemon }}
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Resolve candidate-applicable validation suites
        id: profile
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
          INCLUDE_VALIDATION_SUITES: ${{ inputs.include_validation_suites }}
          WAIVE_VALIDATION_SUITES: ${{ inputs.waive_validation_suites }}
          CANDIDATE_CLI_VERSION: ${{ inputs.candidate_cli_version }}
          CANDIDATE_SERVER_VERSION: ${{ inputs.candidate_server_version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RISK_CLI_UPGRADE: ${{ inputs.risk_cli_upgrade }}
          RISK_SESSION_CONTINUITY: ${{ inputs.risk_session_continuity }}
          RISK_RELAY_UPGRADE: ${{ inputs.risk_relay_upgrade }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.release-control/scripts/pipeline/release-validation/resolve-validation-plan.mjs" \
            --profile "$VALIDATION_PROFILE" \
            --has-cli-candidate "$([[ -n "$CANDIDATE_CLI_VERSION" ]] && echo true || echo false)" \
            --has-server-candidate "$([[ -n "$CANDIDATE_SERVER_VERSION" ]] && echo true || echo false)" \
            --has-published-relay-predecessor "$([[ "$RELEASE_CHANNEL" == preview || "$RELEASE_CHANNEL" == production ]] && echo true || echo false)" \
            --risk-cli-upgrade "$RISK_CLI_UPGRADE" \
            --risk-session-continuity "$RISK_SESSION_CONTINUITY" \
            --risk-relay-upgrade "$RISK_RELAY_UPGRADE" \
            --include-suites "$INCLUDE_VALIDATION_SUITES" \
            --waive-suites "$WAIVE_VALIDATION_SUITES" \
            --github-output "$GITHUB_OUTPUT"

  verify:
    name: Verify (tests.yml)
    needs: [verify_candidate, resolve_validation_profile]
    if: ${{ always() && (needs.verify_candidate.result == 'success' || needs.verify_candidate.result == 'skipped') && needs.resolve_validation_profile.result == 'success' }}
    uses: ./.github/workflows/tests.yml
    with:
      select_jobs_explicitly: true
      run_ui: false
      run_server: false
      run_cli: false
      run_stack: false
      run_typecheck: false
      checkout_sha: ${{ inputs.candidate_source_sha }}
      run_cli_daemon_e2e: false
      run_e2e_core: false
      run_server_db_contract: false
      run_providers: false
      run_release_contracts: false
      run_installers_smoke: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_installers_smoke) }}
      installers_channel: ${{ inputs.channel == 'production' && 'stable' || inputs.channel == 'dev' && 'dev' || 'preview' }}
      installers_source: ${{ inputs.candidate_cli_version != '' && 'published-tag' || 'published-channel' }}
      installers_ref: ${{ inputs.candidate_cli_version != '' && format('cli-v{0}', inputs.candidate_cli_version) || '' }}
      run_binary_smoke: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_binary_smoke) }}
      run_cli_update_continuity: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_cli_update_continuity) }}
      cli_update_to_source: ${{ inputs.candidate_cli_version != '' && 'published-tag' || 'local-build' }}
      cli_update_to_ref: ${{ inputs.candidate_cli_version != '' && format('cli-v{0}', inputs.candidate_cli_version) || '.' }}
      run_daemon_continuity: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_daemon_continuity) }}
      run_session_continuity: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_session_continuity) }}
      run_release_assets_docker: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_release_assets_docker) }}
      relay_upgrade_to_source: ${{ inputs.candidate_server_version != '' && 'published-tag' || 'local-build' }}
      relay_upgrade_to_ref: ${{ inputs.candidate_server_version != '' && format('server-v{0}', inputs.candidate_server_version) || '.' }}
      run_self_host_systemd: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_systemd) }}
      run_self_host_launchd: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_launchd) }}
      run_self_host_schtasks: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_schtasks) }}
      run_self_host_daemon: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_daemon) }}
