name: RELEASE — Verify artifacts (post-build)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Target — Channel to verify (dev/preview use their channel refs; production uses main ref by default)"
        required: true
        type: choice
        default: preview
        options:
          - dev
          - preview
          - production
      validation_profile:
        description: "Validation — Bounded public release profile"
        required: false
        default: integrated
        type: choice
        options:
          - integrated
          - stable
      run_installers_smoke:
        description: "Verify — Installers smoke (linux/macos/windows)"
        required: true
        default: true
        type: boolean
      run_binary_smoke:
        description: "Verify — Binary smoke (cli/server/self-host)"
        required: true
        default: true
        type: boolean
      run_cli_update_continuity:
        description: "Verify — CLI update continuity (published channel -> local build, linux)"
        required: true
        default: true
        type: boolean
      run_daemon_continuity:
        description: "Verify — Daemon continuity (local build, linux)"
        required: true
        default: true
        type: boolean
      run_session_continuity:
        description: "Verify — Session continuity after server restart (local build, linux)"
        required: true
        default: true
        type: boolean
      run_release_assets_docker:
        description: "Verify — Relay upgrade (published channel -> exact candidate, SQLite + Postgres)"
        required: true
        default: true
        type: boolean
      run_self_host_systemd:
        description: "Verify — Real self-host systemd E2E (linux)"
        required: true
        default: false
        type: boolean
      run_self_host_launchd:
        description: "Verify — Real self-host launchd E2E (macOS)"
        required: true
        default: false
        type: boolean
      run_self_host_schtasks:
        description: "Verify — Real self-host schtasks E2E (Windows)"
        required: true
        default: false
        type: boolean
      run_self_host_daemon:
        description: "Verify — Real self-host + CLI daemon E2E (linux+mac)"
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      validation_profile:
        required: false
        default: ''
        type: string
      candidate_source_sha:
        required: false
        default: ''
        type: string
      candidate_cli_version:
        required: false
        default: ''
        type: string
      candidate_stack_version:
        required: false
        default: ''
        type: string
      candidate_server_version:
        required: false
        default: ''
        type: string
      candidate_ui_web_version:
        required: false
        default: ''
        type: string
      server_api_version_url:
        required: false
        default: ''
        type: string
      verify_deploy_server:
        required: false
        default: false
        type: boolean
      verify_stack_release:
        required: false
        default: false
        type: boolean
      run_installers_smoke:
        required: false
        default: true
        type: boolean
      run_binary_smoke:
        required: false
        default: true
        type: boolean
      run_cli_update_continuity:
        required: false
        default: true
        type: boolean
      run_daemon_continuity:
        required: false
        default: true
        type: boolean
      run_session_continuity:
        required: false
        default: true
        type: boolean
      run_release_assets_docker:
        required: false
        default: true
        type: boolean
      run_self_host_systemd:
        required: false
        default: false
        type: boolean
      run_self_host_launchd:
        required: false
        default: false
        type: boolean
      run_self_host_schtasks:
        required: false
        default: false
        type: boolean
      run_self_host_daemon:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-verify-${{ inputs.channel }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_candidate:
    name: Verify exact immutable candidate artifacts
    if: ${{ inputs.candidate_source_sha != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Install minisign from trusted control bytes
        uses: ./.release-control/.github/actions/bootstrap-minisign

      - name: Verify immutable identities and download candidate data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          CANDIDATE_CLI_VERSION: ${{ inputs.candidate_cli_version }}
          CANDIDATE_STACK_VERSION: ${{ inputs.candidate_stack_version }}
          CANDIDATE_SERVER_VERSION: ${{ inputs.candidate_server_version }}
          CANDIDATE_UI_WEB_VERSION: ${{ inputs.candidate_ui_web_version }}
          VERIFY_STACK_RELEASE: ${{ inputs.verify_stack_release }}
        run: |
          set -euo pipefail
          if [ "$VERIFY_STACK_RELEASE" = "true" ] && [ -z "$CANDIDATE_STACK_VERSION" ]; then
            echo "Stack release verification requires candidate_stack_version." >&2
            exit 1
          fi
          node "$GITHUB_WORKSPACE/.release-control/scripts/pipeline/release/verify-release-candidate-identity.mjs" \
            --repository "$REPOSITORY" \
            --channel "$RELEASE_CHANNEL" \
            --candidate-source-sha "$CANDIDATE_SOURCE_SHA" \
            --candidate-cli-version "$CANDIDATE_CLI_VERSION" \
            --candidate-stack-version "$CANDIDATE_STACK_VERSION" \
            --candidate-server-version "$CANDIDATE_SERVER_VERSION" \
            --candidate-ui-web-version "$CANDIDATE_UI_WEB_VERSION"

          candidates_dir="$RUNNER_TEMP/release-candidates"
          mkdir -p "$candidates_dir"
          if [ -n "$CANDIDATE_CLI_VERSION" ]; then
            mkdir -p "$candidates_dir/cli"
            gh release download "cli-v${CANDIDATE_CLI_VERSION}" --repo "$REPOSITORY" --dir "$candidates_dir/cli"
          fi
          if [ -n "$CANDIDATE_STACK_VERSION" ]; then
            mkdir -p "$candidates_dir/stack"
            gh release download "stack-v${CANDIDATE_STACK_VERSION}" --repo "$REPOSITORY" --dir "$candidates_dir/stack"
          fi
          if [ -n "$CANDIDATE_SERVER_VERSION" ]; then
            mkdir -p "$candidates_dir/server"
            gh release download "server-v${CANDIDATE_SERVER_VERSION}" --repo "$REPOSITORY" --dir "$candidates_dir/server"
          fi
          if [ -n "$CANDIDATE_UI_WEB_VERSION" ]; then
            mkdir -p "$candidates_dir/ui-web"
            gh release download "ui-web-v${CANDIDATE_UI_WEB_VERSION}" --repo "$REPOSITORY" --dir "$candidates_dir/ui-web"
          fi

      - name: Verify downloaded signed artifacts without repository token
        env:
          CANDIDATE_CLI_VERSION: ${{ inputs.candidate_cli_version }}
          CANDIDATE_STACK_VERSION: ${{ inputs.candidate_stack_version }}
          CANDIDATE_SERVER_VERSION: ${{ inputs.candidate_server_version }}
          CANDIDATE_UI_WEB_VERSION: ${{ inputs.candidate_ui_web_version }}
        run: |
          set -euo pipefail
          verifier="$GITHUB_WORKSPACE/.release-control/scripts/pipeline/release/verify-artifacts.mjs"
          public_key="$GITHUB_WORKSPACE/.release-control/scripts/release/installers/happier-release.pub"
          candidates_dir="$RUNNER_TEMP/release-candidates"
          verify_artifacts() {
            version="$1"
            product_dir="$2"
            checksum_stem="$3"
            if [ -z "$version" ]; then
              return
            fi
            checksums="$product_dir/checksums-${checksum_stem}-v${version}.txt"
            test -f "$checksums"
            test -f "${checksums}.minisig"
            node "$verifier" \
              --artifacts-dir "$product_dir" \
              --checksums "$checksums" \
              --public-key "$public_key" \
              --skip-smoke
          }
          verify_artifacts "$CANDIDATE_CLI_VERSION" "$candidates_dir/cli" happier
          verify_artifacts "$CANDIDATE_STACK_VERSION" "$candidates_dir/stack" hstack
          verify_artifacts "$CANDIDATE_SERVER_VERSION" "$candidates_dir/server" happier-server
          verify_artifacts "$CANDIDATE_UI_WEB_VERSION" "$candidates_dir/ui-web" happier-ui-web

      - name: Verify loaded server API revision
        if: ${{ inputs.verify_deploy_server }}
        env:
          SERVER_API_VERSION_URL: ${{ inputs.server_api_version_url }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          set -euo pipefail
          test -n "$SERVER_API_VERSION_URL"
          node "$GITHUB_WORKSPACE/.release-control/scripts/pipeline/release/verify-loaded-release-revision.mjs" \
            --url "$SERVER_API_VERSION_URL" \
            --expected-source-sha "$CANDIDATE_SOURCE_SHA"

  resolve_validation_profile:
    name: Resolve bounded validation profile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_installers_smoke: ${{ steps.profile.outputs.run_installers_smoke }}
      run_binary_smoke: ${{ steps.profile.outputs.run_binary_smoke }}
      run_cli_update_continuity: ${{ steps.profile.outputs.run_cli_update_continuity }}
      run_daemon_continuity: ${{ steps.profile.outputs.run_daemon_continuity }}
      run_session_continuity: ${{ steps.profile.outputs.run_session_continuity }}
      run_release_assets_docker: ${{ steps.profile.outputs.run_release_assets_docker }}
      run_self_host_systemd: ${{ steps.profile.outputs.run_self_host_systemd }}
      run_self_host_launchd: ${{ steps.profile.outputs.run_self_host_launchd }}
      run_self_host_schtasks: ${{ steps.profile.outputs.run_self_host_schtasks }}
      run_self_host_daemon: ${{ steps.profile.outputs.run_self_host_daemon }}
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Resolve public profile or retained legacy flags
        id: profile
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
          LEGACY_RUN_INSTALLERS_SMOKE: ${{ inputs.run_installers_smoke }}
          LEGACY_RUN_BINARY_SMOKE: ${{ inputs.run_binary_smoke }}
          LEGACY_RUN_CLI_UPDATE_CONTINUITY: ${{ inputs.run_cli_update_continuity }}
          LEGACY_RUN_DAEMON_CONTINUITY: ${{ inputs.run_daemon_continuity }}
          LEGACY_RUN_SESSION_CONTINUITY: ${{ inputs.run_session_continuity }}
          LEGACY_RUN_RELEASE_ASSETS_DOCKER: ${{ inputs.run_release_assets_docker }}
          LEGACY_RUN_SELF_HOST_SYSTEMD: ${{ inputs.run_self_host_systemd }}
          LEGACY_RUN_SELF_HOST_LAUNCHD: ${{ inputs.run_self_host_launchd }}
          LEGACY_RUN_SELF_HOST_SCHTASKS: ${{ inputs.run_self_host_schtasks }}
          LEGACY_RUN_SELF_HOST_DAEMON: ${{ inputs.run_self_host_daemon }}
          CANDIDATE_CLI_VERSION: ${{ inputs.candidate_cli_version }}
          CANDIDATE_SERVER_VERSION: ${{ inputs.candidate_server_version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.release-control/scripts/pipeline/run.mjs" release-contract | node --input-type=module -e '
            import { pathToFileURL } from "node:url";
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const legacy = Object.fromEntries(Object.entries({
              run_installers_smoke: process.env.LEGACY_RUN_INSTALLERS_SMOKE,
              run_binary_smoke: process.env.LEGACY_RUN_BINARY_SMOKE,
              run_cli_update_continuity: process.env.LEGACY_RUN_CLI_UPDATE_CONTINUITY,
              run_daemon_continuity: process.env.LEGACY_RUN_DAEMON_CONTINUITY,
              run_session_continuity: process.env.LEGACY_RUN_SESSION_CONTINUITY,
              run_release_assets_docker: process.env.LEGACY_RUN_RELEASE_ASSETS_DOCKER,
              run_self_host_systemd: process.env.LEGACY_RUN_SELF_HOST_SYSTEMD,
              run_self_host_launchd: process.env.LEGACY_RUN_SELF_HOST_LAUNCHD,
              run_self_host_schtasks: process.env.LEGACY_RUN_SELF_HOST_SCHTASKS,
              run_self_host_daemon: process.env.LEGACY_RUN_SELF_HOST_DAEMON,
            }));
            let outputs = legacy;
            if (process.env.VALIDATION_PROFILE) {
              const contract = JSON.parse(raw);
              const profile = contract.validationProfiles?.find((entry) => entry.id === process.env.VALIDATION_PROFILE);
              if (contract.kind !== "happier.public-release-contract.v1" || contract.schemaVersion !== 1 || !profile?.normalRelease) throw new Error(`Unsupported normal release validation profile: ${process.env.VALIDATION_PROFILE}`);
              const hasCliCandidate = Boolean(process.env.CANDIDATE_CLI_VERSION);
              const hasServerCandidate = Boolean(process.env.CANDIDATE_SERVER_VERSION);
              const hasPublishedRelayPredecessor = process.env.RELEASE_CHANNEL === "preview" || process.env.RELEASE_CHANNEL === "production";
              const registry = await import(pathToFileURL(`${process.cwd()}/.release-control/scripts/pipeline/release-validation/registry.mjs`).href);
              const execution = registry.resolveAutomaticReleaseValidationExecution(profile.id, { hasCliCandidate, hasServerCandidate, hasPublishedRelayPredecessor });
              const selected = new Set(execution.selectedSuiteIds);
              outputs = {
                run_installers_smoke: "false",
                run_binary_smoke: String(selected.has("binary-smoke")),
                run_cli_update_continuity: String(selected.has("cli-update")),
                run_daemon_continuity: "false",
                run_session_continuity: String(selected.has("session-continuity")),
                run_release_assets_docker: String(selected.has("docker-release-assets")),
                run_self_host_systemd: "false",
                run_self_host_launchd: "false",
                run_self_host_schtasks: "false",
                run_self_host_daemon: "false",
              };
            }
            for (const [key, value] of Object.entries(outputs)) console.log(`${key}=${value}`);
          ' >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (tests.yml)
    needs: [verify_candidate, resolve_validation_profile]
    if: ${{ always() && (needs.verify_candidate.result == 'success' || needs.verify_candidate.result == 'skipped') && needs.resolve_validation_profile.result == 'success' }}
    uses: ./.github/workflows/tests.yml
    with:
      run_ui: false
      run_server: false
      run_cli: false
      run_stack: false
      run_typecheck: false
      checkout_sha: ${{ inputs.candidate_source_sha }}
      run_cli_daemon_e2e: false
      run_e2e_core: false
      run_server_db_contract: false
      run_providers: false
      run_release_contracts: false
      run_installers_smoke: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_installers_smoke) }}
      installers_channel: ${{ inputs.channel == 'production' && 'stable' || inputs.channel == 'dev' && 'dev' || 'preview' }}
      installers_source: ${{ inputs.candidate_cli_version != '' && 'published-tag' || 'published-channel' }}
      installers_ref: ${{ inputs.candidate_cli_version != '' && format('cli-v{0}', inputs.candidate_cli_version) || '' }}
      run_binary_smoke: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_binary_smoke) }}
      run_cli_update_continuity: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_cli_update_continuity) }}
      cli_update_to_source: ${{ inputs.candidate_cli_version != '' && 'published-tag' || 'local-build' }}
      cli_update_to_ref: ${{ inputs.candidate_cli_version != '' && format('cli-v{0}', inputs.candidate_cli_version) || '.' }}
      run_daemon_continuity: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_daemon_continuity) }}
      run_session_continuity: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_session_continuity) }}
      run_release_assets_docker: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_release_assets_docker) }}
      relay_upgrade_to_source: ${{ inputs.candidate_server_version != '' && 'published-tag' || 'local-build' }}
      relay_upgrade_to_ref: ${{ inputs.candidate_server_version != '' && format('server-v{0}', inputs.candidate_server_version) || '.' }}
      run_self_host_systemd: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_systemd) }}
      run_self_host_launchd: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_launchd) }}
      run_self_host_schtasks: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_schtasks) }}
      run_self_host_daemon: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_daemon) }}
