name: RELEASE — Verify artifacts (post-build)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Target — Channel to verify (dev/preview use their channel refs; production uses main ref by default)"
        required: true
        type: choice
        default: preview
        options:
          - dev
          - preview
          - production
      validation_profile:
        description: "Validation — Bounded public release profile"
        required: false
        default: integrated
        type: choice
        options:
          - integrated
          - stable
      run_installers_smoke:
        description: "Verify — Installers smoke (linux/macos/windows)"
        required: true
        default: true
        type: boolean
      run_binary_smoke:
        description: "Verify — Binary smoke (cli/server/self-host)"
        required: true
        default: true
        type: boolean
      run_cli_update_continuity:
        description: "Verify — CLI update continuity (published channel -> local build, linux)"
        required: true
        default: true
        type: boolean
      run_daemon_continuity:
        description: "Verify — Daemon continuity (local build, linux)"
        required: true
        default: true
        type: boolean
      run_session_continuity:
        description: "Verify — Session continuity after server restart (local build, linux)"
        required: true
        default: true
        type: boolean
      run_self_host_systemd:
        description: "Verify — Real self-host systemd E2E (linux)"
        required: true
        default: false
        type: boolean
      run_self_host_launchd:
        description: "Verify — Real self-host launchd E2E (macOS)"
        required: true
        default: false
        type: boolean
      run_self_host_schtasks:
        description: "Verify — Real self-host schtasks E2E (Windows)"
        required: true
        default: false
        type: boolean
      run_self_host_daemon:
        description: "Verify — Real self-host + CLI daemon E2E (linux+mac)"
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      validation_profile:
        required: false
        default: ''
        type: string
      candidate_source_sha:
        required: false
        default: ''
        type: string
      candidate_cli_version:
        required: false
        default: ''
        type: string
      candidate_stack_version:
        required: false
        default: ''
        type: string
      candidate_server_version:
        required: false
        default: ''
        type: string
      candidate_ui_web_version:
        required: false
        default: ''
        type: string
      verify_stack_release:
        required: false
        default: false
        type: boolean
      run_installers_smoke:
        required: false
        default: true
        type: boolean
      run_binary_smoke:
        required: false
        default: true
        type: boolean
      run_cli_update_continuity:
        required: false
        default: true
        type: boolean
      run_daemon_continuity:
        required: false
        default: true
        type: boolean
      run_session_continuity:
        required: false
        default: true
        type: boolean
      run_self_host_systemd:
        required: false
        default: false
        type: boolean
      run_self_host_launchd:
        required: false
        default: false
        type: boolean
      run_self_host_schtasks:
        required: false
        default: false
        type: boolean
      run_self_host_daemon:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-verify-${{ inputs.channel }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_candidate:
    name: Verify exact immutable candidate artifacts
    if: ${{ inputs.candidate_source_sha != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Install minisign from trusted control bytes
        uses: ./.release-control/.github/actions/bootstrap-minisign

      - name: Require requested HStack verification identity
        if: ${{ inputs.verify_stack_release && inputs.candidate_stack_version == '' }}
        run: |
          echo 'Stack release verification requires candidate_stack_version.' >&2
          exit 1
      - name: Verify CLI candidate
        id: verify_cli
        if: ${{ always() && inputs.candidate_cli_version != '' }}
        uses: ./.release-control/.github/actions/verify-immutable-release-candidate
        with:
          repository: ${{ github.repository }}
          channel: ${{ inputs.channel }}
          candidate_source_sha: ${{ inputs.candidate_source_sha }}
          product: cli
          version: ${{ inputs.candidate_cli_version }}
      - name: Verify HStack candidate
        id: verify_stack
        if: ${{ always() && inputs.candidate_stack_version != '' }}
        uses: ./.release-control/.github/actions/verify-immutable-release-candidate
        with:
          repository: ${{ github.repository }}
          channel: ${{ inputs.channel }}
          candidate_source_sha: ${{ inputs.candidate_source_sha }}
          product: hstack
          version: ${{ inputs.candidate_stack_version }}
      - name: Verify server candidate
        id: verify_server
        if: ${{ always() && inputs.candidate_server_version != '' }}
        uses: ./.release-control/.github/actions/verify-immutable-release-candidate
        with:
          repository: ${{ github.repository }}
          channel: ${{ inputs.channel }}
          candidate_source_sha: ${{ inputs.candidate_source_sha }}
          product: server
          version: ${{ inputs.candidate_server_version }}
      - name: Verify UI-web candidate
        id: verify_ui_web
        if: ${{ always() && inputs.candidate_ui_web_version != '' }}
        uses: ./.release-control/.github/actions/verify-immutable-release-candidate
        with:
          repository: ${{ github.repository }}
          channel: ${{ inputs.channel }}
          candidate_source_sha: ${{ inputs.candidate_source_sha }}
          product: ui-web
          version: ${{ inputs.candidate_ui_web_version }}

  resolve_validation_profile:
    name: Resolve bounded validation profile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_installers_smoke: ${{ steps.profile.outputs.run_installers_smoke }}
      run_binary_smoke: ${{ steps.profile.outputs.run_binary_smoke }}
      run_cli_update_continuity: ${{ steps.profile.outputs.run_cli_update_continuity }}
      run_daemon_continuity: ${{ steps.profile.outputs.run_daemon_continuity }}
      run_session_continuity: ${{ steps.profile.outputs.run_session_continuity }}
      run_self_host_systemd: ${{ steps.profile.outputs.run_self_host_systemd }}
      run_self_host_launchd: ${{ steps.profile.outputs.run_self_host_launchd }}
      run_self_host_schtasks: ${{ steps.profile.outputs.run_self_host_schtasks }}
      run_self_host_daemon: ${{ steps.profile.outputs.run_self_host_daemon }}
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Resolve public profile or retained legacy flags
        id: profile
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
          LEGACY_RUN_INSTALLERS_SMOKE: ${{ inputs.run_installers_smoke }}
          LEGACY_RUN_BINARY_SMOKE: ${{ inputs.run_binary_smoke }}
          LEGACY_RUN_CLI_UPDATE_CONTINUITY: ${{ inputs.run_cli_update_continuity }}
          LEGACY_RUN_DAEMON_CONTINUITY: ${{ inputs.run_daemon_continuity }}
          LEGACY_RUN_SESSION_CONTINUITY: ${{ inputs.run_session_continuity }}
          LEGACY_RUN_SELF_HOST_SYSTEMD: ${{ inputs.run_self_host_systemd }}
          LEGACY_RUN_SELF_HOST_LAUNCHD: ${{ inputs.run_self_host_launchd }}
          LEGACY_RUN_SELF_HOST_SCHTASKS: ${{ inputs.run_self_host_schtasks }}
          LEGACY_RUN_SELF_HOST_DAEMON: ${{ inputs.run_self_host_daemon }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.release-control/scripts/pipeline/run.mjs" release-contract | node --input-type=module -e '
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const legacy = Object.fromEntries(Object.entries({
              run_installers_smoke: process.env.LEGACY_RUN_INSTALLERS_SMOKE,
              run_binary_smoke: process.env.LEGACY_RUN_BINARY_SMOKE,
              run_cli_update_continuity: process.env.LEGACY_RUN_CLI_UPDATE_CONTINUITY,
              run_daemon_continuity: process.env.LEGACY_RUN_DAEMON_CONTINUITY,
              run_session_continuity: process.env.LEGACY_RUN_SESSION_CONTINUITY,
              run_self_host_systemd: process.env.LEGACY_RUN_SELF_HOST_SYSTEMD,
              run_self_host_launchd: process.env.LEGACY_RUN_SELF_HOST_LAUNCHD,
              run_self_host_schtasks: process.env.LEGACY_RUN_SELF_HOST_SCHTASKS,
              run_self_host_daemon: process.env.LEGACY_RUN_SELF_HOST_DAEMON,
            }));
            let outputs = legacy;
            if (process.env.VALIDATION_PROFILE) {
              const contract = JSON.parse(raw);
              const profile = contract.validationProfiles?.find((entry) => entry.id === process.env.VALIDATION_PROFILE);
              if (contract.kind !== "happier.public-release-contract.v1" || contract.schemaVersion !== 1 || !profile?.normalRelease) throw new Error(`Unsupported normal release validation profile: ${process.env.VALIDATION_PROFILE}`);
              const automatic = new Set(profile.automaticSuiteIds);
              const allowed = new Set(["artifact-verify", "binary-smoke", "cli-update", "daemon-continuity", "session-continuity"]);
              if (!automatic.has("artifact-verify") || [...automatic].some((id) => !allowed.has(id))) throw new Error(`Profile ${profile.id} contains an unsupported automatic suite`);
              outputs = {
                run_installers_smoke: "false",
                run_binary_smoke: String(automatic.has("binary-smoke")),
                run_cli_update_continuity: String(automatic.has("cli-update")),
                run_daemon_continuity: String(automatic.has("daemon-continuity")),
                run_session_continuity: String(automatic.has("session-continuity")),
                run_self_host_systemd: "false",
                run_self_host_launchd: "false",
                run_self_host_schtasks: "false",
                run_self_host_daemon: "false",
              };
            }
            for (const [key, value] of Object.entries(outputs)) console.log(`${key}=${value}`);
          ' >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (tests.yml)
    needs: [verify_candidate, resolve_validation_profile]
    if: ${{ always() && (needs.verify_candidate.result == 'success' || needs.verify_candidate.result == 'skipped') && needs.resolve_validation_profile.result == 'success' }}
    uses: ./.github/workflows/tests.yml
    with:
      run_ui: false
      run_server: false
      run_cli: false
      run_stack: false
      run_typecheck: false
      run_cli_daemon_e2e: false
      run_e2e_core: false
      run_server_db_contract: false
      run_providers: false
      run_release_contracts: false
      run_installers_smoke: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_installers_smoke) }}
      installers_channel: ${{ inputs.channel == 'production' && 'stable' || inputs.channel == 'dev' && 'dev' || 'preview' }}
      installers_source: ${{ inputs.candidate_cli_version != '' && 'published-tag' || 'published-channel' }}
      installers_ref: ${{ inputs.candidate_cli_version != '' && format('cli-v{0}', inputs.candidate_cli_version) || '' }}
      run_binary_smoke: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_binary_smoke) }}
      run_cli_update_continuity: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_cli_update_continuity) }}
      run_daemon_continuity: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_daemon_continuity) }}
      run_session_continuity: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_session_continuity) }}
      run_self_host_systemd: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_systemd) }}
      run_self_host_launchd: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_launchd) }}
      run_self_host_schtasks: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_schtasks) }}
      run_self_host_daemon: ${{ fromJSON(needs.resolve_validation_profile.outputs.run_self_host_daemon) }}
