name: BUILD — UI Mobile

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref (branch, tag, or SHA) to build"
        required: false
        default: ""
        type: string
      environment:
        description: "App variant (maps to APP_ENV)"
        required: true
        type: choice
        default: preview
        options:
          - internaldev
          - internalpreview
          - dev
          - preview
          - production
      platform:
        description: "Native platform to build"
        required: true
        type: choice
        default: all
        options:
          - ios
          - android
          - all
      profile:
        description: "EAS build profile (auto: environment→matching profile)"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - internaldev
          - internaldev-store
          - internalpreview
          - internalpreview-apk
          - dev
          - dev-apk
          - preview
          - preview-apk
          - production
          - production-apk
      native_build_mode:
        description: "EAS build runner"
        required: true
        type: choice
        default: local
        options:
          - cloud
          - local
      action:
        description: "Build native binaries, submit/resubmit store builds, resume TestFlight distribution, or publish OTA"
        required: true
        type: choice
        default: build_only
        options:
          - build_only
          - build_and_submit
          - retry_android_store_submit
          - retry_testflight_distribution
          - ota
      publish_apk_release:
        description: "Deploy (Android APK only) — Publish APK to GitHub Releases (auto publishes only when an APK is produced)"
        required: true
        type: choice
        default: "false"
        options:
          - auto
          - "true"
          - "false"
      retry_version:
        description: "Production version — Reproject an existing immutable APK release without rebuilding"
        required: false
        default: ""
        type: string
      retry_testflight_build_number:
        description: "TestFlight retry — Existing App Store Connect build number (no IPA rebuild)"
        required: false
        default: ""
        type: string
      retry_testflight_app_version:
        description: "TestFlight retry — Existing App Store Connect app version (no IPA rebuild)"
        required: false
        default: ""
        type: string
      retry_store_run_id:
        description: "Android submit retry — Origin GitHub Actions run containing the preserved AAB"
        required: false
        default: ""
        type: string
      retry_store_source_sha:
        description: "Android submit retry — Exact source SHA bound to the preserved AAB"
        required: false
        default: ""
        type: string
      release_message:
        description: "Release notes — Exact approved candidate changelog projection"
        required: false
        default: ""
        type: string
      release_notes_id:
        description: "Release notes — Exact approved project release ID for immutable retry projection"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: false
        default: ""
        type: string
      environment:
        required: true
        type: string
      platform:
        required: false
        default: all
        type: string
      profile:
        required: false
        default: auto
        type: string
      native_build_mode:
        required: false
        default: local
        type: string
      action:
        required: false
        default: build_only
        type: string
      publish_apk_release:
        required: false
        default: "false"
        type: string
      retry_version:
        required: false
        default: ""
        type: string
      retry_testflight_build_number:
        required: false
        default: ""
        type: string
      retry_testflight_app_version:
        required: false
        default: ""
        type: string
      retry_store_run_id:
        required: false
        default: ""
        type: string
      retry_store_source_sha:
        required: false
        default: ""
        type: string
      release_message:
        required: false
        default: ""
        type: string
      release_notes_id:
        required: false
        default: ""
        type: string
    secrets:
      EXPO_TOKEN:
        required: false
      APPLE_API_PRIVATE_KEY:
        required: false
      MINISIGN_SECRET_KEY:
        required: false
      MINISIGN_PASSPHRASE:
        required: false

permissions:
  contents: read

concurrency:
  group: build-ui-mobile-local-${{ github.repository }}-${{ inputs.source_ref }}-${{ inputs.environment }}-${{ inputs.platform }}-${{ inputs.profile }}-${{ inputs.action }}-${{ inputs.publish_apk_release }}
  cancel-in-progress: false

env:
  EXPO_UNSTABLE_WEB_MODAL: "1"

jobs:
  trusted_ref_guard:
    name: Trusted workflow ref guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Admit trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_FILE: build-ui-mobile-local.yml
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/main") ;;
            *) echo "Untrusted workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    needs: [trusted_ref_guard]
    name: Release actor guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  validate_expo_token:
    name: Validate EXPO_TOKEN
    if: ${{ inputs.retry_version == '' && inputs.action != 'retry_testflight_distribution' && (inputs.action == 'ota' || inputs.action == 'retry_android_store_submit' || inputs.platform == 'all' || inputs.platform == 'android' || inputs.platform == 'ios') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-shared
    steps:
      - name: Fail when EXPO_TOKEN is missing
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is required for BUILD — UI Mobile." >&2
            echo "Set the repository secret EXPO_TOKEN, or call this workflow from a trusted workflow that provides it." >&2
            exit 1
          fi

  validate_apple_api_private_key:
    name: Validate APPLE_API_PRIVATE_KEY (iOS submit)
    if: ${{ ((inputs.action == 'build_and_submit' && (inputs.platform == 'all' || inputs.platform == 'ios')) || inputs.action == 'retry_testflight_distribution') && (inputs.environment == 'dev' || inputs.environment == 'preview' || inputs.environment == 'production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-shared
    steps:
      - name: Fail when APPLE_API_PRIVATE_KEY is missing
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.APPLE_API_PRIVATE_KEY }}" ]; then
            echo "APPLE_API_PRIVATE_KEY is required for iOS submit in non-interactive mode." >&2
            echo "Set the repository secret APPLE_API_PRIVATE_KEY, or run via workflow_call from a trusted workflow that provides it." >&2
            exit 1
          fi

  build_android:
    name: Build (android)
    if: ${{ inputs.retry_version == '' && inputs.action != 'ota' && inputs.action != 'retry_android_store_submit' && inputs.action != 'retry_testflight_distribution' && (inputs.platform == 'all' || inputs.platform == 'android') }}
    needs: [release_actor_guard, validate_expo_token]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    environment: release-shared
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      app_version: ${{ steps.candidate.outputs.app_version }}
      has_apk: ${{ steps.apk.outputs.has_apk }}
    env:
      EAS_CLI_VERSION: 18.0.1
      APP_ENV: ${{ inputs.environment }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PLATFORM: android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Bind built candidate identity
        id: candidate
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          app_version="$(node -p "require('./apps/ui/package.json').version")"
          canonical_semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          [[ "$candidate_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$app_version" =~ $canonical_semver_re ]]
          printf 'candidate_sha=%s\napp_version=%s\n' "$candidate_sha" "$app_version" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          # Keep builds mobile-focused (desktop/web builds happen elsewhere).
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ (inputs.environment == 'production' && 'production') || ((inputs.environment == 'dev' || inputs.environment == 'preview' || inputs.environment == 'internalpreview') && 'preview') || '' }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: EAS build (pipeline)
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs ui-mobile-release \
            --environment "${{ inputs.environment }}" \
            --action "${{ inputs.action == 'build_and_submit' && 'native_submit' || 'native' }}" \
            --platform "${EAS_PLATFORM}" \
            --profile "${{ inputs.profile == 'auto' && inputs.environment || inputs.profile }}" \
            --native-build-mode "${{ inputs.native_build_mode }}" \
            --build-json "/tmp/eas_build_${EAS_PLATFORM}.json" \
            --out-dir "dist/ui-mobile" \
            --publish-apk-release false \
            --release-message "${{ inputs.release_message }}" \
            --secrets-source env

      - name: Persist Android candidate identity for recovery
        if: ${{ always() }}
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          APP_VERSION: ${{ steps.candidate.outputs.app_version }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          mkdir -p dist/ui-mobile
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync("dist/ui-mobile/candidate-identity.json", `${JSON.stringify({
              schemaVersion: 1,
              candidateSha: process.env.CANDIDATE_SHA,
              appVersion: process.env.APP_VERSION,
              environment: process.env.RELEASE_ENVIRONMENT,
              platform: "android",
            }, null, 2)}\n`);
          '

      - name: Locate built APK candidate
        id: apk
        if: ${{ inputs.publish_apk_release == 'true' || (inputs.publish_apk_release == 'auto' && (inputs.environment == 'dev' || inputs.environment == 'preview' || inputs.environment == 'production')) }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find dist/ui-mobile -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -gt 1 ]; then
            echo "Expected at most one built APK candidate; found ${#apks[@]}." >&2
            exit 1
          fi
          printf 'has_apk=%s\n' "$([ "${#apks[@]}" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload mobile build artifact
        if: ${{ always() && (inputs.native_build_mode == 'local' || steps.apk.outputs.has_apk == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-mobile-${{ inputs.environment }}-android
          path: dist/ui-mobile/**
          retention-days: 7

  publish_android_apk:
    name: Sign and publish Android APK
    if: ${{ inputs.retry_version == '' && inputs.action != 'ota' && (inputs.platform == 'all' || inputs.platform == 'android') && needs.build_android.outputs.has_apk == 'true' }}
    needs: [release_actor_guard, build_android]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    environment: release-shared
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Download built APK candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ui-mobile-${{ inputs.environment }}-android
          path: dist/ui-mobile

      - name: Create GitHub App token (APK publishing)
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Sign and publish APK with trusted control
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
          APP_VERSION: ${{ needs.build_android.outputs.app_version }}
          AUTHORIZED_SHA: ${{ needs.build_android.outputs.candidate_sha }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find dist/ui-mobile -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one built APK candidate; found ${#apks[@]}." >&2
            exit 1
          fi
          node scripts/pipeline/expo/publish-apk-release.mjs \
            --environment "${{ inputs.environment }}" \
            --apk-path "${apks[0]}" \
            --version "$APP_VERSION" \
            --target-sha "$AUTHORIZED_SHA" \
            --release-message "$RELEASE_MESSAGE"

  build_ios:
    name: Build (ios)
    if: ${{ inputs.retry_version == '' && inputs.action != 'ota' && inputs.action != 'retry_android_store_submit' && inputs.action != 'retry_testflight_distribution' && (inputs.platform == 'all' || inputs.platform == 'ios') }}
    needs: [release_actor_guard, validate_expo_token]
    runs-on: macos-26
    timeout-minutes: 180
    environment: release-shared
    env:
      EAS_CLI_VERSION: 18.0.1
      APP_ENV: ${{ inputs.environment }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      EAS_PLATFORM: ios
      APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS }}
      APP_STORE_CONNECT_PUBLICDEV_SUBMIT_BETA_REVIEW: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_SUBMIT_BETA_REVIEW }}
      APP_STORE_CONNECT_PUBLICDEV_WAIT_PROCESSING: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_WAIT_PROCESSING }}
      APP_STORE_CONNECT_PUBLICDEV_PROCESSING_TIMEOUT_SECONDS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_PROCESSING_TIMEOUT_SECONDS }}
      APP_STORE_CONNECT_PREVIEW_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PREVIEW_EXTERNAL_GROUPS }}
      APP_STORE_CONNECT_PREVIEW_SUBMIT_BETA_REVIEW: ${{ vars.APP_STORE_CONNECT_PREVIEW_SUBMIT_BETA_REVIEW }}
      APP_STORE_CONNECT_PREVIEW_WAIT_PROCESSING: ${{ vars.APP_STORE_CONNECT_PREVIEW_WAIT_PROCESSING }}
      APP_STORE_CONNECT_PREVIEW_PROCESSING_TIMEOUT_SECONDS: ${{ vars.APP_STORE_CONNECT_PREVIEW_PROCESSING_TIMEOUT_SECONDS }}
      APP_STORE_CONNECT_PRODUCTION_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PRODUCTION_EXTERNAL_GROUPS }}
      APP_STORE_CONNECT_PRODUCTION_SUBMIT_BETA_REVIEW: ${{ vars.APP_STORE_CONNECT_PRODUCTION_SUBMIT_BETA_REVIEW }}
      APP_STORE_CONNECT_PRODUCTION_WAIT_PROCESSING: ${{ vars.APP_STORE_CONNECT_PRODUCTION_WAIT_PROCESSING }}
      APP_STORE_CONNECT_PRODUCTION_PROCESSING_TIMEOUT_SECONDS: ${{ vars.APP_STORE_CONNECT_PRODUCTION_PROCESSING_TIMEOUT_SECONDS }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Xcode (pin)
        uses: ./.github/actions/setup-xcode
        with:
          xcode_version: "26.2"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          # Keep builds mobile-focused (desktop/web builds happen elsewhere).
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ (inputs.environment == 'production' && 'production') || ((inputs.environment == 'dev' || inputs.environment == 'preview' || inputs.environment == 'internalpreview') && 'preview') || '' }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: EAS build (pipeline)
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs ui-mobile-release \
            --environment "${{ inputs.environment }}" \
            --action "${{ inputs.action == 'build_and_submit' && 'native_submit' || 'native' }}" \
            --platform "${EAS_PLATFORM}" \
            --profile "${{ inputs.profile == 'auto' && inputs.environment || inputs.profile }}" \
            --native-build-mode "${{ inputs.native_build_mode }}" \
            --build-json "/tmp/eas_build_${EAS_PLATFORM}.json" \
            --out-dir "dist/ui-mobile" \
            --publish-apk-release false \
            --release-message "${{ inputs.release_message }}" \
            --secrets-source env

      - name: Upload mobile build artifact
        if: ${{ always() && inputs.native_build_mode == 'local' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-mobile-${{ inputs.environment }}-ios
          path: dist/ui-mobile/**
          retention-days: 7

  retry_android_store_submit:
    name: Resume Android store submission (preserved AAB)
    if: ${{ inputs.action == 'retry_android_store_submit' }}
    needs: [release_actor_guard, validate_expo_token]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    environment: release-shared
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Bind origin run and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_STORE_RUN_ID: ${{ inputs.retry_store_run_id }}
          RETRY_STORE_SOURCE_SHA: ${{ inputs.retry_store_source_sha }}
        run: |
          set -euo pipefail
          [[ "$RETRY_STORE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "retry_store_run_id must be a positive integer." >&2; exit 1; }
          [[ "$RETRY_STORE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "retry_store_source_sha must be an exact lowercase commit SHA." >&2; exit 1; }
          origin_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETRY_STORE_RUN_ID}" --jq .status)"
          origin_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETRY_STORE_RUN_ID}" --jq .head_sha)"
          [ "$origin_status" = completed ] || { echo "Origin run $RETRY_STORE_RUN_ID is not completed." >&2; exit 1; }
          printf 'ORIGIN_HEAD_SHA=%s\n' "$origin_head_sha" >> "$GITHUB_ENV"

      - name: Download preserved Android build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.retry_store_run_id }}
          name: ui-mobile-${{ inputs.environment }}-android
          path: retry-artifact

      - name: Verify candidate identity and resubmit exact AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_CLI_VERSION: 18.0.1
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_PROFILE: ${{ inputs.profile == 'auto' && inputs.environment || inputs.profile }}
          RETRY_STORE_SOURCE_SHA: ${{ inputs.retry_store_source_sha }}
        run: |
          set -euo pipefail
          mapfile -t aabs < <(find retry-artifact -type f -name '*.aab' -print)
          if [ "${#aabs[@]}" -ne 1 ]; then
            echo "Expected exactly one preserved Android AAB; found ${#aabs[@]}." >&2
            exit 1
          fi
          if [ -f retry-artifact/candidate-identity.json ]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const identity = JSON.parse(readFileSync("retry-artifact/candidate-identity.json", "utf8"));
              if (identity.schemaVersion !== 1 || identity.candidateSha !== process.env.RETRY_STORE_SOURCE_SHA || identity.environment !== process.env.RELEASE_ENVIRONMENT || identity.platform !== "android") {
                throw new Error("Preserved Android artifact identity does not match the authorized retry inputs.");
              }
            '
          elif [ "$ORIGIN_HEAD_SHA" != "$RETRY_STORE_SOURCE_SHA" ]; then
            echo "Legacy artifact has no candidate identity and its origin run SHA does not match retry_store_source_sha." >&2
            exit 1
          fi
          aab="${aabs[0]}"
          aab="$(realpath "$aab")"
          submit_workspace="$RUNNER_TEMP/happier-android-submit"
          node scripts/pipeline/expo/prepare-static-submit-workspace.mjs \
            --environment "$RELEASE_ENVIRONMENT" \
            --profile "$RELEASE_PROFILE" \
            --out-dir "$submit_workspace"
          node scripts/pipeline/expo/submit.mjs \
            --environment "$RELEASE_ENVIRONMENT" \
            --platform android \
            --profile "$RELEASE_PROFILE" \
            --project-dir "$submit_workspace" \
            --path "$aab" \
            --wait true \
            --android-release-status draft

  retry_testflight_distribution:
    name: Resume TestFlight distribution (existing build)
    if: ${{ inputs.action == 'retry_testflight_distribution' }}
    needs: [release_actor_guard, validate_apple_api_private_key]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    environment: release-shared
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Attach existing processed build to TestFlight groups
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_PROFILE: ${{ inputs.profile == 'auto' && inputs.environment || inputs.profile }}
          RETRY_TESTFLIGHT_BUILD_NUMBER: ${{ inputs.retry_testflight_build_number }}
          RETRY_TESTFLIGHT_APP_VERSION: ${{ inputs.retry_testflight_app_version }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS }}
          APP_STORE_CONNECT_PUBLICDEV_SUBMIT_BETA_REVIEW: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_SUBMIT_BETA_REVIEW }}
          APP_STORE_CONNECT_PUBLICDEV_WAIT_PROCESSING: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_WAIT_PROCESSING }}
          APP_STORE_CONNECT_PUBLICDEV_PROCESSING_TIMEOUT_SECONDS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_PROCESSING_TIMEOUT_SECONDS }}
          APP_STORE_CONNECT_PREVIEW_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PREVIEW_EXTERNAL_GROUPS }}
          APP_STORE_CONNECT_PREVIEW_SUBMIT_BETA_REVIEW: ${{ vars.APP_STORE_CONNECT_PREVIEW_SUBMIT_BETA_REVIEW }}
          APP_STORE_CONNECT_PREVIEW_WAIT_PROCESSING: ${{ vars.APP_STORE_CONNECT_PREVIEW_WAIT_PROCESSING }}
          APP_STORE_CONNECT_PREVIEW_PROCESSING_TIMEOUT_SECONDS: ${{ vars.APP_STORE_CONNECT_PREVIEW_PROCESSING_TIMEOUT_SECONDS }}
          APP_STORE_CONNECT_PRODUCTION_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PRODUCTION_EXTERNAL_GROUPS }}
          APP_STORE_CONNECT_PRODUCTION_SUBMIT_BETA_REVIEW: ${{ vars.APP_STORE_CONNECT_PRODUCTION_SUBMIT_BETA_REVIEW }}
          APP_STORE_CONNECT_PRODUCTION_WAIT_PROCESSING: ${{ vars.APP_STORE_CONNECT_PRODUCTION_WAIT_PROCESSING }}
          APP_STORE_CONNECT_PRODUCTION_PROCESSING_TIMEOUT_SECONDS: ${{ vars.APP_STORE_CONNECT_PRODUCTION_PROCESSING_TIMEOUT_SECONDS }}
        run: |
          set -euo pipefail
          if ! [[ "$RETRY_TESTFLIGHT_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "retry_testflight_build_number must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "$RETRY_TESTFLIGHT_APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "retry_testflight_app_version must be a semantic version." >&2
            exit 1
          fi

          case "$RELEASE_ENVIRONMENT" in
            dev)
              external_groups="$APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS"
              submit_beta_review="${APP_STORE_CONNECT_PUBLICDEV_SUBMIT_BETA_REVIEW:-auto}"
              wait_processing="${APP_STORE_CONNECT_PUBLICDEV_WAIT_PROCESSING:-true}"
              processing_timeout="${APP_STORE_CONNECT_PUBLICDEV_PROCESSING_TIMEOUT_SECONDS:-3600}"
              ;;
            preview)
              external_groups="$APP_STORE_CONNECT_PREVIEW_EXTERNAL_GROUPS"
              submit_beta_review="${APP_STORE_CONNECT_PREVIEW_SUBMIT_BETA_REVIEW:-auto}"
              wait_processing="${APP_STORE_CONNECT_PREVIEW_WAIT_PROCESSING:-true}"
              processing_timeout="${APP_STORE_CONNECT_PREVIEW_PROCESSING_TIMEOUT_SECONDS:-3600}"
              ;;
            production)
              external_groups="$APP_STORE_CONNECT_PRODUCTION_EXTERNAL_GROUPS"
              submit_beta_review="${APP_STORE_CONNECT_PRODUCTION_SUBMIT_BETA_REVIEW:-auto}"
              wait_processing="${APP_STORE_CONNECT_PRODUCTION_WAIT_PROCESSING:-true}"
              processing_timeout="${APP_STORE_CONNECT_PRODUCTION_PROCESSING_TIMEOUT_SECONDS:-3600}"
              ;;
            *)
              echo "TestFlight distribution retry supports only dev, preview, or production." >&2
              exit 1
              ;;
          esac

          if [ -z "$external_groups" ]; then
            echo "No external TestFlight groups are configured for $RELEASE_ENVIRONMENT." >&2
            exit 1
          fi

          node scripts/pipeline/expo/testflight-distribute.mjs \
            --environment "$RELEASE_ENVIRONMENT" \
            --profile "$RELEASE_PROFILE" \
            --external-groups "$external_groups" \
            --build-number "$RETRY_TESTFLIGHT_BUILD_NUMBER" \
            --app-version "$RETRY_TESTFLIGHT_APP_VERSION" \
            --submit-beta-review "$submit_beta_review" \
            --wait-processing "$wait_processing" \
            --processing-timeout-seconds "$processing_timeout"

  ota_update:
    name: OTA update
    if: ${{ inputs.retry_version == '' && inputs.action == 'ota' }}
    needs: [release_actor_guard, validate_expo_token]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release-shared
    env:
      EAS_CLI_VERSION: 18.0.1
      APP_ENV: ${{ inputs.environment }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ (inputs.environment == 'production' && 'production') || ((inputs.environment == 'dev' || inputs.environment == 'preview' || inputs.environment == 'internalpreview') && 'preview') || '' }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Publish OTA via pipeline
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs ui-mobile-release \
            --environment "${{ inputs.environment }}" \
            --action ota \
            --platform all \
            --secrets-source env

  promote_existing_apk:
    name: Recover rolling APK projection
    if: ${{ inputs.retry_version != '' }}
    needs: [release_actor_guard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-shared
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Bind exact immutable APK tag SHA
        id: source
        env:
          RETRY_VERSION: ${{ inputs.retry_version }}
        run: |
          set -euo pipefail
          node scripts/pipeline/github/resolve-authorized-release-source.mjs \
            --source-ref "refs/tags/ui-mobile-v$RETRY_VERSION" \
            --remote origin \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact immutable APK candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.source.outputs.authorized_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Project approved release notes from exact immutable candidate
        env:
          RETRY_VERSION: ${{ inputs.retry_version }}
          RELEASE_NOTES_ID: ${{ inputs.release_notes_id }}
          AUTHORIZED_SHA: ${{ steps.source.outputs.authorized_sha }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_NOTES_ID" ]; then
            echo "release_notes_id is required when retry_version reprojects an immutable APK release." >&2
            exit 1
          fi
          node scripts/pipeline/release/release-notes/project-release-notes.mjs \
            --release-id "$RELEASE_NOTES_ID" \
            --source-sha "$AUTHORIZED_SHA" \
            --component-version "ui=$RETRY_VERSION" \
            --changelog "$GITHUB_WORKSPACE/candidate/apps/ui/CHANGELOG.md" | \
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              let raw = "";
              for await (const chunk of process.stdin) raw += chunk;
              const bundle = JSON.parse(raw);
              if (bundle.kind !== "happier.release-notes.projection.v2" || bundle.schemaVersion !== 2 || bundle.release?.id !== process.env.RELEASE_NOTES_ID || bundle.release?.sourceSha !== process.env.AUTHORIZED_SHA || JSON.stringify(bundle.release?.components) !== JSON.stringify({ ui: process.env.RETRY_VERSION })) {
                throw new Error("Invalid exact-candidate release-notes projection");
              }
              const value = bundle.projections?.github?.markdown;
              if (typeof value !== "string") throw new Error("Missing github_markdown projection");
              writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, value, { mode: 0o600 });
            '

      - name: Create scoped release token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Recover rolling APK projection from immutable bytes
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          AUTHORIZED_SHA: ${{ steps.source.outputs.authorized_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/expo/publish-apk-release.mjs \
            --environment production \
            --retry-version "$RETRY_VERSION" \
            --target-sha "$AUTHORIZED_SHA" \
            --release-message-file "$RUNNER_TEMP/release-notes.md"
