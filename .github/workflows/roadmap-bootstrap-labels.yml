name: "Roadmap: Bootstrap Labels"

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: Update label descriptions/colors if they already exist.
        required: false
        type: boolean
        default: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Validate actor permissions
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const actor = context.actor;
            const { owner, repo } = context.repo;
            const result = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: actor });
            const allowed = new Set(['admin', 'maintain', 'write', 'triage']);
            if (!allowed.has(result.data.permission)) {
              core.setFailed(`Actor '${actor}' does not have permission to bootstrap labels.`);
            }

      - name: Create/update roadmap labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const force = Boolean(${{ inputs.force_update }});
            const { owner, repo } = context.repo;

            const stageMigrations = [
              { from: 'stage:not-shipped', to: 'stage:source', color: 'bfdadc', description: 'Correction is integrated and verified on the canonical dev branch.' },
              { from: 'stage:experimental', to: 'stage:dev', color: '1d76db', description: 'Correction is available on the automated dev channel.' },
              { from: 'stage:beta', to: 'stage:preview', color: '0e8a16', description: 'Correction is available on the preview channel.' },
              { from: 'stage:ga', to: 'stage:stable', color: '0052cc', description: 'Correction is available on the stable channel.' },
            ];

            for (const migration of stageMigrations) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: migration.from });
              } catch (error) {
                if (error?.status === 404) continue;
                throw error;
              }
              try {
                await github.rest.issues.getLabel({ owner, repo, name: migration.to });
                throw new Error(`Cannot migrate ${migration.from}: target label ${migration.to} already exists.`);
              } catch (error) {
                if (error?.status !== 404) throw error;
              }
              await github.rest.issues.updateLabel({
                owner,
                repo,
                name: migration.from,
                new_name: migration.to,
                color: migration.color,
                description: migration.description,
              });
              core.info(`Migrated label: ${migration.from} -> ${migration.to}`);
            }

            /** @type {Array<{name: string, color: string, description: string}>} */
            const labels = [
              { name: 'roadmap', color: '5319e7', description: 'Include on the public roadmap project.' },

              { name: 'priority:p0', color: 'b60205', description: 'Drop-everything priority.' },
              { name: 'priority:p1', color: 'd93f0b', description: 'High priority.' },
              { name: 'priority:p2', color: 'fbca04', description: 'Normal priority.' },
              { name: 'priority:p3', color: 'c2e0c6', description: 'Low priority.' },

              { name: 'needs:maintainer', color: '1d76db', description: 'Project review or action is required.' },
              { name: 'needs:reporter', color: 'd876e3', description: 'Waiting for new information or confirmation from an external participant.' },

              { name: 'stage:source', color: 'bfdadc', description: 'Correction is integrated and verified on the canonical dev branch.' },
              { name: 'stage:dev', color: '1d76db', description: 'Correction is available on the automated dev channel.' },
              { name: 'stage:preview', color: '0e8a16', description: 'Correction is available on the preview channel.' },
              { name: 'stage:stable', color: '0052cc', description: 'Correction is available on the stable channel.' },

              { name: 'type: bug', color: 'd73a4a', description: 'Bug or regression.' },
              { name: 'type: feature', color: 'a2eeef', description: 'New feature or enhancement.' },
              { name: 'type: task', color: 'ededed', description: 'Internal task or chore.' },

              { name: 'source: bug-report', color: 'fef2c0', description: 'Created from in-app bug report.' },
              { name: 'ai-triage', color: 'cfd3d7', description: 'Needs maintainer triage.' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: label.name, color: label.color, description: label.description });
                core.info(`Created label: ${label.name}`);
              } catch (error) {
                const status = error?.status;
                // 422: already exists (or validation); treat as "exists" for our purposes.
                if (status !== 422) throw error;
                if (!force) {
                  core.info(`Label exists (skipped): ${label.name}`);
                  continue;
                }
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
                core.info(`Updated label: ${label.name}`);
              }
            }
