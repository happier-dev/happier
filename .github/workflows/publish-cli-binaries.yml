name: PUBLISH — CLI Binaries (GitHub)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: dev
        options:
          - preview
          - dev
          - stable
      source_ref:
        description: "Source ref to publish (auto => dev:dev, preview:preview, stable:main)"
        required: true
        default: auto
        type: string
      allow_stable:
        description: "Safety — allow publishing stable artifacts (disabled by default)"
        required: true
        default: false
        type: boolean
      release_message:
        description: "Release message — Optional note to include at the top of the GitHub rolling release notes"
        required: false
        default: ""
        type: string
      retry_version:
        description: "Existing immutable version to re-promote after an interrupted rolling upload"
        required: false
        default: ""
        type: string
      resume_version:
        description: "Existing immutable candidate to re-verify and return without rebuilding or promoting"
        required: false
        default: ""
        type: string
      authorized_sha:
        description: "Caller-bound source SHA (required when invoked by the full release)"
        required: false
        default: ""
        type: string
      publish_rolling:
        description: "Promote the immutable version to the user-consumed rolling channel"
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      source_ref:
        required: false
        default: auto
        type: string
      allow_stable:
        required: false
        default: false
        type: boolean
      release_message:
        required: false
        default: ""
        type: string
      retry_version:
        required: false
        default: ""
        type: string
      resume_version:
        required: false
        default: ""
        type: string
      authorized_sha:
        required: false
        default: ""
        type: string
      publish_rolling:
        required: false
        default: true
        type: boolean
    outputs:
      version:
        description: Exact immutable CLI version published by this invocation
        value: ${{ jobs.finalize_publish.outputs.version || jobs.release_actor_guard.outputs.resume_version }}

permissions:
  contents: read

concurrency:
  group: publish-cli-binaries-${{ github.repository }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Trust called workflow repository and ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Reject cross-repository or untrusted workflow control
        env:
          CHANNEL: ${{ inputs.channel }}
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          RESUME_VERSION: ${{ inputs.resume_version }}
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable|preview|dev) ;;
            *) echo "Noncanonical CLI publisher channel: $CHANNEL" >&2; exit 1 ;;
          esac
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          if [ -n "$RETRY_VERSION" ] && [ -n "$RESUME_VERSION" ]; then
            echo "retry_version and resume_version are mutually exclusive." >&2
            exit 1
          fi
          if [[ -n "$RETRY_VERSION" || -n "$RESUME_VERSION" ]] && [[ ! "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "authorized_sha must be a full lowercase 40-character commit SHA for retry or resume." >&2
            exit 1
          fi
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-cli-binaries.yml@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-cli-binaries.yml@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-cli-binaries.yml@refs/heads/main") ;;
            *) echo "Untrusted CLI publisher control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    name: Release actor guard
    needs: [trusted_ref_guard]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      resume_version: ${{ steps.resume.outputs.resume_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Re-verify reusable immutable CLI candidate
        id: resume
        if: ${{ inputs.resume_version != '' && inputs.retry_version == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ inputs.authorized_sha }}
          RESUME_VERSION: ${{ inputs.resume_version }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/verify-release-candidate-identity.mjs \
            --repository "$REPOSITORY" \
            --channel "$CHANNEL" \
            --candidate-source-sha "$SOURCE_SHA" \
            --candidate-product cli \
            --candidate-version "$RESUME_VERSION"
          echo "resume_version=$RESUME_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify immutable CLI tag matches caller authorization
        if: ${{ inputs.retry_version != '' && inputs.resume_version == '' }}
        env:
          RETRY_VERSION: ${{ inputs.retry_version }}
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/github/resolve-authorized-release-source.mjs \
            --source-ref "refs/tags/cli-v${RETRY_VERSION}" \
            --authorized-sha "$AUTHORIZED_SHA" \
            --remote origin

  prepare:
    if: ${{ inputs.retry_version == '' && inputs.resume_version == '' }}
    needs: [release_actor_guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      embedded_policy_env: ${{ steps.channel_meta.outputs.embedded_policy_env }}
    steps:
      - name: Enforce stable publishing gate
        if: ${{ inputs.channel == 'stable' && inputs.allow_stable != true }}
        run: |
          echo "Stable CLI binary publishing is disabled. Re-run with allow_stable=true if intentional." >&2
          exit 1

      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Resolve channel metadata
        id: channel_meta
        env:
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/resolve-public-release-channel-meta.mjs \
            --channel "$CHANNEL" \
            --source-ref "$SOURCE_REF" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact source as inert data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.authorized_sha != '' && inputs.authorized_sha || steps.channel_meta.outputs.source_ref }}
          path: .candidate-source
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze source SHA
        id: source
        run: |
          set -euo pipefail
          echo "source_sha=$(git -C .candidate-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enforce caller-authorized source SHA
        if: ${{ inputs.authorized_sha != '' }}
        env:
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .candidate-source rev-parse HEAD)" = "$AUTHORIZED_SHA"

      - name: Read candidate base version as data
        id: candidate_base
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import { normalizeRollingBaseVersion } from "./scripts/pipeline/release/lib/rolling-version-allocation.mjs";
            const value = JSON.parse(fs.readFileSync(".candidate-source/apps/cli/package.json", "utf8")).version;
            if (typeof value !== "string" || normalizeRollingBaseVersion(value) !== value) {
              throw new Error("Candidate CLI package version must be exact canonical base semver");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_version=${value}\n`);
          '

      - name: Package exact candidate source as inert transport data
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git -C .candidate-source archive \
            --format=tar.gz \
            --output "${RUNNER_TEMP}/cli-source-${SOURCE_SHA}.tar.gz" \
            HEAD

      - name: Upload exact candidate source transport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-source-${{ steps.source.outputs.source_sha }}
          path: ${{ runner.temp }}/cli-source-${{ steps.source.outputs.source_sha }}.tar.gz
          if-no-files-found: error
          retention-days: 2

      - name: Allocate immutable version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          CANDIDATE_BASE_VERSION: ${{ steps.candidate_base.outputs.base_version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/publish-cli-binaries.mjs \
            --channel "$CHANNEL" \
            --allow-stable "$ALLOW_STABLE" \
            --base-version "$CANDIDATE_BASE_VERSION" \
            --resolve-version-only \
            --github-output "$GITHUB_OUTPUT" \
            --run-contracts false \
            --check-installers false

  build_candidate:
    name: Build unsigned CLI candidate
    if: ${{ inputs.retry_version == '' && inputs.resume_version == '' }}
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {}
    steps:
      - name: Download exact candidate source transport
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-source-${{ needs.prepare.outputs.source_sha }}
          path: ${{ runner.temp }}/cli-source
      - name: Materialize candidate source without repository authority
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cli-source/cli-source-${SOURCE_SHA}.tar.gz"
          test -f "$archive"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/scripts/pipeline/run.mjs"
          test -f "$GITHUB_WORKSPACE/apps/cli/package.json"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        uses: ./.github/actions/enable-corepack-yarn
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines
      - name: Build unsigned CLI archives
        env:
          MINISIGN_SECRET_KEY: ""
          MINISIGN_PASSPHRASE: ""
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/build-cli-binaries.mjs \
            --channel "$CHANNEL" \
            --version "$VERSION"
          find dist/release-assets/cli -type f ! -name '*.tar.gz' -delete
          test "$(find dist/release-assets/cli -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "5"
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-candidate-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: dist/release-assets/cli/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  finalize_darwin:
    name: Sign and notarize CLI (${{ matrix.platform_key }})
    if: ${{ inputs.retry_version == '' && inputs.resume_version == '' }}
    needs: [prepare, build_candidate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment: release-shared
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_key: darwin-x64
            runner: macos-15-intel
            target: darwin-x64
          - platform_key: darwin-arm64
            runner: macos-15
            target: darwin-arm64
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        uses: ./.github/actions/enable-corepack-yarn
      - name: Install trusted workflow control dependencies
        env:
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines --ignore-scripts
      - name: Build trusted release archive runtime
        run: yarn workspace @happier-dev/release-runtime build
      - name: Require Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS payload signing/notarization secret: ${name}" >&2
              exit 1
            fi
          done
      - name: Setup Apple code signing identity
        id: apple_id
        uses: ./.github/actions/setup-apple-codesigning
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Download unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-candidate-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: dist/release-assets/cli
      - name: Sign, notarize, and verify exact CLI archive
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM_KEY: ${{ matrix.platform_key }}
          SIGNING_IDENTITY: ${{ steps.apple_id.outputs.identity }}
        run: |
          set -euo pipefail
          ARCHIVE="${GITHUB_WORKSPACE}/dist/release-assets/cli/happier-v${VERSION}-${TARGET}.tar.gz"
          PAYLOAD="happier-v${VERSION}-${TARGET}"
          EVIDENCE="${GITHUB_WORKSPACE}/dist/notary/${PLATFORM_KEY}.cli.json"
          node scripts/pipeline/release/notarize-standalone-binary.mjs \
            --archive "${ARCHIVE}" \
            --expected-payload "${PAYLOAD}" \
            --identity "${SIGNING_IDENTITY}" \
            --out "${EVIDENCE}" \
            --refresh-cli-runtime-asset-manifest
          VERIFY_DIR="${RUNNER_TEMP}/happier-verify-${PLATFORM_KEY}"
          node scripts/pipeline/release/node-archive.mjs \
            --extract-archive-path "${ARCHIVE}" \
            --extract-dir "${VERIFY_DIR}"
          node scripts/pipeline/release/notarize-standalone-binary.mjs \
            --verify-evidence \
            --payload "${VERIFY_DIR}/${PAYLOAD}" \
            --evidence "${EVIDENCE}"
          CLI_BIN="${VERIFY_DIR}/${PAYLOAD}/happier"
          test -x "$CLI_BIN"
          "$CLI_BIN" --version
      - name: Clean Apple signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.apple_id.outputs.keychain-path }}
          CERTIFICATE_PATH: ${{ steps.apple_id.outputs.certificate-path }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          rm -f "$CERTIFICATE_PATH"
      - name: Assemble signed Darwin leaf handoff
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM_KEY: ${{ matrix.platform_key }}
        run: |
          set -euo pipefail
          rm -rf dist/signed-leaf
          mkdir -p dist/signed-leaf
          cp "dist/release-assets/cli/happier-v${VERSION}-${TARGET}.tar.gz" dist/signed-leaf/
          cp "dist/notary/${PLATFORM_KEY}.cli.json" dist/signed-leaf/
          cp "dist/notary/${PLATFORM_KEY}.cli.json.notary-log.json" dist/signed-leaf/
      - name: Upload signed Darwin leaf and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-signed-${{ matrix.platform_key }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: dist/signed-leaf
          if-no-files-found: error
          retention-days: 2

  finalize_publish:
    name: Finalize and publish exact CLI candidate
    if: ${{ inputs.retry_version == '' && inputs.resume_version == '' }}
    needs: [prepare, build_candidate, finalize_darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release-shared
    permissions:
      contents: read
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        uses: ./.github/actions/enable-corepack-yarn
      - name: Install minisign
        uses: ./.github/actions/bootstrap-minisign
      - name: Install dependencies
        env:
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines
      - name: Download unsigned candidate matrix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-candidate-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: dist/release-assets/cli
      - name: Download signed Darwin leaves
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: cli-signed-*-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: dist/signed-darwin
          merge-multiple: true
      - name: Overlay exact signed Darwin leaves and evidence
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cp "dist/signed-darwin/happier-v${VERSION}-darwin-arm64.tar.gz" dist/release-assets/cli/
          cp "dist/signed-darwin/happier-v${VERSION}-darwin-x64.tar.gz" dist/release-assets/cli/
          cp "dist/signed-darwin/darwin-arm64.cli.json" dist/release-assets/cli/
          cp "dist/signed-darwin/darwin-x64.cli.json" dist/release-assets/cli/
      - name: Create scoped release token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Finalize immutable Release then rolling projection
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
          CHANNEL: ${{ inputs.channel }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
          VERSION: ${{ needs.prepare.outputs.version }}
          AUTHORIZED_SHA: ${{ needs.prepare.outputs.source_sha }}
          PUBLISH_PHASE: ${{ inputs.publish_rolling == false && 'publish-immutable' || 'publish' }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/publish-cli-binaries.mjs \
            --channel "$CHANNEL" \
            --allow-stable "$ALLOW_STABLE" \
            --release-message "$RELEASE_MESSAGE" \
            --version "$VERSION" \
            --authorized-sha "$AUTHORIZED_SHA" \
            --phase "$PUBLISH_PHASE" \
            --prepared-artifacts \
            --run-contracts false \
            --check-installers true

  promote_existing:
    name: Recover rolling CLI projection
    if: ${{ inputs.retry_version != '' && inputs.resume_version == '' }}
    needs: [release_actor_guard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-shared
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Install minisign
        uses: ./.github/actions/bootstrap-minisign
      - name: Create scoped release token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Recover rolling projection from immutable bytes
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          CHANNEL: ${{ inputs.channel }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/publish-cli-binaries.mjs \
            --channel "$CHANNEL" \
