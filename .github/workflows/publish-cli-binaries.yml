name: PUBLISH — CLI Binaries (GitHub)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: dev
        options:
          - preview
          - dev
          - stable
      source_ref:
        description: "Source ref to publish (auto => dev:dev, preview:preview, stable:main)"
        required: true
        default: auto
        type: string
      allow_stable:
        description: "Safety — allow publishing stable artifacts (disabled by default)"
        required: true
        default: false
        type: boolean
      release_message:
        description: "Release message — Optional note to include at the top of the GitHub rolling release notes"
        required: false
        default: ""
        type: string
      retry_version:
        description: "Recovery — exact immutable version to re-project to the rolling channel"
        required: false
        default: ""
        type: string
      authorized_sha:
        description: "Caller-bound source SHA"
        required: false
        default: ""
        type: string
      candidate_only:
        description: "Build and sign one candidate-native matrix without publishing GitHub Releases"
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      source_ref:
        required: false
        default: auto
        type: string
      allow_stable:
        required: false
        default: false
        type: boolean
      release_message:
        required: false
        default: ""
        type: string
      retry_version:
        required: false
        default: ""
        type: string
      authorized_sha:
        required: false
        default: ""
        type: string
      candidate_only:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-cli-binaries-${{ github.repository }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Trust called workflow repository and ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject cross-repository or untrusted workflow control
        env:
          CHANNEL: ${{ inputs.channel }}
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          if [ "$CANDIDATE_ONLY" = "true" ] && [ -n "$RETRY_VERSION" ]; then
            echo "Candidate-only mode cannot promote an existing release." >&2
            exit 1
          fi
          case "$CHANNEL" in
            stable|preview|dev) ;;
            *) echo "Noncanonical CLI publisher channel: $CHANNEL" >&2; exit 1 ;;
          esac
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-cli-binaries.yml@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-cli-binaries.yml@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-cli-binaries.yml@refs/heads/main") ;;
            *) echo "Untrusted CLI publisher control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    name: Release actor guard
    needs: [trusted_ref_guard]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  prepare:
    if: ${{ inputs.retry_version == '' }}
    name: Freeze source and release version
    needs: [release_actor_guard]
    runs-on: ubuntu-24.04
    environment: release-shared
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
      embedded_policy_env: ${{ steps.channel_meta.outputs.embedded_policy_env }}
    steps:
      - name: Enforce stable publishing gate
        if: ${{ inputs.channel == 'stable' && inputs.allow_stable != true }}
        run: |
          echo "Stable CLI binary publishing is disabled. Re-run with allow_stable=true if intentional." >&2
          exit 1

      - name: Checkout workflow repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Resolve channel metadata
        id: channel_meta
        run: |
          set -euo pipefail
          node scripts/pipeline/release/resolve-public-release-channel-meta.mjs \
            --channel "${{ inputs.channel }}" \
            --source-ref "${{ inputs.source_ref }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ steps.channel_meta.outputs.source_ref }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false

      - name: Freeze source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enforce caller-authorized source SHA
        if: ${{ inputs.authorized_sha != '' }}
        env:
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"

      - name: Admit Qualified V4 CLI payload publication
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$RELEASE_CHANNEL" in
            stable) deploy_environment="production" ;;
            preview|dev) deploy_environment="preview" ;;
            *) echo "Unsupported CLI release channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          deploy_branch="deploy/${deploy_environment}/server"
          baseline_ref="refs/qualified-v4-payload-baseline"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/${deploy_branch}" >/dev/null
          baseline_status=$?
          set -e
          case "$baseline_status" in
            0) git fetch --no-tags origin "refs/heads/${deploy_branch}:${baseline_ref}" ;;
            2) ;;
            *) echo "Unable to resolve deployed server migration baseline ${deploy_branch}." >&2; exit "$baseline_status" ;;
          esac
          node scripts/release/qualified-connected-accounts-v4-activation-admission.mjs \
            --admission-kind payload-publication \
            --baseline-ref "$baseline_ref" \
            --candidate-ref HEAD \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Enable Corepack (Yarn)
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ steps.channel_meta.outputs.embedded_policy_env }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Allocate one release version for the native matrix
        id: version
        env:
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$CANDIDATE_ONLY" = "true" ]; then
            candidate_version="$(node -p "require('./apps/cli/package.json').version")"
            test -n "$candidate_version"
            echo "version=${candidate_version}" >> "$GITHUB_OUTPUT"
          else
            node scripts/pipeline/run.mjs publish-cli-binaries \
              --channel "${{ inputs.channel }}" \
              --allow-stable "${{ inputs.allow_stable }}" \
              --resolve-version-only \
              --github-output "$GITHUB_OUTPUT"
          fi

  build_native:
    if: ${{ inputs.retry_version == '' }}
    name: Build and verify CLI (${{ matrix.platform_key }})
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    environment: release-shared
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_key: linux-x64
            runner: ubuntu-24.04
            platform_os: linux
            cli_target: linux-x64
            go_target: linux-amd64
            wrapper_name: happier-cliproxyapi-managed
          - platform_key: linux-arm64
            runner: ubuntu-24.04-arm
            platform_os: linux
            cli_target: linux-arm64
            go_target: linux-arm64
            wrapper_name: happier-cliproxyapi-managed
          - platform_key: darwin-x64
            runner: macos-15-intel
            platform_os: macos
            cli_target: darwin-x64
            go_target: darwin-amd64
            wrapper_name: happier-cliproxyapi-managed
          - platform_key: darwin-arm64
            runner: macos-15
            platform_os: macos
            cli_target: darwin-arm64
            go_target: darwin-arm64
            wrapper_name: happier-cliproxyapi-managed
          - platform_key: windows-x64
            runner: windows-2025
            platform_os: windows
            cli_target: windows-x64
            go_target: windows-amd64
            wrapper_name: happier-cliproxyapi-managed.exe
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Setup pinned Go toolchain and module cache
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/plugins/cliproxyapi/managed-runtime/go.mod
          cache: true
          cache-dependency-path: packages/plugins/cliproxyapi/managed-runtime/go.sum

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Run retained source conformance harness
        shell: bash
        working-directory: packages/plugins/cliproxyapi/managed-runtime
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Run Linux race and reachable vulnerability checks
        if: matrix.platform_key == 'linux-x64'
        shell: bash
        working-directory: packages/plugins/cliproxyapi/managed-runtime
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
          go tool govulncheck ./...

      - name: Resolve wrapper output path
        shell: bash
        env:
          WRAPPER_NAME: ${{ matrix.wrapper_name }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const path=require("path");fs.appendFileSync(process.env.GITHUB_ENV,`WRAPPER_PATH=${path.join(process.env.RUNNER_TEMP,process.env.WRAPPER_NAME)}\n`)'

      - name: Build wrapper through its one package-owned definition
        shell: bash
        env:
          HAPPIER_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          yarn workspace @happier-dev/plugins-cliproxyapi managed-runtime:build \
            --target "${{ matrix.go_target }}" \
            --output "${WRAPPER_PATH}"
          node -e 'const fs=require("fs");if(!fs.statSync(process.argv[1]).isFile())process.exit(1)' "${WRAPPER_PATH}"

      - name: Record exact Go module graph and embedded build provenance
        shell: bash
        working-directory: packages/plugins/cliproxyapi/managed-runtime
        run: |
          set -euo pipefail
          PROVENANCE_DIR="${GITHUB_WORKSPACE}/dist/provenance"
          mkdir -p "${PROVENANCE_DIR}"
          go mod graph | LC_ALL=C sort > "${PROVENANCE_DIR}/${{ matrix.platform_key }}.module-graph.txt"
          go list -m -f '{{.Path}} {{.Version}}' all | LC_ALL=C sort > \
            "${PROVENANCE_DIR}/${{ matrix.platform_key }}.module-list.txt"
          go version -m "${WRAPPER_PATH}" | tail -n +2 > "${PROVENANCE_DIR}/${{ matrix.platform_key }}.binary-build-info.txt"
          grep -F $'\tdep\tgithub.com/router-for-me/CLIProxyAPI/v7\tv7.2.95' \
            "${PROVENANCE_DIR}/${{ matrix.platform_key }}.binary-build-info.txt"

      - name: Require Apple signing and notarization credentials
        if: matrix.platform_os == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS payload signing/notarization secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Apple codesigning certificate
        if: matrix.platform_os == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="${RUNNER_TEMP}/build.keychain-db"
          keychain_password="$(uuidgen)"
          cert_path="${RUNNER_TEMP}/apple-cert.p12"
          echo "${APPLE_CERTIFICATE}" | base64 --decode > "${cert_path}"
          chmod 600 "${cert_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          existing_keychains=()
          while IFS= read -r line; do
            existing_keychains+=("${line}")
          done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"
          security import "${cert_path}" -k "${keychain_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"

      - name: Resolve Apple signing identity
        if: matrix.platform_os == 'macos'
        id: apple_id
        shell: bash
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning 2>&1 | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          if [ -z "${identity:-}" ]; then
            echo "Unable to find Developer ID Application identity after importing certificate." >&2
            exit 1
          fi
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      - name: Build exact native CLI archive from the wrapper
        if: matrix.platform_os != 'macos'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs release-build-cli-binaries \
            --channel "${{ inputs.channel }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --targets "${{ matrix.cli_target }}" \
            --cliproxyapi-managed-runtime-executable "${WRAPPER_PATH}"

      - name: Build, sign, and notarize exact native CLI payload from the wrapper
        if: matrix.platform_os == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs release-build-cli-binaries \
            --channel "${{ inputs.channel }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --targets "${{ matrix.cli_target }}" \
            --cliproxyapi-managed-runtime-executable "${WRAPPER_PATH}" \
            --macos-signing-identity "${{ steps.apple_id.outputs.identity }}" \
            --macos-notarization-output "dist/notary/${{ matrix.platform_key }}.cli.json"

      - name: Run retained conformance harness against the packaged wrapper
        shell: bash
        working-directory: packages/plugins/cliproxyapi/managed-runtime
        run: |
          set -euo pipefail
          ARCHIVE="${GITHUB_WORKSPACE}/dist/release-assets/cli/happier-v${{ needs.prepare.outputs.version }}-${{ matrix.cli_target }}.tar.gz"
          EXTRACT_DIR="${RUNNER_TEMP}/packaged-${{ matrix.platform_key }}"
          rm -rf "${EXTRACT_DIR}"
          node "${GITHUB_WORKSPACE}/scripts/pipeline/release/node-archive.mjs" \
            --extract-archive-path "${ARCHIVE}" \
            --extract-dir "${EXTRACT_DIR}"
          PACKAGED_PAYLOAD_PATH="${EXTRACT_DIR}/happier-v${{ needs.prepare.outputs.version }}-${{ matrix.cli_target }}"
          test -d "${PACKAGED_PAYLOAD_PATH}"
          PACKAGED_WRAPPER_PATH="$(find "${EXTRACT_DIR}" -type f -name '${{ matrix.wrapper_name }}' -print)"
          PACKAGED_LICENSE_PATH="$(find "${EXTRACT_DIR}" -type f -name 'CLIProxyAPI-LICENSE' -print)"
          PACKAGED_NOTICES_PATH="$(find "${EXTRACT_DIR}" -type f -name 'CLIProxyAPI-THIRD-PARTY-NOTICES' -print)"
          test "$(printf '%s\n' "${PACKAGED_WRAPPER_PATH}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "${PACKAGED_LICENSE_PATH}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "${PACKAGED_NOTICES_PATH}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          cmp \
            "licenses/CLIProxyAPI-LICENSE" \
            "${PACKAGED_LICENSE_PATH}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            node "${GITHUB_WORKSPACE}/scripts/pipeline/release/notarize-standalone-binary.mjs" \
              --verify-evidence \
              --payload "${PACKAGED_PAYLOAD_PATH}" \
              --evidence "${GITHUB_WORKSPACE}/dist/notary/${{ matrix.platform_key }}.cli.json"
          fi
          GO_TARGET="${{ matrix.go_target }}"
          GOOS_VALUE="${GO_TARGET%-*}"
          GOARCH_VALUE="${GO_TARGET#*-}"
          go run ./tools/notices \
            --binary "${PACKAGED_WRAPPER_PATH}" \
            --goos "${GOOS_VALUE}" \
            --goarch "${GOARCH_VALUE}" \
            --output "${PACKAGED_NOTICES_PATH}" \
            --check
          go version -m "${PACKAGED_WRAPPER_PATH}" | tail -n +2 > \
            "${GITHUB_WORKSPACE}/dist/provenance/${{ matrix.platform_key }}.packaged-binary-build-info.txt"
          cmp \
            "${GITHUB_WORKSPACE}/dist/provenance/${{ matrix.platform_key }}.binary-build-info.txt" \
            "${GITHUB_WORKSPACE}/dist/provenance/${{ matrix.platform_key }}.packaged-binary-build-info.txt"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            PACKAGED_WRAPPER_PATH="$(cygpath -w "${PACKAGED_WRAPPER_PATH}")"
          else
            test -x "${PACKAGED_WRAPPER_PATH}"
          fi
          HAPPIER_CLIPROXYAPI_EXECUTABLE="${PACKAGED_WRAPPER_PATH}" \
            HAPPIER_CLIPROXYAPI_WRAPPER_BUILD_VERSION="${{ needs.prepare.outputs.version }}" \
            go test ./conformance -run '^TestPackagedWrapper$' -count=1 -v

      - name: Attest exact archive from its native builder
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/release-assets/cli/happier-v${{ needs.prepare.outputs.version }}-${{ matrix.cli_target }}.tar.gz

      - name: Clean Apple signing material
        if: always() && matrix.platform_os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain "${RUNNER_TEMP}/build.keychain-db" >/dev/null 2>&1 || true
          rm -f "${RUNNER_TEMP}/apple-cert.p12"

      - name: Upload exact native archive and notarization evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-native-${{ matrix.platform_key }}
          path: |
            dist/release-assets/cli/happier-v${{ needs.prepare.outputs.version }}-${{ matrix.cli_target }}.tar.gz
            dist/notary/${{ matrix.platform_key }}.cli.json
            dist/notary/${{ matrix.platform_key }}.cli.json.notary-log.json
            dist/provenance/${{ matrix.platform_key }}.module-graph.txt
            dist/provenance/${{ matrix.platform_key }}.module-list.txt
            dist/provenance/${{ matrix.platform_key }}.binary-build-info.txt
            dist/provenance/${{ matrix.platform_key }}.packaged-binary-build-info.txt
          if-no-files-found: error
          retention-days: 7

  finalize_candidate:
    if: ${{ inputs.retry_version == '' && inputs.candidate_only == true }}
    name: Finalize signed CLI candidate matrix
    needs: [prepare, build_native]
    runs-on: ubuntu-24.04
    environment: release-shared
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install minisign
        uses: ./.github/actions/bootstrap-minisign

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Download exact native leaves
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-native-*
          path: dist/native-matrix
          merge-multiple: true

      - name: Assemble bounded candidate-native matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/candidate-native-matrix
          mkdir -p dist/candidate-native-matrix
          find dist/native-matrix -type f -name '*.tar.gz' \
            -exec cp '{}' dist/candidate-native-matrix/ ';'
          test "$(find dist/candidate-native-matrix -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "5"
          for evidence in darwin-x64.cli.json darwin-arm64.cli.json; do
            matches=()
            while IFS= read -r match; do
              matches+=("$match")
            done < <(find dist/native-matrix -type f -name "$evidence" -print)
            test "${#matches[@]}" = "1"
            cp "${matches[0]}" "dist/candidate-native-matrix/$evidence"
          done
          test "$(find dist/candidate-native-matrix -maxdepth 1 -type f -name '*.cli.json' | wc -l | tr -d ' ')" = "2"

      - name: Finalize and verify signed candidate-native matrix
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/publishing/prepare-binary-assets.mjs \
            --finalize-prepared-only \
            --product cli \
            --channel "${{ inputs.channel }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --artifacts-dir dist/candidate-native-matrix
          node scripts/pipeline/release/verify-artifacts.mjs \
            --artifacts-dir dist/candidate-native-matrix \
            --public-key apps/website/public/happier-release.pub \
            --skip-smoke
          test "$(find dist/candidate-native-matrix -maxdepth 1 -type f | wc -l | tr -d ' ')" = "9"

      - name: Upload one signed candidate-native matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-candidate-native-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: dist/candidate-native-matrix
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.retry_version == '' && inputs.candidate_only != true }}
    name: Publish complete CLI matrix
    needs: [prepare, build_native]
    runs-on: ubuntu-24.04
    environment: release-shared
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install minisign
        uses: ./.github/actions/bootstrap-minisign

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Download native matrix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-native-*
          path: dist/native-matrix
          merge-multiple: true

      - name: Assemble prepared archive directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/release-assets/cli
          mkdir -p dist/release-assets/cli
          find dist/native-matrix -type f -name '*.tar.gz' -exec cp '{}' dist/release-assets/cli/ ';'
          test "$(find dist/release-assets/cli -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "5"

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Re-admit Qualified V4 CLI payload publication
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$RELEASE_CHANNEL" in
            stable) deploy_environment="production" ;;
            preview|dev) deploy_environment="preview" ;;
            *) echo "Unsupported CLI release channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          deploy_branch="deploy/${deploy_environment}/server"
          baseline_ref="refs/qualified-v4-payload-baseline"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/${deploy_branch}" >/dev/null
          baseline_status=$?
          set -e
          case "$baseline_status" in
            0) git fetch --no-tags origin "refs/heads/${deploy_branch}:${baseline_ref}" ;;
            2) ;;
            *) echo "Unable to resolve deployed server migration baseline ${deploy_branch}." >&2; exit "$baseline_status" ;;
          esac
          node scripts/release/qualified-connected-accounts-v4-activation-admission.mjs \
            --admission-kind payload-publication \
            --baseline-ref "$baseline_ref" \
            --candidate-ref HEAD \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Sign manifests and publish prepared CLI matrix
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs publish-cli-binaries \
            --channel "${{ inputs.channel }}" \
            --allow-stable "${{ inputs.allow_stable }}" \
            --release-message "${{ inputs.release_message }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --prepared-artifacts \
            --run-contracts "true" \
            --check-installers "true"

  promote_existing:
    name: Recover rolling CLI projection
    if: ${{ inputs.retry_version != '' && inputs.candidate_only != true }}
    needs: [release_actor_guard]
    runs-on: ubuntu-24.04
    environment: release-shared
    permissions:
      contents: write
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install minisign
        uses: ./.github/actions/bootstrap-minisign
      - name: Install dependencies
        env:
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines
      - name: Create scoped release token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Bind exact immutable tag SHA
        id: source
        env:
          RETRY_VERSION: ${{ inputs.retry_version }}
        run: |
          node scripts/pipeline/github/resolve-authorized-release-source.mjs \
            --source-ref "refs/tags/cli-v${RETRY_VERSION}" \
            --remote origin \
            --github-output "$GITHUB_OUTPUT"
      - name: Admit Qualified V4 immutable CLI payload publication
        env:
          AUTHORIZED_SHA: ${{ steps.source.outputs.authorized_sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$AUTHORIZED_SHA"
          git update-ref refs/qualified-v4-payload-candidate FETCH_HEAD
          case "$RELEASE_CHANNEL" in
            stable) deploy_environment="production" ;;
            preview|dev) deploy_environment="preview" ;;
            *) echo "Unsupported CLI release channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          deploy_branch="deploy/${deploy_environment}/server"
          baseline_ref="refs/qualified-v4-payload-baseline"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/${deploy_branch}" >/dev/null
          baseline_status=$?
          set -e
          case "$baseline_status" in
            0) git fetch --no-tags origin "refs/heads/${deploy_branch}:${baseline_ref}" ;;
            2) ;;
            *) echo "Unable to resolve deployed server migration baseline ${deploy_branch}." >&2; exit "$baseline_status" ;;
          esac
          node scripts/release/qualified-connected-accounts-v4-activation-admission.mjs \
            --admission-kind payload-publication \
            --baseline-ref "$baseline_ref" \
            --candidate-ref refs/qualified-v4-payload-candidate \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Recover rolling projection from immutable bytes
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          AUTHORIZED_SHA: ${{ steps.source.outputs.authorized_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/publish-cli-binaries.mjs \
            --channel "${{ inputs.channel }}" \
            --allow-stable "${{ inputs.allow_stable }}" \
            --release-message "${{ inputs.release_message }}" \
            --phase promote-rolling \
            --version "$RETRY_VERSION" \
            --authorized-sha "$AUTHORIZED_SHA" \
            --run-contracts false \
            --check-installers true
