name: PROMOTE — Branch (fast-forward or reset)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Target — Source branch to copy FROM"
        required: true
        default: dev
        type: string
      source_sha:
        description: "Exact authorized source commit SHA"
        required: false
        default: ""
        type: string
      target:
        description: "Target — Target branch to update"
        required: true
        default: main
        type: string
      mode:
        description: "Promotion — Mode"
        required: true
        type: choice
        default: fast_forward
        options:
          - fast_forward
          - reset
      dry_run:
        description: "Safety — Only compute and show what would change (no push)"
        required: true
        default: false
        type: boolean
      allow_reset:
        description: "Safety — Required when mode=reset (rewrites target history)"
        required: true
        default: false
        type: boolean
      confirm:
        description: "Confirm — Type exactly: promote <target> from <source> (or: reset <target> from <source>)"
        required: true
        type: string
  workflow_call:
    inputs:
      source:
        description: "Source branch to copy FROM"
        required: true
        type: string
      source_sha:
        description: "Exact authorized source commit SHA"
        required: false
        default: ""
        type: string
      target:
        description: "Target branch to update"
        required: true
        type: string
      mode:
        description: "Promotion mode"
        required: true
        type: string
      dry_run:
        description: "Only compute and show what would change (no push)"
        required: false
        default: false
        type: boolean
      allow_reset:
        description: "Required when mode=reset (rewrites target history)"
        required: false
        default: false
        type: boolean
      confirm:
        description: "Type exactly: promote <target> from <source> (or: reset <target> from <source>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-branch-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Trusted workflow ref guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Admit trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_FILE: promote-branch.yml
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/main") ;;
            *) echo "Untrusted workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    needs: [trusted_ref_guard]
    name: Release actor guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  promote:
    needs: [release_actor_guard]
    runs-on: ubuntu-latest
    environment: release-shared
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Validate inputs
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_RESET: ${{ inputs.allow_reset }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          src="$INPUT_SOURCE"
          tgt="$INPUT_TARGET"
          mode="$INPUT_MODE"
          confirm="$INPUT_CONFIRM"

          if [ -z "$src" ] || [ -z "$tgt" ]; then
            echo "source and target are required." >&2
            exit 1
          fi

          git check-ref-format --branch "$src" >/dev/null || {
            echo "Invalid source branch: $src" >&2
            exit 1
          }
          git check-ref-format --branch "$tgt" >/dev/null || {
            echo "Invalid target branch: $tgt" >&2
            exit 1
          }

          if [ "$src" = "$tgt" ]; then
            echo "Refusing to promote a branch onto itself ($tgt)." >&2
            exit 1
          fi

          case "$INPUT_DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false." >&2; exit 1 ;;
          esac

          if [ "$INPUT_DRY_RUN" = "false" ] && [ -z "$INPUT_SOURCE_SHA" ]; then
            echo "source_sha is required when dry_run is false." >&2
            exit 1
          fi
          if [ -n "$INPUT_SOURCE_SHA" ] && ! [[ "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi

          case "$INPUT_ALLOW_RESET" in
            true|false) ;;
            *) echo "allow_reset must be true or false." >&2; exit 1 ;;
          esac

          if [ "$mode" = "fast_forward" ]; then
            expected="promote $tgt from $src"
            if [ "$confirm" != "$expected" ]; then
              echo "Confirmation mismatch." >&2
              echo "Expected: $expected" >&2
              echo "Got:      $confirm" >&2
              exit 1
            fi
          elif [ "$mode" = "reset" ]; then
            if [ "$INPUT_ALLOW_RESET" != "true" ]; then
              echo "Refusing to reset without allow_reset=true." >&2
              exit 1
            fi
            expected="reset $tgt from $src"
            if [ "$confirm" != "$expected" ]; then
              echo "Confirmation mismatch." >&2
              echo "Expected: $expected" >&2
              echo "Got:      $confirm" >&2
              exit 1
            fi
          else
            echo "Unknown mode: $mode" >&2
            exit 1
          fi

      - name: Enforce trusted refs for manual dispatch
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            dev|preview|main) ;;
            *)
              echo "Refusing workflow_dispatch from untrusted ref '${GITHUB_REF_NAME}'. Use dev, preview, or main." >&2
              exit 1
              ;;
          esac

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Promote branch (pipeline)
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_RESET: ${{ inputs.allow_reset }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          run_promote_branch() {
            node scripts/pipeline/run.mjs promote-branch \
              --source "$INPUT_SOURCE" \
              "$@" \
              --target "$INPUT_TARGET" \
              --mode "$INPUT_MODE" \
              --allow-reset "$INPUT_ALLOW_RESET" \
              --confirm "$INPUT_CONFIRM" \
              --summary-file "$GITHUB_STEP_SUMMARY"
          }
          if [ -n "$INPUT_SOURCE_SHA" ]; then
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              run_promote_branch --source-sha "$INPUT_SOURCE_SHA" --dry-run
            else
              run_promote_branch --source-sha "$INPUT_SOURCE_SHA"
            fi
          elif [ "$INPUT_DRY_RUN" = "true" ]; then
            run_promote_branch --dry-run
          else
            run_promote_branch
          fi
