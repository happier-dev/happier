name: RELEASE — npm publish (cli/stack/server/plugin-sdk/sdk)

on:
  workflow_call:
    outputs:
      plugin_sdk_result:
        description: "Verified publish result for @happier-dev/plugin-sdk"
        value: ${{ jobs.publish-plugin-sdk-pair.outputs.plugin_sdk_result }}
      plugin_sdk_version:
        description: "Published @happier-dev/plugin-sdk version"
        value: ${{ jobs.publish-plugin-sdk-pair.outputs.plugin_sdk_version }}
      plugin_sdk_integrity:
        description: "Published @happier-dev/plugin-sdk integrity"
        value: ${{ jobs.publish-plugin-sdk-pair.outputs.plugin_sdk_integrity }}
      plugin_ui_result:
        description: "Verified publish result for @happier-dev/plugin-ui"
        value: ${{ jobs.publish-plugin-sdk-pair.outputs.plugin_ui_result }}
      plugin_ui_version:
        description: "Published @happier-dev/plugin-ui version"
        value: ${{ jobs.publish-plugin-sdk-pair.outputs.plugin_ui_version }}
      plugin_ui_integrity:
        description: "Published @happier-dev/plugin-ui integrity"
        value: ${{ jobs.publish-plugin-sdk-pair.outputs.plugin_ui_integrity }}
      sdk_result:
        description: "Verified publish result for @happier-dev/sdk"
        value: ${{ jobs.publish-sdk.outputs.sdk_result }}
      sdk_version:
        description: "Published @happier-dev/sdk version"
        value: ${{ jobs.publish-sdk.outputs.sdk_version }}
      sdk_integrity:
        description: "Published @happier-dev/sdk integrity"
        value: ${{ jobs.publish-sdk.outputs.sdk_integrity }}
    inputs:
      channel:
        description: "Target — Release channel"
        required: true
        type: string
      source_ref:
        description: "Promotion — Source ref to release from (auto: preview→preview, production→main)"
        required: false
        default: auto
        type: string
      authorized_sha:
        description: "Release-admitted exact source SHA"
        required: true
        type: string
      run_tests:
        description: "Checks — Run publish checks/tests before publishing"
        required: false
        default: true
        type: boolean
      publish_cli:
        description: "Publish (CLI) — Publish CLI to npm"
        required: false
        default: true
        type: boolean
      npm_tag:
        description: "Publish (CLI) — npm dist-tag (production: latest, preview: next)"
        required: false
        default: latest
        type: string
      publish_stack:
        description: "Compatibility (Stack) — Publish hstack dev-helper package to npm (not release signoff)"
        required: false
        default: false
        type: boolean
      publish_server:
        description: "Publish (Server) — Publish server runner (@happier-dev/relay-server) to npm"
        required: false
        default: false
        type: boolean
      publish_plugin_sdk:
        description: "Publish (Plugin SDK) — Publish the lockstep plugin-sdk/plugin-ui pair to npm"
        required: false
        default: false
        type: boolean
      publish_sdk:
        description: "Publish (SDK) — Publish @happier-dev/sdk to npm"
        required: false
        default: false
        type: boolean
      release_message:
        description: "Release message — Optional note to include at the top of GitHub rolling release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Trusted workflow ref guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Admit trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_FILE: release-npm.yml
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/main") ;;
            *) echo "Untrusted workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    needs: [trusted_ref_guard]
    name: Release actor guard
    permissions:
      contents: read
    # We install Sapling via a Ubuntu 22.04 package; pin runner for compatibility.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  release:
    needs: [release_actor_guard]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      HAPPIER_EMBEDDED_POLICY_ENV: ${{ inputs.channel == 'production' && 'production' || 'preview' }}
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      channel: ${{ steps.meta.outputs.channel }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      cli_version: ${{ steps.meta.outputs.cli_version }}
      stack_version: ${{ steps.meta.outputs.stack_version }}
      server_version: ${{ steps.meta.outputs.server_version }}
      plugin_sdk_version: ${{ steps.meta.outputs.plugin_sdk_version }}
      sdk_version: ${{ steps.meta.outputs.sdk_version }}
    steps:
      - name: Resolve release inputs
        id: release_inputs
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_NPM_TAG: ${{ inputs.npm_tag }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          INPUT_PUBLISH_CLI: ${{ inputs.publish_cli }}
          INPUT_PUBLISH_STACK: ${{ inputs.publish_stack }}
          INPUT_PUBLISH_SERVER: ${{ inputs.publish_server }}
          INPUT_PUBLISH_PLUGIN_SDK: ${{ inputs.publish_plugin_sdk }}
          INPUT_PUBLISH_SDK: ${{ inputs.publish_sdk }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/resolve-npm-release-inputs.mjs \
            --channel "$INPUT_CHANNEL" \
            --npm-tag "$INPUT_NPM_TAG" \
            --source-ref "$INPUT_SOURCE_REF" \
            --authorized-sha "$INPUT_AUTHORIZED_SHA" \
            --publish-cli "$INPUT_PUBLISH_CLI" \
            --publish-stack "$INPUT_PUBLISH_STACK" \
            --publish-server "$INPUT_PUBLISH_SERVER" \
            --publish-plugin-sdk "$INPUT_PUBLISH_PLUGIN_SDK" \
            --publish-sdk "$INPUT_PUBLISH_SDK" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.release_inputs.outputs.authorized_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admit Qualified V4 npm CLI payload publication
        if: inputs.publish_cli
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          CANDIDATE_SHA: ${{ steps.release_inputs.outputs.authorized_sha }}
        run: |
          node scripts/pipeline/release/admit-qualified-v4-npm-cli-payload.mjs \
            --channel "$RELEASE_CHANNEL" \
            --candidate-ref HEAD \
            --candidate-sha "$CANDIDATE_SHA" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Corepack (Yarn 1.22.22)
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Run release contract tests
        run: yarn -s test:release:contracts

      - name: Verify installer assets are synced
        run: node scripts/pipeline/run.mjs release-sync-installers --check

      - name: Resolve server runner package
        id: server_runner
        run: |
          set -euo pipefail
          dir="packages/relay-server"
          if [ ! -f "${dir}/package.json" ]; then
            echo "No server runner package.json found (expected ${dir}/package.json)." >&2
            exit 1
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Install Sapling
        if: inputs.publish_cli && inputs.run_tests
        run: |
          set -euo pipefail
          bash scripts/ci/install_sapling_ubuntu22.sh

      - name: Run cli tests
        if: inputs.publish_cli && inputs.run_tests
        run: |
          yarn --cwd apps/cli test:unit
          yarn --cwd apps/cli test:integration

      - name: Run stack tests
        if: inputs.publish_stack && inputs.run_tests
        run: |
          yarn --cwd apps/stack test:unit
          yarn --cwd apps/stack test:integration

      - name: Run server runner tests
        if: inputs.publish_server && inputs.run_tests
        env:
          SERVER_RUNNER_DIR: ${{ steps.server_runner.outputs.dir }}
        run: yarn --cwd "${SERVER_RUNNER_DIR}" test

      - name: Run public plugin package tests
        if: inputs.publish_plugin_sdk && inputs.run_tests
        run: |
          yarn --cwd packages/plugin-sdk test
          yarn --cwd packages/plugin-ui test

      - name: Run public SDK package tests
        if: inputs.publish_sdk && inputs.run_tests
        run: yarn --cwd packages/sdk test

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_NPM_TAG: ${{ steps.release_inputs.outputs.npm_tag }}
          INPUT_PUBLISH_CLI: ${{ inputs.publish_cli }}
          INPUT_PUBLISH_STACK: ${{ inputs.publish_stack }}
          INPUT_PUBLISH_SERVER: ${{ inputs.publish_server }}
          INPUT_PUBLISH_PLUGIN_SDK: ${{ inputs.publish_plugin_sdk }}
          INPUT_PUBLISH_SDK: ${{ inputs.publish_sdk }}
          RESOLVED_SOURCE_REF: ${{ steps.release_inputs.outputs.source_ref }}
          SERVER_RUNNER_DIR: ${{ steps.server_runner.outputs.dir }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/resolve-release-metadata.mjs \
            --channel "$INPUT_CHANNEL" \
            --npm-tag "$INPUT_NPM_TAG" \
            --source-ref "$RESOLVED_SOURCE_REF" \
            --publish-cli "$INPUT_PUBLISH_CLI" \
            --publish-stack "$INPUT_PUBLISH_STACK" \
            --publish-server "$INPUT_PUBLISH_SERVER" \
            --publish-plugin-sdk "$INPUT_PUBLISH_PLUGIN_SDK" \
            --publish-sdk "$INPUT_PUBLISH_SDK" \
            --server-runner-dir "$SERVER_RUNNER_DIR" \
            --github-output "$GITHUB_OUTPUT"

      - name: npm pack (pipeline)
        if: inputs.publish_cli || inputs.publish_stack || inputs.publish_server || inputs.publish_plugin_sdk || inputs.publish_sdk
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          PUBLISH_CLI: ${{ inputs.publish_cli }}
          PUBLISH_STACK: ${{ inputs.publish_stack }}
          PUBLISH_SERVER: ${{ inputs.publish_server }}
          PUBLISH_PLUGIN_SDK: ${{ inputs.publish_plugin_sdk }}
          PUBLISH_SDK: ${{ inputs.publish_sdk }}
          CLI_VERSION: ${{ steps.meta.outputs.cli_version }}
          STACK_VERSION: ${{ steps.meta.outputs.stack_version }}
          SERVER_VERSION: ${{ steps.meta.outputs.server_version }}
          PLUGIN_SDK_VERSION: ${{ steps.meta.outputs.plugin_sdk_version }}
          SDK_VERSION: ${{ steps.meta.outputs.sdk_version }}
          RUN_TESTS: ${{ inputs.run_tests }}
          SERVER_RUNNER_DIR: ${{ steps.server_runner.outputs.dir }}
          AUTHORIZED_SHA: ${{ steps.release_inputs.outputs.authorized_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs npm-release \
            --channel "${RELEASE_CHANNEL}" \
            --publish-cli "${PUBLISH_CLI}" \
            --publish-stack "${PUBLISH_STACK}" \
            --publish-server "${PUBLISH_SERVER}" \
            --publish-plugin-sdk "${PUBLISH_PLUGIN_SDK}" \
            --publish-sdk "${PUBLISH_SDK}" \
            --server-runner-dir "${SERVER_RUNNER_DIR}" \
            --cli-version "${CLI_VERSION}" \
            --stack-version "${STACK_VERSION}" \
            --server-version "${SERVER_VERSION}" \
            --plugin-sdk-version "${PLUGIN_SDK_VERSION}" \
            --sdk-version "${SDK_VERSION}" \
            --run-tests "${RUN_TESTS}" \
            --authorized-sha "${AUTHORIZED_SHA}" \
            --mode pack

      - name: Upload npm pack artifact (cli)
        if: inputs.publish_cli
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-pack-cli-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.cli_version }}
          path: dist/release-assets/cli
          if-no-files-found: error

      - name: Upload npm pack artifact (stack)
        if: inputs.publish_stack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-pack-stack-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.stack_version }}
          path: dist/release-assets/stack
          if-no-files-found: error

      - name: Upload npm pack artifact (server runner)
        if: inputs.publish_server
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-pack-server-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.server_version }}
          path: dist/release-assets/server
          if-no-files-found: error

      - name: Upload npm pack artifact (plugin SDK pair)
        if: inputs.publish_plugin_sdk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-pack-plugin-sdk-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.plugin_sdk_version }}
          path: dist/release-assets/plugin-sdk
          if-no-files-found: error

      - name: Upload npm pack artifact (SDK)
        if: inputs.publish_sdk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-pack-sdk-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.sdk_version }}
          path: dist/release-assets/sdk
          if-no-files-found: error

      - name: Step summary
        if: always()
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PUBLISH_CLI: ${{ inputs.publish_cli }}
          INPUT_PUBLISH_STACK: ${{ inputs.publish_stack }}
          INPUT_PUBLISH_SERVER: ${{ inputs.publish_server }}
          INPUT_PUBLISH_PLUGIN_SDK: ${{ inputs.publish_plugin_sdk }}
          INPUT_PUBLISH_SDK: ${{ inputs.publish_sdk }}
          NPM_TAG: ${{ steps.meta.outputs.npm_tag }}
          CLI_VERSION: ${{ steps.meta.outputs.cli_version }}
          STACK_VERSION: ${{ steps.meta.outputs.stack_version }}
          SERVER_VERSION: ${{ steps.meta.outputs.server_version }}
          PLUGIN_SDK_VERSION: ${{ steps.meta.outputs.plugin_sdk_version }}
          SDK_VERSION: ${{ steps.meta.outputs.sdk_version }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
        run: |
          npm_tag="${NPM_TAG}"
          cli_version="${CLI_VERSION}"
          stack_version="${STACK_VERSION}"
          server_version="${SERVER_VERSION}"
          plugin_sdk_version="${PLUGIN_SDK_VERSION}"
          sdk_version="${SDK_VERSION}"
          [ -n "${npm_tag}" ] || npm_tag="(unavailable)"
          [ -n "${cli_version}" ] || cli_version="(unavailable)"
          [ -n "${stack_version}" ] || stack_version="(unavailable)"
          [ -n "${server_version}" ] || server_version="(unavailable)"
          [ -n "${plugin_sdk_version}" ] || plugin_sdk_version="(unavailable)"
          [ -n "${sdk_version}" ] || sdk_version="(unavailable)"

          {
            echo "### npm publish"
            echo ""
            echo "- source ref: \`${SOURCE_REF}\`"
            echo "- channel: \`${INPUT_CHANNEL}\`"
            echo "- npm dist-tag: \`${npm_tag}\`"
            if [ "${INPUT_PUBLISH_CLI}" = "true" ]; then
              echo "- cli: \`${cli_version}\`"
            fi
            if [ "${INPUT_PUBLISH_STACK}" = "true" ]; then
              echo "- stack: \`${stack_version}\`"
            fi
            if [ "${INPUT_PUBLISH_SERVER}" = "true" ]; then
              echo "- server runner: \`${server_version}\`"
            fi
            if [ "${INPUT_PUBLISH_PLUGIN_SDK}" = "true" ]; then
              echo "- plugin SDK pair: \`${plugin_sdk_version}\`"
            fi
            if [ "${INPUT_PUBLISH_SDK}" = "true" ]; then
              echo "- SDK: \`${sdk_version}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-cli:
    name: npm publish (cli)
    if: ${{ inputs.publish_cli == true && needs.release.result == 'success' }}
    needs: [release_actor_guard, release]
    runs-on: ubuntu-22.04
    environment: release-shared
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download npm pack artifact (cli)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-pack-cli-${{ needs.release.outputs.sha }}-${{ needs.release.outputs.cli_version }}
          path: dist/release-assets/cli

      - name: Setup Node (npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Re-admit Qualified V4 npm CLI payload publication
        env:
          CANDIDATE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          node scripts/pipeline/release/admit-qualified-v4-npm-cli-payload.mjs \
            --channel "$RELEASE_CHANNEL" \
            --candidate-ref refs/qualified-v4-payload-candidate \
            --candidate-sha "$CANDIDATE_SHA" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: npm publish (cli tarball) (pipeline)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          AUTHORIZED_SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/publish-tarball.mjs \
            --channel "${RELEASE_CHANNEL}" \
            --tarball-dir "dist/release-assets/cli" \
            --authorized-sha "${AUTHORIZED_SHA}"

  publish-stack:
    name: npm publish (stack)
    if: ${{ inputs.publish_stack == true && needs.release.result == 'success' }}
    needs: [release_actor_guard, release]
    runs-on: ubuntu-22.04
    environment: release-shared
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download npm pack artifact (stack)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-pack-stack-${{ needs.release.outputs.sha }}-${{ needs.release.outputs.stack_version }}
          path: dist/release-assets/stack

      - name: Setup Node (npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: npm publish (stack tarball) (pipeline)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          AUTHORIZED_SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/publish-tarball.mjs \
            --channel "${RELEASE_CHANNEL}" \
            --tarball-dir "dist/release-assets/stack" \
            --authorized-sha "${AUTHORIZED_SHA}"

  publish-server-runner:
    name: npm publish (server runner)
    if: ${{ inputs.publish_server == true && needs.release.result == 'success' }}
    needs: [release_actor_guard, release]
    runs-on: ubuntu-22.04
    environment: release-shared
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download npm pack artifact (server runner)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-pack-server-${{ needs.release.outputs.sha }}-${{ needs.release.outputs.server_version }}
          path: dist/release-assets/server

      - name: Setup Node (npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: npm publish (server runner tarball) (pipeline)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          AUTHORIZED_SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/publish-tarball.mjs \
            --channel "${RELEASE_CHANNEL}" \
            --tarball-dir "dist/release-assets/server" \
            --authorized-sha "${AUTHORIZED_SHA}"

  publish-plugin-sdk-pair:
    name: npm publish (plugin SDK pair)
    if: ${{ inputs.publish_plugin_sdk == true && needs.release.result == 'success' }}
    needs: [release_actor_guard, release]
    runs-on: ubuntu-22.04
    environment: release-shared
    permissions:
      contents: read
      id-token: write
    outputs:
      plugin_sdk_result: ${{ steps.publish.outcome == 'success' && 'success' || 'failed' }}
      plugin_sdk_version: ${{ steps.publish.outputs.plugin_sdk_version }}
      plugin_sdk_integrity: ${{ steps.publish.outputs.plugin_sdk_integrity }}
      plugin_ui_result: ${{ steps.publish.outcome == 'success' && 'success' || 'failed' }}
      plugin_ui_version: ${{ steps.publish.outputs.plugin_ui_version }}
      plugin_ui_integrity: ${{ steps.publish.outputs.plugin_ui_integrity }}
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download npm pack artifact (plugin SDK pair)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-pack-plugin-sdk-${{ needs.release.outputs.sha }}-${{ needs.release.outputs.plugin_sdk_version }}
          path: dist/release-assets/plugin-sdk

      - name: Setup Node (npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: npm publish (plugin SDK lockstep pair) (pipeline)
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          AUTHORIZED_SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/publish-plugin-sdk-pair.mjs \
            --channel "${RELEASE_CHANNEL}" \
            --tarball-dir "dist/release-assets/plugin-sdk" \
            --authorized-sha "${AUTHORIZED_SHA}" \
            --github-output "$GITHUB_OUTPUT"

  publish-sdk:
    name: npm publish (SDK)
    if: ${{ inputs.publish_sdk == true && needs.release.result == 'success' }}
    needs: [release_actor_guard, release]
    runs-on: ubuntu-22.04
    environment: release-shared
    permissions:
      contents: read
      id-token: write
    outputs:
      sdk_result: ${{ steps.publish.outcome == 'success' && 'success' || 'failed' }}
      sdk_version: ${{ steps.publish.outputs.version }}
      sdk_integrity: ${{ steps.publish.outputs.integrity }}
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download npm pack artifact (SDK)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-pack-sdk-${{ needs.release.outputs.sha }}-${{ needs.release.outputs.sdk_version }}
          path: dist/release-assets/sdk

      - name: Setup Node (npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: npm publish (SDK tarball) (pipeline)
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          AUTHORIZED_SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/publish-tarball.mjs \
            --channel "${RELEASE_CHANNEL}" \
            --tarball-dir "dist/release-assets/sdk" \
            --authorized-sha "${AUTHORIZED_SHA}" \
            --github-output "$GITHUB_OUTPUT"
