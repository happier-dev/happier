name: RELEASE — npm publish (cli/stack/server)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Target — Release channel"
        required: true
        type: choice
        options:
          - production
          - preview
      source_ref:
        description: "Promotion — Source ref to release from (auto: preview→preview, production→main)"
        required: true
        default: auto
        type: string
      authorized_sha:
        description: "Caller-bound exact source SHA; optional for direct manual release"
        required: false
        default: ""
        type: string
      run_tests:
        description: "Checks — Run publish checks/tests before publishing"
        required: true
        default: true
        type: boolean
      publish_cli:
        description: "Publish (CLI) — Publish CLI to npm"
        required: true
        default: true
        type: boolean
      npm_tag:
        description: "Publish (CLI) — npm dist-tag (production: latest, preview: next)"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      publish_stack:
        description: "Compatibility (Stack) — Publish hstack dev-helper package to npm (not release signoff)"
        required: true
        default: false
        type: boolean
      publish_server:
        description: "Publish (Server) — Publish server runner (@happier-dev/relay-server) to npm"
        required: true
        default: false
        type: boolean
      release_message:
        description: "Release message — Optional note to include at the top of GitHub rolling release notes"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      channel:
        description: "Target — Release channel"
        required: true
        type: string
      source_ref:
        description: "Promotion — Source ref to release from (auto: preview→preview, production→main)"
        required: false
        default: auto
        type: string
      authorized_sha:
        required: false
        default: ""
        type: string
      run_tests:
        description: "Checks — Run publish checks/tests before publishing"
        required: false
        default: true
        type: boolean
      publish_cli:
        description: "Publish (CLI) — Publish CLI to npm"
        required: false
        default: true
        type: boolean
      npm_tag:
        description: "Publish (CLI) — npm dist-tag (production: latest, preview: next)"
        required: false
        default: latest
        type: string
      publish_stack:
        description: "Compatibility (Stack) — Publish hstack dev-helper package to npm (not release signoff)"
        required: false
        default: false
        type: boolean
      publish_server:
        description: "Publish (Server) — Publish server runner (@happier-dev/relay-server) to npm"
        required: false
        default: false
        type: boolean
      release_message:
        description: "Release message — Optional note to include at the top of GitHub rolling release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Trusted workflow ref guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Admit trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_FILE: release-npm.yml
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/main") ;;
            *) echo "Untrusted workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    needs: [trusted_ref_guard]
    name: Release actor guard
    permissions:
      contents: read
    # We install Sapling via a Ubuntu 22.04 package; pin runner for compatibility.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  release:
    needs: [release_actor_guard]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      HAPPIER_EMBEDDED_POLICY_ENV: ${{ inputs.channel == 'production' && 'production' || 'preview' }}
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      channel: ${{ steps.meta.outputs.channel }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      cli_version: ${{ steps.meta.outputs.cli_version }}
      stack_version: ${{ steps.meta.outputs.stack_version }}
      server_version: ${{ steps.meta.outputs.server_version }}
    steps:
      - name: Validate inputs
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          INPUT_NPM_TAG: ${{ inputs.npm_tag }}
          INPUT_PUBLISH_CLI: ${{ inputs.publish_cli }}
          INPUT_PUBLISH_STACK: ${{ inputs.publish_stack }}
          INPUT_PUBLISH_SERVER: ${{ inputs.publish_server }}
        run: |
          set -euo pipefail
          if [ "${INPUT_PUBLISH_CLI}" != "true" ] && [ "${INPUT_PUBLISH_STACK}" != "true" ] && [ "${INPUT_PUBLISH_SERVER}" != "true" ]; then
            echo "At least one of publish_cli, publish_stack, or publish_server must be true." >&2
            exit 1
          fi
          expected_tag="latest"
          if [ "${INPUT_CHANNEL}" = "preview" ]; then
            expected_tag="next"
          fi
          if [ "${INPUT_NPM_TAG}" != "${expected_tag}" ]; then
            echo "npm_tag must be '${expected_tag}' for channel='${INPUT_CHANNEL}' (got '${INPUT_NPM_TAG}')." >&2
            exit 1
          fi
          if [ -n "$INPUT_AUTHORIZED_SHA" ] && ! [[ "$INPUT_AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "authorized_sha must be a full lowercase 40-character commit SHA when supplied." >&2
            exit 1
          fi

      - name: Resolve source ref
        id: resolve_source
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
        run: |
          set -euo pipefail
          channel="${INPUT_CHANNEL}"
          src="${INPUT_SOURCE_REF}"
          if [ "$src" = "auto" ]; then
            if [ "$channel" = "preview" ]; then
              src="preview"
            else
              src="main"
            fi
          fi

          canonical_ref="preview"
          if [ "$channel" = "production" ]; then
            canonical_ref="main"
          fi

          if [ -n "$INPUT_AUTHORIZED_SHA" ]; then
            src="$INPUT_AUTHORIZED_SHA"
          elif [ "$src" != "$canonical_ref" ]; then
            echo "${channel} releases must run from $canonical_ref unless authorized_sha binds an exact source (got source_ref='$src')." >&2
            exit 1
          fi

          {
            echo "ref=$src"
            echo "canonical_ref=$canonical_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce trusted refs for manual dispatch
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            dev|preview|main) ;;
            *)
              echo "Refusing workflow_dispatch from untrusted ref '${GITHUB_REF_NAME}'. Use dev, preview, or main." >&2
              exit 1
              ;;
          esac

      - name: Checkout source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.resolve_source.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authorized source remains canonical
        env:
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          CANONICAL_REF: ${{ steps.resolve_source.outputs.canonical_ref }}
        run: |
          set -euo pipefail
          if [ -z "$AUTHORIZED_SHA" ]; then
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$AUTHORIZED_SHA" ]; then
            echo "Checked out source does not match authorized_sha." >&2
            exit 1
          fi
          current_sha="$(git ls-remote origin "refs/heads/$CANONICAL_REF" | awk 'NR == 1 { print $1 }')"
          if [ "$current_sha" != "$AUTHORIZED_SHA" ]; then
            echo "Canonical source branch '$CANONICAL_REF' no longer resolves to authorized_sha." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Corepack (Yarn 1.22.22)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Run release contract tests
        run: yarn -s test:release:contracts

      - name: Verify installer assets are synced
        run: node scripts/pipeline/run.mjs release-sync-installers --check

      - name: Resolve server runner package
        id: server_runner
        run: |
          set -euo pipefail
          dir="packages/relay-server"
          if [ ! -f "${dir}/package.json" ]; then
            echo "No server runner package.json found (expected ${dir}/package.json)." >&2
            exit 1
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Install Sapling
        if: inputs.publish_cli && inputs.run_tests
        run: |
          set -euo pipefail
          bash scripts/ci/install_sapling_ubuntu22.sh

      - name: Run cli tests
        if: inputs.publish_cli && inputs.run_tests
        run: |
          yarn --cwd apps/cli test:unit
          yarn --cwd apps/cli test:integration

      - name: Run stack tests
        if: inputs.publish_stack && inputs.run_tests
        run: |
          yarn --cwd apps/stack test:unit
          yarn --cwd apps/stack test:integration

      - name: Run server runner tests
        if: inputs.publish_server && inputs.run_tests
        env:
          SERVER_RUNNER_DIR: ${{ steps.server_runner.outputs.dir }}
        run: yarn --cwd "${SERVER_RUNNER_DIR}" test

      - name: Release metadata
        id: meta
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PUBLISH_CLI: ${{ inputs.publish_cli }}
          INPUT_PUBLISH_STACK: ${{ inputs.publish_stack }}
          INPUT_PUBLISH_SERVER: ${{ inputs.publish_server }}
          RESOLVED_SOURCE_REF: ${{ steps.resolve_source.outputs.ref }}
          SERVER_RUNNER_DIR: ${{ steps.server_runner.outputs.dir }}
        run: |
          set -euo pipefail
          write_version_output() {
            local output_name="$1"
            local product_id="$2"
            local raw_version="$3"
            RELEASE_CHANNEL="${INPUT_CHANNEL}" PRODUCT_ID="${product_id}" RAW_VERSION="${raw_version}" \
              node --input-type=module <<'NODE'
          const productId = process.env.PRODUCT_ID;
          const rawVersion = process.env.RAW_VERSION ?? '';
          const canonicalVersionPatterns = {
            production: /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/,
            preview: /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)-preview\.(?:[1-9]\d*)(?:\.(?:[1-9]\d*))?$/,
          };
          const versionPattern = canonicalVersionPatterns[process.env.RELEASE_CHANNEL ?? ''];
          if (rawVersion.includes('\n') || rawVersion.includes('\r') || !versionPattern?.test(rawVersion)) {
            throw new Error(`npm release metadata rejected non-canonical ${productId} version`);
          }
          NODE
            printf '%s=%s\n' "$output_name" "$raw_version" >> "$GITHUB_OUTPUT"
          }

          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_ref=${RESOLVED_SOURCE_REF}" >> "$GITHUB_OUTPUT"
          echo "channel=${INPUT_CHANNEL}" >> "$GITHUB_OUTPUT"
          if [ "${INPUT_CHANNEL}" = "preview" ]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

          versions_json="{}"
          if [ "${INPUT_CHANNEL}" = "preview" ]; then
            versions_json="$(node scripts/pipeline/run.mjs npm-set-preview-versions \
              --publish-cli "${INPUT_PUBLISH_CLI}" \
              --publish-stack "${INPUT_PUBLISH_STACK}" \
              --publish-server "${INPUT_PUBLISH_SERVER}" \
              --server-runner-dir "${SERVER_RUNNER_DIR}" \
              --write false)"
          fi

          if [ "${INPUT_PUBLISH_CLI}" = "true" ]; then
            if [ "${INPUT_CHANNEL}" = "preview" ]; then
              cli_version="$(node -e 'const raw=process.argv[1]; const v=JSON.parse(raw); process.stdout.write(String(v.cli||""));' "${versions_json}")"
            else
              cli_version="$(node -e 'process.stdout.write(String(require("./apps/cli/package.json").version ?? ""));')"
            fi
            write_version_output cli_version cli "$cli_version"
          fi

          if [ "${INPUT_PUBLISH_STACK}" = "true" ]; then
            if [ "${INPUT_CHANNEL}" = "preview" ]; then
              stack_version="$(node -e 'const raw=process.argv[1]; const v=JSON.parse(raw); process.stdout.write(String(v.stack||""));' "${versions_json}")"
            else
              stack_version="$(node -e 'process.stdout.write(String(require("./apps/stack/package.json").version ?? ""));')"
            fi
            write_version_output stack_version stack "$stack_version"
          fi

          if [ "${INPUT_PUBLISH_SERVER}" = "true" ]; then
            if [ "${INPUT_CHANNEL}" = "preview" ]; then
              server_version="$(node -e 'const raw=process.argv[1]; const v=JSON.parse(raw); process.stdout.write(String(v.server||""));' "${versions_json}")"
            else
              server_version="$(node -e 'process.stdout.write(String(require("./" + process.env.SERVER_RUNNER_DIR + "/package.json").version ?? ""));')"
            fi
            write_version_output server_version server "$server_version"
          fi

      - name: npm pack (pipeline)
        if: inputs.publish_cli || inputs.publish_stack || inputs.publish_server
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          PUBLISH_CLI: ${{ inputs.publish_cli }}
          PUBLISH_STACK: ${{ inputs.publish_stack }}
          PUBLISH_SERVER: ${{ inputs.publish_server }}
          CLI_VERSION: ${{ steps.meta.outputs.cli_version }}
          STACK_VERSION: ${{ steps.meta.outputs.stack_version }}
          SERVER_VERSION: ${{ steps.meta.outputs.server_version }}
          RUN_TESTS: ${{ inputs.run_tests }}
          SERVER_RUNNER_DIR: ${{ steps.server_runner.outputs.dir }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs npm-release \
            --channel "${RELEASE_CHANNEL}" \
            --publish-cli "${PUBLISH_CLI}" \
            --publish-stack "${PUBLISH_STACK}" \
            --publish-server "${PUBLISH_SERVER}" \
            --server-runner-dir "${SERVER_RUNNER_DIR}" \
            --cli-version "${CLI_VERSION}" \
            --stack-version "${STACK_VERSION}" \
            --server-version "${SERVER_VERSION}" \
            --run-tests "${RUN_TESTS}" \
            --mode pack

      - name: Upload npm pack artifact (cli)
        if: inputs.publish_cli
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-pack-cli-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.cli_version }}
          path: dist/release-assets/cli
          if-no-files-found: error

      - name: Upload npm pack artifact (stack)
        if: inputs.publish_stack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-pack-stack-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.stack_version }}
          path: dist/release-assets/stack
          if-no-files-found: error

      - name: Upload npm pack artifact (server runner)
        if: inputs.publish_server
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-pack-server-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.server_version }}
          path: dist/release-assets/server
          if-no-files-found: error

      - name: Step summary
        if: always()
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PUBLISH_CLI: ${{ inputs.publish_cli }}
          INPUT_PUBLISH_STACK: ${{ inputs.publish_stack }}
          INPUT_PUBLISH_SERVER: ${{ inputs.publish_server }}
          NPM_TAG: ${{ steps.meta.outputs.npm_tag }}
          CLI_VERSION: ${{ steps.meta.outputs.cli_version }}
          STACK_VERSION: ${{ steps.meta.outputs.stack_version }}
          SERVER_VERSION: ${{ steps.meta.outputs.server_version }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
        run: |
          npm_tag="${NPM_TAG}"
          cli_version="${CLI_VERSION}"
          stack_version="${STACK_VERSION}"
          server_version="${SERVER_VERSION}"
          [ -n "${npm_tag}" ] || npm_tag="(unavailable)"
          [ -n "${cli_version}" ] || cli_version="(unavailable)"
          [ -n "${stack_version}" ] || stack_version="(unavailable)"
          [ -n "${server_version}" ] || server_version="(unavailable)"

          {
            echo "### npm publish"
            echo ""
            echo "- source ref: \`${SOURCE_REF}\`"
            echo "- channel: \`${INPUT_CHANNEL}\`"
            echo "- npm dist-tag: \`${npm_tag}\`"
            if [ "${INPUT_PUBLISH_CLI}" = "true" ]; then
              echo "- cli: \`${cli_version}\`"
            fi
            if [ "${INPUT_PUBLISH_STACK}" = "true" ]; then
              echo "- stack: \`${stack_version}\`"
            fi
            if [ "${INPUT_PUBLISH_SERVER}" = "true" ]; then
              echo "- server runner: \`${server_version}\`"
            fi
            echo ""
            echo "### GitHub Releases (mirror)"
            echo ""
            if [ "${INPUT_CHANNEL}" = "preview" ]; then
              if [ "${INPUT_PUBLISH_CLI}" = "true" ]; then echo "- CLI npm package (GitHub binary Releases remain owned by publish-cli-binaries.yml)"; fi
            else
              if [ "${INPUT_PUBLISH_CLI}" = "true" ]; then echo "- \`cli-v${cli_version}\`"; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-cli:
    name: npm publish (cli)
    if: ${{ inputs.publish_cli == true && needs.release.result == 'success' }}
    needs: [release_actor_guard, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-shared
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download npm pack artifact (cli)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-pack-cli-${{ needs.release.outputs.sha }}-${{ needs.release.outputs.cli_version }}
          path: dist/release-assets/cli

      - name: Setup Node (npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: npm publish (cli tarball) (pipeline)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/publish-tarball.mjs \
            --channel "${RELEASE_CHANNEL}" \
            --tarball-dir "dist/release-assets/cli"

  publish-stack:
    name: npm publish (stack)
    if: ${{ inputs.publish_stack == true && needs.release.result == 'success' }}
    needs: [release_actor_guard, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-shared
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download npm pack artifact (stack)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-pack-stack-${{ needs.release.outputs.sha }}-${{ needs.release.outputs.stack_version }}
          path: dist/release-assets/stack

      - name: Setup Node (npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: npm publish (stack tarball) (pipeline)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/publish-tarball.mjs \
            --channel "${RELEASE_CHANNEL}" \
            --tarball-dir "dist/release-assets/stack"

  publish-server-runner:
    name: npm publish (server runner)
    if: ${{ inputs.publish_server == true && needs.release.result == 'success' }}
    needs: [release_actor_guard, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-shared
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download npm pack artifact (server runner)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-pack-server-${{ needs.release.outputs.sha }}-${{ needs.release.outputs.server_version }}
          path: dist/release-assets/server

      - name: Setup Node (npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: npm publish (server runner tarball) (pipeline)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/publish-tarball.mjs \
            --channel "${RELEASE_CHANNEL}" \
            --tarball-dir "dist/release-assets/server"
