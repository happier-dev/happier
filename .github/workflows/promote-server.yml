name: PROMOTE — Server (deploy branch)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target — Environment (deploy branch)"
        required: true
        type: choice
        options:
          - preview
          - production
      force_deploy:
        description: "Deploy — Force deploy webhook trigger even if deploy branch is already up to date"
        required: true
        default: false
        type: boolean
      run_tests:
        description: "Checks — Run apps/server tests before promoting"
        required: true
        default: true
        type: boolean
      source_ref:
        description: "Promotion — Source ref to promote (branch, tag, or SHA). Use 'auto' to default preview→preview, production→main."
        required: true
        default: auto
        type: string
      allow_cross_promote:
        description: "Safety — Allow promoting a non-default source ref to the selected environment (use with care)."
        required: true
        default: false
        type: boolean
      bump:
        description: "Versions — Version bump on source ref (server)"
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      publish_runtime_release:
        description: "Publish — Build + publish server runtime binaries/manifests to GitHub Releases (server-preview/server-stable)"
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      environment:
        description: "Target — Environment (deploy branch)"
        required: true
        type: string
      force_deploy:
        description: "Deploy — Force deploy webhook trigger even if deploy branch is already up to date"
        required: false
        default: false
        type: boolean
      run_tests:
        description: "Checks — Run apps/server tests before promoting"
        required: false
        default: true
        type: boolean
      source_ref:
        description: "Promotion — Source ref to promote (branch, tag, or SHA). Use 'auto' to default preview→preview, production→main."
        required: false
        default: auto
        type: string
      allow_cross_promote:
        description: "Safety — Allow promoting a non-default source ref to the selected environment (use with care)."
        required: false
        default: false
        type: boolean
      bump:
        description: "Versions — Version bump on source ref (server)"
        required: false
        default: none
        type: string
      publish_runtime_release:
        description: "Publish — Build + publish server runtime binaries/manifests to GitHub Releases (server-preview/server-stable)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-ref-${{ github.repository }}-${{ inputs.environment }}-server
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Trusted workflow ref guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Admit trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_FILE: promote-server.yml
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/main") ;;
            *) echo "Untrusted workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    needs: [trusted_ref_guard]
    name: Release actor guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  resolve_source:
    needs: [release_actor_guard]
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.authorized_sha }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    env:
      RUNTIME_ACTIVITY_ROLLOUT_STAGE: ${{ inputs.environment == 'production' && vars.HAPPIER_PRODUCTION_SERVER_RUNTIME_ACTIVITY_ROLLOUT_STAGE || vars.HAPPIER_PREVIEW_SERVER_RUNTIME_ACTIVITY_ROLLOUT_STAGE }}
      RUNTIME_ACTIVITY_MINIMUM_FENCE_SHA: ${{ inputs.environment == 'production' && vars.HAPPIER_PRODUCTION_SERVER_FENCE_AWARE_MINIMUM_SHA || vars.HAPPIER_PREVIEW_SERVER_FENCE_AWARE_MINIMUM_SHA }}
      RUNTIME_ACTIVITY_R2_DRAINED_SHA: ${{ inputs.environment == 'production' && vars.HAPPIER_PRODUCTION_SERVER_SESSION_SYNC_R2_DRAINED_SHA || vars.HAPPIER_PREVIEW_SERVER_SESSION_SYNC_R2_DRAINED_SHA }}
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Capture trusted server release policy
        run: |
          set -euo pipefail
          cp scripts/pipeline/github/enforce-server-runtime-activity-rollout.mjs \
            "$RUNNER_TEMP/enforce-server-runtime-activity-rollout.mjs"
          cp scripts/pipeline/github/resolve-server-promotion-inputs.mjs \
            "$RUNNER_TEMP/resolve-server-promotion-inputs.mjs"
          cp scripts/pipeline/github/resolve-authorized-release-source.mjs \
            "$RUNNER_TEMP/resolve-authorized-release-source.mjs"

      - name: Enforce trusted workflow control ref
        env:
          TRUSTED_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          test -n "${TRUSTED_WORKFLOW_REF}"
          workflow_ref="${TRUSTED_WORKFLOW_REF##*@}"
          case "${workflow_ref}" in
            refs/heads/dev|refs/heads/preview|refs/heads/main) ;;
            *) echo "Refusing untrusted workflow ref '${TRUSTED_WORKFLOW_REF}'." >&2; exit 1 ;;
          esac

      - name: Enforce trusted refs for manual dispatch
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then exit 0; fi
          case "${GITHUB_REF_NAME}" in
            dev|preview|main) ;;
            *) echo "Refusing workflow_dispatch from untrusted ref '${GITHUB_REF_NAME}'." >&2; exit 1 ;;
          esac

      - name: Resolve source ref
        id: resolve
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ALLOW_CROSS_PROMOTE: ${{ inputs.allow_cross_promote }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = "${{ job.workflow_repository }}" || {
            echo "Cross-repository callers are not supported for server promotion." >&2
            exit 1
          }
          node "$RUNNER_TEMP/resolve-server-promotion-inputs.mjs" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --source-ref "$SOURCE_REF" \
            --allow-cross-promote "$ALLOW_CROSS_PROMOTE" \
            --bump "$BUMP" \
            --github-output "$GITHUB_OUTPUT"

      - name: Bind exact authorized source SHA
        id: candidate
        env:
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/resolve-authorized-release-source.mjs" \
            --source-ref "$SOURCE_REF" \
            --remote origin \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ steps.candidate.outputs.authorized_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce server runtime-activity rollout policy
        run: |
          node "$RUNNER_TEMP/enforce-server-runtime-activity-rollout.mjs" \
            --rollout-stage "${RUNTIME_ACTIVITY_ROLLOUT_STAGE}" \
            --candidate-sha "$(git rev-parse HEAD)" \
            --minimum-fence-sha "${RUNTIME_ACTIVITY_MINIMUM_FENCE_SHA}" \
            --r2-drained-sha "${RUNTIME_ACTIVITY_R2_DRAINED_SHA}"

      - name: Verify authorized source checkout
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test "${candidate_sha}" = "${{ steps.candidate.outputs.authorized_sha }}"
          test "$(git rev-parse --verify HEAD^{commit})" = "${candidate_sha}"

  apply_bump:
    needs: [release_actor_guard, resolve_source, validate_candidate]
    runs-on: ubuntu-latest
    environment: release-shared
    outputs:
      candidate_sha: ${{ steps.select.outputs.candidate_sha }}
    steps:
      - name: Checkout trusted bump policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Capture trusted server bump helper
        run: cp scripts/pipeline/github/prepare-server-release-bump.mjs "$RUNNER_TEMP/prepare-server-release-bump.mjs"

      - name: Checkout exact pre-bump source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.resolve_source.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create bump GitHub App token
        if: inputs.bump != 'none'
        id: bump_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Apply trusted server version bump
        if: inputs.bump != 'none'
        id: bump
        env:
          HAPPIER_GIT_AUTHORIZATION_HEADER: "AUTHORIZATION: bearer ${{ steps.bump_token.outputs.token }}"
          BUMP: ${{ inputs.bump }}
          SOURCE_BRANCH: ${{ needs.resolve_source.outputs.source_ref }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/prepare-server-release-bump.mjs" \
            --bump "$BUMP" \
            --source-branch "$SOURCE_BRANCH" \
            --expected-sha "${{ needs.resolve_source.outputs.candidate_sha }}" \
            --push true \
            --github-output "$GITHUB_OUTPUT"

      - name: Select candidate SHA after optional bump
        id: select
        run: |
          set -euo pipefail
          candidate_sha="${{ steps.bump.outputs.candidate_sha }}"
          if [ -z "${candidate_sha}" ]; then candidate_sha="${{ needs.resolve_source.outputs.candidate_sha }}"; fi
          echo "candidate_sha=${candidate_sha}" >> "$GITHUB_OUTPUT"

  validate_candidate:
    needs: [release_actor_guard, resolve_source]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted candidate validation policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Capture trusted server bump transform
        run: cp scripts/pipeline/github/prepare-server-release-bump.mjs "$RUNNER_TEMP/prepare-server-release-bump.mjs"

      - name: Checkout exact authorized candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.resolve_source.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply trusted bump transform locally
        if: inputs.bump != 'none'
        env:
          BUMP: ${{ inputs.bump }}
          SOURCE_BRANCH: ${{ needs.resolve_source.outputs.source_ref }}
        run: |
          node "$RUNNER_TEMP/prepare-server-release-bump.mjs" \
            --bump "$BUMP" \
            --source-branch "$SOURCE_BRANCH" \
            --expected-sha "${{ needs.resolve_source.outputs.candidate_sha }}" \
            --push false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Run release contract tests
        run: yarn -s test:release:contracts

      - name: Verify installer assets are synced
        run: node scripts/pipeline/run.mjs release-sync-installers --check

      - name: Run server tests
        if: inputs.run_tests
        run: yarn --cwd apps/server test

  finalize_source:
    needs: [release_actor_guard, resolve_source, apply_bump, validate_candidate]
    runs-on: ubuntu-latest
    outputs:
      authorized_sha: ${{ steps.bind.outputs.authorized_sha }}
    steps:
      - name: Checkout independently resolved source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.resolve_source.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind independently verified final source
        id: bind
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          pre_sha="${{ needs.resolve_source.outputs.candidate_sha }}"
          authorized_sha="$(git rev-parse HEAD)"
          test "${authorized_sha}" = "${{ needs.apply_bump.outputs.candidate_sha }}"
          if [ "$BUMP" = "none" ]; then
            test "${authorized_sha}" = "${pre_sha}"
          else
            test "$(git rev-parse "${authorized_sha}^")" = "${pre_sha}"
            test "$(git diff --name-only "${pre_sha}" "${authorized_sha}")" = $'apps/server/package.json\npackages/relay-server/package.json'
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const server = JSON.parse(fs.readFileSync('apps/server/package.json', 'utf8')).version;
          const runner = JSON.parse(fs.readFileSync('packages/relay-server/package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+$/.test(server) || server !== runner) process.exit(1);
          NODE
          fi
          echo "authorized_sha=${authorized_sha}" >> "$GITHUB_OUTPUT"

  publish_runtime_release:
    if: inputs.publish_runtime_release == true
    needs: [resolve_source, finalize_source]
    uses: ./.github/workflows/publish-server-runtime.yml
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ needs.finalize_source.outputs.authorized_sha }}
      authorized_sha: ${{ needs.finalize_source.outputs.authorized_sha }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ""
    secrets: inherit

  promote_deploy_ref:
    if: always() && needs.finalize_source.result == 'success' && (needs.publish_runtime_release.result == 'success' || needs.publish_runtime_release.result == 'skipped')
    needs: [release_actor_guard, resolve_source, apply_bump, validate_candidate, finalize_source, publish_runtime_release]
    runs-on: ubuntu-latest
    environment: release-shared
    env:
      RUNTIME_ACTIVITY_ROLLOUT_STAGE: ${{ inputs.environment == 'production' && vars.HAPPIER_PRODUCTION_SERVER_RUNTIME_ACTIVITY_ROLLOUT_STAGE || vars.HAPPIER_PREVIEW_SERVER_RUNTIME_ACTIVITY_ROLLOUT_STAGE }}
      RUNTIME_ACTIVITY_MINIMUM_FENCE_SHA: ${{ inputs.environment == 'production' && vars.HAPPIER_PRODUCTION_SERVER_FENCE_AWARE_MINIMUM_SHA || vars.HAPPIER_PREVIEW_SERVER_FENCE_AWARE_MINIMUM_SHA }}
      RUNTIME_ACTIVITY_R2_DRAINED_SHA: ${{ inputs.environment == 'production' && vars.HAPPIER_PRODUCTION_SERVER_SESSION_SYNC_R2_DRAINED_SHA || vars.HAPPIER_PREVIEW_SERVER_SESSION_SYNC_R2_DRAINED_SHA }}
    steps:
      - name: Checkout trusted server promotion policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Capture trusted server deploy mutation
        run: |
          set -euo pipefail
          cp scripts/pipeline/github/enforce-server-runtime-activity-rollout.mjs \
            "$RUNNER_TEMP/enforce-server-runtime-activity-rollout.mjs"
          cp scripts/pipeline/github/deploy-ref-cas.mjs \
            "$RUNNER_TEMP/deploy-ref-cas.mjs"
          cp scripts/pipeline/github/promote-server-deploy-ref.mjs \
            "$RUNNER_TEMP/promote-server-deploy-ref.mjs"
          cp scripts/pipeline/deploy/trigger-webhooks.mjs \
            "$RUNNER_TEMP/trigger-server-deploy-webhooks.mjs"
          cp scripts/pipeline/github/resolve-server-promotion-inputs.mjs \
            "$RUNNER_TEMP/resolve-server-promotion-inputs.mjs"

      - name: Enforce trusted server promotion control ref
        env:
          TRUSTED_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          test -n "${TRUSTED_WORKFLOW_REF}"
          workflow_ref="${TRUSTED_WORKFLOW_REF##*@}"
          case "${workflow_ref}" in
            refs/heads/dev|refs/heads/preview|refs/heads/main) ;;
            *) echo "Refusing untrusted workflow ref '${TRUSTED_WORKFLOW_REF}'." >&2; exit 1 ;;
          esac

      - name: Resolve exact authorized server release SHA
        id: trusted_resolve
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ALLOW_CROSS_PROMOTE: ${{ inputs.allow_cross_promote }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/resolve-server-promotion-inputs.mjs" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --source-ref "$SOURCE_REF" \
            --allow-cross-promote "$ALLOW_CROSS_PROMOTE" \
            --bump "$BUMP" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact authorized server release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ steps.trusted_resolve.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact server promotion SHA in trusted job
        id: bind
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test "${candidate_sha}" = "${{ needs.finalize_source.outputs.authorized_sha }}"
          node "$RUNNER_TEMP/enforce-server-runtime-activity-rollout.mjs" \
            --rollout-stage "${RUNTIME_ACTIVITY_ROLLOUT_STAGE}" \
            --candidate-sha "${candidate_sha}" \
            --minimum-fence-sha "${RUNTIME_ACTIVITY_MINIMUM_FENCE_SHA}" \
            --r2-drained-sha "${RUNTIME_ACTIVITY_R2_DRAINED_SHA}"
          test "$(git rev-parse HEAD)" = "${candidate_sha}"
          echo "candidate_sha=${candidate_sha}" >> "$GITHUB_OUTPUT"

      - name: Create trusted promotion GitHub App token
        id: promotion_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Resolve exact server deploy ref before promotion
        id: deploy_before
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.extraHeader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ steps.promotion_token.outputs.token }}"
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ref="refs/heads/deploy/${DEPLOY_ENVIRONMENT}/server"
          row="$(git ls-remote --refs origin "${ref}")"
          sha="${row%%[[:space:]]*}"
          if [ -n "${sha}" ] && ! [[ "${sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then exit 1; fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Promote exact validated SHA to server deploy branch
        id: promote_ref
        env:
          HAPPIER_GIT_AUTHORIZATION_HEADER: "AUTHORIZATION: bearer ${{ steps.promotion_token.outputs.token }}"
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          expected="${{ steps.deploy_before.outputs.sha }}"
          if [ -z "${expected}" ]; then expected="missing"; fi
          node "$RUNNER_TEMP/promote-server-deploy-ref.mjs" \
            --deploy-environment "$DEPLOY_ENVIRONMENT" \
            --candidate-sha "${{ steps.bind.outputs.candidate_sha }}" \
            --expected-current-sha "${expected}" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Trigger trusted deploy webhook(s) (force_deploy, no branch change)
        if: inputs.force_deploy && steps.promote_ref.outputs.changed == 'false'
        env:
          CF_WEBHOOK_DEPLOY_CLIENT_ID: ${{ secrets.CF_WEBHOOK_DEPLOY_CLIENT_ID }}
          CF_WEBHOOK_DEPLOY_CLIENT_SECRET: ${{ secrets.CF_WEBHOOK_DEPLOY_CLIENT_SECRET }}
          DEPLOY_WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL != '' && vars.DEPLOY_WEBHOOK_URL || secrets.DEPLOY_WEBHOOK_URL }}
          HAPPIER_SERVER_API_DEPLOY_WEBHOOKS: ${{ vars.HAPPIER_SERVER_API_DEPLOY_WEBHOOKS != '' && vars.HAPPIER_SERVER_API_DEPLOY_WEBHOOKS || secrets.HAPPIER_SERVER_API_DEPLOY_WEBHOOKS }}
          HAPPIER_SERVER_WORKER_DEPLOY_WEBHOOKS: ${{ vars.HAPPIER_SERVER_WORKER_DEPLOY_WEBHOOKS != '' && vars.HAPPIER_SERVER_WORKER_DEPLOY_WEBHOOKS || secrets.HAPPIER_SERVER_WORKER_DEPLOY_WEBHOOKS }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          node "$RUNNER_TEMP/trigger-server-deploy-webhooks.mjs" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --component server \
            --repository "${{ job.workflow_repository }}" \
            --ref-name "deploy/${DEPLOY_ENVIRONMENT}/server" \
            --sha "${{ steps.promote_ref.outputs.new_sha }}"
