name: NIGHTLY — Dev Releases

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref — Branch, tag, or SHA to build/publish (default: dev)"
        required: true
        default: dev
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: nightly-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release_candidate:
    name: Prepare exact nightly candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      release_message: ${{ steps.identity.outputs.release_message }}
    steps:
      - name: Checkout requested nightly source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || 'dev' }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact nightly source SHA
        id: identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$(printf '%s' "$source_sha" | wc -c | tr -d ' ')" = "40"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_message=Automated nightly dev release." >> "$GITHUB_OUTPUT"

  cli:
    name: CLI immutable candidate (dev)
    needs: [prepare_release_candidate]
    uses: ./.github/workflows/publish-cli-binaries.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      publish_rolling: false
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  hstack:
    name: HStack immutable candidate (dev)
    needs: [prepare_release_candidate]
    uses: ./.github/workflows/publish-hstack-binaries.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      publish_rolling: false
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  server_runtime:
    name: Server immutable candidate (dev)
    needs: [prepare_release_candidate]
    uses: ./.github/workflows/publish-server-runtime.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      publish_rolling: false
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  ui_web:
    name: UI web immutable candidate (dev)
    needs: [prepare_release_candidate]
    uses: ./.github/workflows/publish-ui-web.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      publish_rolling: false
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  release_verify:
    name: Verify exact immutable nightly candidates
    needs: [prepare_release_candidate, cli, hstack, server_runtime, ui_web]
    uses: ./.github/workflows/release-verify.yml
    secrets: inherit
    with:
      channel: dev
      candidate_source_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      candidate_cli_version: ${{ needs.cli.outputs.version }}
      candidate_stack_version: ${{ needs.hstack.outputs.version }}
      candidate_server_version: ${{ needs.server_runtime.outputs.version }}
      candidate_ui_web_version: ${{ needs.ui_web.outputs.version }}
      run_installers_smoke: true
      run_binary_smoke: true
      run_cli_update_continuity: true
      run_daemon_continuity: true
      run_session_continuity: true

  promote_server:
    name: Promote verified server candidate
    needs: [prepare_release_candidate, server_runtime, release_verify]
    uses: ./.github/workflows/publish-server-runtime.yml
    secrets: inherit
    with:
      channel: dev
      retry_version: ${{ needs.server_runtime.outputs.version }}
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  promote_hstack:
    name: Promote verified HStack candidate
    needs: [prepare_release_candidate, hstack, promote_server]
    uses: ./.github/workflows/publish-hstack-binaries.yml
    secrets: inherit
    with:
      channel: dev
      retry_version: ${{ needs.hstack.outputs.version }}
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  promote_cli:
    name: Promote verified CLI candidate
    needs: [prepare_release_candidate, cli, promote_hstack]
    uses: ./.github/workflows/publish-cli-binaries.yml
    secrets: inherit
    with:
      channel: dev
      retry_version: ${{ needs.cli.outputs.version }}
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  promote_ui_web:
    name: Promote verified UI web candidate
    needs: [prepare_release_candidate, ui_web, promote_cli]
    uses: ./.github/workflows/publish-ui-web.yml
    secrets: inherit
    with:
      channel: dev
      retry_version: ${{ needs.ui_web.outputs.version }}
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  ui_mobile:
    name: UI mobile (dev)
    needs: [prepare_release_candidate, release_verify]
    uses: ./.github/workflows/publish-ui-mobile-dev.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      publish_ota: true
      publish_android_apk: true
      submit_ios_testflight: true
      eas_builder: eas_local
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  ui_desktop:
    name: UI desktop (Tauri) (dev)
    needs: [prepare_release_candidate, release_verify]
    uses: ./.github/workflows/build-tauri.yml
    secrets: inherit
    with:
      environment: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      publish_release: true
      release_message: ${{ needs.prepare_release_candidate.outputs.release_message }}

  docker:
    name: Docker images (dev)
    needs: [prepare_release_candidate, cli, server_runtime, promote_ui_web]
    uses: ./.github/workflows/publish-docker.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      server_version: ${{ needs.server_runtime.outputs.version }}
      cli_version: ${{ needs.cli.outputs.version }}
      push_latest: true
      registries: dockerhub,ghcr
      build_relay: true
      build_dev_box: true

  verify_promoted:
    name: Verify promoted nightly references
    needs: [prepare_release_candidate, ui_mobile, ui_desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify rolling references bind the candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.prepare_release_candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          resolve_tag_commit() {
            tag="$1"
            read -r object_type object_sha <<EOF
          $(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.type + " " + .object.sha')
          EOF
            while [ "$object_type" = "tag" ]; do
              read -r object_type object_sha <<EOF
          $(gh api "repos/${GH_REPO}/git/tags/${object_sha}" --jq '.object.type + " " + .object.sha')
          EOF
            done
            test "$object_type" = "commit"
            printf '%s\n' "$object_sha"
          }
          for tag in server-dev stack-dev cli-dev ui-web-dev; do
            actual="$(resolve_tag_commit "$tag")"
            test "$actual" = "$EXPECTED_SHA"
          done

  release_status:
    name: Project terminal nightly release status
    if: ${{ always() }}
    needs: [prepare_release_candidate, cli, hstack, server_runtime, ui_web, release_verify, promote_server, promote_hstack, promote_cli, promote_ui_web, ui_mobile, ui_desktop, docker, verify_promoted]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Project nightly release status facts
        env:
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_RUN_NAME: NIGHTLY — Dev Releases
          SOURCE_SHA: ${{ needs.prepare_release_candidate.outputs.source_sha || github.sha }}
          CANDIDATE_RESULT: ${{ needs.prepare_release_candidate.result }}
          IMMUTABLE_VERIFICATION_RESULT: ${{ needs.release_verify.result }}
          CLI_RESULT: ${{ needs.promote_cli.result }}
          STACK_RESULT: ${{ needs.promote_hstack.result }}
          SERVER_RESULT: ${{ needs.promote_server.result }}
          UI_WEB_RESULT: ${{ needs.promote_ui_web.result }}
          MOBILE_RESULT: ${{ needs.ui_mobile.result }}
          DESKTOP_RESULT: ${{ needs.ui_desktop.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          POST_PROMOTION_RESULT: ${{ needs.verify_promoted.result }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/release-status-input.json"
          const result = (name) => ['success', 'skipped'].includes(process.env[name]) ? process.env[name] : 'failed';
          const sourceSha = process.env.SOURCE_SHA;
          const item = (id, required, evidence, name, verified, recoveryHint) => ({
            id,
            requested: true,
            required,
            evidence,
            result: evidence === 'accepted' && result(name) === 'success' ? 'accepted' : result(name),
            identity: { sourceSha, verified },
            recoveryHint,
          });
          const promotedVerified = (name) => result(name) === 'success' && result('POST_PROMOTION_RESULT') === 'success';
          const observed = [
            item('candidate', true, 'verified', 'CANDIDATE_RESULT', result('CANDIDATE_RESULT') === 'success', { job: 'prepare_release_candidate' }),
            item('immutable_candidate_verification', true, 'verified', 'IMMUTABLE_VERIFICATION_RESULT', result('IMMUTABLE_VERIFICATION_RESULT') === 'success', { job: 'release_verify' }),
            item('cli_rolling_release', false, 'verified', 'CLI_RESULT', promotedVerified('CLI_RESULT'), { job: 'promote_cli' }),
            item('hstack_rolling_release', false, 'verified', 'STACK_RESULT', promotedVerified('STACK_RESULT'), { job: 'promote_hstack' }),
            item('server_rolling_release', false, 'verified', 'SERVER_RESULT', promotedVerified('SERVER_RESULT'), { job: 'promote_server' }),
            item('ui_web_rolling_release', false, 'verified', 'UI_WEB_RESULT', promotedVerified('UI_WEB_RESULT'), { job: 'promote_ui_web' }),
            item('ui_mobile', false, 'accepted', 'MOBILE_RESULT', false, { job: 'ui_mobile' }),
            item('ui_desktop', false, 'accepted', 'DESKTOP_RESULT', false, { job: 'ui_desktop' }),
            item('docker', false, 'accepted', 'DOCKER_RESULT', false, { job: 'docker' }),
            item('post_promotion_identity', false, 'verified', 'POST_PROMOTION_RESULT', result('POST_PROMOTION_RESULT') === 'success', { job: 'verify_promoted' }),
          ];
          process.stdout.write(`${JSON.stringify({
            run: { id: Number(process.env.RELEASE_RUN), url: process.env.RELEASE_RUN_URL, name: process.env.RELEASE_RUN_NAME },
            channel: 'dev',
            sourceSha,
            requestedSurfaces: observed.map(({ id, requested, required, evidence }) => ({ id, requested, required, evidence })),
            surfaces: observed.map(({ id, result: surfaceResult, identity, recoveryHint }) => ({ id, result: surfaceResult, identity, recoveryHint })),
          })}\n`);
          NODE
          node "$GITHUB_WORKSPACE/.release-control/scripts/pipeline/release/summarize-release-status.mjs" \
            --input "$RUNNER_TEMP/release-status-input.json" \
            --out "$RUNNER_TEMP/release-status.json"

      - name: Write nightly release status summary
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';
          const status = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/release-status.json`, 'utf8'));
          console.log('## Nightly release status');
          console.log(`Channel: \`${status.channel}\`  \nSource: \`${status.sourceSha}\`  \nTerminal: **${status.terminal}**`);
          console.log('\n| Surface | State | Result | Exact identity |\n| --- | --- | --- | --- |');
          for (const surface of status.surfaces) {
            console.log(`| ${surface.id} | ${surface.state} | ${surface.result ?? '-'} | ${surface.identity?.verified === true ? 'yes' : 'no'} |`);
          }
          console.log('\n<details><summary>Exact status JSON</summary>\n');
          console.log('```json');
          console.log(JSON.stringify(status, null, 2));
          console.log('```\n</details>');
          NODE

      - name: Upload nightly release status artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: happier-release-status
          path: ${{ runner.temp }}/release-status.json
          if-no-files-found: error
