name: NIGHTLY — Dev Releases

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref — Branch, tag, or SHA to build/publish (default: dev)"
        required: true
        default: dev
        type: string
      resume_run_id:
        description: "Completed NIGHTLY run ID whose verified immutable candidates should be reused"
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: nightly-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve_resume:
    name: Resolve resumable nightly candidates
    uses: ./.github/workflows/resolve-release-resume.yml
    with:
      origin_run_id: ${{ inputs.resume_run_id }}
      expected_workflow: .github/workflows/nightly-dev.yml
      expected_channel: dev

  prepare_release_candidate:
    name: Prepare exact nightly candidate
    needs: [resolve_resume]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      release_notes_github_markdown: ${{ steps.release_notes.outputs.github_markdown }}
      release_notes_expo_message: ${{ steps.release_notes.outputs.expo_message }}
    steps:
      - name: Checkout requested nightly source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve_resume.outputs.source_sha || (github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || 'dev') }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Bind exact nightly source SHA
        id: identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$(printf '%s' "$source_sha" | wc -c | tr -d ' ')" = "40"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Project approved release notes from exact nightly candidate
        id: release_notes
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/ui/package.json').version")"
          VERSION="$version" node scripts/pipeline/release/release-notes/project-release-notes.mjs \
            --version "$version" \
            --changelog "$GITHUB_WORKSPACE/apps/ui/CHANGELOG.md" | \
            VERSION="$version" node --input-type=module -e '
              import { appendFileSync } from "node:fs";
              import { createHash } from "node:crypto";
              let raw = "";
              for await (const chunk of process.stdin) raw += chunk;
              const bundle = JSON.parse(raw);
              if (bundle.kind !== "happier.release-notes.projection.v1" || bundle.schemaVersion !== 1 || bundle.version !== process.env.VERSION) {
                throw new Error("Invalid exact-candidate release-notes projection");
              }
              const values = {
                github_markdown: bundle.projections?.github?.markdown,
                expo_message: bundle.projections?.expo?.message,
              };
              for (const [key, value] of Object.entries(values)) {
                if (typeof value !== "string") throw new Error(`Missing ${key} projection`);
                const delimiter = `RELEASE_NOTES_${createHash("sha256").update(`${key}:${value}`).digest("hex")}`;
                appendFileSync(process.env.GITHUB_OUTPUT, `${key}<<${delimiter}\n${value}\n${delimiter}\n`);
              }
            '

  cli:
    name: CLI immutable candidate (dev)
    needs: [resolve_resume, prepare_release_candidate]
    uses: ./.github/workflows/publish-cli-binaries.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      resume_version: ${{ needs.resolve_resume.outputs.cli_version }}
      publish_rolling: false
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  hstack:
    name: HStack immutable candidate (dev)
    needs: [resolve_resume, prepare_release_candidate]
    uses: ./.github/workflows/publish-hstack-binaries.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      resume_version: ${{ needs.resolve_resume.outputs.stack_version }}
      publish_rolling: false
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  server_runtime:
    name: Server immutable candidate (dev)
    needs: [resolve_resume, prepare_release_candidate]
    uses: ./.github/workflows/publish-server-runtime.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      resume_version: ${{ needs.resolve_resume.outputs.server_version }}
      publish_rolling: false
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  ui_web:
    name: UI web immutable candidate (dev)
    needs: [resolve_resume, prepare_release_candidate]
    uses: ./.github/workflows/publish-ui-web.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      resume_version: ${{ needs.resolve_resume.outputs.ui_web_version }}
      publish_rolling: false
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  release_verify:
    name: Verify exact immutable nightly candidates
    needs: [prepare_release_candidate, cli, hstack, server_runtime, ui_web]
    uses: ./.github/workflows/release-verify.yml
    secrets: inherit
    with:
      channel: dev
      candidate_source_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      candidate_cli_version: ${{ needs.cli.outputs.version }}
      candidate_stack_version: ${{ needs.hstack.outputs.version }}
      candidate_server_version: ${{ needs.server_runtime.outputs.version }}
      candidate_ui_web_version: ${{ needs.ui_web.outputs.version }}
      run_installers_smoke: true
      run_binary_smoke: true
      run_cli_update_continuity: true
      run_daemon_continuity: true
      run_session_continuity: true

  verify_resume_candidates:
    name: Verify successful immutable siblings for resume
    if: ${{ always() && needs.prepare_release_candidate.result == 'success' && needs.release_verify.result != 'success' }}
    needs: [prepare_release_candidate, cli, hstack, server_runtime, ui_web, release_verify]
    uses: ./.github/workflows/verify-release-resume-candidates.yml
    with:
      channel: dev
      candidate_source_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      candidate_cli_version: ${{ needs.cli.result == 'success' && needs.cli.outputs.version || '' }}
      candidate_stack_version: ${{ needs.hstack.result == 'success' && needs.hstack.outputs.version || '' }}
      candidate_server_version: ${{ needs.server_runtime.result == 'success' && needs.server_runtime.outputs.version || '' }}
      candidate_ui_web_version: ${{ needs.ui_web.result == 'success' && needs.ui_web.outputs.version || '' }}

  promote_server:
    name: Promote verified server candidate
    needs: [prepare_release_candidate, server_runtime, release_verify]
    uses: ./.github/workflows/publish-server-runtime.yml
    secrets: inherit
    with:
      channel: dev
      retry_version: ${{ needs.server_runtime.outputs.version }}
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  promote_hstack:
    name: Promote verified HStack candidate
    needs: [prepare_release_candidate, hstack, promote_server]
    uses: ./.github/workflows/publish-hstack-binaries.yml
    secrets: inherit
    with:
      channel: dev
      retry_version: ${{ needs.hstack.outputs.version }}
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  promote_cli:
    name: Promote verified CLI candidate
    needs: [prepare_release_candidate, cli, promote_hstack]
    uses: ./.github/workflows/publish-cli-binaries.yml
    secrets: inherit
    with:
      channel: dev
      retry_version: ${{ needs.cli.outputs.version }}
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  promote_ui_web:
    name: Promote verified UI web candidate
    needs: [prepare_release_candidate, ui_web, promote_cli]
    uses: ./.github/workflows/publish-ui-web.yml
    secrets: inherit
    with:
      channel: dev
      retry_version: ${{ needs.ui_web.outputs.version }}
      allow_stable: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  ui_mobile:
    name: UI mobile (dev)
    needs: [prepare_release_candidate, release_verify]
    uses: ./.github/workflows/publish-ui-mobile-dev.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      publish_ota: true
      publish_android_apk: true
      submit_ios_testflight: true
      eas_builder: eas_local
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_expo_message }}

  ui_desktop:
    name: UI desktop (Tauri) (dev)
    needs: [prepare_release_candidate, release_verify]
    uses: ./.github/workflows/build-tauri.yml
    secrets: inherit
    with:
      environment: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      publish_release: true
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  docker:
    name: Docker images (dev)
    needs: [prepare_release_candidate, cli, server_runtime, promote_ui_web]
    uses: ./.github/workflows/publish-docker.yml
    secrets: inherit
    with:
      channel: dev
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      server_version: ${{ needs.server_runtime.outputs.version }}
      cli_version: ${{ needs.cli.outputs.version }}
      push_latest: true
      registries: dockerhub,ghcr
      build_relay: true
      build_dev_box: true

  verify_promoted:
    name: Verify promoted nightly references
    needs: [prepare_release_candidate, ui_mobile, ui_desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify rolling references bind the candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.prepare_release_candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          resolve_tag_commit() {
            tag="$1"
            read -r object_type object_sha <<EOF
          $(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.type + " " + .object.sha')
          EOF
            while [ "$object_type" = "tag" ]; do
              read -r object_type object_sha <<EOF
          $(gh api "repos/${GH_REPO}/git/tags/${object_sha}" --jq '.object.type + " " + .object.sha')
          EOF
            done
            test "$object_type" = "commit"
            printf '%s\n' "$object_sha"
          }
          for tag in server-dev stack-dev cli-dev ui-web-dev; do
            actual="$(resolve_tag_commit "$tag")"
            test "$actual" = "$EXPECTED_SHA"
          done

  release_status:
    name: Summarize nightly release status
    if: ${{ always() }}
    needs: [prepare_release_candidate, cli, hstack, server_runtime, ui_web, release_verify, verify_resume_candidates, promote_server, promote_hstack, promote_cli, promote_ui_web, ui_mobile, ui_desktop, docker, verify_promoted]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release status projector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Project terminal release status
        env:
          SOURCE_SHA: ${{ needs.prepare_release_candidate.outputs.source_sha }}
          CLI_RESULT: ${{ needs.cli.result }}
          CLI_VERSION: ${{ needs.cli.outputs.version }}
          HSTACK_RESULT: ${{ needs.hstack.result }}
          HSTACK_VERSION: ${{ needs.hstack.outputs.version }}
          SERVER_RESULT: ${{ needs.server_runtime.result }}
          SERVER_VERSION: ${{ needs.server_runtime.outputs.version }}
          UI_WEB_RESULT: ${{ needs.ui_web.result }}
          UI_WEB_VERSION: ${{ needs.ui_web.outputs.version }}
          VERIFY_RESULT: ${{ needs.release_verify.result }}
          CLI_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.cli_verified }}
          HSTACK_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.stack_verified }}
          SERVER_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.server_verified }}
          UI_WEB_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.ui_web_verified }}
          PROMOTE_SERVER_RESULT: ${{ needs.promote_server.result }}
          PROMOTE_HSTACK_RESULT: ${{ needs.promote_hstack.result }}
          PROMOTE_CLI_RESULT: ${{ needs.promote_cli.result }}
          PROMOTE_UI_WEB_RESULT: ${{ needs.promote_ui_web.result }}
          UI_MOBILE_RESULT: ${{ needs.ui_mobile.result }}
          UI_DESKTOP_RESULT: ${{ needs.ui_desktop.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          VERIFY_PROMOTED_RESULT: ${{ needs.verify_promoted.result }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/release-status-input.json"
          import { writeFileSync } from 'node:fs';
          const ids = [
            ['cli', 'CLI_RESULT'], ['hstack', 'HSTACK_RESULT'], ['server', 'SERVER_RESULT'], ['ui-web', 'UI_WEB_RESULT'],
            ['candidate-verification', 'VERIFY_RESULT'], ['promote-server', 'PROMOTE_SERVER_RESULT'],
            ['promote-hstack', 'PROMOTE_HSTACK_RESULT'], ['promote-cli', 'PROMOTE_CLI_RESULT'],
            ['promote-ui-web', 'PROMOTE_UI_WEB_RESULT'], ['ui-mobile', 'UI_MOBILE_RESULT'],
            ['ui-desktop', 'UI_DESKTOP_RESULT'], ['docker', 'DOCKER_RESULT'], ['rolling-verification', 'VERIFY_PROMOTED_RESULT'],
          ];
          const candidateProducts = new Map([
            ['cli', ['cli', 'CLI_VERSION', 'CLI_RESUME_VERIFIED']],
            ['hstack', ['stack', 'HSTACK_VERSION', 'HSTACK_RESUME_VERIFIED']],
            ['server', ['server', 'SERVER_VERSION', 'SERVER_RESUME_VERIFIED']],
            ['ui-web', ['ui-web', 'UI_WEB_VERSION', 'UI_WEB_RESUME_VERIFIED']],
          ]);
          const normalizeResult = (value) => value === 'success' ? 'success' : value === 'skipped' ? 'skipped' : 'failed';
          const input = {
            run: process.env.GITHUB_RUN_ID,
            channel: 'dev',
            sourceSha: process.env.SOURCE_SHA || 'unavailable',
            requestedSurfaces: ids.map(([id]) => ({ id, requested: true, required: true })),
            surfaces: ids.map(([id, envName]) => {
              const result = normalizeResult(process.env[envName]);
              const candidate = candidateProducts.get(id);
              const version = candidate ? process.env[candidate[1]] ?? '' : '';
              const verified = candidate
                ? result === 'success'
                  && version !== ''
                  && (normalizeResult(process.env.VERIFY_RESULT) === 'success' || process.env[candidate[2]] === 'true')
                : result === 'success';
              return {
                id,
                result,
                ...(result === 'success' ? { identity: {
                  verified,
                  ...(candidate ? { product: candidate[0], sourceSha: process.env.SOURCE_SHA, version } : {}),
                } } : {}),
              };
            }),
          };
          writeFileSync('/dev/stdout', `${JSON.stringify(input)}\n`);
          NODE
          node scripts/pipeline/release/summarize-release-status.mjs \
            --input "$RUNNER_TEMP/release-status-input.json" \
            --out "$RUNNER_TEMP/release-status.json"
          {
            echo '## Nightly release status'
            echo '```json'
            cat "$RUNNER_TEMP/release-status.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload terminal release status
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: happier-release-status
          path: ${{ runner.temp }}/release-status.json
          if-no-files-found: error
          overwrite: true
