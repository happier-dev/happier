name: PUBLISH — UI Mobile (Dev lane)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref — Branch, tag, or SHA to build/publish (default: dev)"
        required: true
        default: dev
        type: string
      publish_ota:
        description: "Publish — Expo OTA update to the public dev channel"
        required: true
        default: true
        type: boolean
      publish_android_apk:
        description: "Publish — Build Android APK and publish rolling GitHub release ui-mobile-dev"
        required: true
        default: true
        type: boolean
      submit_ios_testflight:
        description: "Publish — Build iOS and submit to TestFlight (best-effort)"
        required: true
        default: true
        type: boolean
      eas_builder:
        description: "Runner — EAS build runner"
        required: true
        default: eas_local
        type: choice
        options:
          - eas_cloud
          - eas_local
      release_message:
        description: "Release message — Optional message for OTA + GitHub APK rolling release notes"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: false
        default: dev
        type: string
      publish_ota:
        required: false
        default: true
        type: boolean
      publish_android_apk:
        required: false
        default: true
        type: boolean
      submit_ios_testflight:
        required: false
        default: true
        type: boolean
      eas_builder:
        required: false
        default: eas_local
        type: string
      release_message:
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: publish-ui-mobile-dev-${{ github.ref }}-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  EAS_CLI_VERSION: "18.0.1"
  EXPO_UNSTABLE_WEB_MODAL: "1"

jobs:
  trusted_ref_guard:
    name: Trusted workflow ref guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Admit trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_FILE: publish-ui-mobile-dev.yml
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/main") ;;
            *) echo "Untrusted workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    needs: [trusted_ref_guard]
    name: Release actor guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  prepare_ota:
    name: Prepare exact dev OTA bytes without credentials
    needs: [release_actor_guard]
    if: inputs.publish_ota
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout candidate source as untrusted preparation input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact candidate source
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$(printf '%s' "$source_sha" | wc -c | tr -d ' ')" = "40"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn
      - name: Install candidate preparation dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines
      - name: Prepare Android OTA artifact without credentials
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/expo/ota-update.mjs \
            --phase prepare --environment dev --platform android \
            --input-dir "$RUNNER_TEMP/prepared-ota/android" --source-sha "$SOURCE_SHA" \
            --eas-cli-version "$EAS_CLI_VERSION"
      - name: Prepare iOS OTA artifact without credentials
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/expo/ota-update.mjs \
            --phase prepare --environment dev --platform ios \
            --input-dir "$RUNNER_TEMP/prepared-ota/ios" --source-sha "$SOURCE_SHA" \
            --eas-cli-version "$EAS_CLI_VERSION"
      - name: Upload exact prepared OTA bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-mobile-dev-ota-${{ steps.source.outputs.source_sha }}
          path: ${{ runner.temp }}/prepared-ota
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish_ota:
    name: Publish prepared dev OTA bytes from trusted control
    needs: [release_actor_guard, prepare_ota]
    if: inputs.publish_ota
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release-shared
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn
      - name: Install trusted OTA publisher dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_INSTALL_SCOPE: "ui,protocol,release-runtime"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines
      - name: Download exact prepared OTA bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-mobile-dev-ota-${{ needs.prepare_ota.outputs.source_sha }}
          path: ${{ runner.temp }}/prepared-ota
      - name: Publish Android OTA from validated bytes
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
          SOURCE_SHA: ${{ needs.prepare_ota.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/expo/ota-update.mjs \
            --phase publish --environment dev --platform android \
            --input-dir "$RUNNER_TEMP/prepared-ota/android" --expected-source-sha "$SOURCE_SHA" \
            --message "$RELEASE_MESSAGE" --eas-cli-version "$EAS_CLI_VERSION"
      - name: Publish iOS OTA from validated bytes
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
          SOURCE_SHA: ${{ needs.prepare_ota.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/expo/ota-update.mjs \
            --phase publish --environment dev --platform ios \
            --input-dir "$RUNNER_TEMP/prepared-ota/ios" --expected-source-sha "$SOURCE_SHA" \
            --message "$RELEASE_MESSAGE" --eas-cli-version "$EAS_CLI_VERSION"

  publish:
    needs: [release_actor_guard]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release-shared
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Checkout source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          # Keep builds mobile-focused (desktop/web builds happen elsewhere).
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native"
          # Dev lane uses preview-like embedded policy and does not need web-asset vendoring.
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Generate release notes manifest
        run: |
          set -euo pipefail
          yarn --cwd apps/ui tsx sources/scripts/parseReleaseNotes.ts

      - name: Android APK (dev lane) + rolling GitHub release
        if: inputs.publish_android_apk && inputs.eas_builder == 'eas_cloud'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # GitHub App tokens are short-lived and can expire during long native builds.
          # Use the job-scoped GITHUB_TOKEN for release publishing so the lane stays idempotent.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs ui-mobile-release \
            --environment dev \
            --action native \
            --platform android \
            --profile dev-apk \
            --native-build-mode cloud \
            --fingerprint-mode if-changed \
            --build-json "/tmp/eas_build.json" \
            --out-dir "dist/ui-mobile" \
            --eas-cli-version "${EAS_CLI_VERSION}" \
            --release-message "${{ inputs.release_message }}" \
            --secrets-source env

      - name: Install Dagger (local Android builds)
        if: inputs.publish_android_apk && inputs.eas_builder == 'eas_local'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b
        with:
          version: "0.19.11"

      - name: Android APK (dev lane) (local via Dagger) + rolling GitHub release
        if: inputs.publish_android_apk && inputs.eas_builder == 'eas_local'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # GitHub App tokens are short-lived and can expire during long native builds.
          # Use the job-scoped GITHUB_TOKEN for release publishing so the lane stays idempotent.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs ui-mobile-release \
            --environment dev \
            --action native \
            --platform android \
            --profile dev-apk \
            --native-build-mode local \
            --native-local-runtime dagger \
            --fingerprint-mode if-changed \
            --build-json "/tmp/eas_build.json" \
            --out-dir "dist/ui-mobile" \
            --eas-cli-version "${EAS_CLI_VERSION}" \
            --release-message "${{ inputs.release_message }}" \
            --secrets-source env

      - name: Note
        run: |
          set -euo pipefail
          echo "Triggered UI mobile dev lane: OTA + Android APK rolling release + optional TestFlight submit." >> "$GITHUB_STEP_SUMMARY"

  ios_cloud:
    name: iOS TestFlight submit (dev lane) (cloud, best-effort)
    needs: [release_actor_guard]
    if: inputs.submit_ios_testflight && inputs.eas_builder == 'eas_cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release-shared
    continue-on-error: true
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Checkout source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false

      - name: Checkout trusted TestFlight preflight control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .testflight-preflight-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Validate configured external TestFlight groups
        working-directory: .testflight-preflight-control
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs ui-mobile-release \
            --environment dev \
            --action native_submit \
            --platform ios \
            --profile dev \
            --preflight-only \
            --secrets-source env

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: iOS TestFlight submit (dev lane) (best-effort)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS }}
          APP_STORE_CONNECT_PUBLICDEV_SUBMIT_BETA_REVIEW: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_SUBMIT_BETA_REVIEW }}
          APP_STORE_CONNECT_PUBLICDEV_WAIT_PROCESSING: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_WAIT_PROCESSING }}
          APP_STORE_CONNECT_PUBLICDEV_PROCESSING_TIMEOUT_SECONDS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_PROCESSING_TIMEOUT_SECONDS }}
          # Prefer the job-scoped GITHUB_TOKEN over the short-lived GitHub App token.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs ui-mobile-release \
            --environment dev \
            --action native_submit \
            --platform ios \
            --profile dev \
            --native-build-mode cloud \
            --fingerprint-mode if-changed \
            --build-json "/tmp/eas_build.ios.json" \
            --out-dir "dist/ui-mobile" \
            --eas-cli-version "${EAS_CLI_VERSION}" \
            --release-message "${{ inputs.release_message }}" \
            --secrets-source env

  ios_local:
    name: iOS TestFlight submit (dev lane) (local, best-effort)
    needs: [release_actor_guard]
    if: inputs.submit_ios_testflight && inputs.eas_builder == 'eas_local'
    runs-on: macos-26
    timeout-minutes: 180
    environment: release-shared
    continue-on-error: true
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Checkout source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false

      - name: Checkout trusted TestFlight preflight control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .testflight-preflight-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Validate configured external TestFlight groups
        working-directory: .testflight-preflight-control
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs ui-mobile-release \
            --environment dev \
            --action native_submit \
            --platform ios \
            --profile dev \
            --preflight-only \
            --secrets-source env

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Setup Xcode (pin)
        uses: ./.github/actions/setup-xcode
        with:
          xcode_version: "26.2"

      - name: iOS TestFlight submit (dev lane) (best-effort)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_EXTERNAL_GROUPS }}
          APP_STORE_CONNECT_PUBLICDEV_SUBMIT_BETA_REVIEW: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_SUBMIT_BETA_REVIEW }}
          APP_STORE_CONNECT_PUBLICDEV_WAIT_PROCESSING: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_WAIT_PROCESSING }}
          APP_STORE_CONNECT_PUBLICDEV_PROCESSING_TIMEOUT_SECONDS: ${{ vars.APP_STORE_CONNECT_PUBLICDEV_PROCESSING_TIMEOUT_SECONDS }}
          # Prefer the job-scoped GITHUB_TOKEN over the short-lived GitHub App token.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs ui-mobile-release \
            --environment dev \
            --action native_submit \
            --platform ios \
            --profile dev \
            --native-build-mode local \
            --native-local-runtime host \
            --fingerprint-mode if-changed \
            --build-json "/tmp/eas_build.ios.json" \
            --out-dir "dist/ui-mobile" \
            --eas-cli-version "${EAS_CLI_VERSION}" \
            --release-message "${{ inputs.release_message }}" \
            --secrets-source env
