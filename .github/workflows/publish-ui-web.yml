name: PUBLISH — UI Web Bundle (GitHub)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - dev
          - stable
      source_ref:
        description: "Source ref to publish (auto => dev:dev, preview:preview, stable:main)"
        required: true
        default: auto
        type: string
      allow_stable:
        description: "Safety — allow publishing stable artifacts (disabled by default)"
        required: true
        default: false
        type: boolean
      release_message:
        description: "Release message — Optional note to include at the top of the GitHub rolling release notes"
        required: false
        default: ""
        type: string
      retry_version:
        description: "Recovery — exact immutable version to re-project to the rolling channel"
        required: false
        default: ""
        type: string
      resume_version:
        description: "Existing immutable candidate to re-verify and return without rebuilding or promoting"
        required: false
        default: ""
        type: string
      authorized_sha:
        description: "Caller-bound source SHA"
        required: false
        default: ""
        type: string
      publish_rolling:
        description: "Promote the immutable version to the user-consumed rolling channel"
        required: true
        default: true
        type: boolean
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.publish.outputs.version || jobs.release_actor_guard.outputs.resume_version }}
    inputs:
      channel:
        required: true
        type: string
      source_ref:
        required: false
        default: auto
        type: string
      allow_stable:
        required: false
        default: false
        type: boolean
      release_message:
        required: false
        default: ""
        type: string
      retry_version:
        required: false
        default: ""
        type: string
      resume_version:
        required: false
        default: ""
        type: string
      authorized_sha:
        required: false
        default: ""
        type: string
      publish_rolling:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-ui-web-${{ github.repository }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Trust called workflow repository and ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject cross-repository or untrusted workflow control
        env:
          CHANNEL: ${{ inputs.channel }}
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          RESUME_VERSION: ${{ inputs.resume_version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable|preview|dev) ;;
            *) echo "Noncanonical UI-web publisher channel: $CHANNEL" >&2; exit 1 ;;
          esac
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          if [ -n "$RETRY_VERSION" ] && [ -n "$RESUME_VERSION" ]; then
            echo "retry_version and resume_version are mutually exclusive." >&2
            exit 1
          fi
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-ui-web.yml@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-ui-web.yml@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-ui-web.yml@refs/heads/main") ;;
            *) echo "Untrusted UI-web publisher control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    name: Release actor guard
    needs: [trusted_ref_guard]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      resume_version: ${{ steps.resume.outputs.resume_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Re-verify reusable immutable UI-web candidate
        id: resume
        if: ${{ inputs.resume_version != '' && inputs.retry_version == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ inputs.authorized_sha }}
          RESUME_VERSION: ${{ inputs.resume_version }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/verify-release-candidate-identity.mjs \
            --repository "$REPOSITORY" \
            --channel "$CHANNEL" \
            --candidate-source-sha "$SOURCE_SHA" \
            --candidate-product ui-web \
            --candidate-version "$RESUME_VERSION"
          echo "resume_version=$RESUME_VERSION" >> "$GITHUB_OUTPUT"

  prepare:
    if: ${{ inputs.retry_version == '' && inputs.resume_version == '' }}
    needs: [release_actor_guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.candidate_base.outputs.base_version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      app_env: ${{ steps.channel_meta.outputs.app_env }}
      expo_updates_channel: ${{ steps.channel_meta.outputs.expo_updates_channel }}
      app_scheme: ${{ steps.channel_meta.outputs.app_scheme }}
      embedded_policy_env: ${{ steps.channel_meta.outputs.embedded_policy_env }}
    steps:
      - name: Enforce stable publishing gate
        if: ${{ inputs.channel == 'stable' && inputs.allow_stable != true }}
        run: |
          echo "Stable ui web bundle publishing is disabled. Re-run with allow_stable=true if intentional." >&2
          exit 1

      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Resolve channel metadata
        id: channel_meta
        env:
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/resolve-public-release-channel-meta.mjs \
            --channel "$CHANNEL" \
            --source-ref "$REQUESTED_SOURCE_REF" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact source as inert data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.authorized_sha != '' && inputs.authorized_sha || steps.channel_meta.outputs.source_ref }}
          path: .candidate-source
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze source SHA
        id: source
        run: |
          set -euo pipefail
          echo "source_sha=$(git -C .candidate-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enforce caller-authorized source SHA
        if: ${{ inputs.authorized_sha != '' }}
        env:
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .candidate-source rev-parse HEAD)" = "$AUTHORIZED_SHA"

      - name: Read candidate base version as data
        id: candidate_base
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import { normalizeRollingBaseVersion } from "./scripts/pipeline/release/lib/rolling-version-allocation.mjs";
            const value = JSON.parse(fs.readFileSync(".candidate-source/apps/ui/package.json", "utf8")).version;
            if (typeof value !== "string" || normalizeRollingBaseVersion(value) !== value) {
              throw new Error("Candidate UI package version must be exact canonical base semver");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_version=${value}\n`);
          '

      - name: Allocate exact UI-web version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          CANDIDATE_BASE_VERSION: ${{ steps.candidate_base.outputs.base_version }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/publish-ui-web.mjs \
            --channel "$CHANNEL" \
            --allow-stable "$ALLOW_STABLE" \
            --base-version "$CANDIDATE_BASE_VERSION" \
            --resolve-version-only \
            --github-output "$GITHUB_OUTPUT"

      - name: Package exact candidate source as inert transport data
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git -C .candidate-source archive \
            --format=tar.gz \
            --output "${RUNNER_TEMP}/ui-web-source-${SOURCE_SHA}.tar.gz" \
            HEAD

      - name: Upload exact candidate source transport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-web-source-${{ steps.source.outputs.source_sha }}
          path: ${{ runner.temp }}/ui-web-source-${{ steps.source.outputs.source_sha }}.tar.gz
          if-no-files-found: error
          retention-days: 2

  build_candidate:
    name: Build unsigned UI-web candidate
    if: ${{ inputs.retry_version == '' && inputs.resume_version == '' }}
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      EXPO_UNSTABLE_WEB_MODAL: "1"
    steps:
      - name: Download exact candidate source transport
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ui-web-source-${{ needs.prepare.outputs.source_sha }}
          path: ${{ runner.temp }}/ui-web-source

      - name: Materialize candidate source without repository authority
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ui-web-source/ui-web-source-${SOURCE_SHA}.tar.gz"
          test -f "$archive"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/scripts/pipeline/run.mjs"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          APP_ENV: ${{ needs.prepare.outputs.app_env }}
          EXPO_UPDATES_CHANNEL: ${{ needs.prepare.outputs.expo_updates_channel }}
          EXPO_APP_SCHEME: ${{ needs.prepare.outputs.app_scheme }}
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Generate release notes manifest
        run: |
          set -euo pipefail
          yarn --cwd apps/ui tsx sources/scripts/parseReleaseNotes.ts

      - name: Build release notes assets
        run: |
          set -euo pipefail
          node scripts/pipeline/release/release-notes/build-release-notes-assets.mjs \
            --out-dir "dist/release-notes-assets"

      - name: Build unsigned UI-web archive
        env:
          MINISIGN_SECRET_KEY: ""
          MINISIGN_PASSPHRASE: ""
          APP_ENV: ${{ needs.prepare.outputs.app_env }}
          EXPO_UPDATES_CHANNEL: ${{ needs.prepare.outputs.expo_updates_channel }}
          EXPO_APP_SCHEME: ${{ needs.prepare.outputs.app_scheme }}
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPO_PUBLIC_SENTRY_RELEASE: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/build-ui-web-bundle.mjs \
            --channel "$CHANNEL" \
            --version "$VERSION"

      - name: Assemble opaque UI-web candidate handoff
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/release-assets/ui-web/happier-ui-web-v${VERSION}-web-any.tar.gz"
          test -f "$archive"
          test "$(find dist/release-assets/ui-web -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
          rm -rf dist/ui-web-candidate
          mkdir -p dist/ui-web-candidate/ui-web dist/ui-web-candidate/release-notes-assets
          cp "$archive" dist/ui-web-candidate/ui-web/
          cp -R dist/release-notes-assets/. dist/ui-web-candidate/release-notes-assets/

      - name: Upload opaque UI-web candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-web-candidate-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: dist/ui-web-candidate
          if-no-files-found: error
          retention-days: 2

  publish:
    if: ${{ inputs.retry_version == '' && inputs.resume_version == '' }}
    needs: [prepare, build_candidate]
    runs-on: ubuntu-latest
    environment: release-shared
    permissions:
      contents: write
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install minisign (signing + verification)
        uses: ./.github/actions/bootstrap-minisign

      - name: Install trusted workflow control dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Download exact opaque UI-web candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ui-web-candidate-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_sha }}
          path: dist/ui-web-candidate

      - name: Materialize candidate data for trusted publishers
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          source_archive="dist/ui-web-candidate/ui-web/happier-ui-web-v${VERSION}-web-any.tar.gz"
          test -f "$source_archive"
          test "$(find dist/ui-web-candidate/ui-web -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          test -d dist/ui-web-candidate/release-notes-assets
          rm -rf dist/release-assets/ui-web dist/release-notes-assets
          mkdir -p dist/release-assets/ui-web dist/release-notes-assets
          cp "$source_archive" dist/release-assets/ui-web/
          cp -R dist/ui-web-candidate/release-notes-assets/. dist/release-notes-assets/

      - name: Upload exact UI-web source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.prepare.outputs.version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          source_archive="dist/release-assets/ui-web/happier-ui-web-v${VERSION}-web-any.tar.gz"
          extract_dir="${RUNNER_TEMP}/ui-web-sourcemaps"
          bundle_dir="${extract_dir}/happier-ui-web-v${VERSION}-web-any"
          rm -rf "$extract_dir"
          node scripts/pipeline/release/node-archive.mjs \
            --extract-archive-path "$source_archive" \
            --extract-dir "$extract_dir"
          node scripts/pipeline/expo/sentry-upload-sourcemaps.mjs \
            --ui-dir "$GITHUB_WORKSPACE/apps/ui" \
            --dist-dir "$bundle_dir"

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Publish UI web bundle (pipeline)
        id: publish
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.prepare.outputs.embedded_policy_env }}
          CHANNEL: ${{ inputs.channel }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
          PUBLISH_PHASE: ${{ inputs.publish_rolling == false && 'publish-immutable' || 'publish' }}
          BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
          VERSION: ${{ needs.prepare.outputs.version }}
          AUTHORIZED_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/publish-ui-web.mjs \
            --channel "$CHANNEL" \
            --allow-stable "$ALLOW_STABLE" \
            --release-message "$RELEASE_MESSAGE" \
            --phase "$PUBLISH_PHASE" \
            --base-version "$BASE_VERSION" \
            --version "$VERSION" \
            --authorized-sha "$AUTHORIZED_SHA" \
            --prepared-artifacts \
            --github-output "$GITHUB_OUTPUT" \
            --run-contracts "true" \
            --check-installers "true"

  promote_existing:
    name: Re-promote exact immutable UI web version after interrupted rolling upload
    needs: [release_actor_guard]
    if: ${{ inputs.retry_version != '' && inputs.resume_version == '' }}
    runs-on: ubuntu-latest
    environment: release-shared
    permissions:
      contents: read
    steps:
      - name: Enforce stable publishing gate
        if: ${{ inputs.channel == 'stable' && inputs.allow_stable != true }}
        run: exit 1
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines
      - name: Create narrowly scoped publish token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Bind exact immutable version tag SHA
        id: source
        env:
          RETRY_VERSION: ${{ inputs.retry_version }}
        run: |
          node scripts/pipeline/github/resolve-authorized-release-source.mjs \
            --source-ref "refs/tags/ui-web-v$RETRY_VERSION" \
            --remote origin \
            --github-output "$GITHUB_OUTPUT"
      - name: Install minisign for immutable bundle verification
        uses: ./.github/actions/bootstrap-minisign
      - name: Re-promote exact verified immutable release bytes
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          AUTHORIZED_SHA: ${{ steps.source.outputs.authorized_sha }}
          CHANNEL: ${{ inputs.channel }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/publish-ui-web.mjs \
            --phase promote-rolling --channel "$CHANNEL" \
            --allow-stable "$ALLOW_STABLE" \
            --version "$RETRY_VERSION" --authorized-sha "$AUTHORIZED_SHA" \
            --release-message "$RELEASE_MESSAGE" \
            --run-contracts false --check-installers false
