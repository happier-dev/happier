name: PROMOTE — Docs (deploy branch)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target — Environment (deploy branch)"
        required: true
        type: choice
        options:
          - preview
          - production
      force_deploy:
        description: "Deploy — Force deploy webhook trigger even if deploy branch is already up to date"
        required: true
        default: false
        type: boolean
      run_build:
        description: "Checks — Run docs build before promoting"
        required: true
        default: true
        type: boolean
      source_ref:
        description: "Promotion — Source ref to promote (branch, tag, or SHA). Use 'auto' to default preview→preview, production→main."
        required: true
        default: auto
        type: string
      allow_cross_promote:
        description: "Safety — Allow promoting a non-default source ref to the selected environment (use with care)."
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      environment:
        description: "Target — Environment (deploy branch)"
        required: true
        type: string
      force_deploy:
        description: "Deploy — Force deploy webhook trigger even if deploy branch is already up to date"
        required: false
        default: false
        type: boolean
      run_build:
        description: "Checks — Run docs build before promoting"
        required: false
        default: true
        type: boolean
      source_ref:
        description: "Promotion — Source ref to promote (branch, tag, or SHA). Use 'auto' to default preview→preview, production→main."
        required: false
        default: auto
        type: string
      allow_cross_promote:
        description: "Safety — Allow promoting a non-default source ref to the selected environment (use with care)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: promote-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Trusted workflow ref guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Admit trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_FILE: promote-docs.yml
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/main") ;;
            *) echo "Untrusted workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    needs: [trusted_ref_guard]
    name: Release actor guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  resolve_source:
    needs: [release_actor_guard]
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      candidate_sha: ${{ steps.candidate.outputs.authorized_sha }}
    steps:
      - name: Checkout trusted workflow control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Enforce trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/promote-docs.yml@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/promote-docs.yml@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/promote-docs.yml@refs/heads/main") ;;
            *) echo "Untrusted promote-docs workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

      - name: Resolve source ref
        id: resolve
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REF: ${{ inputs.source_ref }}
          ALLOW_CROSS_PROMOTE: ${{ inputs.allow_cross_promote }}
        run: |
          set -euo pipefail
          env_name="$DEPLOY_ENVIRONMENT"
          src="$SOURCE_REF"
          if [ "$src" = "auto" ]; then
            if [ "$env_name" = "preview" ]; then
              src="preview"
            else
              src="main"
            fi
          fi

          # Guardrails: allow using non-default source ref only when explicitly confirmed.
          if [ "$env_name" = "production" ] && [ "$src" != "main" ] && [ "$ALLOW_CROSS_PROMOTE" != "true" ]; then
            echo "Refusing to promote '$src' to production without allow_cross_promote=true." >&2
            exit 1
          fi

          if [[ "$src" == *$'\n'* || "$src" == *$'\r'* ]] || ! git check-ref-format --branch "$src" >/dev/null 2>&1; then
            if [[ ! "$src" =~ ^[a-f0-9]{40}$ ]]; then
              echo "Invalid promotion source ref." >&2
              exit 1
            fi
          fi

          echo "source_ref=$src" >> "$GITHUB_OUTPUT"

      - name: Enforce trusted refs for manual dispatch
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            dev|preview|main) ;;
            *)
              echo "Refusing workflow_dispatch from untrusted ref '${GITHUB_REF_NAME}'. Use dev, preview, or main." >&2
              exit 1
              ;;
          esac

      - name: Bind exact authorized source SHA
        id: candidate
        env:
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
        run: |
          node scripts/pipeline/github/resolve-authorized-release-source.mjs \
            --source-ref "$SOURCE_REF" \
            --remote origin \
            --github-output "$GITHUB_OUTPUT"

  validate_candidate:
    needs: [resolve_source]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.resolve_source.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        run: |
          set -euo pipefail
          bash scripts/ci/yarn-install-with-retry.sh --frozen-lockfile --ignore-engines --network-timeout 600000 --prefer-offline --non-interactive

      # The build is unconditional now: deploy_cloudflare publishes exactly these
      # bytes, so skipping it would leave nothing to publish. `run_build` is
      # retained as an input for compatibility with callers that still pass it.
      - name: Build docs
        run: yarn workspace docs build

      - name: Upload the exact built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-out-${{ github.sha }}
          path: apps/docs/out
          retention-days: 7
          if-no-files-found: error

  promote:
    needs: [release_actor_guard, resolve_source, validate_candidate]
    runs-on: ubuntu-latest
    environment: release-shared
    steps:
      - name: Checkout trusted promotion control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Resolve deploy branch SHA (before)
        id: deploy_before
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ref="deploy/${DEPLOY_ENVIRONMENT}/docs"
          sha="$(gh api "repos/${GH_REPO}/git/ref/heads/${ref}" --jq .object.sha 2>/dev/null || true)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Promote source ref to deploy branch
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          CANDIDATE_SHA: ${{ needs.resolve_source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          node scripts/pipeline/github/promote-deploy-branch.mjs \
            --deploy-environment "$DEPLOY_ENVIRONMENT" \
            --component docs \
            --sha "$CANDIDATE_SHA" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Resolve deploy branch SHA (after)
        id: deploy_after
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ref="deploy/${DEPLOY_ENVIRONMENT}/docs"
          sha="$(gh api "repos/${GH_REPO}/git/ref/heads/${ref}" --jq .object.sha 2>/dev/null || true)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Deploy note
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_SHA: ${{ steps.deploy_after.outputs.sha }}
        run: |
          set -euo pipefail
          echo "deploy/${DEPLOY_ENVIRONMENT}/docs records what is live; Cloudflare is published by the deploy_cloudflare job." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy_branch_sha: \`${DEPLOY_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # Publishes the exact bytes the build job produced. Kept out of `promote`
  # because that job owns release-shared (GitHub App) secrets and a job may only
  # bind one environment; shared Cloudflare credentials live in cloudflare-deploy.
  #
  # This replaced a Cloudflare PAGES deploy hook, which rebuilt the app inside
  # Cloudflare's build container on every push to deploy/<env>/docs — bypassing
  # release_actor_guard and every content check this workflow runs. Do not
  # reconnect Cloudflare's Git integration: two publishers for one Worker race,
  # and CI is the one that ran the checks.
  deploy_cloudflare:
    needs: [promote]
    runs-on: ubuntu-latest
    environment: cloudflare-deploy
    permissions:
      contents: read
    steps:
      - name: Checkout trusted deploy control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Download the exact built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: docs-out-${{ github.sha }}
          path: apps/docs/out
      # A green build that produced a partial export publishes a dead site just
      # as successfully as a good one. These are the files whose absence is
      # silent in production: the 160 redirects the export cannot emit itself,
      # the search index, and the 404 the Worker serves by name.
      - name: Verify the artifact is a real static export
        run: |
          set -euo pipefail
          test -f apps/docs/out/index.html
          test -f apps/docs/out/404.html
          test -f apps/docs/out/_redirects
          test -f apps/docs/out/robots.txt
          test -s apps/docs/out/sitemap.xml
          test -s apps/docs/out/api/search
          test -s apps/docs/out/llms.txt
          # The Markdown sources must have been MOVED to their public paths
          # (scripts/exportMdxSources.mjs). If they are still staged under
          # llms.mdx/, every <page>.mdx URL 404s — and nothing else notices,
          # because the Worker no longer rewrites that prefix.
          test -s apps/docs/out/agents.mdx
          test ! -d apps/docs/out/llms.mdx
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        working-directory: apps/docs
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" = production ]; then
            npx --yes wrangler@4 deploy --message "promote ${{ github.sha }}"
          else
            npx --yes wrangler@4 versions upload --preview-alias preview --message "promote ${{ github.sha }}"
          fi
      - name: Cloudflare note
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Published apps/docs/out to the happier-docs Worker ($DEPLOY_ENVIRONMENT) from ${{ github.sha }}." >> "$GITHUB_STEP_SUMMARY"
