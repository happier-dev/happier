name: Issue Needs Handoff

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-needs-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconcile issue handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/pipeline/github/reconcile-issue-needs.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH"
