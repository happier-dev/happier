name: Issue and PR Needs Handoff

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-needs-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Reconcile issue or PR handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/pipeline/github/reconcile-issue-needs.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH"
