name: PUBLISH — Server Runtime (GitHub)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        default: preview
        options:
          - preview
          - dev
          - stable
      source_ref:
        description: Source ref to publish (auto resolves from channel)
        required: true
        default: auto
        type: string
      allow_stable:
        description: Safety — allow publishing stable artifacts
        required: true
        default: false
        type: boolean
      release_message:
        required: false
        default: ''
        type: string
      retry_version:
        description: Existing immutable version to re-promote after an interrupted rolling upload
        required: false
        default: ''
        type: string
      publish_rolling:
        description: Promote the immutable version to the user-consumed rolling channel
        required: true
        default: true
        type: boolean
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.release_actor_guard.outputs.version }}
    inputs:
      channel: { required: true, type: string }
      source_ref: { required: false, default: auto, type: string }
      authorized_sha: { required: false, default: '', type: string }
      allow_stable: { required: false, default: false, type: boolean }
      release_message: { required: false, default: '', type: string }
      retry_version: { required: false, default: '', type: string }
      publish_rolling: { required: false, default: true, type: boolean }

permissions:
  contents: read

concurrency:
  group: publish-server-runtime-${{ github.repository }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Trust called workflow repository and ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject cross-repository or untrusted workflow control
        env:
          CHANNEL: ${{ inputs.channel }}
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable|preview|dev) ;;
            *) echo "Noncanonical server-runtime workflow channel: $CHANNEL" >&2; exit 1 ;;
          esac
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-server-runtime.yml@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-server-runtime.yml@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/publish-server-runtime.yml@refs/heads/main") ;;
            *) echo "Untrusted server-runtime publisher control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    name: Release actor guard and bind source
    runs-on: ubuntu-latest
    needs: [trusted_ref_guard]
    permissions:
      contents: read
    outputs:
      authorized_sha: ${{ steps.source.outputs.authorized_sha }}
      source_ref: ${{ steps.source.outputs.canonical_ref }}
      embedded_policy_env: ${{ steps.channel_meta.outputs.embedded_policy_env }}
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.source_version.outputs.base_version }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      repository_owner: ${{ steps.source.outputs.repository_owner }}
      repository_name: ${{ steps.source.outputs.repository_name }}
    steps:
      - name: Checkout called workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Enforce stable publishing gate
        if: ${{ inputs.channel == 'stable' && inputs.allow_stable != true }}
        run: exit 1
      - name: Resolve channel metadata from control bytes
        id: channel_meta
        env:
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          node scripts/pipeline/release/resolve-public-release-channel-meta.mjs \
            --channel "$CHANNEL" --source-ref "$SOURCE_REF" --github-output "$GITHUB_OUTPUT"
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Bind authorized remote source SHA
        id: source
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          SOURCE_REF: ${{ steps.channel_meta.outputs.source_ref }}
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          ARTIFACT_NAME: server-runtime-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ -n "$RETRY_VERSION" ]]; then
            SOURCE_REF="refs/tags/server-v$RETRY_VERSION"
          fi
          node scripts/pipeline/github/resolve-authorized-release-source.mjs \
            --source-ref "$SOURCE_REF" --authorized-sha "$AUTHORIZED_SHA" --remote origin --github-output "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "repository_owner=${WORKFLOW_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "repository_name=${WORKFLOW_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - name: Checkout authorized source as non-executable data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ steps.source.outputs.authorized_sha }}
          path: authorized-source
          fetch-depth: 1
          persist-credentials: false
      - name: Read synchronized version from authorized source data
        id: source_version
        run: node scripts/pipeline/release/publishing/authorized-server-version.mjs --source-dir authorized-source --github-output "$GITHUB_OUTPUT"
      - name: Resolve authorized release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ job.workflow_repository }}
          CHANNEL: ${{ inputs.channel }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          BASE_VERSION: ${{ steps.source_version.outputs.base_version }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          AUTHORIZED_SHA: ${{ steps.source.outputs.authorized_sha }}
        run: |
          PHASE=build-candidate
          VERSION_ARGS=()
          if [[ -n "$RETRY_VERSION" ]]; then
            PHASE=promote-rolling
            VERSION_ARGS=(--version "$RETRY_VERSION" --authorized-sha "$AUTHORIZED_SHA")
          fi
          node scripts/pipeline/release/publish-server-runtime.mjs \
            --phase "$PHASE" --channel "$CHANNEL" --base-version "$BASE_VERSION" \
            "${VERSION_ARGS[@]}" \
            --allow-stable "$ALLOW_STABLE" --run-contracts false --check-installers false \
            --dry-run --github-output "$GITHUB_OUTPUT"

  build_candidate:
    name: Build and smoke-test unsigned candidate
    needs: [trusted_ref_guard, release_actor_guard]
    if: ${{ inputs.retry_version == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact authorized candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.release_actor_guard.outputs.authorized_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.5
      - name: Install candidate dependencies without credentials
        env:
          YARN_PRODUCTION: 'false'
          npm_config_production: 'false'
          HAPPIER_UI_VENDOR_WEB_ASSETS: '0'
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.release_actor_guard.outputs.embedded_policy_env }}
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines --ignore-platform
      - name: Build and smoke-test opaque unsigned archives
        env:
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.release_actor_guard.outputs.embedded_policy_env }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.release_actor_guard.outputs.version }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          BASE_VERSION: ${{ needs.release_actor_guard.outputs.base_version }}
        run: |
          node scripts/pipeline/release/publish-server-runtime.mjs \
            --phase build-candidate --channel "$CHANNEL" --base-version "$BASE_VERSION" \
            --version "$VERSION" --allow-stable "$ALLOW_STABLE" --run-contracts true --check-installers true \
            --candidate-dir dist/release-assets/server
      - name: Upload opaque unsigned archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-runtime-candidate-${{ needs.release_actor_guard.outputs.version }}-${{ needs.release_actor_guard.outputs.authorized_sha }}
          path: dist/release-assets/server/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  finalize_darwin:
    name: Sign and notarize server (${{ matrix.platform_key }})
    needs: [trusted_ref_guard, release_actor_guard, build_candidate]
    if: ${{ inputs.retry_version == '' }}
    runs-on: ${{ matrix.runner }}
    environment: release-shared
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_key: darwin-x64
            runner: macos-15-intel
            target: darwin-x64
          - platform_key: darwin-arm64
            runner: macos-15
            target: darwin-arm64
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn
      - name: Install trusted workflow control dependencies
        env:
          YARN_PRODUCTION: 'false'
          npm_config_production: 'false'
          HAPPIER_UI_VENDOR_WEB_ASSETS: '0'
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines --ignore-scripts
      - name: Build trusted release archive runtime
        run: yarn workspace @happier-dev/release-runtime build
      - name: Require Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS payload signing/notarization secret: ${name}" >&2
              exit 1
            fi
          done
      - name: Setup Apple code signing identity
        id: apple_id
        uses: ./.github/actions/setup-apple-codesigning
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Download unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: server-runtime-candidate-${{ needs.release_actor_guard.outputs.version }}-${{ needs.release_actor_guard.outputs.authorized_sha }}
          path: dist/release-assets/server
      - name: Sign, notarize, and verify exact server archive
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          VERSION: ${{ needs.release_actor_guard.outputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM_KEY: ${{ matrix.platform_key }}
          SIGNING_IDENTITY: ${{ steps.apple_id.outputs.identity }}
        run: |
          set -euo pipefail
          ARCHIVE="${GITHUB_WORKSPACE}/dist/release-assets/server/happier-server-v${VERSION}-${TARGET}.tar.gz"
          PAYLOAD="happier-server-v${VERSION}-${TARGET}"
          EVIDENCE="${GITHUB_WORKSPACE}/dist/notary/${PLATFORM_KEY}.server.json"
          node scripts/pipeline/release/notarize-standalone-binary.mjs \
            --archive "${ARCHIVE}" \
            --expected-payload "${PAYLOAD}" \
            --identity "${SIGNING_IDENTITY}" \
            --out "${EVIDENCE}"
          VERIFY_DIR="${RUNNER_TEMP}/server-verify-${PLATFORM_KEY}"
          node scripts/pipeline/release/node-archive.mjs \
            --extract-archive-path "${ARCHIVE}" \
            --extract-dir "${VERIFY_DIR}"
          node scripts/pipeline/release/notarize-standalone-binary.mjs \
            --verify-evidence \
            --payload "${VERIFY_DIR}/${PAYLOAD}" \
            --evidence "${EVIDENCE}"
      - name: Clean Apple signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.apple_id.outputs.keychain-path }}
          CERTIFICATE_PATH: ${{ steps.apple_id.outputs.certificate-path }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          rm -f "$CERTIFICATE_PATH"
      - name: Assemble signed Darwin leaf handoff
        env:
          VERSION: ${{ needs.release_actor_guard.outputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM_KEY: ${{ matrix.platform_key }}
        run: |
          set -euo pipefail
          rm -rf dist/signed-leaf
          mkdir -p dist/signed-leaf
          cp "dist/release-assets/server/happier-server-v${VERSION}-${TARGET}.tar.gz" dist/signed-leaf/
          cp "dist/notary/${PLATFORM_KEY}.server.json" dist/signed-leaf/
      - name: Upload signed Darwin leaf and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-runtime-signed-${{ matrix.platform_key }}-${{ needs.release_actor_guard.outputs.version }}-${{ needs.release_actor_guard.outputs.authorized_sha }}
          path: dist/signed-leaf
          if-no-files-found: error
          retention-days: 1

  finalize_publish:
    name: Validate, sign, manifest, and publish authorized candidate
    needs: [trusted_ref_guard, release_actor_guard, build_candidate, finalize_darwin]
    if: ${{ inputs.retry_version == '' }}
    runs-on: ubuntu-latest
    environment: release-shared
    permissions:
      contents: read
    steps:
      - name: Checkout called workflow control bytes only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Download candidate as hostile opaque data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: server-runtime-candidate-${{ needs.release_actor_guard.outputs.version }}-${{ needs.release_actor_guard.outputs.authorized_sha }}
          path: dist/release-assets/server
      - name: Download signed Darwin leaves
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: server-runtime-signed-*-${{ needs.release_actor_guard.outputs.version }}-${{ needs.release_actor_guard.outputs.authorized_sha }}
          path: dist/signed-darwin
          merge-multiple: true
      - name: Overlay exact signed Darwin leaves and evidence
        env:
          VERSION: ${{ needs.release_actor_guard.outputs.version }}
        run: |
          set -euo pipefail
          cp "dist/signed-darwin/happier-server-v${VERSION}-darwin-arm64.tar.gz" dist/release-assets/server/
          cp "dist/signed-darwin/happier-server-v${VERSION}-darwin-x64.tar.gz" dist/release-assets/server/
          cp "dist/signed-darwin/darwin-arm64.server.json" dist/release-assets/server/
          cp "dist/signed-darwin/darwin-x64.server.json" dist/release-assets/server/
      - name: Install minisign only from trusted control bytes
        uses: ./.github/actions/bootstrap-minisign
      - name: Create narrowly scoped publish token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ needs.release_actor_guard.outputs.repository_owner }}
          repositories: ${{ needs.release_actor_guard.outputs.repository_name }}
          permission-contents: write
      - name: Validate opaque files, recompute, sign, manifest, and publish
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ job.workflow_repository }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
          HAPPIER_EMBEDDED_POLICY_ENV: ${{ needs.release_actor_guard.outputs.embedded_policy_env }}
          AUTHORIZED_SHA: ${{ needs.release_actor_guard.outputs.authorized_sha }}
          VERSION: ${{ needs.release_actor_guard.outputs.version }}
          BASE_VERSION: ${{ needs.release_actor_guard.outputs.base_version }}
          CHANNEL: ${{ inputs.channel }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
          PUBLISH_ROLLING: ${{ inputs.publish_rolling }}
        run: |
          node scripts/pipeline/release/publish-server-runtime.mjs \
            --phase finalize-candidate --prepared-artifacts \
            --authorized-sha "$AUTHORIZED_SHA" --base-version "$BASE_VERSION" --version "$VERSION" \
            --channel "$CHANNEL" --allow-stable "$ALLOW_STABLE" \
            --release-message "$RELEASE_MESSAGE" --run-contracts false --check-installers false \
            --publish-rolling "$PUBLISH_ROLLING"

  promote_existing:
    name: Re-promote exact immutable version after interrupted rolling upload
    needs: [trusted_ref_guard, release_actor_guard]
    if: ${{ inputs.retry_version != '' }}
    runs-on: ubuntu-latest
    environment: release-shared
    permissions:
      contents: read
    steps:
      - name: Checkout called workflow control bytes only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Install minisign only from trusted control bytes
        uses: ./.github/actions/bootstrap-minisign
      - name: Create narrowly scoped publish token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ needs.release_actor_guard.outputs.repository_owner }}
          repositories: ${{ needs.release_actor_guard.outputs.repository_name }}
          permission-contents: write
      - name: Re-promote exact verified immutable release bytes
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ job.workflow_repository }}
          AUTHORIZED_SHA: ${{ needs.release_actor_guard.outputs.authorized_sha }}
          VERSION: ${{ needs.release_actor_guard.outputs.version }}
          BASE_VERSION: ${{ needs.release_actor_guard.outputs.base_version }}
          CHANNEL: ${{ inputs.channel }}
          ALLOW_STABLE: ${{ inputs.allow_stable }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
        run: |
          node scripts/pipeline/release/publish-server-runtime.mjs \
            --phase promote-rolling --authorized-sha "$AUTHORIZED_SHA" --version "$VERSION" \
            --base-version "$BASE_VERSION" --channel "$CHANNEL" --allow-stable "$ALLOW_STABLE" \
            --release-message "$RELEASE_MESSAGE" --run-contracts false --check-installers false
