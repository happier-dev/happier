name: CI — Tests

on:
  pull_request:
  push:
    branches:
      - dev
      - preview
      - main
  workflow_call:
    inputs:
      run_ui_e2e:
        required: false
        default: false
        type: boolean
      run_wsrepl_lima:
        required: false
        default: false
        type: boolean
      run_mobile_e2e_android:
        required: false
        default: false
        type: boolean
      run_mobile_e2e_ios:
        required: false
        default: false
        type: boolean
      run_ui:
        required: false
        default: true
        type: boolean
      run_server:
        required: false
        default: true
        type: boolean
      run_server_db_contract:
        required: false
        default: true
        type: boolean
      run_cli:
        required: false
        default: true
        type: boolean
      run_stack:
        required: false
        default: true
        type: boolean
      run_typecheck:
        required: false
        default: true
        type: boolean
      run_cli_daemon_e2e:
        required: false
        default: true
        type: boolean
      run_e2e_core:
        required: false
        default: true
        type: boolean
      run_e2e_core_slow:
        required: false
        default: false
        type: boolean
      run_providers:
        required: false
        default: false
        type: boolean
      providers_preset:
        required: false
        default: all
        type: string
      providers_tier:
        required: false
        default: smoke
        type: string
      providers_opencode:
        required: false
        default: "1.1.52|c7c1e622aff3d457358385e28dff33ffa8401cb9067e865a9f35a2f94e899490"
        type: string
      providers_flags:
        required: false
        default: '{"strict_keys":false,"flake_retry":true,"update_baselines":false}'
        type: string
      providers_models:
        required: false
        default: '{"default":"","overrides":""}'
        type: string
      run_stress:
        required: false
        default: false
        type: boolean
      run_release_contracts:
        required: false
        default: false
        type: boolean
      run_installers_smoke:
        required: false
        default: true
        type: boolean
      run_artifact_verify:
        required: false
        default: false
        type: boolean
      installers_channel:
        required: false
        default: stable
        type: string
      installers_source:
        required: false
        default: published-channel
        type: string
      installers_ref:
        required: false
        default: ""
        type: string
      run_binary_smoke:
        required: false
        default: true
        type: boolean
      checkout_sha:
        required: false
        default: ""
        type: string
      run_cli_update_continuity:
        required: false
        default: false
        type: boolean
      cli_update_to_source:
        required: false
        default: local-build
        type: string
      cli_update_to_ref:
        required: false
        default: "."
        type: string
      run_daemon_continuity:
        required: false
        default: false
        type: boolean
      run_session_continuity:
        required: false
        default: false
        type: boolean
      run_release_assets_docker:
        required: false
        default: false
        type: boolean
      relay_upgrade_to_source:
        required: false
        default: local-build
        type: string
      relay_upgrade_to_ref:
        required: false
        default: "."
        type: string
      run_self_host_systemd:
        required: false
        default: false
        type: boolean
      run_self_host_launchd:
        required: false
        default: false
        type: boolean
      run_self_host_schtasks:
        required: false
        default: false
        type: boolean
      run_self_host_daemon:
        required: false
        default: false
        type: boolean
      stress_config:
        required: false
        default: '{"target_mode":"light","base_url":"","repeat":"5","seed":"20260418","flake_retry":"true","users":"25","machines_per_user":"1","sessions_per_user":"1","rpc_listeners_per_user":"1","rpc_calls_per_second":"2","messages_per_second":"5","reconnect_rate":"0","duration_ms":"30000","warmup_ms":"1000","cooldown_ms":"1000","soak_ms":"0","api_replicas":"2","worker_replicas":"1","rolling_restart":"false","compose_metrics_enabled":"true","metrics_scrape_enabled":"false","keep_topology_on_failure":"false","save_artifacts_on_success":"false","socket_transport":"websocket","kill_target":"api"}'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Speed up CI: UI postinstall vendors large web-only assets (Monaco/Kokoro/Skia web).
  # Tests and native builds do not require these assets.
  HAPPIER_UI_VENDOR_WEB_ASSETS: "0"

jobs:
  cliproxyapi-managed-runtime:
    name: CLIProxyAPI managed runtime (${{ matrix.platform_key }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_key: linux-amd64
            runner: ubuntu-24.04
            go_target: linux-amd64
            wrapper_name: happier-cliproxyapi-managed
          - platform_key: darwin-arm64
            runner: macos-15
            go_target: darwin-arm64
            wrapper_name: happier-cliproxyapi-managed
          - platform_key: windows-amd64
            runner: windows-2025
            go_target: windows-amd64
            wrapper_name: happier-cliproxyapi-managed.exe
          - platform_key: windows-arm64
            runner: windows-2025
            go_target: windows-arm64
            wrapper_name: happier-cliproxyapi-managed.exe
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Enable Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Setup pinned Go toolchain and module cache
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/plugins/cliproxyapi/managed-runtime/go.mod
          cache: true
          cache-dependency-path: packages/plugins/cliproxyapi/managed-runtime/go.sum

      - name: Run retained source conformance
        shell: bash
        working-directory: packages/plugins/cliproxyapi/managed-runtime
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Run Linux race and reachable vulnerability checks
        if: matrix.platform_key == 'linux-amd64'
        shell: bash
        working-directory: packages/plugins/cliproxyapi/managed-runtime
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
          go tool govulncheck ./...

      - name: Build target through the one package-owned definition
        shell: bash
        env:
          HAPPIER_VERSION: 0.0.0-ci
          WRAPPER_NAME: ${{ matrix.wrapper_name }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const path=require("path");fs.appendFileSync(process.env.GITHUB_ENV,`WRAPPER_PATH=${path.join(process.env.RUNNER_TEMP,process.env.WRAPPER_NAME)}\n`)'
          yarn workspace @happier-dev/plugins-cliproxyapi managed-runtime:build \
            --target "${{ matrix.go_target }}" \
            --output "${RUNNER_TEMP}/${WRAPPER_NAME}"
          node -e 'const fs=require("fs");if(!fs.statSync(process.argv[1]).isFile())process.exit(1)' "${RUNNER_TEMP}/${WRAPPER_NAME}"

  ui-e2e:
    if: ${{ (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call') || (github.event_name == 'workflow_call' && inputs.run_ui_e2e) }}
    name: UI E2E (Playwright)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # UI E2E boots Expo web; keep web assets available to avoid CI-only runtime surprises.
      HAPPIER_UI_VENDOR_WEB_ASSETS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Detect UI E2E-relevant changes
        id: changes
        if: github.event_name != 'workflow_call'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui_e2e:
              - 'apps/ui/**'
              - 'apps/server/**'
              - 'apps/cli/**'
              - 'packages/tests/**'
              - 'package.json'
              - 'yarn.lock'

      - name: Skip UI E2E (no relevant changes)
        if: github.event_name != 'workflow_call' && steps.changes.outputs.ui_e2e != 'true'
        run: |
          echo "UI E2E skipped: no relevant changes."

      - name: Setup Node (GitHub Actions)
        if: (github.event_name == 'workflow_call' || steps.changes.outputs.ui_e2e == 'true') && env.ACT != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Node (act)
        if: (github.event_name == 'workflow_call' || steps.changes.outputs.ui_e2e == 'true') && env.ACT == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Enable Corepack
        if: github.event_name == 'workflow_call' || steps.changes.outputs.ui_e2e == 'true'
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        if: github.event_name == 'workflow_call' || steps.changes.outputs.ui_e2e == 'true'
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile

      - name: Install Playwright browsers
        if: github.event_name == 'workflow_call' || steps.changes.outputs.ui_e2e == 'true'
        run: npx playwright install --with-deps chromium

      - name: Install sqlite3 (if missing)
        if: github.event_name == 'workflow_call' || steps.changes.outputs.ui_e2e == 'true'
        run: |
          if command -v sqlite3 >/dev/null 2>&1; then
            sqlite3 --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y sqlite3
          sqlite3 --version

      - name: Run UI E2E
        if: github.event_name == 'workflow_call' || steps.changes.outputs.ui_e2e == 'true'
        run: yarn -s test:e2e:ui

      - name: Upload UI E2E artifacts (Playwright)
        if: (github.event_name == 'workflow_call' || steps.changes.outputs.ui_e2e == 'true') && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-e2e-playwright-artifacts
          path: |
            packages/tests/.project/logs/e2e/ui-playwright
            .project/logs/e2e/*ui-e2e*
          if-no-files-found: ignore

  ui-e2e-wsrepl-lima:
    if: ${{ github.event_name == 'workflow_call' && inputs.run_wsrepl_lima }}
    name: UI E2E (WSREPL Lima matrix)
    runs-on:
      - self-hosted
      - macOS
      - wsrepl-lima
    timeout-minutes: 90
    env:
      HAPPIER_UI_VENDOR_WEB_ASSETS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify Lima host prerequisites
        run: |
          limactl --version
          sw_vers

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run WSREPL Lima matrix
        run: yarn -s test:e2e:ui:wsrepl:lima

      - name: Upload WSREPL Lima artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-e2e-wsrepl-lima-artifacts
          path: |
            apps/stack/output/wsrepl-lima-matrix
            .project/logs/e2e/*ui-e2e*
          if-no-files-found: ignore

  mobile-e2e-android:
    # Native E2E is intentionally opt-in for now (not a PR check).
    if: ${{ github.event_name == 'workflow_call' && inputs.run_mobile_e2e_android }}
    name: Mobile E2E (Maestro) (android) (opt-in)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          # Keep this lane mobile-focused (avoid downloading heavy web-only assets).
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,tests"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile

      - name: Install Maestro
        run: |
          bash scripts/ci/install_maestro.sh

      - name: Run Mobile E2E (android)
        run: yarn -s test:e2e:mobile

      - name: Upload Mobile E2E artifacts (Maestro)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-e2e-maestro-android-artifacts
          path: |
            packages/tests/.project/logs/e2e/mobile-maestro
          if-no-files-found: ignore

  mobile-e2e-ios:
    # Native E2E is intentionally opt-in for now (not a PR check).
    if: ${{ github.event_name == 'workflow_call' && inputs.run_mobile_e2e_ios }}
    name: Mobile E2E (Maestro) (ios) (opt-in)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,tests"
          HAPPIER_UI_VENDOR_WEB_ASSETS: "0"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile

      - name: Install Maestro
        run: |
          bash scripts/ci/install_maestro.sh

      - name: Run Mobile E2E (ios)
        run: yarn -s test:e2e:mobile:ios

      - name: Upload Mobile E2E artifacts (Maestro)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-e2e-maestro-ios-artifacts
          path: |
            packages/tests/.project/logs/e2e/mobile-maestro
          if-no-files-found: ignore

  ui:
    if: ${{ (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call') || inputs.run_ui }}
    name: UI Tests (unit + integration)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node (GitHub Actions)
        if: env.ACT != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Node (act)
        if: env.ACT == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile

      - name: Run protocol unit tests
        run: yarn workspace @happier-dev/protocol test

      - name: Run unit tests
        run: yarn workspace @happier-dev/app test:unit

      - name: Run integration tests
        run: yarn workspace @happier-dev/app test:integration

  shared-packages-unit:
    if: ${{ (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call') || inputs.run_ui }}
    name: Shared Package Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node (GitHub Actions)
        if: env.ACT != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Node (act)
        if: env.ACT == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Setup Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Run shared package unit tests
        run: |
          yarn workspace privacy-kit test
          yarn workspace privacy-kit test:runtime:bun
          yarn workspace @happier-dev/voice-modelpacks test
          yarn workspace @happier-dev/peer-mediation test
          yarn workspace @happier-dev/transfers test
          yarn workspace @happier-dev/terminal-native test
          yarn workspace @happier-dev/sherpa-native test
          yarn workspace @happier-dev/agents test
          yarn workspace @happier-dev/cli-common test
          yarn workspace @happier-dev/support test
          yarn workspace @happier-dev/connection-supervisor test
          yarn workspace @happier-dev/bootstrap test
          yarn workspace @happier-dev/plugin-sdk test
          yarn workspace @happier-dev/plugin-ui test
          yarn workspace @happier-dev/plugins-inspector test
          yarn --cwd packages/relay-server test

      - name: Run public plugin SDK consumer contracts
        run: yarn workspace @happier-dev/tests test:plugin-sdk-consumers:all

  server:
    if: ${{ (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call') || inputs.run_server }}
    name: Server Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node (GitHub Actions)
        if: env.ACT != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Node (act)
        if: env.ACT == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Run unit tests
        run: yarn --cwd apps/server test:unit

      - name: Run integration tests
        run: yarn --cwd apps/server test:integration

  server-db-contract:
    if: ${{ (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call') || inputs.run_server_db_contract }}
    name: Server DB Contract (Postgres)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: happier
          POSTGRES_USER: happier
          POSTGRES_PASSWORD: happier
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U happier -d happier"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node (GitHub Actions)
        if: env.ACT != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Node (act)
        if: env.ACT == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Migrate (Postgres)
        env:
          DATABASE_URL: postgresql://happier:happier@127.0.0.1:${{ job.services.postgres.ports[5432] }}/happier?sslmode=disable
        run: yarn --cwd apps/server -s prisma migrate deploy

      - name: Run db contract suite (Postgres)
        env:
          HAPPIER_DB_PROVIDER: postgres
          DATABASE_URL: postgresql://happier:happier@127.0.0.1:${{ job.services.postgres.ports[5432] }}/happier?sslmode=disable
        run: yarn --cwd apps/server test:server:db-contract

  cli:
    if: ${{ (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call') || inputs.run_cli }}
    name: CLI Tests (unit + integration)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      # Some CLI tests fetch/inspect GitHub Release assets. Prefer the built-in
      # GitHub Actions token rather than requiring extra secrets.
      GH_TOKEN: ${{ github.token }}
      HAPPIER_GITHUB_TOKEN: ${{ github.token }}
      HAPPIER_CLI_TMUX_INTEGRATION: "1"
      HAPPIER_CLI_DAEMON_REATTACH_INTEGRATION: "1"
      HAPPIER_NO_BROWSER_OPEN: "1"
      TMPDIR: /tmp
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node (GitHub Actions)
        if: env.ACT != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Node (act)
        if: env.ACT == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_FLAGS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          if [ "${ACT:-}" = "true" ] || [ -d /var/run/act ]; then
            . /etc/os-release || true
            CODENAME="${VERSION_CODENAME:-noble}"
            ARCH="$(dpkg --print-architecture)"
            BASE_URL="http://ports.ubuntu.com/ubuntu-ports"
            if [ "${ARCH}" = "amd64" ]; then BASE_URL="http://archive.ubuntu.com/ubuntu"; fi
            if command -v sudo >/dev/null 2>&1; then
              sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources || true
              echo "deb ${BASE_URL} ${CODENAME} main universe" | sudo tee /etc/apt/sources.list >/dev/null
            else
              rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources || true
              echo "deb ${BASE_URL} ${CODENAME} main universe" > /etc/apt/sources.list
            fi
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get ${APT_FLAGS} update
            sudo apt-get ${APT_FLAGS} install -y --no-install-recommends tmux
          else
            apt-get ${APT_FLAGS} update
            apt-get ${APT_FLAGS} install -y --no-install-recommends tmux
          fi
          tmux -V

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Disable remote logging for CI (avoid hanging test process)
        run: |
          set -euo pipefail
          if [ -f apps/cli/.env.integration-test ]; then
            sed -i 's/^DANGEROUSLY_LOG_TO_SERVER_FOR_AI_AUTO_DEBUGGING=.*/DANGEROUSLY_LOG_TO_SERVER_FOR_AI_AUTO_DEBUGGING=/' apps/cli/.env.integration-test
            sed -i 's/^DEBUG=.*/DEBUG=/' apps/cli/.env.integration-test
          fi

      - name: Run unit tests
        run: yarn workspace @happier-dev/cli test:unit

      - name: Run integration tests
        run: yarn workspace @happier-dev/cli test:integration

