    name: Core E2E (slow, packages/tests, server-light, sqlite)
    runs-on: ${{ needs.trusted_ref_guard.outputs.ubuntu_2204 }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
