  plugin-platform-packed:
    if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' }}
    name: Plugin Platform (packed author)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PACKED_PLUGIN_PLATFORM_OUTPUT_ROOT: ${{ runner.temp }}/plugin-platform-packed
      PACKED_PLUGIN_PLATFORM_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node (GitHub Actions)
        if: env.ACT != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Node (act)
        if: env.ACT == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Build natural packed Plugin Platform artifacts
        run: |
          set -euo pipefail
          artifact_inputs_path="${RUNNER_TEMP}/plugin-platform-packed-artifacts.json"
          yarn -s workspace @happier-dev/tests build:plugin-platform:natural \
            --run-id "$PACKED_PLUGIN_PLATFORM_RUN_ID" \
            --output-root "$PACKED_PLUGIN_PLATFORM_OUTPUT_ROOT" > "$artifact_inputs_path"
          cat "$artifact_inputs_path"
          node --input-type=module - "$artifact_inputs_path" <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const artifactInputs = JSON.parse(readFileSync(process.argv.at(-1), 'utf8'));
          const inputs = [
            ['PACKED_PLUGIN_PLATFORM_SDK_TARBALL', artifactInputs.sdkTarballPath],
            ['PACKED_PLUGIN_PLATFORM_PLUGIN_UI_TARBALL', artifactInputs.pluginUiTarballPath],
            ['PACKED_PLUGIN_PLATFORM_CLI_TARBALL', artifactInputs.cliTarballPath],
          ];
          for (const [name, value] of inputs) {
            if (typeof value !== 'string' || value.length === 0) {
              throw new Error(`Missing packed Plugin Platform artifact input: ${name}`);
            }
          }
          appendFileSync(
            process.env.GITHUB_ENV,
            inputs.map(([name, value]) => `${name}=${value}\n`).join(''),
          );
          NODE

      - name: Run packed Plugin Platform author vertical
        run: |
          set -euo pipefail
          yarn -s workspace @happier-dev/tests test:plugin-platform:packed-author -- \
            --sdk-tarball "$PACKED_PLUGIN_PLATFORM_SDK_TARBALL" \
            --plugin-ui-tarball "$PACKED_PLUGIN_PLATFORM_PLUGIN_UI_TARBALL" \
            --cli-tarball "$PACKED_PLUGIN_PLATFORM_CLI_TARBALL"

      - name: Upload packed Plugin Platform artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-platform-packed-artifacts
          path: .project/logs/e2e
          if-no-files-found: ignore

  trusted_ref_guard:
    name: Trusted workflow ref guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Admit trusted workflow control ref
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_FILE: tests.yml
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/$WORKFLOW_FILE@refs/heads/main") ;;
            *) echo "Untrusted workflow control ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac

  release_actor_guard:
    needs: [trusted_ref_guard]
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.run_providers }}
    name: Release actor guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  providers:
    needs: [release_actor_guard]
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.run_providers }}
    name: Providers (contract matrix)
    runs-on: ubuntu-latest
    environment: providers-ci
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Install provider CLIs
        env:
          PRESET: ${{ inputs.providers_preset }}
          OPENCODE_SPEC: ${{ inputs.providers_opencode }}
        run: |
          set -euo pipefail

          need_claude=0
          need_codex=0
          need_opencode=0

          case "$PRESET" in
            all) need_claude=1; need_codex=1; need_opencode=1 ;;
            claude) need_claude=1 ;;
            codex) need_codex=1 ;;
            opencode) need_opencode=1 ;;
            *) echo "Unknown providers_preset: $PRESET" >&2; exit 2 ;;
          esac

          if [ "$need_claude" = "1" ]; then
            npm install -g @anthropic-ai/claude-code
            claude --version
          fi

          if [ "$need_codex" = "1" ]; then
            npm install -g @openai/codex
            codex --version
          fi

          if [ "$need_opencode" = "1" ]; then
            # Avoid `curl ... | bash` by downloading a pinned, checksummed release artifact.
            opencode_version="${OPENCODE_SPEC%%|*}"
            opencode_sha256=""
            if [ "$opencode_version" != "$OPENCODE_SPEC" ]; then
              opencode_sha256="${OPENCODE_SPEC#*|}"
            fi

            version="${opencode_version#v}"
            asset="opencode-linux-x64-baseline.tar.gz"
            url="https://github.com/anomalyco/opencode/releases/download/v${version}/${asset}"

            install_dir="$HOME/.opencode/bin"
            mkdir -p "$install_dir"

            tmp_dir="$(mktemp -d)"
            curl -fsSL -o "$tmp_dir/$asset" "$url"

            if [ -n "${opencode_sha256:-}" ]; then
              echo "${opencode_sha256}  $tmp_dir/$asset" | sha256sum -c -
            fi

            tar -xzf "$tmp_dir/$asset" -C "$tmp_dir"
            mv -f "$tmp_dir/opencode" "$install_dir/opencode"
            chmod 755 "$install_dir/opencode"
            rm -rf "$tmp_dir"

            echo "$install_dir" >> "$GITHUB_PATH"
            export PATH="$install_dir:$PATH"
            opencode --version
          fi

      - name: Validate provider auth env
        env:
          PRESET: ${{ inputs.providers_preset }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          need_openai=0
          need_anthropic=0

          case "$PRESET" in
            all) need_openai=1; need_anthropic=1 ;;
            codex) need_openai=1 ;;
            opencode) need_openai=1 ;;
            claude) need_anthropic=1 ;;
            *) echo "Unknown providers_preset: $PRESET" >&2; exit 2 ;;
          esac

          if [ "$need_openai" = "1" ] && [ -z "${OPENAI_API_KEY:-}" ] && [ -z "${CODEX_API_KEY:-}" ]; then
            echo "Missing provider secrets: set OPENAI_API_KEY (or CODEX_API_KEY) to run preset=$PRESET" >&2
            exit 1
          fi

          if [ "$need_anthropic" = "1" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Missing provider secrets: set ANTHROPIC_API_KEY to run preset=$PRESET" >&2
            exit 1
          fi

      - name: Run provider contract suite
        env:
          CI: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAPPIER_E2E_PROVIDER_MODEL: ${{ fromJSON(inputs.providers_models).default }}
          HAPPY_E2E_PROVIDER_MODEL: ${{ fromJSON(inputs.providers_models).default }}
          HAPPIER_E2E_PROVIDER_MODELS: ${{ fromJSON(inputs.providers_models).overrides }}
          HAPPY_E2E_PROVIDER_MODELS: ${{ fromJSON(inputs.providers_models).overrides }}
        run: |
          set -euo pipefail

          flags=()
          if [ "${{ fromJSON(inputs.providers_flags).strict_keys }}" = "true" ]; then flags+=("--strict-keys"); fi
          if [ "${{ fromJSON(inputs.providers_flags).flake_retry }}" != "true" ]; then flags+=("--no-flake-retry"); fi
          if [ "${{ fromJSON(inputs.providers_flags).update_baselines }}" = "true" ]; then flags+=("--update-baselines"); fi

          yarn workspace @happier-dev/tests providers:run "${{ inputs.providers_preset }}" "${{ inputs.providers_tier }}" "${flags[@]}"

      - name: Upload provider artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: providers-artifacts
          path: .project/logs/e2e

  stress:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.run_stress }}
    name: Stress (repeat/chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Validate stress config
        env:
          STRESS_TARGET_MODE: ${{ fromJSON(inputs.stress_config).target_mode }}
          STRESS_BASE_URL: ${{ fromJSON(inputs.stress_config).base_url }}
        run: |
          set -euo pipefail
          if [ "${STRESS_TARGET_MODE}" = "external" ] && [ -z "${STRESS_BASE_URL}" ]; then
            echo "stress_config.base_url is required when target_mode=external" >&2
            exit 1
          fi

      - name: Run stress suite
        env:
          CI: "1"
          HAPPIER_STRESS_TARGET_MODE: ${{ fromJSON(inputs.stress_config).target_mode }}
          HAPPIER_STRESS_BASE_URL: ${{ fromJSON(inputs.stress_config).base_url }}
          HAPPIER_STRESS_REPEAT: ${{ fromJSON(inputs.stress_config).repeat }}
          HAPPIER_STRESS_SEED: ${{ fromJSON(inputs.stress_config).seed }}
          HAPPIER_STRESS_FLAKE_RETRY: ${{ fromJSON(inputs.stress_config).flake_retry }}
          HAPPIER_STRESS_USERS: ${{ fromJSON(inputs.stress_config).users }}
          HAPPIER_STRESS_MACHINES_PER_USER: ${{ fromJSON(inputs.stress_config).machines_per_user }}
          HAPPIER_STRESS_SESSIONS_PER_USER: ${{ fromJSON(inputs.stress_config).sessions_per_user }}
          HAPPIER_STRESS_RPC_LISTENERS_PER_USER: ${{ fromJSON(inputs.stress_config).rpc_listeners_per_user }}
          HAPPIER_STRESS_RPC_CALLS_PER_SECOND: ${{ fromJSON(inputs.stress_config).rpc_calls_per_second }}
          HAPPIER_STRESS_MESSAGES_PER_SECOND: ${{ fromJSON(inputs.stress_config).messages_per_second }}
          HAPPIER_STRESS_RECONNECT_RATE: ${{ fromJSON(inputs.stress_config).reconnect_rate }}
          HAPPIER_STRESS_DURATION_MS: ${{ fromJSON(inputs.stress_config).duration_ms }}
          HAPPIER_STRESS_WARMUP_MS: ${{ fromJSON(inputs.stress_config).warmup_ms }}
          HAPPIER_STRESS_COOLDOWN_MS: ${{ fromJSON(inputs.stress_config).cooldown_ms }}
          HAPPIER_STRESS_SOAK_MS: ${{ fromJSON(inputs.stress_config).soak_ms }}
          HAPPIER_STRESS_COMPOSE_API_REPLICAS: ${{ fromJSON(inputs.stress_config).api_replicas }}
          HAPPIER_STRESS_COMPOSE_WORKER_REPLICAS: ${{ fromJSON(inputs.stress_config).worker_replicas }}
          HAPPIER_STRESS_EXPECTED_API_REPLICAS: ${{ fromJSON(inputs.stress_config).api_replicas }}
          HAPPIER_STRESS_EXPECTED_WORKER_REPLICAS: ${{ fromJSON(inputs.stress_config).worker_replicas }}
          HAPPIER_STRESS_ROLLING_RESTART_ENABLED: ${{ fromJSON(inputs.stress_config).rolling_restart }}
          HAPPIER_STRESS_KILL_TARGET: ${{ fromJSON(inputs.stress_config).kill_target }}
          HAPPIER_STRESS_COMPOSE_METRICS_ENABLED: ${{ fromJSON(inputs.stress_config).compose_metrics_enabled }}
          HAPPIER_STRESS_METRICS_SCRAPE_ENABLED: ${{ fromJSON(inputs.stress_config).metrics_scrape_enabled }}
          HAPPIER_STRESS_KEEP_TOPOLOGY_ON_FAILURE: ${{ fromJSON(inputs.stress_config).keep_topology_on_failure }}
          HAPPIER_STRESS_SOCKET_TRANSPORT: ${{ fromJSON(inputs.stress_config).socket_transport }}
          HAPPIER_E2E_SAVE_ARTIFACTS: ${{ fromJSON(inputs.stress_config).save_artifacts_on_success }}
        run: yarn test:stress

      - name: Upload stress artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stress-artifacts
          path: .project/logs/e2e
          if-no-files-found: ignore
