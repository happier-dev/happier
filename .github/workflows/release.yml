  release_verify:
    name: Verify promoted release references
    needs: [resolve_resume, plan, deploy_plan, prepare_release_candidate, verify_release_candidates, promote_cli_binaries, promote_hstack_binaries, promote_server_runtime, promote_ui_web, deploy_server]
    if: >-
      always() &&
      inputs.dry_run != true &&
      needs.plan.result == 'success' &&
      (needs.deploy_plan.result == 'success' || needs.deploy_plan.result == 'skipped') &&
      needs.verify_release_candidates.result == 'success' &&
      (needs.promote_cli_binaries.result == 'success' || (needs.plan.outputs.publish_cli_binaries_needed != 'true' && needs.promote_cli_binaries.result == 'skipped')) &&
      (needs.promote_hstack_binaries.result == 'success' || (needs.plan.outputs.publish_stack != 'true' && needs.promote_hstack_binaries.result == 'skipped')) &&
      (needs.promote_server_runtime.result == 'success' || (needs.plan.outputs.publish_server_runtime_needed != 'true' && needs.promote_server_runtime.result == 'skipped')) &&
      (needs.promote_ui_web.result == 'success' || (needs.plan.outputs.publish_ui_web_needed != 'true' && needs.promote_ui_web.result == 'skipped')) &&
      (needs.deploy_server.result == 'success' || needs.resolve_resume.outputs.deploy_server_complete == 'true' || (needs.deploy_plan.outputs.deploy_server_requested != 'true' && needs.deploy_server.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Verify rolling references bind the candidate SHA
        env:
          EXPECTED_SHA: ${{ needs.prepare_release_candidate.outputs.source_sha }}
          CHANNEL_SUFFIX: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
          CLI_PROMOTED: ${{ needs.promote_cli_binaries.result == 'success' }}
          HSTACK_PROMOTED: ${{ needs.promote_hstack_binaries.result == 'success' }}
          SERVER_PROMOTED: ${{ needs.promote_server_runtime.result == 'success' }}
          UI_WEB_PROMOTED: ${{ needs.promote_ui_web.result == 'success' }}
        run: |
          set -euo pipefail
          for tag in server-$CHANNEL_SUFFIX stack-$CHANNEL_SUFFIX cli-$CHANNEL_SUFFIX ui-web-$CHANNEL_SUFFIX; do
            case "$tag" in
              server-*) promoted="$SERVER_PROMOTED" ;;
              stack-*) promoted="$HSTACK_PROMOTED" ;;
              cli-*) promoted="$CLI_PROMOTED" ;;
              ui-web-*) promoted="$UI_WEB_PROMOTED" ;;
            esac
            if [ "$promoted" != "true" ]; then continue; fi
            node scripts/pipeline/github/resolve-authorized-release-source.mjs \
              --source-ref "refs/tags/$tag" \
              --authorized-sha "$EXPECTED_SHA" \
              --remote origin
          done
      - name: Verify loaded server API revision
        if: >-
          (needs.deploy_server.result == 'success' || needs.resolve_resume.outputs.deploy_server_complete == 'true') &&
          ((inputs.environment == 'production' && vars.HAPPIER_SERVER_API_PRODUCTION_VERSION_URL != '') ||
          (inputs.environment != 'production' && vars.HAPPIER_SERVER_API_PREVIEW_VERSION_URL != ''))
        env:
          SERVER_API_VERSION_URL: ${{ inputs.environment == 'production' && vars.HAPPIER_SERVER_API_PRODUCTION_VERSION_URL || vars.HAPPIER_SERVER_API_PREVIEW_VERSION_URL }}
          CANDIDATE_SOURCE_SHA: ${{ needs.prepare_release_candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$SERVER_API_VERSION_URL"
          node scripts/pipeline/release/verify-loaded-release-revision.mjs \
            --url "$SERVER_API_VERSION_URL" \
            --expected-source-sha "$CANDIDATE_SOURCE_SHA"

      - name: Record unavailable server runtime observation
        if: >-
          (needs.deploy_server.result == 'success' || needs.resolve_resume.outputs.deploy_server_complete == 'true') &&
          ((inputs.environment == 'production' && vars.HAPPIER_SERVER_API_PRODUCTION_VERSION_URL == '') ||
          (inputs.environment != 'production' && vars.HAPPIER_SERVER_API_PREVIEW_VERSION_URL == ''))
        run: |
          echo 'The server deployment was accepted, but this environment has no canonical API version URL configured; loaded-runtime identity remains unobserved.' >> "$GITHUB_STEP_SUMMARY"

  advance_release_issues:
    name: Advance issues to the released channel
    if: ${{ needs.release_verify.result == 'success' && needs.snapshot_release_issues.outputs.eligible == 'true' }}
    needs: [snapshot_release_issues, release_verify]
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Reconcile the snapshotted issues
        env:
          DEV_ISSUES_JSON: ${{ needs.snapshot_release_issues.outputs.dev_issues_json }}
          GITHUB_TOKEN: ${{ github.token }}
          INCLUDE_PREVIEW_STAGE: ${{ inputs.environment == 'production' && (inputs.confirm == 'release preview to main' || inputs.confirm == 'reset main from preview') }}
          PREVIEW_ISSUES_JSON: ${{ needs.snapshot_release_issues.outputs.preview_issues_json }}
          SOURCE_ISSUES_JSON: ${{ needs.snapshot_release_issues.outputs.source_issues_json }}
          TO_STAGE: ${{ inputs.environment == 'production' && 'stage:stable' || 'stage:preview' }}
        run: |
          set -euo pipefail
          node scripts/pipeline/github/reconcile-issue-stage.mjs advance \
            --repo "$GITHUB_REPOSITORY" \
            --issues-json "$SOURCE_ISSUES_JSON" \
            --from-stage "stage:source" \
            --to-stage "$TO_STAGE"
          node scripts/pipeline/github/reconcile-issue-stage.mjs advance \
            --repo "$GITHUB_REPOSITORY" \
            --issues-json "$DEV_ISSUES_JSON" \
            --from-stage "stage:dev" \
            --to-stage "$TO_STAGE"
          if [ "$INCLUDE_PREVIEW_STAGE" = "true" ]; then
            node scripts/pipeline/github/reconcile-issue-stage.mjs advance \
              --repo "$GITHUB_REPOSITORY" \
              --issues-json "$PREVIEW_ISSUES_JSON" \
              --from-stage "stage:preview" \
              --to-stage "$TO_STAGE"
          fi

  release_status:
    name: Project terminal release status
    if: ${{ always() && inputs.dry_run != true }}
    needs: [resolve_resume, plan, deploy_plan, prepare_release_candidate, publish_cli_binaries, publish_hstack_binaries, publish_server_runtime, publish_ui_web, verify_release_candidates, verify_resume_candidates, promote_cli_binaries, promote_hstack_binaries, promote_server_runtime, promote_ui_web, deploy_ui, deploy_server, deploy_website, deploy_docs, publish_docker, publish_npm, release_verify, advance_release_issues, sync_dev]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Project release status facts
        env:
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_RUN_NAME: ${{ inputs.hmaint_operation_id != '' && format('RELEASE — Publish ({0}, {1})', inputs.hmaint_operation_id, inputs.hmaint_attempt_id) || 'RELEASE — Publish (manual)' }}
          HMAINT_OPERATION_ID: ${{ inputs.hmaint_operation_id }}
          RELEASE_CHANNEL: ${{ inputs.environment }}
          SOURCE_SHA: ${{ needs.prepare_release_candidate.outputs.source_sha || inputs.authorized_promotion_source_sha }}
          REQUEST_CLI: ${{ needs.resolve_resume.outputs.cli_requested == 'true' || needs.plan.outputs.publish_cli_binaries_needed == 'true' }}
          REQUEST_STACK: ${{ needs.resolve_resume.outputs.stack_requested == 'true' || needs.plan.outputs.publish_stack == 'true' }}
          REQUEST_SERVER: ${{ needs.resolve_resume.outputs.server_requested == 'true' || needs.plan.outputs.publish_server_runtime_needed == 'true' }}
          REQUEST_UI_WEB: ${{ needs.resolve_resume.outputs.ui_web_requested == 'true' || needs.plan.outputs.publish_ui_web_needed == 'true' }}
          CLI_CANDIDATE_RESULT: ${{ needs.publish_cli_binaries.result }}
          STACK_CANDIDATE_RESULT: ${{ needs.publish_hstack_binaries.result }}
          SERVER_CANDIDATE_RESULT: ${{ needs.publish_server_runtime.result }}
          UI_WEB_CANDIDATE_RESULT: ${{ needs.publish_ui_web.result }}
          CLI_VERSION: ${{ needs.publish_cli_binaries.outputs.version }}
          STACK_VERSION: ${{ needs.publish_hstack_binaries.outputs.version }}
          SERVER_VERSION: ${{ needs.publish_server_runtime.outputs.version }}
          UI_WEB_VERSION: ${{ needs.publish_ui_web.outputs.version }}
          CLI_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.cli_verified }}
          HSTACK_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.stack_verified }}
          SERVER_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.server_verified }}
          UI_WEB_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.ui_web_verified }}
          REQUEST_DEPLOY_UI: ${{ needs.resolve_resume.outputs.deploy_ui_requested == 'true' || needs.deploy_plan.outputs.deploy_ui_requested == 'true' }}
          REQUEST_DEPLOY_SERVER: ${{ needs.resolve_resume.outputs.deploy_server_requested == 'true' || needs.deploy_plan.outputs.deploy_server_requested == 'true' }}
          REQUEST_DEPLOY_WEBSITE: ${{ needs.resolve_resume.outputs.deploy_website_requested == 'true' || needs.deploy_plan.outputs.deploy_website_requested == 'true' }}
          REQUEST_DEPLOY_DOCS: ${{ needs.resolve_resume.outputs.deploy_docs_requested == 'true' || needs.deploy_plan.outputs.deploy_docs_requested == 'true' }}
          REQUEST_DOCKER: ${{ needs.resolve_resume.outputs.docker_requested == 'true' || needs.plan.outputs.publish_docker_needed == 'true' }}
          REQUEST_NPM: ${{ needs.resolve_resume.outputs.npm_requested == 'true' || needs.plan.outputs.publish_npm_needed == 'true' }}
          DEPLOY_UI_WEB: ${{ needs.resolve_resume.outputs.deploy_ui_web_requested == 'true' || needs.deploy_plan.outputs.deploy_ui_web == 'true' }}
          DEPLOY_UI_EXPO_ACTION: ${{ needs.deploy_plan.outputs.deploy_ui_expo_action || needs.resolve_resume.outputs.deploy_ui_expo_action || 'none' }}
          DEPLOY_UI_DESKTOP_MODE: ${{ needs.deploy_plan.outputs.deploy_ui_desktop_mode || needs.resolve_resume.outputs.deploy_ui_desktop_mode || 'none' }}
          NPM_PUBLISH_CLI: ${{ needs.resolve_resume.outputs.npm_publish_cli_requested == 'true' || needs.plan.outputs.npm_publish_cli_needed == 'true' }}
          NPM_PUBLISH_STACK: ${{ needs.resolve_resume.outputs.npm_publish_stack_requested == 'true' || needs.plan.outputs.npm_publish_stack_needed == 'true' }}
          NPM_PUBLISH_SERVER: ${{ needs.resolve_resume.outputs.npm_publish_server_requested == 'true' || needs.plan.outputs.npm_publish_server_needed == 'true' }}
          DEPLOY_UI_RESUME_COMPLETE: ${{ needs.resolve_resume.outputs.deploy_ui_complete }}
          DEPLOY_SERVER_RESUME_COMPLETE: ${{ needs.resolve_resume.outputs.deploy_server_complete }}
          DEPLOY_WEBSITE_RESUME_COMPLETE: ${{ needs.resolve_resume.outputs.deploy_website_complete }}
          DEPLOY_DOCS_RESUME_COMPLETE: ${{ needs.resolve_resume.outputs.deploy_docs_complete }}
          DOCKER_RESUME_COMPLETE: ${{ needs.resolve_resume.outputs.docker_complete }}
          NPM_RESUME_COMPLETE: ${{ needs.resolve_resume.outputs.npm_complete }}
          CANDIDATE_RESULT: ${{ needs.prepare_release_candidate.result }}
          IMMUTABLE_VERIFICATION_RESULT: ${{ needs.verify_release_candidates.result }}
          CLI_RESULT: ${{ needs.promote_cli_binaries.result }}
          STACK_RESULT: ${{ needs.promote_hstack_binaries.result }}
          SERVER_RESULT: ${{ needs.promote_server_runtime.result }}
          UI_WEB_RESULT: ${{ needs.promote_ui_web.result }}
          DEPLOY_UI_RESULT: ${{ needs.deploy_ui.result }}
          DEPLOY_SERVER_RESULT: ${{ needs.deploy_server.result }}
          DEPLOY_WEBSITE_RESULT: ${{ needs.deploy_website.result }}
          DEPLOY_DOCS_RESULT: ${{ needs.deploy_docs.result }}
          DOCKER_RESULT: ${{ needs.publish_docker.result }}
          NPM_RESULT: ${{ needs.publish_npm.result }}
          RELEASE_VERIFY_RESULT: ${{ needs.release_verify.result }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.release-control/scripts/pipeline/release/project-release-status.mjs" \
            --mode standard \
            --out "$RUNNER_TEMP/release-status.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload release status artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: happier-release-status
          path: ${{ runner.temp }}/release-status.json
          if-no-files-found: error
          overwrite: true
      - name: Admit complete release status
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const status = JSON.parse(await readFile(process.env.STATUS_PATH, "utf8"));
            if (status.terminal !== "complete" && status.terminal !== "published") {
              throw new Error(`Release status is not complete: ${String(status.terminal)}`);
            }
          '
        env:
          STATUS_PATH: ${{ runner.temp }}/release-status.json
  sync_dev:
    if: ${{ inputs.dry_run != true && inputs.environment == 'production' && (vars.RELEASE_SYNC_DEV_FROM_MAIN == '' || vars.RELEASE_SYNC_DEV_FROM_MAIN == 'true') && needs.release_verify.result == 'success' }}
    needs: [plan, promote_main, prepare_release_candidate, release_verify]
    uses: ./.github/workflows/promote-branch.yml
    secrets: inherit
    with:
      source: main
      source_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      target: dev
      mode: fast_forward
      dry_run: false
      allow_reset: false
      confirm: promote dev from main
