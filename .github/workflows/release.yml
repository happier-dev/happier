      retry_version: ${{ needs.publish_ui_web.outputs.version }}

  promote_cli_binaries:
    if: ${{ always() && needs.verify_release_candidates.result == 'success' && needs.publish_cli_binaries.result == 'success' && needs.publish_cli_binaries.outputs.version != '' && (needs.promote_ui_web.result == 'success' || needs.promote_ui_web.result == 'skipped') }}
    needs: [prepare_release_candidate, verify_release_candidates, publish_cli_binaries, promote_ui_web]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-cli-binaries.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}
      retry_version: ${{ needs.publish_cli_binaries.outputs.version }}

  promote_hstack_binaries:
    if: ${{ always() && needs.verify_release_candidates.result == 'success' && needs.publish_hstack_binaries.result == 'success' && needs.publish_hstack_binaries.outputs.version != '' && (needs.promote_cli_binaries.result == 'success' || needs.promote_cli_binaries.result == 'skipped') }}
    needs: [prepare_release_candidate, verify_release_candidates, publish_hstack_binaries, promote_cli_binaries]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-hstack-binaries.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
