      candidate_server_version: ${{ needs.publish_server_runtime.outputs.version }}
      candidate_ui_web_version: ${{ needs.publish_ui_web.outputs.version }}
      verify_cli_release: ${{ needs.publish_cli_binaries.result == 'success' && needs.resolve_resume.outputs.cli_version == '' }}
      verify_stack_release: ${{ needs.publish_hstack_binaries.result == 'success' && needs.resolve_resume.outputs.stack_version == '' }}
      verify_server_release: ${{ needs.publish_server_runtime.result == 'success' && needs.resolve_resume.outputs.server_version == '' }}
      verify_ui_web_release: ${{ needs.publish_ui_web.result == 'success' && needs.resolve_resume.outputs.ui_web_version == '' }}
      validation_profile: ${{ needs.plan.outputs.validation_profile }}
      risk_cli_upgrade: ${{ needs.plan.outputs.risk_cli_upgrade == 'true' }}
      risk_session_continuity: ${{ needs.plan.outputs.risk_session_continuity == 'true' }}
