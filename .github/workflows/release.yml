name: RELEASE — Publish (preview + production)
run-name: ${{ inputs.hmaint_operation_id != '' && format('RELEASE — Publish ({0}, {1})', inputs.hmaint_operation_id, inputs.hmaint_attempt_id) || 'RELEASE — Publish (manual)' }}
on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: Validation — Bounded public release profile
        required: true
        type: choice
        default: auto
        options:
          - auto
          - integrated
          - stable
      ci_run_id:
        description: Completed canonical push CI run ID for this exact source (optional; avoids waiting on a hosted runner)
        required: false
        default: ""
        type: string
      waive_ci:
        description: Maintainer override — accept this exact candidate without existing CI evidence
        required: false
        default: false
        type: boolean
      approve_public_sdk_release:
        description: Maintainer approval after reviewing this source's public API comparison, selected versions, and migration decision
        required: false
        default: false
        type: boolean
      public_sdk_release_approval:
        description: 'Public SDK detail JSON — {"pluginSdk": {"ready", "apiClassification", "migrationNotes"}, "sdk": {"authReadiness", "authWaiver", "apiClassification", "migrationNotes"}}'
        required: false
        default: "{}"
        type: string
      include_validation_suites:
        description: Maintainer refinement — comma-separated additional validation suite IDs
        required: false
        default: ""
        type: string
      waive_validation_suites:
        description: Maintainer override — comma-separated heavy validation suite IDs to mark WAIVED
        required: false
        default: ""
        type: string
      override_reason:
        description: Maintainer override — required bounded reason when evidence is waived
        required: false
        default: ""
        type: string
      dry_run:
        description: Safety — Run checks and show plan, but do not push/deploy
        required: true
        default: false
        type: boolean
      environment:
        description: Deploy — Target environment (deploy/<env>/*)
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
          - preview-and-production
      deploy_targets:
        description: "Deploy — Comma-separated targets: ui,server,website,docs,cli,stack,server_runner"
        required: true
        default: ui,server,website,docs
        type: string
      force_deploy:
        description: Deploy — Force promote + deploy for enabled targets even if no relevant changes are detected (useful after infra failures)
        required: true
        default: false
        type: boolean
      ui_expo_action:
        description: Deploy — UI Expo action (full includes OTA + native submit + APK)
        required: true
        default: none
        type: choice
        options:
          - none
          - ota
          - native
          - native_submit
          - full
      desktop_mode:
        description: Deploy — Desktop artifacts mode
        required: true
        type: choice
        default: none
        options:
          - none
          - build_only
          - build_and_publish
      qualified_v4_activation_approval:
        description: "Irreversible server migrations — explicit approval only: attests backup/restore readiness, all old API and worker writers are stopped, including legacy read-state writers, and remain stopped if migration fails, with no old-server or old-daemon rollback."
        required: false
        default: false
        type: boolean
      confirm:
        description: Confirm — Choose the exact branch-promotion action.
        required: true
        type: choice
        options:
          - release dev to preview
          - release preview to main
          - reset main from preview
          - release dev to main
          - reset main from dev
          - release dev to preview and main
      candidate_run_id:
        description: Preview CLI candidate — exact prior workflow run ID (requires candidate_version and candidate_source_sha)
        required: false
        default: ""
        type: string
      candidate_version:
        description: Preview CLI candidate — exact embedded CLI version
        required: false
        default: ""
        type: string
      candidate_source_sha:
        description: Preview CLI candidate — exact 40-character source SHA
        required: false
        default: ""
        type: string
      authorized_promotion_source_sha:
        description: Safety — exact source branch SHA approved for promotion
        required: false
        default: ""
        type: string
      workflow_control_sha:
        description: Safety — dispatcher-observed dev SHA; leave empty only for emergency direct manual dispatch
        required: false
        default: ""
        type: string
      hmaint_operation_id:
        description: Safety — conductor operation ID; leave empty only for emergency direct manual dispatch
        required: false
        default: ""
        type: string
      hmaint_attempt_id:
        description: Safety — conductor execution attempt identity
        required: false
        default: attempt_1
        type: string
      release_notes_id:
        description: Release notes — Exact approved project release ID
        required: true
        type: string
      resume_run_id:
        description: Resume — prior full-release run ID whose verified immutable candidates may be reused
        required: false
        default: ""
        type: string
permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  packages: write
  pull-requests: read
concurrency:
  group: release-unified-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  trusted_ref_guard:
    name: Admit trusted release workflow ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject cross-repository or untrusted release control
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/main") ;;
            *) echo "Untrusted release workflow ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac
      - name: Verify workflow-control SHA
        env:
          WORKFLOW_CONTROL_SHA: ${{ inputs.workflow_control_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_CONTROL_SHA" ]; then
            exit 0
          fi
          if ! [[ "$WORKFLOW_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow_control_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          if [ "$WORKFLOW_SHA" != "$WORKFLOW_CONTROL_SHA" ]; then
            echo "Workflow-control SHA drift: loaded '$WORKFLOW_SHA', expected '$WORKFLOW_CONTROL_SHA'." >&2
            exit 1
          fi
      - name: Bind combined release to one explicit approved dev candidate
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
          SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = preview-and-production ]; then
            test "$CONFIRM" = "release dev to preview and main"
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test -z "$CANDIDATE_RUN_ID"
          fi
  release_actor_guard:
    name: Release actor guard
    needs:
      - trusted_ref_guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
  resolve_validation_profile:
    name: Resolve bounded release validation profile
    needs:
      - release_actor_guard
    if: ${{ needs.release_actor_guard.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
      checks_profile: ${{ steps.resolve.outputs.checks_profile }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Resolve public profile
        id: resolve
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile == 'auto' && (inputs.environment == 'preview-and-production' && 'stable' || 'integrated') || inputs.validation_profile }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release-validation/resolve-profile.mjs "$VALIDATION_PROFILE"
  release_preflight:
    name: Validate release request
    needs:
      - resolve_validation_profile
    if: ${{ needs.resolve_validation_profile.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_ref: ${{ steps.dispatch.outputs.source_ref }}
      base_ref: ${{ steps.dispatch.outputs.base_ref }}
      compare_label: ${{ steps.dispatch.outputs.compare_label }}
      plugin_sdk_ready: ${{ steps.dispatch.outputs.plugin_sdk_ready }}
      plugin_sdk_api_classification: ${{ steps.dispatch.outputs.plugin_sdk_api_classification }}
      plugin_sdk_migration_notes: ${{ steps.dispatch.outputs.plugin_sdk_migration_notes }}
      sdk_auth_readiness: ${{ steps.dispatch.outputs.sdk_auth_readiness }}
      sdk_auth_waiver: ${{ steps.dispatch.outputs.sdk_auth_waiver }}
      sdk_api_classification: ${{ steps.dispatch.outputs.sdk_api_classification }}
      sdk_migration_notes: ${{ steps.dispatch.outputs.sdk_migration_notes }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Validate release dispatch
        id: dispatch
        env:
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          HMAINT_OPERATION_ID: ${{ inputs.hmaint_operation_id }}
          HMAINT_ATTEMPT_ID: ${{ inputs.hmaint_attempt_id }}
          RELEASE_NOTES_ID: ${{ inputs.release_notes_id }}
          BUMP: none
          CONFIRM: ${{ inputs.environment == 'preview-and-production' && 'release dev to preview' || inputs.confirm }}
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          ENVIRONMENT: ${{ inputs.environment == 'preview-and-production' && 'preview' || inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          WAIVE_CI: ${{ inputs.waive_ci }}
          PUBLIC_SDK_RELEASE_APPROVAL: ${{ inputs.public_sdk_release_approval }}
          INCLUDE_VALIDATION_SUITES: ${{ inputs.include_validation_suites }}
          WAIVE_VALIDATION_SUITES: ${{ inputs.waive_validation_suites }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/validate-release-dispatch.mjs
      - name: Record explicit maintainer overrides
        if: ${{ inputs.waive_ci == true || inputs.waive_validation_suites != '' }}
        env:
          WAIVE_CI: ${{ inputs.waive_ci }}
          WAIVE_VALIDATION_SUITES: ${{ inputs.waive_validation_suites }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          {
            echo '### Maintainer release overrides'
            if [ "$WAIVE_CI" = "true" ]; then echo '- Exact-SHA CI evidence: **WAIVED**'; fi
            if [ -n "$WAIVE_VALIDATION_SUITES" ]; then echo "- Validation suites: **WAIVED** ($WAIVE_VALIDATION_SUITES)"; fi
            echo "- Reason: $OVERRIDE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve the exact source consumed by shared validation
        id: source
        env:
          SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          SOURCE_REF: ${{ steps.dispatch.outputs.source_ref }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_SHA" ]; then
            git fetch origin "$SOURCE_REF"
            SOURCE_SHA="$(git rev-parse FETCH_HEAD)"
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  snapshot_release_issues:
    name: Snapshot source issues before either channel advances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      eligible: ${{ steps.snapshot.outputs.eligible }}
      source_issues_json: ${{ steps.snapshot.outputs.source_issues_json }}
      dev_issues_json: ${{ steps.snapshot.outputs.dev_issues_json }}
      preview_issues_json: ${{ steps.snapshot.outputs.preview_issues_json }}
    steps:
      - name: Checkout trusted combined-release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Snapshot issues eligible for the exact dev candidate
        id: snapshot
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.release_preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            {
              echo 'eligible=false'
              echo 'source_issues_json=[]'
              echo 'dev_issues_json=[]'
              echo 'preview_issues_json=[]'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_issues_json="$(node scripts/pipeline/github/reconcile-issue-stage.mjs snapshot --repo "$GITHUB_REPOSITORY" --from-stage 'stage:source' --candidate-sha "$CANDIDATE_SHA")"
          dev_issues_json="$(node scripts/pipeline/github/reconcile-issue-stage.mjs snapshot --repo "$GITHUB_REPOSITORY" --from-stage 'stage:dev' --candidate-sha "$CANDIDATE_SHA")"
          preview_issues_json="$(node scripts/pipeline/github/reconcile-issue-stage.mjs snapshot --repo "$GITHUB_REPOSITORY" --from-stage 'stage:preview' --candidate-sha "$CANDIDATE_SHA")"
          {
            echo "source_issues_json=$source_issues_json"
            echo "dev_issues_json=$dev_issues_json"
            echo "preview_issues_json=$preview_issues_json"
            echo 'eligible=true'
          } >> "$GITHUB_OUTPUT"
    needs:
      - release_preflight
    if: ${{ inputs.environment == 'preview-and-production' }}
    continue-on-error: true
  source_validation:
    name: Validate shared exact source once
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-source-validation.yml
    with:
      source_sha: ${{ needs.release_preflight.outputs.source_sha }}
      source_branch: ${{ needs.release_preflight.outputs.source_ref }}
      base_refs: ${{ inputs.environment == 'preview-and-production' && 'preview,main' || inputs.environment == 'preview' && 'preview' || 'main' }}
      dry_run: ${{ inputs.dry_run }}
      waive_ci: ${{ inputs.waive_ci }}
      deploy_targets: ${{ inputs.deploy_targets }}
      force_deploy: ${{ inputs.force_deploy }}
      resume_cli_requested: ${{ inputs.resume_run_id != '' }}
      resume_stack_requested: ${{ inputs.resume_run_id != '' }}
      resume_server_requested: ${{ inputs.resume_run_id != '' }}
      ci_run_id: ${{ inputs.ci_run_id }}
      candidate_cli_requested: ${{ inputs.candidate_run_id != '' }}
      resume_runner_requested: ${{ inputs.resume_run_id != '' }}
    needs:
      - release_preflight
  release_single:
    name: Release single channel
    needs:
      - snapshot_release_issues
      - source_validation
      - resolve_validation_profile
    permissions:
      attestations: write
      artifact-metadata: write
      actions: write
      contents: write
      id-token: write
      issues: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/release-channel.yml
    secrets: inherit
    with:
      validation_profile: ${{ needs.resolve_validation_profile.outputs.profile }}
      waive_ci: ${{ inputs.waive_ci }}
      approve_public_sdk_release: ${{ inputs.approve_public_sdk_release }}
      public_sdk_release_approval: ${{ inputs.public_sdk_release_approval }}
      include_validation_suites: ${{ inputs.include_validation_suites }}
      waive_validation_suites: ${{ inputs.waive_validation_suites }}
      override_reason: ${{ inputs.override_reason }}
      dry_run: ${{ inputs.dry_run }}
      environment: ${{ inputs.environment }}
      deploy_targets: ${{ inputs.deploy_targets }}
      force_deploy: ${{ inputs.force_deploy }}
      ui_expo_action: ${{ inputs.ui_expo_action }}
      desktop_mode: ${{ inputs.desktop_mode }}
      qualified_v4_activation_approval: ${{ inputs.qualified_v4_activation_approval }}
      authorized_promotion_source_sha: ${{ inputs.authorized_promotion_source_sha }}
      workflow_control_sha: ${{ inputs.workflow_control_sha }}
      hmaint_operation_id: ${{ inputs.hmaint_operation_id }}
      hmaint_attempt_id: ${{ inputs.hmaint_attempt_id }}
      release_notes_id: ${{ inputs.release_notes_id }}
      resume_run_id: ${{ inputs.resume_run_id }}
      confirm: ${{ inputs.confirm }}
      combined_preview_production: false
      shared_source_validation_sha: ${{ needs.source_validation.outputs.source_sha }}
      shared_ci_result: ${{ needs.source_validation.outputs.ci_result }}
      shared_mysql_result: ${{ needs.source_validation.outputs.mysql_result }}
      shared_platform_result: ${{ needs.source_validation.outputs.platform_result }}
      shared_trust_roots_result: ${{ needs.source_validation.outputs.trust_roots_result }}
      ci_run_id: ${{ inputs.ci_run_id }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_version: ${{ inputs.candidate_version }}
      candidate_source_sha: ${{ inputs.candidate_source_sha }}
    if: ${{ always() && inputs.environment != 'preview-and-production' && needs.source_validation.result == 'success' && needs.resolve_validation_profile.result == 'success' }}
  release_preview:
    name: Release preview channel
    needs:
      - snapshot_release_issues
      - source_validation
      - resolve_validation_profile
    permissions:
      attestations: write
      artifact-metadata: write
      actions: write
      contents: write
      id-token: write
      issues: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/release-channel.yml
    secrets: inherit
    with:
      validation_profile: ${{ needs.resolve_validation_profile.outputs.profile }}
      waive_ci: ${{ inputs.waive_ci }}
      approve_public_sdk_release: ${{ inputs.approve_public_sdk_release }}
      public_sdk_release_approval: ${{ inputs.public_sdk_release_approval }}
      include_validation_suites: ${{ inputs.include_validation_suites }}
      waive_validation_suites: ${{ inputs.waive_validation_suites }}
      override_reason: ${{ inputs.override_reason }}
      dry_run: ${{ inputs.dry_run }}
      environment: preview
      deploy_targets: ${{ inputs.deploy_targets }}
      force_deploy: ${{ inputs.force_deploy }}
      ui_expo_action: ${{ inputs.ui_expo_action }}
      desktop_mode: ${{ inputs.desktop_mode }}
      qualified_v4_activation_approval: ${{ inputs.qualified_v4_activation_approval }}
      authorized_promotion_source_sha: ${{ inputs.authorized_promotion_source_sha }}
      workflow_control_sha: ${{ inputs.workflow_control_sha }}
      hmaint_operation_id: ${{ inputs.hmaint_operation_id }}
      hmaint_attempt_id: ${{ inputs.hmaint_attempt_id }}
      release_notes_id: ${{ inputs.release_notes_id }}
      resume_run_id: ${{ inputs.resume_run_id }}
      confirm: release dev to preview
      combined_preview_production: true
      shared_source_validation_sha: ${{ needs.source_validation.outputs.source_sha }}
      shared_ci_result: ${{ needs.source_validation.outputs.ci_result }}
      shared_mysql_result: ${{ needs.source_validation.outputs.mysql_result }}
      shared_platform_result: ${{ needs.source_validation.outputs.platform_result }}
      shared_trust_roots_result: ${{ needs.source_validation.outputs.trust_roots_result }}
      ci_run_id: ${{ inputs.ci_run_id }}
      candidate_run_id: ""
      candidate_version: ""
      candidate_source_sha: ""
    if: ${{ always() && inputs.environment == 'preview-and-production' && needs.source_validation.result == 'success' && needs.resolve_validation_profile.result == 'success' }}
  release_production:
    name: Release production channel
    needs:
      - snapshot_release_issues
      - source_validation
      - resolve_validation_profile
    permissions:
      attestations: write
      artifact-metadata: write
      actions: write
      contents: write
      id-token: write
      issues: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/release-channel.yml
    secrets: inherit
    with:
      validation_profile: ${{ needs.resolve_validation_profile.outputs.profile }}
      waive_ci: ${{ inputs.waive_ci }}
      approve_public_sdk_release: ${{ inputs.approve_public_sdk_release }}
      public_sdk_release_approval: ${{ inputs.public_sdk_release_approval }}
      include_validation_suites: ${{ inputs.include_validation_suites }}
      waive_validation_suites: ${{ inputs.waive_validation_suites }}
      override_reason: ${{ inputs.override_reason }}
      dry_run: ${{ inputs.dry_run }}
      environment: production
      deploy_targets: ${{ inputs.deploy_targets }}
      force_deploy: ${{ inputs.force_deploy }}
      ui_expo_action: ${{ inputs.ui_expo_action }}
      desktop_mode: ${{ inputs.desktop_mode }}
      qualified_v4_activation_approval: ${{ inputs.qualified_v4_activation_approval }}
      authorized_promotion_source_sha: ${{ inputs.authorized_promotion_source_sha }}
      workflow_control_sha: ${{ inputs.workflow_control_sha }}
      hmaint_operation_id: ${{ inputs.hmaint_operation_id }}
      hmaint_attempt_id: ${{ inputs.hmaint_attempt_id }}
      release_notes_id: ${{ inputs.release_notes_id }}
      resume_run_id: ${{ inputs.resume_run_id }}
      confirm: release dev to main
      combined_preview_production: true
      shared_source_validation_sha: ${{ needs.source_validation.outputs.source_sha }}
      shared_ci_result: ${{ needs.source_validation.outputs.ci_result }}
      shared_mysql_result: ${{ needs.source_validation.outputs.mysql_result }}
      shared_platform_result: ${{ needs.source_validation.outputs.platform_result }}
      shared_trust_roots_result: ${{ needs.source_validation.outputs.trust_roots_result }}
      ci_run_id: ${{ inputs.ci_run_id }}
      candidate_run_id: ""
      candidate_version: ""
      candidate_source_sha: ""
    if: ${{ always() && inputs.environment == 'preview-and-production' && needs.source_validation.result == 'success' && needs.resolve_validation_profile.result == 'success' }}
  advance_release_issues:
    name: Advance issues to the highest completed channel
    if: ${{ always() && inputs.environment == 'preview-and-production' && inputs.dry_run != true && needs.snapshot_release_issues.outputs.eligible == 'true' && (needs.release_preview.outputs.release_complete == 'true' || needs.release_production.outputs.release_complete == 'true') }}
    needs:
      - snapshot_release_issues
      - release_preview
      - release_production
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted combined-release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Advance the initially eligible issues to the completed channel
        env:
          DEV_ISSUES_JSON: ${{ needs.snapshot_release_issues.outputs.dev_issues_json }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ISSUES_JSON: ${{ needs.snapshot_release_issues.outputs.source_issues_json }}
          PREVIEW_ISSUES_JSON: ${{ needs.snapshot_release_issues.outputs.preview_issues_json }}
          TO_STAGE: ${{ needs.release_production.outputs.release_complete == 'true' && 'stage:stable' || 'stage:preview' }}
        run: |
          set -euo pipefail
          node scripts/pipeline/github/reconcile-issue-stage.mjs advance \
            --repo "$GITHUB_REPOSITORY" \
            --issues-json "$SOURCE_ISSUES_JSON" \
            --from-stage "stage:source" \
            --to-stage "$TO_STAGE"
          node scripts/pipeline/github/reconcile-issue-stage.mjs advance \
            --repo "$GITHUB_REPOSITORY" \
            --issues-json "$DEV_ISSUES_JSON" \
            --from-stage "stage:dev" \
            --to-stage "$TO_STAGE"
          if [ "$TO_STAGE" = "stage:stable" ]; then
            node scripts/pipeline/github/reconcile-issue-stage.mjs advance \
              --repo "$GITHUB_REPOSITORY" \
              --issues-json "$PREVIEW_ISSUES_JSON" \
              --from-stage "stage:preview" \
              --to-stage "$TO_STAGE"
          fi
