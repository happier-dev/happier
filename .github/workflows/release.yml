  deploy_docs:
    if: always() && needs.plan.result == 'success' && needs.release_admission.result == 'success' && needs.prepare_release_candidate.result == 'success' && inputs.dry_run != true && contains(format(',{0},', inputs.deploy_targets), ',docs,') && (needs.deploy_plan.outputs.deploy_docs_needed == 'true' || inputs.force_deploy == true)
    needs: [plan, release_admission, prepare_release_candidate, deploy_plan]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/promote-docs.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      force_deploy: ${{ inputs.force_deploy }}
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      allow_cross_promote: true
      run_build: true

  publish_npm:
    if: always() && needs.plan.result == 'success' && needs.release_admission.result == 'success' && needs.prepare_release_candidate.result == 'success' && needs.verify_release_candidates.result == 'success' && inputs.dry_run != true && (needs.plan.outputs.publish_cli == 'true' || needs.plan.outputs.publish_stack == 'true' || needs.plan.outputs.publish_server == 'true' || needs.plan.outputs.publish_plugin_sdk == 'true' || needs.plan.outputs.publish_sdk == 'true')
    needs: [plan, release_admission, prepare_release_candidate, verify_release_candidates]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-npm.yml
    secrets: inherit
    with:
      publish_cli: ${{ needs.plan.outputs.publish_cli == 'true' }}
      publish_stack: ${{ needs.plan.outputs.publish_stack == 'true' }}
      publish_server: ${{ needs.plan.outputs.publish_server == 'true' }}
      publish_plugin_sdk: ${{ needs.plan.outputs.publish_plugin_sdk == 'true' }}
      publish_sdk: ${{ needs.plan.outputs.publish_sdk == 'true' }}
      channel: ${{ inputs.environment }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      authorized_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      approve_public_sdk_release: ${{ inputs.approve_public_sdk_release }}
      npm_tag: ${{ inputs.environment == 'production' && 'latest' || 'next' }}
      run_tests: false
      release_message: ${{ needs.prepare_release_candidate.outputs.release_notes_github_markdown }}

  release_verify:
    name: Release Verification (release-verify.yml)
    needs: [plan, release_admission, prepare_release_candidate, deploy_ui, deploy_server, deploy_website, deploy_docs, publish_hstack_binaries, promote_cli_binaries, promote_hstack_binaries, promote_server_runtime, promote_ui_web, publish_docker, publish_npm]
    if: ${{ always() && inputs.dry_run != true && needs.plan.result == 'success' && needs.release_admission.result == 'success' && needs.prepare_release_candidate.result == 'success' && (needs.deploy_ui.result == 'success' || needs.deploy_ui.result == 'skipped') && (needs.deploy_server.result == 'success' || needs.deploy_server.result == 'skipped') && (needs.deploy_website.result == 'success' || needs.deploy_website.result == 'skipped') && (needs.deploy_docs.result == 'success' || needs.deploy_docs.result == 'skipped') && (needs.publish_hstack_binaries.result == 'success' || needs.publish_hstack_binaries.result == 'skipped') && (needs.promote_cli_binaries.result == 'success' || needs.promote_cli_binaries.result == 'skipped') && (needs.plan.outputs.publish_stack != 'true' || needs.promote_hstack_binaries.result == 'success') && (needs.promote_server_runtime.result == 'success' || needs.promote_server_runtime.result == 'skipped') && (needs.promote_ui_web.result == 'success' || needs.promote_ui_web.result == 'skipped') && (needs.publish_docker.result == 'success' || needs.publish_docker.result == 'skipped') && (needs.publish_npm.result == 'success' || needs.publish_npm.result == 'skipped') }}
    uses: ./.github/workflows/release-verify.yml
    with:
      channel: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
      validation_profile: integrated
      candidate_source_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      candidate_build_run_id: ${{ needs.prepare_release_candidate.outputs.build_run_id }}
      cli_candidate_build_run_id: ${{ inputs.candidate_run_id }}
      publication_run_id: ${{ github.run_id }}
      candidate_stack_version: ${{ needs.publish_hstack_binaries.outputs.version }}
      verify_deploy_ui: ${{ needs.deploy_ui.result == 'success' && inputs.environment == 'production' }}
      verify_deploy_server: ${{ needs.deploy_server.result == 'success' }}
      server_api_version_url: ${{ inputs.environment == 'production' && vars.HAPPIER_SERVER_API_PRODUCTION_VERSION_URL || vars.HAPPIER_SERVER_API_PREVIEW_VERSION_URL }}
      verify_deploy_website: ${{ needs.deploy_website.result == 'success' }}
      verify_deploy_docs: ${{ needs.deploy_docs.result == 'success' }}
      verify_cli_release: ${{ needs.promote_cli_binaries.result == 'success' }}
      verify_stack_release: ${{ needs.promote_hstack_binaries.result == 'success' }}
      verify_server_release: ${{ needs.promote_server_runtime.result == 'success' }}
      verify_ui_web_release: ${{ needs.promote_ui_web.result == 'success' }}

  advance_release_issues:
    name: Advance issues to the released channel
    continue-on-error: true
    if: ${{ needs.release_verify.result == 'success' && needs.snapshot_release_issues.outputs.eligible == 'true' }}
    needs: [snapshot_release_issues, release_verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Reconcile the snapshotted issues
        env:
          DEV_ISSUES_JSON: ${{ needs.snapshot_release_issues.outputs.dev_issues_json }}
          GITHUB_TOKEN: ${{ github.token }}
          INCLUDE_PREVIEW_STAGE: ${{ inputs.environment == 'production' && (inputs.confirm == 'release preview to main' || inputs.confirm == 'reset main from preview') }}
          PREVIEW_ISSUES_JSON: ${{ needs.snapshot_release_issues.outputs.preview_issues_json }}
          SOURCE_ISSUES_JSON: ${{ needs.snapshot_release_issues.outputs.source_issues_json }}
          TO_STAGE: ${{ inputs.environment == 'production' && 'stage:stable' || 'stage:preview' }}
        run: |
          set -euo pipefail
          node scripts/pipeline/github/reconcile-issue-stage.mjs advance \
            --repo "$GITHUB_REPOSITORY" \
            --issues-json "$SOURCE_ISSUES_JSON" \
            --from-stage "stage:source" \
            --to-stage "$TO_STAGE"
          node scripts/pipeline/github/reconcile-issue-stage.mjs advance \
            --repo "$GITHUB_REPOSITORY" \
            --issues-json "$DEV_ISSUES_JSON" \
            --from-stage "stage:dev" \
            --to-stage "$TO_STAGE"
          if [ "$INCLUDE_PREVIEW_STAGE" = "true" ]; then
            node scripts/pipeline/github/reconcile-issue-stage.mjs advance \
              --repo "$GITHUB_REPOSITORY" \
              --issues-json "$PREVIEW_ISSUES_JSON" \
              --from-stage "stage:preview" \
              --to-stage "$TO_STAGE"
          fi

  sync_dev:
    if: ${{ inputs.dry_run != true && inputs.environment == 'production' && (vars.RELEASE_SYNC_DEV_FROM_MAIN == '' || vars.RELEASE_SYNC_DEV_FROM_MAIN == 'true') && needs.release_admission.result == 'success' && needs.release_verify.result == 'success' }}
    needs: [plan, release_admission, promote_main, prepare_release_candidate, release_verify]
    uses: ./.github/workflows/promote-branch.yml
    secrets: inherit
    with:
      source: main
      source_sha: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      target: dev
      mode: fast_forward
      dry_run: false
      allow_reset: false
      confirm: promote dev from main

  release_status:
    name: Project terminal release status
    if: ${{ always() && inputs.dry_run != true }}
    needs: [resolve_resume, plan, deploy_plan, prepare_release_candidate, publish_cli_binaries, publish_hstack_binaries, publish_server_runtime, publish_ui_web, verify_release_candidates, verify_resume_candidates, promote_cli_binaries, promote_hstack_binaries, promote_server_runtime, promote_ui_web, deploy_ui, deploy_server, deploy_website, deploy_docs, publish_docker, publish_npm, release_verify, advance_release_issues, sync_dev]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Project release status facts
        env:
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_RUN_NAME: ${{ inputs.hmaint_operation_id != '' && format('RELEASE — Publish ({0}, {1})', inputs.hmaint_operation_id, inputs.hmaint_attempt_id) || 'RELEASE — Publish (manual)' }}
          HMAINT_OPERATION_ID: ${{ inputs.hmaint_operation_id }}
          RELEASE_CHANNEL: ${{ inputs.environment }}
          SOURCE_SHA: ${{ needs.prepare_release_candidate.outputs.source_sha || inputs.authorized_promotion_source_sha }}
          REQUEST_CLI: ${{ needs.plan.outputs.publish_cli_binaries_needed == 'true' }}
          REQUEST_STACK: ${{ needs.plan.outputs.publish_stack == 'true' }}
          REQUEST_SERVER: ${{ needs.plan.outputs.publish_server_runtime_needed == 'true' }}
          REQUEST_UI_WEB: ${{ needs.resolve_resume.outputs.ui_web_requested == 'true' || contains(format(',{0},', inputs.deploy_targets), ',ui,') || inputs.force_deploy == true || needs.plan.outputs.changed_ui == 'true' || needs.plan.outputs.changed_shared == 'true' }}
          CLI_CANDIDATE_RESULT: ${{ needs.publish_cli_binaries.result }}
          STACK_CANDIDATE_RESULT: ${{ needs.publish_hstack_binaries.result }}
          SERVER_CANDIDATE_RESULT: ${{ needs.publish_server_runtime.result }}
          UI_WEB_CANDIDATE_RESULT: ${{ needs.publish_ui_web.result }}
          CLI_VERSION: ${{ needs.publish_cli_binaries.outputs.version }}
          STACK_VERSION: ${{ needs.publish_hstack_binaries.outputs.version }}
          SERVER_VERSION: ${{ needs.publish_server_runtime.outputs.version }}
          UI_WEB_VERSION: ${{ needs.publish_ui_web.outputs.version }}
          CLI_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.cli_verified }}
          HSTACK_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.stack_verified }}
          SERVER_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.server_verified }}
          UI_WEB_RESUME_VERIFIED: ${{ needs.verify_resume_candidates.outputs.ui_web_verified }}
          REQUEST_DEPLOY_UI: ${{ contains(format(',{0},', inputs.deploy_targets), ',ui,') && (needs.deploy_plan.outputs.deploy_ui_needed == 'true' || needs.plan.outputs.bump_app != 'none' || inputs.force_deploy == true || inputs.ui_expo_action != 'none') }}
          REQUEST_DEPLOY_SERVER: ${{ contains(format(',{0},', inputs.deploy_targets), ',server,') && (needs.deploy_plan.outputs.deploy_server_needed == 'true' || needs.plan.outputs.bump_server != 'none' || inputs.force_deploy == true) }}
          REQUEST_DEPLOY_WEBSITE: ${{ contains(format(',{0},', inputs.deploy_targets), ',website,') && (needs.deploy_plan.outputs.deploy_website_needed == 'true' || needs.plan.outputs.bump_website != 'none' || inputs.force_deploy == true) }}
          REQUEST_DEPLOY_DOCS: ${{ contains(format(',{0},', inputs.deploy_targets), ',docs,') && (needs.deploy_plan.outputs.deploy_docs_needed == 'true' || inputs.force_deploy == true) }}
          REQUEST_DOCKER: ${{ inputs.force_deploy == true || needs.plan.outputs.publish_server == 'true' || needs.plan.outputs.publish_cli == 'true' || needs.plan.outputs.changed_ui == 'true' || needs.plan.outputs.changed_server == 'true' || needs.plan.outputs.changed_cli == 'true' || needs.plan.outputs.changed_cli_stack_shared == 'true' || needs.plan.outputs.changed_shared == 'true' }}
          REQUEST_NPM: ${{ needs.plan.outputs.publish_cli == 'true' || needs.plan.outputs.publish_stack == 'true' || needs.plan.outputs.publish_server == 'true' || needs.plan.outputs.publish_plugin_sdk == 'true' || needs.plan.outputs.publish_sdk == 'true' }}
          REQUEST_PLUGIN_SDK: ${{ needs.plan.outputs.publish_plugin_sdk == 'true' }}
          REQUEST_SDK: ${{ needs.plan.outputs.publish_sdk == 'true' }}
          CANDIDATE_RESULT: ${{ needs.prepare_release_candidate.result }}
          IMMUTABLE_VERIFICATION_RESULT: ${{ needs.verify_release_candidates.result }}
          CLI_RESULT: ${{ needs.promote_cli_binaries.result }}
          STACK_RESULT: ${{ needs.promote_hstack_binaries.result }}
          SERVER_RESULT: ${{ needs.promote_server_runtime.result }}
          UI_WEB_RESULT: ${{ needs.promote_ui_web.result }}
          DEPLOY_UI_RESULT: ${{ needs.deploy_ui.result }}
          DEPLOY_SERVER_RESULT: ${{ needs.deploy_server.result }}
          DEPLOY_WEBSITE_RESULT: ${{ needs.deploy_website.result }}
          DEPLOY_DOCS_RESULT: ${{ needs.deploy_docs.result }}
          DOCKER_RESULT: ${{ needs.publish_docker.result }}
          NPM_RESULT: ${{ needs.publish_npm.result }}
          NPM_PLUGIN_SDK_RESULT: ${{ needs.publish_npm.outputs.plugin_sdk_result }}
          NPM_PLUGIN_SDK_VERSION: ${{ needs.publish_npm.outputs.plugin_sdk_version }}
          NPM_PLUGIN_SDK_INTEGRITY: ${{ needs.publish_npm.outputs.plugin_sdk_integrity }}
          NPM_PLUGIN_UI_RESULT: ${{ needs.publish_npm.outputs.plugin_ui_result }}
          NPM_PLUGIN_UI_VERSION: ${{ needs.publish_npm.outputs.plugin_ui_version }}
          NPM_PLUGIN_UI_INTEGRITY: ${{ needs.publish_npm.outputs.plugin_ui_integrity }}
          NPM_SDK_RESULT: ${{ needs.publish_npm.outputs.sdk_result }}
          NPM_SDK_VERSION: ${{ needs.publish_npm.outputs.sdk_version }}
          NPM_SDK_INTEGRITY: ${{ needs.publish_npm.outputs.sdk_integrity }}
          RELEASE_VERIFY_RESULT: ${{ needs.release_verify.result }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.release-control/scripts/pipeline/release/project-release-status.mjs" \
            --mode standard \
            --out "$RUNNER_TEMP/release-status.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload release status artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: happier-release-status
          path: ${{ runner.temp }}/release-status.json
          if-no-files-found: error
          overwrite: true
