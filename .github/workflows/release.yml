name: RELEASE — Publish (preview + production)
run-name: ${{ inputs.hmaint_operation_id != '' && format('RELEASE — Publish ({0}, {1})', inputs.hmaint_operation_id, inputs.hmaint_attempt_id) || 'RELEASE — Publish (manual)' }}

on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: "Release validation contract (stable adds full source checks and semantic compatibility/preview review)"
        required: true
        type: choice
        default: integrated
        options:
          - integrated
          - stable
      dry_run:
        description: "Safety — Run checks and show plan, but do not push/deploy"
        required: true
        default: false
        type: boolean
      environment:
        description: "Deploy — Target environment (deploy/<env>/*)"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      deploy_targets:
        description: "Deploy — Comma-separated targets: ui,server,website,docs,cli,stack,server_runner"
        required: true
        default: ui,server,website,docs
        type: string
      force_deploy:
        description: "Deploy — Force promote + deploy for enabled targets even if no relevant changes are detected (useful after infra failures)"
        required: true
        default: false
        type: boolean
      ui_expo_action:
        description: "Deploy — UI Expo action (none|ota|native|native_submit) for the selected environment"
        required: true
        default: none
        type: choice
        options:
          - none
          - ota
          - native
          - native_submit
      desktop_mode:
        description: "Deploy — Desktop artifacts mode"
        required: true
        type: choice
        default: none
        options:
          - none
          - build_only
          - build_and_publish
      waive_ci:
        description: "Maintainer override — waive exact-SHA source CI and source-only MySQL/platform gates"
        required: true
        default: false
        type: boolean
      include_validation_suites:
        description: "Validation — additional suite IDs to require (comma-separated)"
        required: false
        default: ""
        type: string
      waive_validation_suites:
        description: "Maintainer override — risk-selected suite IDs to waive (comma-separated)"
        required: false
        default: ""
        type: string
      override_reason:
        description: "Maintainer override — required reason for waived CI or validation evidence"
        required: false
        default: ""
        type: string
      authorized_promotion_source_sha:
        description: "Safety — exact source branch SHA approved for promotion"
        required: false
        default: ""
        type: string
      workflow_control_sha:
        description: "Safety — dispatcher-observed dev SHA; leave empty only for emergency direct manual dispatch"
        required: false
        default: ""
        type: string
      ci_run_id:
        description: "Completed canonical push CI run ID for this exact source (required unless dry-run or CI is explicitly waived)"
        required: false
        default: ""
        type: string
      resume_run_id:
        description: "Completed RELEASE run ID whose verified immutable candidates should be reused"
        required: false
        default: ""
        type: string
      hmaint_operation_id:
        description: "Safety — conductor operation ID; leave empty only for emergency direct manual dispatch"
        required: false
        default: ""
        type: string
      hmaint_attempt_id:
        description: "Safety — conductor execution attempt identity"
        required: false
        default: "attempt_1"
        type: string
      release_notes_id:
        description: "Release notes — Exact approved project release ID"
        required: true
        type: string
      qualified_v4_activation_approval:
        description: "Irreversible migration — unsupported on this release line; must remain false"
        required: true
        default: false
        type: boolean
      confirm:
        description: "Confirm — Choose the exact action for this environment"
        required: true
        type: choice
        options:
          - release dev to preview
          - release preview to main
          - reset main from preview
          - release dev to main
          - reset main from dev

permissions:
  contents: write
  actions: read

concurrency:
  group: release-unified
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Admit trusted release workflow ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Reject cross-repository or untrusted release control
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/main") ;;
            *) echo "Untrusted release workflow ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac
      - name: Verify workflow-control SHA
        env:
          WORKFLOW_CONTROL_SHA: ${{ inputs.workflow_control_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_CONTROL_SHA" ]; then
            exit 0
          fi
          if ! [[ "$WORKFLOW_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow_control_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          if [ "$WORKFLOW_SHA" != "$WORKFLOW_CONTROL_SHA" ]; then
            echo "Workflow-control SHA drift: loaded '$WORKFLOW_SHA', expected '$WORKFLOW_CONTROL_SHA'." >&2
            exit 1
          fi

  release_actor_guard:
    name: Release actor guard
    needs: [trusted_ref_guard, release_preflight]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  release_preflight:
    name: Release preflight (inputs + exact source)
    needs: [trusted_ref_guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.authorized_sha }}
      source_ref: ${{ steps.dispatch.outputs.source_ref }}
      base_ref: ${{ steps.dispatch.outputs.base_ref }}
      validation_profile: ${{ steps.profile.outputs.profile }}
      checks_profile: ${{ steps.profile.outputs.checks_profile }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Resolve public profile
        id: profile
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release-validation/resolve-profile.mjs "$VALIDATION_PROFILE"
      - name: Validate release dispatch
        id: dispatch
        env:
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          HMAINT_OPERATION_ID: ${{ inputs.hmaint_operation_id }}
          HMAINT_ATTEMPT_ID: ${{ inputs.hmaint_attempt_id }}
          RELEASE_NOTES_ID: ${{ inputs.release_notes_id }}
          QUALIFIED_V4_ACTIVATION_APPROVAL: ${{ inputs.qualified_v4_activation_approval }}
          CONFIRM: ${{ inputs.confirm }}
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          WAIVE_CI: ${{ inputs.waive_ci }}
          INCLUDE_VALIDATION_SUITES: ${{ inputs.include_validation_suites }}
          WAIVE_VALIDATION_SUITES: ${{ inputs.waive_validation_suites }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/validate-release-dispatch.mjs
      - name: Bind exact release source
        id: source
        env:
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          SOURCE_REF: ${{ steps.dispatch.outputs.source_ref }}
        run: |
          set -euo pipefail
          source_ref="refs/heads/$SOURCE_REF"
          if [ -n "$RESUME_RUN_ID" ] && [ -n "$AUTHORIZED_PROMOTION_SOURCE_SHA" ]; then
            source_ref="$AUTHORIZED_PROMOTION_SOURCE_SHA"
          fi
          args=(
            --source-ref "$source_ref"
            --remote origin
            --github-output "$GITHUB_OUTPUT"
          )
          if [ -n "$AUTHORIZED_PROMOTION_SOURCE_SHA" ]; then
            args+=(--authorized-sha "$AUTHORIZED_PROMOTION_SOURCE_SHA")
          fi
          node scripts/pipeline/github/resolve-authorized-release-source.mjs "${args[@]}"
      - name: Record explicit maintainer overrides
        if: ${{ inputs.waive_ci == true || inputs.waive_validation_suites != '' }}
        env:
          WAIVE_CI: ${{ inputs.waive_ci }}
          WAIVE_VALIDATION_SUITES: ${{ inputs.waive_validation_suites }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          {
            echo '### Maintainer release overrides'
            if [ "$WAIVE_CI" = "true" ]; then echo '- Exact-SHA CI evidence: **WAIVED**'; fi
            if [ -n "$WAIVE_VALIDATION_SUITES" ]; then echo "- Validation suites: **WAIVED** ($WAIVE_VALIDATION_SUITES)"; fi
            echo "- Reason: $OVERRIDE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve_resume:
    name: Resolve resumable release candidates
    needs: [release_actor_guard]
    uses: ./.github/workflows/resolve-release-resume.yml
    with:
      origin_run_id: ${{ inputs.resume_run_id }}
      expected_workflow: .github/workflows/release.yml
      expected_channel: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
      expected_source_sha: ${{ inputs.authorized_promotion_source_sha }}
      expected_operation_id: ${{ inputs.hmaint_operation_id }}

  snapshot_release_issues:
    name: Snapshot issues eligible for this channel release
    needs: [release_actor_guard]
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      eligible: ${{ steps.snapshot.outputs.eligible }}
      source_issues_json: ${{ steps.snapshot.outputs.source_issues_json }}
      dev_issues_json: ${{ steps.snapshot.outputs.dev_issues_json }}
      preview_issues_json: ${{ steps.snapshot.outputs.preview_issues_json }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Snapshot open issues from the source channel
        id: snapshot
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
          INCLUDE_DEVELOPMENT_STAGES: ${{ inputs.environment == 'preview' || (inputs.environment == 'production' && (inputs.confirm == 'release dev to main' || inputs.confirm == 'reset main from dev')) }}
          INCLUDE_PREVIEW_STAGE: ${{ inputs.environment == 'production' && (inputs.confirm == 'release preview to main' || inputs.confirm == 'reset main from preview') }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "source_issues_json=[]" >> "$GITHUB_OUTPUT"
            echo "dev_issues_json=[]" >> "$GITHUB_OUTPUT"
            echo "preview_issues_json=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_issues_json="[]"
          dev_issues_json="[]"
          preview_issues_json="[]"
          if [ "$INCLUDE_DEVELOPMENT_STAGES" = "true" ]; then
            source_issues_json="$(node scripts/pipeline/github/reconcile-issue-stage.mjs snapshot --repo "$GITHUB_REPOSITORY" --from-stage "stage:source")"
            dev_issues_json="$(node scripts/pipeline/github/reconcile-issue-stage.mjs snapshot --repo "$GITHUB_REPOSITORY" --from-stage "stage:dev")"
          fi
          if [ "$INCLUDE_PREVIEW_STAGE" = "true" ]; then
            preview_issues_json="$(node scripts/pipeline/github/reconcile-issue-stage.mjs snapshot --repo "$GITHUB_REPOSITORY" --from-stage "stage:preview")"
          fi
          echo "source_issues_json=$source_issues_json" >> "$GITHUB_OUTPUT"
          echo "dev_issues_json=$dev_issues_json" >> "$GITHUB_OUTPUT"
          echo "preview_issues_json=$preview_issues_json" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  ci:
    name: Verify exact-SHA CI evidence
    needs: [release_preflight, release_actor_guard]
    if: ${{ needs.release_preflight.result == 'success' && needs.release_actor_guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run_id: ${{ steps.existing_ci.outputs.ci_run_id }}
      ci_run_url: ${{ steps.existing_ci.outputs.ci_run_url }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Verify successful existing CI for exact source
        id: existing_ci
        if: ${{ inputs.dry_run != true && inputs.waive_ci != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release_preflight.outputs.source_sha }}
          SOURCE_BRANCH: ${{ needs.release_preflight.outputs.source_ref }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_REPOSITORY"
            --source-sha "$SOURCE_SHA"
            --source-branch "$SOURCE_BRANCH"
          )
          if [ -z "$CI_RUN_ID" ]; then
            echo "ci_run_id is required for a non-dry-run release unless CI is explicitly waived." >&2
            exit 1
          fi
          args+=(--run-id "$CI_RUN_ID")
          node scripts/pipeline/release/verify-existing-ci.mjs "${args[@]}" --github-output "$GITHUB_OUTPUT"

  plan:
    name: Release preflight plan (changes + versions + risk)
    needs: [release_actor_guard, resolve_resume, release_preflight]
    if: ${{ always() && needs.release_actor_guard.result == 'success' && needs.resolve_resume.result == 'success' && needs.release_preflight.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed_ui: ${{ steps.plan.outputs.changed_ui }}
      changed_cli: ${{ steps.plan.outputs.changed_cli }}
      changed_server: ${{ steps.plan.outputs.changed_server }}
      changed_website: ${{ steps.plan.outputs.changed_website }}
      changed_docs: ${{ steps.plan.outputs.changed_docs }}
      changed_shared: ${{ steps.plan.outputs.changed_shared }}
      changed_stack: ${{ steps.plan.outputs.changed_stack }}
      bump_app: ${{ steps.bump_plan.outputs.bump_app }}
      bump_cli: ${{ steps.bump_plan.outputs.bump_cli }}
      bump_stack: ${{ steps.bump_plan.outputs.bump_stack }}
      bump_server: ${{ steps.bump_plan.outputs.bump_server }}
      bump_website: ${{ steps.bump_plan.outputs.bump_website }}
      should_bump: ${{ steps.bump_plan.outputs.should_bump }}
      publish_cli: ${{ steps.bump_plan.outputs.publish_cli }}
      publish_stack: ${{ needs.resolve_resume.outputs.stack_requested == 'true' || steps.bump_plan.outputs.publish_stack == 'true' }}
      publish_server: ${{ steps.bump_plan.outputs.publish_server }}
      source_sha: ${{ steps.planning_source.outputs.source_sha }}
      publish_server_runtime_needed: ${{ needs.resolve_resume.outputs.server_requested == 'true' || inputs.force_deploy == true || steps.bump_plan.outputs.publish_server == 'true' || steps.plan.outputs.changed_ui == 'true' || steps.plan.outputs.changed_server == 'true' || steps.plan.outputs.changed_shared == 'true' }}
      publish_cli_binaries_needed: ${{ needs.resolve_resume.outputs.cli_requested == 'true' || inputs.force_deploy == true || steps.bump_plan.outputs.publish_cli == 'true' || steps.plan.outputs.changed_cli == 'true' || steps.plan.outputs.changed_shared == 'true' }}
      publish_ui_web_needed: ${{ needs.resolve_resume.outputs.ui_web_requested == 'true' || contains(format(',{0},', inputs.deploy_targets), ',ui,') || inputs.force_deploy == true || steps.plan.outputs.changed_ui == 'true' || steps.plan.outputs.changed_shared == 'true' }}
      publish_docker_needed: ${{ needs.resolve_resume.outputs.docker_requested == 'true' || inputs.force_deploy == true || steps.bump_plan.outputs.publish_server == 'true' || steps.bump_plan.outputs.publish_cli == 'true' || steps.plan.outputs.changed_ui == 'true' || steps.plan.outputs.changed_server == 'true' || steps.plan.outputs.changed_cli == 'true' || steps.plan.outputs.changed_shared == 'true' }}
      publish_docker_relay_needed: ${{ needs.resolve_resume.outputs.docker_requested == 'true' || inputs.force_deploy == true || steps.bump_plan.outputs.publish_server == 'true' || steps.plan.outputs.changed_ui == 'true' || steps.plan.outputs.changed_server == 'true' || steps.plan.outputs.changed_shared == 'true' }}
      publish_docker_dev_box_needed: ${{ needs.resolve_resume.outputs.docker_requested == 'true' || inputs.force_deploy == true || steps.bump_plan.outputs.publish_cli == 'true' || steps.plan.outputs.changed_cli == 'true' || steps.plan.outputs.changed_shared == 'true' }}
      publish_npm_needed: ${{ needs.resolve_resume.outputs.npm_requested == 'true' || steps.bump_plan.outputs.publish_cli == 'true' || steps.bump_plan.outputs.publish_stack == 'true' || steps.bump_plan.outputs.publish_server == 'true' }}
      npm_publish_cli_needed: ${{ needs.resolve_resume.outputs.npm_publish_cli_requested == 'true' || steps.bump_plan.outputs.publish_cli == 'true' }}
      npm_publish_stack_needed: ${{ needs.resolve_resume.outputs.npm_publish_stack_requested == 'true' || steps.bump_plan.outputs.publish_stack == 'true' }}
      npm_publish_server_needed: ${{ needs.resolve_resume.outputs.npm_publish_server_requested == 'true' || steps.bump_plan.outputs.publish_server == 'true' }}
      validation_profile: ${{ needs.release_preflight.outputs.validation_profile }}
      checks_profile: ${{ needs.release_preflight.outputs.checks_profile }}
      compatibility_analysis_required: ${{ steps.plan.outputs.compatibility_analysis_required }}
      risk_cli_upgrade: ${{ steps.plan.outputs.risk_cli_upgrade }}
      risk_session_continuity: ${{ steps.plan.outputs.risk_session_continuity }}
      risk_relay_upgrade: ${{ steps.plan.outputs.risk_relay_upgrade }}
      risk_mysql_contract: ${{ steps.plan.outputs.risk_mysql_contract }}
      risk_platform_services: ${{ steps.plan.outputs.risk_platform_services }}
      risk_trust_roots: ${{ steps.plan.outputs.risk_trust_roots }}
    steps:
      - name: Checkout trusted release planning control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout authorized release planning source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.release_preflight.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authorized promotion source
        id: planning_source
        working-directory: release-source
        env:
          PREFLIGHT_SOURCE_SHA: ${{ needs.release_preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          echo "source_sha=$checkout_sha" >> "$GITHUB_OUTPUT"
          if [ "$checkout_sha" != "$PREFLIGHT_SOURCE_SHA" ]; then
            echo "Checked out source did not match the preflight-bound release SHA." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Compute changed components (current target..authorized source)
        id: plan
        working-directory: release-source
        env:
          PLAN_SOURCE_REF: ${{ needs.release_preflight.outputs.source_ref }}
          PLAN_BASE_REF: ${{ needs.release_preflight.outputs.base_ref }}
        run: |
          set -euo pipefail

          git fetch origin "${PLAN_BASE_REF}" "${PLAN_SOURCE_REF}" --prune --tags

          source_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse "origin/${PLAN_BASE_REF}")"

          node ../scripts/pipeline/release/compute-changed-components.mjs \
            --base "$base_sha" \
            --head "$source_sha" \
            --out "$GITHUB_OUTPUT"

      - name: Compute versioned component changes (latest release tags..release head)
        id: versioned_plan
        working-directory: release-source
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          git fetch origin main dev preview --prune --tags

          plan_head_sha="$(git rev-parse HEAD)"

          node ../scripts/pipeline/release/compute-versioned-component-changes.mjs \
            --environment "$ENVIRONMENT" \
            --head "$plan_head_sha" \
            --out "$GITHUB_OUTPUT"

      - name: Release plan summary
        env:
          APP_BASELINE_TAG: ${{ steps.versioned_plan.outputs.app_baseline_tag || 'none' }}
          CHANGED_CLI: ${{ steps.plan.outputs.changed_cli }}
          CHANGED_DOCS: ${{ steps.plan.outputs.changed_docs }}
          CHANGED_SERVER: ${{ steps.plan.outputs.changed_server }}
          CHANGED_SHARED: ${{ steps.plan.outputs.changed_shared }}
          CHANGED_STACK: ${{ steps.plan.outputs.changed_stack }}
          CHANGED_UI: ${{ steps.plan.outputs.changed_ui }}
          CHANGED_WEBSITE: ${{ steps.plan.outputs.changed_website }}
          CHECKS_PROFILE: ${{ needs.release_preflight.outputs.checks_profile }}
          CLI_BASELINE_TAG: ${{ steps.versioned_plan.outputs.cli_baseline_tag || 'none' }}
          COMMIT_COUNT: ${{ steps.plan.outputs.commit_count }}
          CONFIRM: ${{ inputs.confirm }}
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          DESKTOP_MODE: ${{ inputs.desktop_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ inputs.environment }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          STACK_BASELINE_TAG: ${{ steps.versioned_plan.outputs.stack_baseline_tag || 'none' }}
          UI_EXPO_ACTION: ${{ inputs.ui_expo_action }}
          VERSIONED_APP_CHANGED: ${{ steps.versioned_plan.outputs.changed_app }}
          VERSIONED_CLI_CHANGED: ${{ steps.versioned_plan.outputs.changed_cli }}
          VERSIONED_SERVER_CHANGED: ${{ steps.versioned_plan.outputs.changed_server }}
          VERSIONED_STACK_CHANGED: ${{ steps.versioned_plan.outputs.changed_stack }}
          SERVER_BASELINE_TAG: ${{ steps.versioned_plan.outputs.server_baseline_tag || 'none' }}
        run: |
          set -euo pipefail

          {
            echo "## Release plan (dev → main)"
            echo ""
            echo "- checks_profile: \`$CHECKS_PROFILE\`"
            echo "- environment: \`$ENVIRONMENT\`"
            echo "- confirm: \`$CONFIRM\`"
            echo "- dry_run: \`$DRY_RUN\`"
            echo "- deploy_targets: \`$DEPLOY_TARGETS\`"
            echo "- force_deploy: \`$FORCE_DEPLOY\`"
            echo "- ui_expo_action: \`$UI_EXPO_ACTION\` (builder=\`eas_cloud\`, platform=\`all\`, profile=\`auto\`, android_release_status=\`draft\`)"
            echo "- desktop_mode: \`$DESKTOP_MODE\`"
            echo ""
            echo "- commits to release (main..dev): \`$COMMIT_COUNT\`"
            echo ""
            echo "### Changed components (main..dev)"
            echo "- ui: \`$CHANGED_UI\`"
            echo "- cli: \`$CHANGED_CLI\`"
            echo "- server: \`$CHANGED_SERVER\`"
            echo "- stack: \`$CHANGED_STACK\`"
            echo "- website: \`$CHANGED_WEBSITE\`"
            echo "- docs: \`$CHANGED_DOCS\`"
            echo "- shared (agents/protocol): \`$CHANGED_SHARED\`"
            echo ""
            echo "### Versioned components since latest release tags"
            echo "- app: \`$VERSIONED_APP_CHANGED\` (baseline=\`$APP_BASELINE_TAG\`)"
            echo "- cli: \`$VERSIONED_CLI_CHANGED\` (baseline=\`$CLI_BASELINE_TAG\`)"
            echo "- stack: \`$VERSIONED_STACK_CHANGED\` (baseline=\`$STACK_BASELINE_TAG\`)"
            echo "- server: \`$VERSIONED_SERVER_CHANGED\` (baseline=\`$SERVER_BASELINE_TAG\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve publish + bump plan
        id: bump_plan
        working-directory: release-source
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUMP_PRESET: none
          BUMP_APP_OVERRIDE: preset
          BUMP_CLI_OVERRIDE: preset
          BUMP_STACK_OVERRIDE: preset
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          CHANGED_UI: ${{ steps.plan.outputs.changed_ui }}
          CHANGED_CLI: ${{ steps.plan.outputs.changed_cli }}
          CHANGED_SERVER: ${{ steps.plan.outputs.changed_server }}
          CHANGED_WEBSITE: ${{ steps.plan.outputs.changed_website }}
          CHANGED_STACK: ${{ steps.plan.outputs.changed_stack }}
          CHANGED_SHARED: ${{ steps.plan.outputs.changed_shared }}
          VERSIONED_APP_CHANGED: ${{ steps.versioned_plan.outputs.changed_app }}
          VERSIONED_CLI_CHANGED: ${{ steps.versioned_plan.outputs.changed_cli }}
          VERSIONED_STACK_CHANGED: ${{ steps.versioned_plan.outputs.changed_stack }}
          VERSIONED_SERVER_CHANGED: ${{ steps.versioned_plan.outputs.changed_server }}
          RESUME_CLI_VERSION: ${{ needs.resolve_resume.outputs.cli_version }}
          RESUME_STACK_VERSION: ${{ needs.resolve_resume.outputs.stack_version }}
          RESUME_SERVER_VERSION: ${{ needs.resolve_resume.outputs.server_version }}
        run: |
          set -euo pipefail
          node ../scripts/pipeline/release/resolve-bump-plan.mjs \
            --environment "${ENVIRONMENT}" \
            --bump-preset "${BUMP_PRESET}" \
            --require-materialized \
            --bump-app-override "${BUMP_APP_OVERRIDE}" \
            --bump-cli-override "${BUMP_CLI_OVERRIDE}" \
            --bump-stack-override "${BUMP_STACK_OVERRIDE}" \
            --deploy-targets "${DEPLOY_TARGETS}" \
            --changed-ui "${CHANGED_UI}" \
            --changed-cli "${CHANGED_CLI}" \
            --changed-stack "${CHANGED_STACK}" \
            --changed-server "${CHANGED_SERVER}" \
            --changed-website "${CHANGED_WEBSITE}" \
            --changed-shared "${CHANGED_SHARED}" \
            --versioned-app-changed "${VERSIONED_APP_CHANGED}" \
            --versioned-cli-changed "${VERSIONED_CLI_CHANGED}" \
            --versioned-stack-changed "${VERSIONED_STACK_CHANGED}" \
            --versioned-server-changed "${VERSIONED_SERVER_CHANGED}" \
            --resume-cli-version "${RESUME_CLI_VERSION}" \
            --resume-stack-version "${RESUME_STACK_VERSION}" \
            --resume-server-version "${RESUME_SERVER_VERSION}" \
            --github-output "$GITHUB_OUTPUT"

  mysql_db_contract:
    name: Server DB Contract (MySQL 8)
    needs: [plan, ci, admit_release_notes]
    if: ${{ inputs.dry_run != true && inputs.waive_ci != true && needs.plan.outputs.publish_server_runtime_needed == 'true' && needs.plan.outputs.risk_mysql_contract == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/extended-db-tests.yml
    with:
      checkout_sha: ${{ needs.plan.outputs.source_sha }}
      select_jobs_explicitly: true
      run_e2e_postgres: false
      run_e2e_mysql: false
      run_db_contract_postgres: false
      run_db_contract_mysql: true

  platform_service_validation:
    name: Platform service validation
    needs: [plan, ci, admit_release_notes]
    if: ${{ inputs.dry_run != true && inputs.waive_ci != true && needs.plan.outputs.risk_platform_services == 'true' && (needs.plan.outputs.publish_server_runtime_needed == 'true' || needs.plan.outputs.publish_cli_binaries_needed == 'true' || needs.plan.outputs.publish_stack == 'true') }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tests.yml
    with:
      checkout_sha: ${{ needs.plan.outputs.source_sha }}
      select_jobs_explicitly: true
      run_ui_e2e: false
      run_mobile_e2e_android: false
      run_mobile_e2e_ios: false
      run_ui: false
      run_server: false
      run_server_db_contract: false
      run_cli: false
      run_stack: false
      run_typecheck: false
      run_cli_daemon_e2e: false
      run_e2e_core: false
      run_e2e_core_slow: false
      run_providers: false
      run_stress: false
      run_release_contracts: false
      run_installers_smoke: false
      run_binary_smoke: false
      run_cli_update_continuity: false
      run_daemon_continuity: false
      run_session_continuity: false
      run_release_assets_docker: false
      run_self_host_systemd: true
      run_self_host_launchd: true
      run_self_host_schtasks: true
      run_self_host_daemon: true

  trust_root_validation:
    name: Installer and updater trust-root validation
    needs: [plan, ci, admit_release_notes]
    if: ${{ inputs.dry_run != true && needs.plan.outputs.risk_trust_roots == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact authorized release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Validate installer and updater trust roots
        run: |
          set -euo pipefail
          node --test scripts/release/installers_security.test.mjs
          node scripts/pipeline/run.mjs release-sync-installers --check
          node scripts/pipeline/run.mjs tauri-validate-updater-pubkey --config-path apps/ui/src-tauri/tauri.conf.json

  release_admission:
    name: Admit release mutation and publication
    needs: [plan, ci, admit_release_notes, mysql_db_contract, platform_service_validation, trust_root_validation]
    if: ${{ always() && inputs.dry_run != true && needs.plan.result == 'success' && needs.ci.result == 'success' && needs.admit_release_notes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Enforce stable and risk-selected publication admission
        env:
          CHECKS_PROFILE: ${{ needs.plan.outputs.checks_profile }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PUBLISH_SERVER_RUNTIME_NEEDED: ${{ needs.plan.outputs.publish_server_runtime_needed }}
          PUBLISH_CLI_BINARIES_NEEDED: ${{ needs.plan.outputs.publish_cli_binaries_needed }}
          PUBLISH_STACK: ${{ needs.plan.outputs.publish_stack }}
          WAIVE_SOURCE_CHECKS: ${{ inputs.waive_ci }}
          RISK_MYSQL_CONTRACT: ${{ needs.plan.outputs.risk_mysql_contract }}
          RISK_PLATFORM_SERVICES: ${{ needs.plan.outputs.risk_platform_services }}
          RISK_TRUST_ROOTS: ${{ needs.plan.outputs.risk_trust_roots }}
          MYSQL_GATE_RESULT: ${{ needs.mysql_db_contract.result }}
          PLATFORM_GATE_RESULT: ${{ needs.platform_service_validation.result }}
          TRUST_ROOT_GATE_RESULT: ${{ needs.trust_root_validation.result }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/admit-release.mjs

  admit_release_notes:
    name: Admit exact candidate release notes
    needs: [release_preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ needs.release_preflight.outputs.source_sha }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Checkout exact authorized release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          path: release-source
          ref: ${{ needs.release_preflight.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Project approved release notes from exact candidate
        env:
          RELEASE_NOTES_ID: ${{ inputs.release_notes_id }}
          SOURCE_SHA: ${{ needs.release_preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          UI_VERSION="$(node -p "require('./release-source/apps/ui/package.json').version")"
          CLI_VERSION="$(node -p "require('./release-source/apps/cli/package.json').version")"
          STACK_VERSION="$(node -p "require('./release-source/apps/stack/package.json').version")"
          SERVER_VERSION="$(node -p "require('./release-source/apps/server/package.json').version")"
          export UI_VERSION CLI_VERSION STACK_VERSION SERVER_VERSION
          node "$GITHUB_WORKSPACE/scripts/pipeline/release/release-notes/project-release-notes.mjs" \
            --release-id "$RELEASE_NOTES_ID" \
            --source-sha "$SOURCE_SHA" \
            --component-version "ui=$UI_VERSION" \
            --component-version "cli=$CLI_VERSION" \
            --component-version "stack=$STACK_VERSION" \
            --component-version "server=$SERVER_VERSION" \
            --changelog "$GITHUB_WORKSPACE/release-source/apps/ui/CHANGELOG.md" | \
            node --input-type=module -e '
              let raw = "";
              for await (const chunk of process.stdin) raw += chunk;
              const bundle = JSON.parse(raw);
              const expectedComponents = {
                ui: process.env.UI_VERSION,
                cli: process.env.CLI_VERSION,
                stack: process.env.STACK_VERSION,
                server: process.env.SERVER_VERSION,
              };
              const actualComponents = bundle.release?.components;
              const componentsMatch = actualComponents && Object.keys(expectedComponents).length === Object.keys(actualComponents).length && Object.entries(expectedComponents).every(([key, value]) => actualComponents[key] === value);
              if (bundle.kind !== "happier.release-notes.projection.v2" || bundle.schemaVersion !== 2 || bundle.release?.id !== process.env.RELEASE_NOTES_ID || bundle.release?.sourceSha !== process.env.SOURCE_SHA || !componentsMatch) {
                throw new Error("Invalid exact-candidate release-notes projection");
              }
              for (const value of [bundle.projections?.github?.markdown, bundle.projections?.expo?.message]) {
                if (typeof value !== "string") throw new Error("Missing release-notes projection");
              }
            '

  deploy_plan:
    name: deploy_plan (source → deploy branches)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: >-
      always() && needs.resolve_resume.result == 'success' && needs.plan.result == 'success' && needs.prepare_release_candidate.result == 'success' && (
        needs.resolve_resume.outputs.deploy_ui_requested == 'true' ||
        needs.resolve_resume.outputs.deploy_server_requested == 'true' ||
        needs.resolve_resume.outputs.deploy_website_requested == 'true' ||
        needs.resolve_resume.outputs.deploy_docs_requested == 'true' ||
        contains(format(',{0},', inputs.deploy_targets), ',server,') ||
        contains(format(',{0},', inputs.deploy_targets), ',website,') ||
        contains(format(',{0},', inputs.deploy_targets), ',docs,') ||
        contains(format(',{0},', inputs.deploy_targets), ',ui,')
      )
    needs: [resolve_resume, plan, promote_preview, promote_main, prepare_release_candidate]
    outputs:
      deploy_ui_needed: ${{ steps.plan.outputs.deploy_ui_needed }}
      deploy_server_needed: ${{ steps.plan.outputs.deploy_server_needed }}
      deploy_website_needed: ${{ steps.plan.outputs.deploy_website_needed }}
      deploy_docs_needed: ${{ steps.plan.outputs.deploy_docs_needed }}
      deploy_ui_requested: ${{ needs.resolve_resume.outputs.deploy_ui_requested == 'true' || (contains(format(',{0},', inputs.deploy_targets), ',ui,') && (steps.plan.outputs.deploy_ui_needed == 'true' || needs.plan.outputs.bump_app != 'none' || inputs.force_deploy == true || inputs.ui_expo_action != 'none' || inputs.desktop_mode != 'none')) }}
      deploy_server_requested: ${{ needs.resolve_resume.outputs.deploy_server_requested == 'true' || (contains(format(',{0},', inputs.deploy_targets), ',server,') && (steps.plan.outputs.deploy_server_needed == 'true' || needs.plan.outputs.bump_server != 'none' || inputs.force_deploy == true)) }}
      deploy_website_requested: ${{ needs.resolve_resume.outputs.deploy_website_requested == 'true' || (contains(format(',{0},', inputs.deploy_targets), ',website,') && (steps.plan.outputs.deploy_website_needed == 'true' || needs.plan.outputs.bump_website != 'none' || inputs.force_deploy == true)) }}
      deploy_docs_requested: ${{ needs.resolve_resume.outputs.deploy_docs_requested == 'true' || (contains(format(',{0},', inputs.deploy_targets), ',docs,') && (steps.plan.outputs.deploy_docs_needed == 'true' || inputs.force_deploy == true)) }}
      deploy_ui_web: ${{ needs.resolve_resume.outputs.deploy_ui_web_requested == 'true' || inputs.environment == 'production' }}
      deploy_ui_expo_action: ${{ needs.resolve_resume.outputs.deploy_ui_expo_action != 'none' && needs.resolve_resume.outputs.deploy_ui_expo_action || inputs.ui_expo_action }}
      deploy_ui_desktop_mode: ${{ (needs.resolve_resume.outputs.deploy_ui_desktop_mode == 'build_and_publish' || inputs.desktop_mode == 'build_and_publish') && 'build_and_publish' || (needs.resolve_resume.outputs.deploy_ui_desktop_mode == 'build_only' || inputs.desktop_mode == 'build_only') && 'build_only' || 'none' }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout release source as inert data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: release-source

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Compute deploy plan (deploy/<env>/* behind release source?)
        id: plan
        working-directory: release-source
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ needs.prepare_release_candidate.outputs.source_sha }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          DEPLOY_UI: ${{ contains(format(',{0},', inputs.deploy_targets), ',ui,') }}
          DEPLOY_SERVER: ${{ contains(format(',{0},', inputs.deploy_targets), ',server,') }}
          DEPLOY_WEBSITE: ${{ contains(format(',{0},', inputs.deploy_targets), ',website,') }}
          DEPLOY_DOCS: ${{ contains(format(',{0},', inputs.deploy_targets), ',docs,') }}
        run: |
          set -euo pipefail
          node ../scripts/pipeline/release/compute-deploy-plan.mjs \
            --deploy-environment "${ENVIRONMENT}" \
            --source-ref "${SOURCE_SHA}" \
            --force-deploy "${FORCE_DEPLOY}" \
            --deploy-ui "${DEPLOY_UI}" \
            --deploy-server "${DEPLOY_SERVER}" \
            --deploy-website "${DEPLOY_WEBSITE}" \
            --deploy-docs "${DEPLOY_DOCS}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Admit reconstructable resumed UI publication intent
        if: ${{ needs.resolve_resume.outputs.deploy_ui_requested == 'true' }}
        env:
          CURRENT_EXPO_ACTION: ${{ inputs.ui_expo_action }}
          RESUME_EXPO_ACTION: ${{ needs.resolve_resume.outputs.deploy_ui_expo_action }}
        run: |
          set -euo pipefail
          if [ "$RESUME_EXPO_ACTION" != none ] && [ "$CURRENT_EXPO_ACTION" != none ] && [ "$RESUME_EXPO_ACTION" != "$CURRENT_EXPO_ACTION" ]; then
            echo "Cannot combine resumed Expo action '$RESUME_EXPO_ACTION' with current action '$CURRENT_EXPO_ACTION' in one canonical UI publication." >&2
            exit 1
          fi

  promote_main:
    if: always() && needs.plan.result == 'success' && needs.release_admission.result == 'success' && needs.admit_release_notes.result == 'success' && inputs.dry_run != true && inputs.environment == 'production'
    needs: [plan, release_admission, admit_release_notes]
    uses: ./.github/workflows/promote-branch.yml
    secrets: inherit
    with:
      source: ${{ (inputs.confirm == 'release preview to main' || inputs.confirm == 'reset main from preview') && 'preview' || 'dev' }}
      source_sha: ${{ needs.admit_release_notes.outputs.source_sha }}
      target: main
      mode: ${{ (inputs.confirm == 'reset main from preview' || inputs.confirm == 'reset main from dev') && 'reset' || 'fast_forward' }}
      dry_run: ${{ inputs.dry_run }}
      allow_reset: ${{ inputs.confirm == 'reset main from preview' || inputs.confirm == 'reset main from dev' }}
      confirm: >-
        ${{
          (inputs.confirm == 'reset main from preview' || inputs.confirm == 'reset main from dev')
            && format('reset main from {0}', ((inputs.confirm == 'reset main from preview') && 'preview' || 'dev'))
            || format('promote main from {0}', ((inputs.confirm == 'release preview to main') && 'preview' || 'dev'))
        }}

  promote_preview:
    if: always() && needs.plan.result == 'success' && needs.release_admission.result == 'success' && needs.admit_release_notes.result == 'success' && inputs.dry_run != true && inputs.environment == 'preview'
    needs: [plan, release_admission, admit_release_notes]
    uses: ./.github/workflows/promote-branch.yml
    secrets: inherit
    with:
      source: dev
      source_sha: ${{ needs.admit_release_notes.outputs.source_sha }}
      target: preview
      mode: fast_forward
      dry_run: ${{ inputs.dry_run }}
      allow_reset: false
      confirm: promote preview from dev

  prepare_release_candidate:
    if: always() && needs.plan.result == 'success' && inputs.dry_run != true && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [plan, promote_preview, promote_main]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.authorized_sha }}
      release_notes_github_markdown: ${{ steps.release_notes.outputs.github_markdown }}
      release_notes_expo_message: ${{ steps.release_notes.outputs.expo_message }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Bind one exact promoted release-candidate SHA
        id: source
        env:
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          SOURCE_REF: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
        run: |
          set -euo pipefail
          node scripts/pipeline/github/resolve-authorized-release-source.mjs \
            --source-ref "refs/heads/$SOURCE_REF" \
            --authorized-sha "$AUTHORIZED_PROMOTION_SOURCE_SHA" \
            --remote origin \
            --github-output "$GITHUB_OUTPUT"
      - name: Checkout exact authorized release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          path: release-source
          ref: ${{ steps.source.outputs.authorized_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Project approved release notes from exact candidate
        id: release_notes
        env:
          RELEASE_NOTES_ID: ${{ inputs.release_notes_id }}
          SOURCE_SHA: ${{ steps.source.outputs.authorized_sha }}
        run: |
          set -euo pipefail
          UI_VERSION="$(node -p "require('./release-source/apps/ui/package.json').version")"
          CLI_VERSION="$(node -p "require('./release-source/apps/cli/package.json').version")"
          STACK_VERSION="$(node -p "require('./release-source/apps/stack/package.json').version")"
          SERVER_VERSION="$(node -p "require('./release-source/apps/server/package.json').version")"
          export UI_VERSION CLI_VERSION STACK_VERSION SERVER_VERSION
          node "$GITHUB_WORKSPACE/scripts/pipeline/release/release-notes/project-release-notes.mjs" \
            --release-id "$RELEASE_NOTES_ID" \
            --source-sha "$SOURCE_SHA" \
            --component-version "ui=$UI_VERSION" \
            --component-version "cli=$CLI_VERSION" \
            --component-version "stack=$STACK_VERSION" \
            --component-version "server=$SERVER_VERSION" \
            --changelog "$GITHUB_WORKSPACE/release-source/apps/ui/CHANGELOG.md" | \
            node --input-type=module -e '
              import { appendFileSync } from "node:fs";
              import { createHash } from "node:crypto";
              let raw = "";
              for await (const chunk of process.stdin) raw += chunk;
              const bundle = JSON.parse(raw);
              const expectedComponents = {
                ui: process.env.UI_VERSION,
                cli: process.env.CLI_VERSION,
                stack: process.env.STACK_VERSION,
                server: process.env.SERVER_VERSION,
              };
              const actualComponents = bundle.release?.components;
              const componentsMatch = actualComponents && Object.keys(expectedComponents).length === Object.keys(actualComponents).length && Object.entries(expectedComponents).every(([key, value]) => actualComponents[key] === value);
              if (bundle.kind !== "happier.release-notes.projection.v2" || bundle.schemaVersion !== 2 || bundle.release?.id !== process.env.RELEASE_NOTES_ID || bundle.release?.sourceSha !== process.env.SOURCE_SHA || !componentsMatch) {
                throw new Error("Invalid exact-candidate release-notes projection");
              }
              const values = {
                github_markdown: bundle.projections?.github?.markdown,
                expo_message: bundle.projections?.expo?.message,
              };
              for (const [key, value] of Object.entries(values)) {
                if (typeof value !== "string") throw new Error(`Missing ${key} projection`);
                const delimiter = `RELEASE_NOTES_${createHash("sha256").update(`${key}:${value}`).digest("hex")}`;
                appendFileSync(process.env.GITHUB_OUTPUT, `${key}<<${delimiter}\n${value}\n${delimiter}\n`);
              }
            '

  deploy_ui:
    if: always() && needs.resolve_resume.result == 'success' && needs.resolve_resume.outputs.deploy_ui_complete != 'true' && needs.plan.result == 'success' && needs.prepare_release_candidate.result == 'success' && needs.verify_release_candidates.result == 'success' && inputs.dry_run != true && needs.deploy_plan.outputs.deploy_ui_requested == 'true' && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [resolve_resume, plan, promote_preview, promote_main, deploy_plan, prepare_release_candidate, verify_release_candidates]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/promote-ui.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      force_deploy: ${{ inputs.force_deploy }}
      source_ref: ${{ needs.prepare_release_candidate.outputs.source_sha }}
      allow_cross_promote: true
      bump: none
      run_tests: false
      deploy_web: ${{ needs.deploy_plan.outputs.deploy_ui_web == 'true' }}
      expo_action: ${{ needs.deploy_plan.outputs.deploy_ui_expo_action }}
      desktop_mode: ${{ needs.deploy_plan.outputs.deploy_ui_desktop_mode }}
      release_notes_id: ${{ inputs.release_notes_id }}

  deploy_server:
