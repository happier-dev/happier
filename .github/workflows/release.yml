name: RELEASE — Publish (preview + production)

on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: "Release validation contract (stable adds update and daemon continuity)"
        required: true
        type: choice
        default: integrated
        options:
          - integrated
          - stable
      dry_run:
        description: "Safety — Run checks and show plan, but do not push/deploy"
        required: true
        default: false
        type: boolean
      environment:
        description: "Deploy — Target environment (deploy/<env>/*)"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      deploy_targets:
        description: "Deploy — Comma-separated targets: ui,server,website,docs,cli,stack,server_runner"
        required: true
        default: ui,server,website,docs
        type: string
      force_deploy:
        description: "Deploy — Force promote + deploy for enabled targets even if no relevant changes are detected (useful after infra failures)"
        required: true
        default: false
        type: boolean
      ui_expo_action:
        description: "Deploy — UI Expo action (none|ota|native|native_submit) for the selected environment"
        required: true
        default: none
        type: choice
        options:
          - none
          - ota
          - native
          - native_submit
      desktop_mode:
        description: "Deploy — Desktop artifacts mode"
        required: true
        type: choice
        default: none
        options:
          - none
          - build_only
          - build_and_publish
      bump:
        description: "Version bump admission — Final releases require none; materialize and commit changelog and version updates before dispatch."
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major
      authorized_promotion_source_sha:
        description: "Safety — exact source branch SHA approved for promotion"
        required: false
        default: ""
        type: string
      workflow_control_sha:
        description: "Safety — dispatcher-observed dev SHA; leave empty only for direct manual dispatch"
        required: false
        default: ""
        type: string
      resume_run_id:
        description: "Completed RELEASE run ID whose verified immutable candidates should be reused"
        required: false
        default: ""
        type: string
      confirm:
        description: "Confirm — Choose the exact action for this environment"
        required: true
        type: choice
        options:
          - release dev to preview
          - release preview to main
          - reset main from preview
          - release dev to main
          - reset main from dev

permissions:
  contents: write
  actions: read

concurrency:
  group: release-unified
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Admit trusted release workflow ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject cross-repository or untrusted release control
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/main") ;;
            *) echo "Untrusted release workflow ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac
      - name: Verify workflow-control SHA
        env:
          WORKFLOW_CONTROL_SHA: ${{ inputs.workflow_control_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_CONTROL_SHA" ]; then
            exit 0
          fi
          if ! [[ "$WORKFLOW_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow_control_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          if [ "$WORKFLOW_SHA" != "$WORKFLOW_CONTROL_SHA" ]; then
            echo "Workflow-control SHA drift: loaded '$WORKFLOW_SHA', expected '$WORKFLOW_CONTROL_SHA'." >&2
            exit 1
          fi

  release_actor_guard:
    name: Release actor guard
    needs: [trusted_ref_guard]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  resolve_resume:
    name: Resolve resumable release candidates
    needs: [release_actor_guard]
    uses: ./.github/workflows/resolve-release-resume.yml
    with:
      origin_run_id: ${{ inputs.resume_run_id }}
      expected_workflow: .github/workflows/release.yml
      expected_channel: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
      expected_source_sha: ${{ inputs.authorized_promotion_source_sha }}

  resolve_validation_profile:
    name: Resolve public release validation profile
    needs: [release_actor_guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
      checks_profile: ${{ steps.resolve.outputs.checks_profile }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Resolve profile
        id: resolve
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs release-contract | node --input-type=module -e '
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const contract = JSON.parse(raw);
            const profile = contract.validationProfiles?.find((candidate) => candidate.id === process.env.VALIDATION_PROFILE);
            if (
              contract.kind !== "happier.public-release-contract.v1" ||
              contract.schemaVersion !== 1 ||
              !profile?.normalRelease ||
              (profile?.checksProfile !== "fast" && profile?.checksProfile !== "full")
            ) {
              throw new Error(`Unsupported normal release validation profile: ${process.env.VALIDATION_PROFILE}`);
            }
            process.stdout.write(`profile=${profile.id}\nchecks_profile=${profile.checksProfile}\n`);
          ' >> "$GITHUB_OUTPUT"

  ci:
    name: CI Checks (tests.yml)
    needs: [resolve_validation_profile]
    if: ${{ needs.resolve_validation_profile.result == 'success' }}
    uses: ./.github/workflows/tests.yml
    with:
      run_ui: true
      run_server: true
      run_cli: true
      run_stack: true
      run_typecheck: true
      run_cli_daemon_e2e: true
      run_e2e_core: ${{ needs.resolve_validation_profile.outputs.checks_profile == 'full' }}
      run_server_db_contract: ${{ needs.resolve_validation_profile.outputs.checks_profile == 'full' }}
      run_providers: false
      providers_preset: all
      providers_tier: smoke
      run_stress: false
      run_release_contracts: true
      run_installers_smoke: false
      run_binary_smoke: false
      run_self_host_systemd: false
      run_self_host_launchd: false
      run_self_host_schtasks: false
      run_self_host_daemon: false

  plan:
    name: Release Plan (inputs + changes + bump/publish decisions)
    needs: [release_actor_guard, resolve_resume, resolve_validation_profile, ci]
    if: ${{ always() && needs.release_actor_guard.result == 'success' && needs.resolve_resume.result == 'success' && needs.resolve_validation_profile.result == 'success' && needs.ci.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed_ui: ${{ steps.plan.outputs.changed_ui }}
      changed_cli: ${{ steps.plan.outputs.changed_cli }}
      changed_server: ${{ steps.plan.outputs.changed_server }}
      changed_website: ${{ steps.plan.outputs.changed_website }}
      changed_docs: ${{ steps.plan.outputs.changed_docs }}
      changed_shared: ${{ steps.plan.outputs.changed_shared }}
      changed_stack: ${{ steps.plan.outputs.changed_stack }}
      bump_app: ${{ steps.bump_plan.outputs.bump_app }}
      bump_cli: ${{ steps.bump_plan.outputs.bump_cli }}
      bump_stack: ${{ steps.bump_plan.outputs.bump_stack }}
      bump_server: ${{ steps.bump_plan.outputs.bump_server }}
      bump_website: ${{ steps.bump_plan.outputs.bump_website }}
      should_bump: ${{ steps.bump_plan.outputs.should_bump }}
      publish_cli: ${{ steps.bump_plan.outputs.publish_cli }}
      publish_stack: ${{ steps.bump_plan.outputs.publish_stack }}
      publish_server: ${{ steps.bump_plan.outputs.publish_server }}
      validation_profile: ${{ needs.resolve_validation_profile.outputs.profile }}
      checks_profile: ${{ needs.resolve_validation_profile.outputs.checks_profile }}
    steps:
      - name: Validate inputs
        env:
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          BUMP: ${{ inputs.bump }}
          CONFIRM: ${{ inputs.confirm }}
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          confirm="$CONFIRM"
          env_name="$ENVIRONMENT"
          mode=""

          if [ "$BUMP" != "none" ]; then
            echo "Materialize and commit changelog and version updates, then rerun with --bump none." >&2
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ -z "$AUTHORIZED_PROMOTION_SOURCE_SHA" ]; then
            echo "authorized_promotion_source_sha is required when dry_run is false." >&2
            exit 1
          fi
          if [ -n "$AUTHORIZED_PROMOTION_SOURCE_SHA" ] && ! [[ "$AUTHORIZED_PROMOTION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "authorized_promotion_source_sha must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi

          if [ "$env_name" = "preview" ]; then
            if [ "$confirm" != "release dev to preview" ]; then
              echo "Confirmation mismatch for preview releases." >&2
              echo "Expected: release dev to preview" >&2
              echo "Got:      $confirm" >&2
              exit 1
            fi
            mode="preview_release"
          else
            case "$confirm" in
              "release preview to main") mode="promote_main_from_preview_fast_forward" ;;
              "reset main from preview") mode="promote_main_from_preview_reset" ;;
              "release dev to main") mode="promote_main_from_dev_fast_forward" ;;
              "reset main from dev") mode="promote_main_from_dev_reset" ;;
              *)
                echo "Unknown confirmation phrase: $confirm" >&2
                exit 1
                ;;
            esac
          fi

          # Validate deploy_targets extras (cli/stack are publishable targets).
          raw_targets="$DEPLOY_TARGETS"
          norm="$(printf '%s' "${raw_targets}" | tr '[:upper:]' '[:lower:]' | tr -d ' \t\r\n')"
          if [ -n "${norm:-}" ]; then
            IFS=',' read -r -a parts <<< "${norm}"
            for p in "${parts[@]}"; do
              [ -z "${p:-}" ] && continue
              case "${p}" in
                ui|server|website|docs|cli|stack|server_runner) ;;
                *)
                  echo "Unknown deploy_targets entry: '${p}'. Expected: ui,server,website,docs,cli,stack,server_runner" >&2
                  exit 1
                  ;;
              esac
            done
          fi

      - name: Enforce trusted refs for manual dispatch
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            dev|preview|main) ;;
            *)
              echo "Refusing workflow_dispatch from untrusted ref '${GITHUB_REF_NAME}'. Use dev, preview, or main." >&2
              exit 1
              ;;
          esac

      - name: Checkout authorized release planning source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.dry_run && ((inputs.confirm == 'release preview to main' || inputs.confirm == 'reset main from preview') && 'preview' || 'dev') || inputs.authorized_promotion_source_sha }}
          fetch-depth: 0

      - name: Verify authorized promotion source
        env:
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_BRANCH: ${{ (inputs.confirm == 'release preview to main' || inputs.confirm == 'reset main from preview') && 'preview' || 'dev' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            exit 0
          fi
          checkout_sha="$(git rev-parse HEAD)"
          source_sha="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk 'NR == 1 { print $1 }')"
          if [ "$checkout_sha" != "$AUTHORIZED_PROMOTION_SOURCE_SHA" ]; then
            echo "Checked out source did not match the authorized promotion SHA." >&2
            exit 1
          fi
          if [ "$source_sha" != "$AUTHORIZED_PROMOTION_SOURCE_SHA" ]; then
            echo "Source branch changed before release planning; refusing to continue." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        if: ${{ needs.resolve_validation_profile.outputs.checks_profile == 'full' }}
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        if: ${{ needs.resolve_validation_profile.outputs.checks_profile == 'full' }}
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Test + typecheck
        run: |
          set -euo pipefail
          echo "CI checks ran in job 'ci' (tests/typecheck/e2e/providers/stress as configured)."

      - name: Build website
        if: ${{ needs.resolve_validation_profile.outputs.checks_profile == 'full' }}
        run: yarn website:build

      - name: Build docs
        if: ${{ needs.resolve_validation_profile.outputs.checks_profile == 'full' }}
        run: yarn docs:build

      - name: CLI smoke test (Linux)
        if: ${{ needs.resolve_validation_profile.outputs.checks_profile == 'full' }}
        run: node scripts/pipeline/run.mjs smoke-cli

      - name: Compute changed components (main..authorized source)
        id: plan
        run: |
          set -euo pipefail

          git fetch origin main dev --prune --tags

          source_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"

          node scripts/pipeline/run.mjs release-compute-changed-components \
            --base "$main_sha" \
            --head "$source_sha" \
            --out "$GITHUB_OUTPUT"

      - name: Compute versioned component changes (latest release tags..release head)
        id: versioned_plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          git fetch origin main dev preview --prune --tags

          plan_head_sha="$(git rev-parse HEAD)"

          node scripts/pipeline/run.mjs release-compute-versioned-component-changes \
            --environment "$ENVIRONMENT" \
            --head "$plan_head_sha" \
            --out "$GITHUB_OUTPUT"

      - name: Release plan summary
        env:
          APP_BASELINE_TAG: ${{ steps.versioned_plan.outputs.app_baseline_tag || 'none' }}
          CHANGED_CLI: ${{ steps.plan.outputs.changed_cli }}
          CHANGED_DOCS: ${{ steps.plan.outputs.changed_docs }}
          CHANGED_SERVER: ${{ steps.plan.outputs.changed_server }}
          CHANGED_SHARED: ${{ steps.plan.outputs.changed_shared }}
          CHANGED_STACK: ${{ steps.plan.outputs.changed_stack }}
          CHANGED_UI: ${{ steps.plan.outputs.changed_ui }}
          CHANGED_WEBSITE: ${{ steps.plan.outputs.changed_website }}
          CHECKS_PROFILE: ${{ needs.resolve_validation_profile.outputs.checks_profile }}
          CLI_BASELINE_TAG: ${{ steps.versioned_plan.outputs.cli_baseline_tag || 'none' }}
          COMMIT_COUNT: ${{ steps.plan.outputs.commit_count }}
          CONFIRM: ${{ inputs.confirm }}
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          DESKTOP_MODE: ${{ inputs.desktop_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ inputs.environment }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          RELEASE_BUMP: ${{ inputs.bump }}
          STACK_BASELINE_TAG: ${{ steps.versioned_plan.outputs.stack_baseline_tag || 'none' }}
          UI_EXPO_ACTION: ${{ inputs.ui_expo_action }}
          VERSIONED_APP_CHANGED: ${{ steps.versioned_plan.outputs.changed_app }}
          VERSIONED_CLI_CHANGED: ${{ steps.versioned_plan.outputs.changed_cli }}
          VERSIONED_SERVER_CHANGED: ${{ steps.versioned_plan.outputs.changed_server }}
          VERSIONED_STACK_CHANGED: ${{ steps.versioned_plan.outputs.changed_stack }}
          SERVER_BASELINE_TAG: ${{ steps.versioned_plan.outputs.server_baseline_tag || 'none' }}
        run: |
          set -euo pipefail

          {
            echo "## Release plan (dev → main)"
            echo ""
            echo "- checks_profile: \`$CHECKS_PROFILE\`"
            echo "- environment: \`$ENVIRONMENT\`"
            echo "- confirm: \`$CONFIRM\`"
            echo "- dry_run: \`$DRY_RUN\`"
            echo "- deploy_targets: \`$DEPLOY_TARGETS\`"
            echo "- force_deploy: \`$FORCE_DEPLOY\`"
            echo "- bump: \`$RELEASE_BUMP\`"
            echo "- ui_expo_action: \`$UI_EXPO_ACTION\` (builder=\`eas_cloud\`, platform=\`all\`, profile=\`auto\`, android_release_status=\`draft\`)"
            echo "- desktop_mode: \`$DESKTOP_MODE\`"
            echo ""
            echo "- commits to release (main..dev): \`$COMMIT_COUNT\`"
            echo ""
            echo "### Changed components (main..dev)"
            echo "- ui: \`$CHANGED_UI\`"
            echo "- cli: \`$CHANGED_CLI\`"
            echo "- server: \`$CHANGED_SERVER\`"
            echo "- stack: \`$CHANGED_STACK\`"
            echo "- website: \`$CHANGED_WEBSITE\`"
            echo "- docs: \`$CHANGED_DOCS\`"
            echo "- shared (agents/protocol): \`$CHANGED_SHARED\`"
            echo ""
            echo "### Versioned components since latest release tags"
            echo "- app: \`$VERSIONED_APP_CHANGED\` (baseline=\`$APP_BASELINE_TAG\`)"
            echo "- cli: \`$VERSIONED_CLI_CHANGED\` (baseline=\`$CLI_BASELINE_TAG\`)"
            echo "- stack: \`$VERSIONED_STACK_CHANGED\` (baseline=\`$STACK_BASELINE_TAG\`)"
            echo "- server: \`$VERSIONED_SERVER_CHANGED\` (baseline=\`$SERVER_BASELINE_TAG\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve publish + bump plan
        id: bump_plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUMP_PRESET: ${{ inputs.bump }}
          BUMP_APP_OVERRIDE: preset
          BUMP_CLI_OVERRIDE: preset
          BUMP_STACK_OVERRIDE: preset
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          CHANGED_UI: ${{ steps.plan.outputs.changed_ui }}
          CHANGED_CLI: ${{ steps.plan.outputs.changed_cli }}
          CHANGED_SERVER: ${{ steps.plan.outputs.changed_server }}
          CHANGED_WEBSITE: ${{ steps.plan.outputs.changed_website }}
          CHANGED_STACK: ${{ steps.plan.outputs.changed_stack }}
          CHANGED_SHARED: ${{ steps.plan.outputs.changed_shared }}
          VERSIONED_APP_CHANGED: ${{ steps.versioned_plan.outputs.changed_app }}
          VERSIONED_CLI_CHANGED: ${{ steps.versioned_plan.outputs.changed_cli }}
          VERSIONED_STACK_CHANGED: ${{ steps.versioned_plan.outputs.changed_stack }}
          VERSIONED_SERVER_CHANGED: ${{ steps.versioned_plan.outputs.changed_server }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs release-resolve-bump-plan \
            --environment "${ENVIRONMENT}" \
            --bump-preset "${BUMP_PRESET}" \
            --require-materialized \
            --bump-app-override "${BUMP_APP_OVERRIDE}" \
            --bump-cli-override "${BUMP_CLI_OVERRIDE}" \
            --bump-stack-override "${BUMP_STACK_OVERRIDE}" \
            --deploy-targets "${DEPLOY_TARGETS}" \
            --changed-ui "${CHANGED_UI}" \
            --changed-cli "${CHANGED_CLI}" \
            --changed-stack "${CHANGED_STACK}" \
            --changed-server "${CHANGED_SERVER}" \
            --changed-website "${CHANGED_WEBSITE}" \
            --changed-shared "${CHANGED_SHARED}" \
            --versioned-app-changed "${VERSIONED_APP_CHANGED}" \
            --versioned-cli-changed "${VERSIONED_CLI_CHANGED}" \
            --versioned-stack-changed "${VERSIONED_STACK_CHANGED}" \
            --versioned-server-changed "${VERSIONED_SERVER_CHANGED}" \
            --github-output "$GITHUB_OUTPUT"

  deploy_plan:
    name: deploy_plan (source → deploy branches)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      always() && needs.plan.result == 'success' && (
        contains(format(',{0},', inputs.deploy_targets), ',server,') ||
        contains(format(',{0},', inputs.deploy_targets), ',website,') ||
        contains(format(',{0},', inputs.deploy_targets), ',docs,') ||
        (inputs.environment == 'production' && contains(format(',{0},', inputs.deploy_targets), ',ui,'))
      )
    needs: [plan, promote_preview, promote_main]
    outputs:
      deploy_ui_needed: ${{ steps.plan.outputs.deploy_ui_needed }}
      deploy_server_needed: ${{ steps.plan.outputs.deploy_server_needed }}
      deploy_website_needed: ${{ steps.plan.outputs.deploy_website_needed }}
      deploy_docs_needed: ${{ steps.plan.outputs.deploy_docs_needed }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout release source as inert data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
          fetch-depth: 0
          persist-credentials: false
          path: release-source

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Compute deploy plan (deploy/<env>/* behind release source?)
        id: plan
        working-directory: release-source
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REF: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          DEPLOY_UI: ${{ contains(format(',{0},', inputs.deploy_targets), ',ui,') }}
          DEPLOY_SERVER: ${{ contains(format(',{0},', inputs.deploy_targets), ',server,') }}
          DEPLOY_WEBSITE: ${{ contains(format(',{0},', inputs.deploy_targets), ',website,') }}
          DEPLOY_DOCS: ${{ contains(format(',{0},', inputs.deploy_targets), ',docs,') }}
        run: |
          set -euo pipefail
          node ../scripts/pipeline/release/compute-deploy-plan.mjs \
            --deploy-environment "${ENVIRONMENT}" \
            --source-ref "${SOURCE_REF}" \
            --force-deploy "${FORCE_DEPLOY}" \
            --deploy-ui "${DEPLOY_UI}" \
            --deploy-server "${DEPLOY_SERVER}" \
            --deploy-website "${DEPLOY_WEBSITE}" \
            --deploy-docs "${DEPLOY_DOCS}" \
            --github-output "$GITHUB_OUTPUT"

  promote_main:
    if: always() && needs.plan.result == 'success' && inputs.dry_run != true && inputs.environment == 'production'
    needs: [plan]
    uses: ./.github/workflows/promote-branch.yml
    secrets: inherit
    with:
      source: ${{ (inputs.confirm == 'release preview to main' || inputs.confirm == 'reset main from preview') && 'preview' || 'dev' }}
      source_sha: ${{ inputs.authorized_promotion_source_sha }}
      target: main
      mode: ${{ (inputs.confirm == 'reset main from preview' || inputs.confirm == 'reset main from dev') && 'reset' || 'fast_forward' }}
      dry_run: ${{ inputs.dry_run }}
      allow_reset: ${{ inputs.confirm == 'reset main from preview' || inputs.confirm == 'reset main from dev' }}
      confirm: >-
        ${{
          (inputs.confirm == 'reset main from preview' || inputs.confirm == 'reset main from dev')
            && format('reset main from {0}', ((inputs.confirm == 'reset main from preview') && 'preview' || 'dev'))
            || format('promote main from {0}', ((inputs.confirm == 'release preview to main') && 'preview' || 'dev'))
        }}

  promote_preview:
    if: always() && needs.plan.result == 'success' && inputs.dry_run != true && inputs.environment == 'preview'
    needs: [plan]
    uses: ./.github/workflows/promote-branch.yml
    secrets: inherit
    with:
      source: dev
      source_sha: ${{ inputs.authorized_promotion_source_sha }}
      target: preview
      mode: fast_forward
      dry_run: ${{ inputs.dry_run }}
      allow_reset: false
      confirm: promote preview from dev

  bind_server_source:
    if: always() && needs.plan.result == 'success' && inputs.dry_run != true && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [plan, promote_preview, promote_main]
    runs-on: ubuntu-latest
    outputs:
      authorized_sha: ${{ steps.source.outputs.authorized_sha }}
      release_notes_github_markdown: ${{ steps.release_notes.outputs.github_markdown }}
      release_notes_expo_message: ${{ steps.release_notes.outputs.expo_message }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Bind one exact post-promotion server SHA
        id: source
        env:
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          SOURCE_REF: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
        run: |
          set -euo pipefail
          node scripts/pipeline/github/resolve-authorized-release-source.mjs \
            --source-ref "refs/heads/$SOURCE_REF" \
            --authorized-sha "$AUTHORIZED_PROMOTION_SOURCE_SHA" \
            --remote origin \
            --github-output "$GITHUB_OUTPUT"
      - name: Checkout exact authorized release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          path: release-source
          ref: ${{ steps.source.outputs.authorized_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Project approved release notes from exact candidate
        id: release_notes
        run: |
          set -euo pipefail
          version="$(node -p "require('./release-source/apps/ui/package.json').version")"
          VERSION="$version" node scripts/pipeline/release/release-notes/project-release-notes.mjs \
            --version "$version" \
            --changelog "$GITHUB_WORKSPACE/release-source/apps/ui/CHANGELOG.md" | \
            VERSION="$version" node --input-type=module -e '
              import { appendFileSync } from "node:fs";
              import { createHash } from "node:crypto";
              let raw = "";
              for await (const chunk of process.stdin) raw += chunk;
              const bundle = JSON.parse(raw);
              if (bundle.kind !== "happier.release-notes.projection.v1" || bundle.schemaVersion !== 1 || bundle.version !== process.env.VERSION) {
                throw new Error("Invalid exact-candidate release-notes projection");
              }
              const values = {
                github_markdown: bundle.projections?.github?.markdown,
                expo_message: bundle.projections?.expo?.message,
              };
              for (const [key, value] of Object.entries(values)) {
                if (typeof value !== "string") throw new Error(`Missing ${key} projection`);
                const delimiter = `RELEASE_NOTES_${createHash("sha256").update(`${key}:${value}`).digest("hex")}`;
                appendFileSync(process.env.GITHUB_OUTPUT, `${key}<<${delimiter}\n${value}\n${delimiter}\n`);
              }
            '

  deploy_ui:
    if: always() && needs.plan.result == 'success' && needs.verify_release_candidates.result == 'success' && inputs.dry_run != true && contains(format(',{0},', inputs.deploy_targets), ',ui,') && (needs.deploy_plan.outputs.deploy_ui_needed == 'true' || inputs.force_deploy == true || inputs.ui_expo_action != 'none') && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [plan, promote_preview, promote_main, deploy_plan, bind_server_source, verify_release_candidates]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/promote-ui.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      force_deploy: ${{ inputs.force_deploy }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      allow_cross_promote: false
      bump: none
      deploy_web: ${{ inputs.environment == 'production' }}
      expo_action: ${{ inputs.ui_expo_action }}
      android_release_status: draft
      desktop_mode: ${{ inputs.desktop_mode }}
      run_tests: false
      expo_update_message: ${{ needs.bind_server_source.outputs.release_notes_expo_message }}

  deploy_server:
    if: always() && needs.plan.result == 'success' && needs.bind_server_source.result == 'success' && (needs.promote_server_runtime.result == 'success' || needs.promote_server_runtime.result == 'skipped') && inputs.dry_run != true && contains(format(',{0},', inputs.deploy_targets), ',server,') && (needs.deploy_plan.outputs.deploy_server_needed == 'true' || inputs.force_deploy == true) && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [plan, promote_preview, promote_main, deploy_plan, bind_server_source, promote_server_runtime]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/promote-server.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      force_deploy: ${{ inputs.force_deploy }}
      source_ref: ${{ needs.bind_server_source.outputs.authorized_sha }}
      allow_cross_promote: true
      bump: none
      publish_runtime_release: false
      run_tests: false

  publish_server_runtime:
    if: always() && needs.plan.result == 'success' && needs.bind_server_source.result == 'success' && inputs.dry_run != true && (needs.plan.outputs.publish_server == 'true' || inputs.force_deploy == true || needs.plan.outputs.changed_ui == 'true' || needs.plan.outputs.changed_server == 'true' || needs.plan.outputs.changed_shared == 'true') && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [resolve_resume, plan, promote_preview, promote_main, bind_server_source]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-server-runtime.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      authorized_sha: ${{ needs.bind_server_source.outputs.authorized_sha }}
      resume_version: ${{ needs.resolve_resume.outputs.server_version }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ${{ needs.bind_server_source.outputs.release_notes_github_markdown }}
      publish_rolling: false

  publish_ui_web:
    if: always() && needs.plan.result == 'success' && inputs.dry_run != true && (contains(format(',{0},', inputs.deploy_targets), ',ui,') || inputs.force_deploy == true || needs.plan.outputs.changed_ui == 'true' || needs.plan.outputs.changed_shared == 'true') && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [resolve_resume, plan, promote_preview, promote_main, bind_server_source]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-ui-web.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      authorized_sha: ${{ needs.bind_server_source.outputs.authorized_sha }}
      resume_version: ${{ needs.resolve_resume.outputs.ui_web_version }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ${{ needs.bind_server_source.outputs.release_notes_github_markdown }}
      publish_rolling: false

  publish_cli_binaries:
    if: always() && needs.plan.result == 'success' && needs.bind_server_source.result == 'success' && inputs.dry_run != true && (inputs.force_deploy == true || needs.plan.outputs.publish_cli == 'true' || needs.plan.outputs.changed_cli == 'true' || needs.plan.outputs.changed_shared == 'true') && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [resolve_resume, plan, promote_preview, promote_main, bind_server_source]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-cli-binaries.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      authorized_sha: ${{ needs.bind_server_source.outputs.authorized_sha }}
      resume_version: ${{ needs.resolve_resume.outputs.cli_version }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ${{ needs.bind_server_source.outputs.release_notes_github_markdown }}
      publish_rolling: false

  publish_hstack_binaries:
    if: always() && needs.plan.result == 'success' && needs.bind_server_source.result == 'success' && inputs.dry_run != true && needs.plan.outputs.publish_stack == 'true' && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [resolve_resume, plan, promote_preview, promote_main, bind_server_source]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-hstack-binaries.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      authorized_sha: ${{ needs.bind_server_source.outputs.authorized_sha }}
      resume_version: ${{ needs.resolve_resume.outputs.stack_version }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ${{ needs.bind_server_source.outputs.release_notes_github_markdown }}
      publish_rolling: false

  supported_old_relay_compatibility:
    name: Verify bound candidate against supported old relay
    if: ${{ always() && needs.plan.result == 'success' && needs.bind_server_source.result == 'success' && needs.plan.outputs.validation_profile == 'stable' }}
    needs: [plan, bind_server_source]
    uses: ./.github/workflows/tests.yml
    with:
      checkout_sha: ${{ needs.bind_server_source.outputs.authorized_sha }}
      run_ui: false
      run_server: false
      run_server_db_contract: false
      run_cli: false
      run_stack: false
      run_typecheck: false
      run_cli_daemon_e2e: false
      run_e2e_core: false
      run_e2e_core_slow: true
      run_installers_smoke: false
      run_binary_smoke: false

  verify_release_candidates:
    name: Verify exact immutable release candidates
    if: ${{ always() && needs.plan.result == 'success' && needs.bind_server_source.result == 'success' && (needs.plan.outputs.validation_profile != 'stable' || needs.supported_old_relay_compatibility.result == 'success') && (needs.publish_cli_binaries.result == 'success' || needs.publish_cli_binaries.result == 'skipped') && (needs.publish_hstack_binaries.result == 'success' || needs.publish_hstack_binaries.result == 'skipped') && (needs.publish_server_runtime.result == 'success' || needs.publish_server_runtime.result == 'skipped') && (needs.publish_ui_web.result == 'success' || needs.publish_ui_web.result == 'skipped') }}
    needs: [plan, bind_server_source, supported_old_relay_compatibility, publish_cli_binaries, publish_hstack_binaries, publish_server_runtime, publish_ui_web]
    uses: ./.github/workflows/release-verify.yml
    with:
      channel: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
      candidate_source_sha: ${{ needs.bind_server_source.outputs.authorized_sha }}
      candidate_cli_version: ${{ needs.publish_cli_binaries.outputs.version }}
      candidate_stack_version: ${{ needs.publish_hstack_binaries.outputs.version }}
      candidate_server_version: ${{ needs.publish_server_runtime.outputs.version }}
      candidate_ui_web_version: ${{ needs.publish_ui_web.outputs.version }}
      verify_stack_release: ${{ needs.publish_hstack_binaries.result == 'success' }}
      validation_profile: ${{ needs.plan.outputs.validation_profile }}

  promote_server_runtime:
    if: ${{ always() && needs.verify_release_candidates.result == 'success' && needs.publish_server_runtime.result == 'success' && needs.publish_server_runtime.outputs.version != '' }}
    needs: [bind_server_source, verify_release_candidates, publish_server_runtime]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-server-runtime.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ${{ needs.bind_server_source.outputs.release_notes_github_markdown }}
      retry_version: ${{ needs.publish_server_runtime.outputs.version }}

  promote_ui_web:
    if: ${{ always() && needs.verify_release_candidates.result == 'success' && needs.publish_ui_web.result == 'success' && needs.publish_ui_web.outputs.version != '' && (needs.promote_server_runtime.result == 'success' || needs.promote_server_runtime.result == 'skipped') }}
    needs: [bind_server_source, verify_release_candidates, publish_ui_web, promote_server_runtime]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-ui-web.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ${{ needs.bind_server_source.outputs.release_notes_github_markdown }}
      retry_version: ${{ needs.publish_ui_web.outputs.version }}

  promote_cli_binaries:
    if: ${{ always() && needs.verify_release_candidates.result == 'success' && needs.publish_cli_binaries.result == 'success' && needs.publish_cli_binaries.outputs.version != '' && (needs.promote_ui_web.result == 'success' || needs.promote_ui_web.result == 'skipped') }}
    needs: [bind_server_source, verify_release_candidates, publish_cli_binaries, promote_ui_web]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-cli-binaries.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ${{ needs.bind_server_source.outputs.release_notes_github_markdown }}
      retry_version: ${{ needs.publish_cli_binaries.outputs.version }}

  promote_hstack_binaries:
    if: ${{ always() && needs.verify_release_candidates.result == 'success' && needs.publish_hstack_binaries.result == 'success' && needs.publish_hstack_binaries.outputs.version != '' }}
    needs: [bind_server_source, verify_release_candidates, publish_hstack_binaries]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-hstack-binaries.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      allow_stable: ${{ inputs.environment == 'production' }}
      release_message: ${{ needs.bind_server_source.outputs.release_notes_github_markdown }}
      retry_version: ${{ needs.publish_hstack_binaries.outputs.version }}

  publish_docker:
    if: always() && needs.plan.result == 'success' && needs.verify_release_candidates.result == 'success' && inputs.dry_run != true && (inputs.force_deploy == true || needs.plan.outputs.changed_ui == 'true' || needs.plan.outputs.changed_server == 'true' || needs.plan.outputs.changed_cli == 'true' || needs.plan.outputs.changed_shared == 'true') && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success')) && (needs.promote_cli_binaries.result == 'success' || needs.promote_cli_binaries.result == 'skipped') && (needs.promote_server_runtime.result == 'success' || needs.promote_server_runtime.result == 'skipped') && (needs.promote_ui_web.result == 'success' || needs.promote_ui_web.result == 'skipped')
    needs: [plan, promote_preview, promote_main, bind_server_source, verify_release_candidates, publish_cli_binaries, publish_server_runtime, promote_cli_binaries, promote_server_runtime, promote_ui_web]
    permissions:
      contents: read
    uses: ./.github/workflows/publish-docker.yml
    secrets: inherit
    with:
      channel: ${{ inputs.environment == 'production' && 'stable' || 'preview' }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      authorized_sha: ${{ needs.bind_server_source.outputs.authorized_sha }}
      server_version: ${{ needs.publish_server_runtime.outputs.version }}
      cli_version: ${{ needs.publish_cli_binaries.outputs.version }}
      push_latest: true
      build_relay: ${{ inputs.force_deploy == true || needs.plan.outputs.changed_ui == 'true' || needs.plan.outputs.changed_server == 'true' || needs.plan.outputs.changed_shared == 'true' }}
      build_dev_box: ${{ inputs.force_deploy == true || needs.plan.outputs.changed_cli == 'true' || needs.plan.outputs.changed_shared == 'true' }}

  deploy_website:
    if: always() && needs.plan.result == 'success' && inputs.dry_run != true && contains(format(',{0},', inputs.deploy_targets), ',website,') && (needs.deploy_plan.outputs.deploy_website_needed == 'true' || inputs.force_deploy == true) && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [plan, promote_preview, promote_main, deploy_plan]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/promote-website.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      force_deploy: ${{ inputs.force_deploy }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      allow_cross_promote: false
      bump: none
      run_build: true

  deploy_docs:
    if: always() && needs.plan.result == 'success' && inputs.dry_run != true && contains(format(',{0},', inputs.deploy_targets), ',docs,') && (needs.deploy_plan.outputs.deploy_docs_needed == 'true' || inputs.force_deploy == true) && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [plan, promote_preview, promote_main, deploy_plan]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/promote-docs.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      force_deploy: ${{ inputs.force_deploy }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      allow_cross_promote: false
      run_build: true

  publish_npm:
    if: always() && needs.plan.result == 'success' && needs.verify_release_candidates.result == 'success' && inputs.dry_run != true && (needs.plan.outputs.publish_cli == 'true' || needs.plan.outputs.publish_stack == 'true' || needs.plan.outputs.publish_server == 'true') && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [plan, promote_preview, promote_main, bind_server_source, verify_release_candidates]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-npm.yml
    secrets: inherit
    with:
      publish_cli: ${{ needs.plan.outputs.publish_cli == 'true' }}
      publish_stack: ${{ needs.plan.outputs.publish_stack == 'true' }}
      publish_server: ${{ needs.plan.outputs.publish_server == 'true' }}
      channel: ${{ inputs.environment }}
      source_ref: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
      npm_tag: ${{ inputs.environment == 'production' && 'latest' || 'next' }}
      run_tests: false
      release_message: ${{ needs.bind_server_source.outputs.release_notes_github_markdown }}

  release_verify:
    name: Release Verification (release-verify.yml)
    needs: [plan, bind_server_source, publish_hstack_binaries, promote_hstack_binaries, promote_cli_binaries, promote_server_runtime, promote_ui_web, publish_docker, publish_npm]
    if: ${{ always() && needs.plan.outputs.checks_profile == 'full' && inputs.dry_run != true && needs.plan.result == 'success' && (needs.promote_hstack_binaries.result == 'success' || needs.promote_hstack_binaries.result == 'skipped') && (needs.promote_cli_binaries.result == 'success' || needs.promote_cli_binaries.result == 'skipped') && (needs.promote_server_runtime.result == 'success' || needs.promote_server_runtime.result == 'skipped') && (needs.promote_ui_web.result == 'success' || needs.promote_ui_web.result == 'skipped') && (needs.publish_docker.result == 'success' || needs.publish_docker.result == 'skipped') && (needs.publish_npm.result == 'success' || needs.publish_npm.result == 'skipped') }}
    uses: ./.github/workflows/release-verify.yml
    with:
      channel: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
      candidate_source_sha: ${{ needs.bind_server_source.outputs.authorized_sha }}
      candidate_stack_version: ${{ needs.publish_hstack_binaries.outputs.version }}
      verify_stack_release: ${{ needs.promote_hstack_binaries.result == 'success' }}
      validation_profile: ${{ needs.plan.outputs.validation_profile }}

  release_status:
    name: Summarize release status
    if: ${{ always() }}
    needs: [plan, bind_server_source, supported_old_relay_compatibility, publish_cli_binaries, publish_hstack_binaries, publish_server_runtime, publish_ui_web, verify_release_candidates, promote_server_runtime, promote_ui_web, promote_cli_binaries, promote_hstack_binaries, publish_docker, publish_npm, release_verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release status projector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Project terminal release status
        env:
          CHANNEL: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          PLAN_RESULT: ${{ needs.plan.result }}
          BIND_SOURCE_RESULT: ${{ needs.bind_server_source.result }}
          VALIDATION_PROFILE: ${{ needs.plan.outputs.validation_profile }}
          PUBLISH_CLI: ${{ needs.plan.outputs.publish_cli }}
          PUBLISH_HSTACK: ${{ needs.plan.outputs.publish_stack }}
          PUBLISH_SERVER: ${{ needs.plan.outputs.publish_server }}
          CHANGED_UI: ${{ needs.plan.outputs.changed_ui }}
          CHANGED_CLI: ${{ needs.plan.outputs.changed_cli }}
          CHANGED_SERVER: ${{ needs.plan.outputs.changed_server }}
          CHANGED_SHARED: ${{ needs.plan.outputs.changed_shared }}
          SOURCE_SHA: ${{ needs.bind_server_source.outputs.authorized_sha }}
          OLD_RELAY_COMPATIBILITY_RESULT: ${{ needs.supported_old_relay_compatibility.result }}
          CLI_RESULT: ${{ needs.publish_cli_binaries.result }}
          CLI_VERSION: ${{ needs.publish_cli_binaries.outputs.version }}
          HSTACK_RESULT: ${{ needs.publish_hstack_binaries.result }}
          HSTACK_VERSION: ${{ needs.publish_hstack_binaries.outputs.version }}
          SERVER_RESULT: ${{ needs.publish_server_runtime.result }}
          SERVER_VERSION: ${{ needs.publish_server_runtime.outputs.version }}
          UI_WEB_RESULT: ${{ needs.publish_ui_web.result }}
          UI_WEB_VERSION: ${{ needs.publish_ui_web.outputs.version }}
          CANDIDATE_VERIFY_RESULT: ${{ needs.verify_release_candidates.result }}
          PROMOTE_SERVER_RESULT: ${{ needs.promote_server_runtime.result }}
          PROMOTE_UI_WEB_RESULT: ${{ needs.promote_ui_web.result }}
          PROMOTE_CLI_RESULT: ${{ needs.promote_cli_binaries.result }}
          PROMOTE_HSTACK_RESULT: ${{ needs.promote_hstack_binaries.result }}
          DOCKER_RESULT: ${{ needs.publish_docker.result }}
          NPM_RESULT: ${{ needs.publish_npm.result }}
          RELEASE_VERIFY_RESULT: ${{ needs.release_verify.result }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/release-status-input.json"
          const normalizeResult = (value) => value === 'success' ? 'success' : value === 'skipped' ? 'skipped' : 'failed';
          const isTrue = (value) => value === 'true';
          const candidateReleaseRequested = process.env.DRY_RUN !== 'true'
            && process.env.PLAN_RESULT === 'success'
            && process.env.BIND_SOURCE_RESULT === 'success';
          const forceDeploy = isTrue(process.env.FORCE_DEPLOY);
          const deployTargets = new Set((process.env.DEPLOY_TARGETS ?? '').split(','));
          const requested = {
            cli: candidateReleaseRequested && (forceDeploy || isTrue(process.env.PUBLISH_CLI) || isTrue(process.env.CHANGED_CLI) || isTrue(process.env.CHANGED_SHARED)),
            hstack: candidateReleaseRequested && isTrue(process.env.PUBLISH_HSTACK),
            server: candidateReleaseRequested && (isTrue(process.env.PUBLISH_SERVER) || forceDeploy || isTrue(process.env.CHANGED_UI) || isTrue(process.env.CHANGED_SERVER) || isTrue(process.env.CHANGED_SHARED)),
            'ui-web': candidateReleaseRequested && (deployTargets.has('ui') || forceDeploy || isTrue(process.env.CHANGED_UI) || isTrue(process.env.CHANGED_SHARED)),
            'supported-old-relay-compatibility': candidateReleaseRequested && process.env.VALIDATION_PROFILE === 'stable',
            'candidate-verification': process.env.DRY_RUN !== 'true',
          };
          requested['promote-server'] = requested.server && normalizeResult(process.env.CANDIDATE_VERIFY_RESULT) === 'success' && normalizeResult(process.env.SERVER_RESULT) === 'success';
          requested['promote-ui-web'] = requested['ui-web'] && normalizeResult(process.env.CANDIDATE_VERIFY_RESULT) === 'success' && normalizeResult(process.env.UI_WEB_RESULT) === 'success' && (normalizeResult(process.env.PROMOTE_SERVER_RESULT) === 'success' || normalizeResult(process.env.PROMOTE_SERVER_RESULT) === 'skipped');
          requested['promote-cli'] = requested.cli && normalizeResult(process.env.CANDIDATE_VERIFY_RESULT) === 'success' && normalizeResult(process.env.CLI_RESULT) === 'success' && (normalizeResult(process.env.PROMOTE_UI_WEB_RESULT) === 'success' || normalizeResult(process.env.PROMOTE_UI_WEB_RESULT) === 'skipped');
          requested['promote-hstack'] = requested.hstack && normalizeResult(process.env.CANDIDATE_VERIFY_RESULT) === 'success' && normalizeResult(process.env.HSTACK_RESULT) === 'success';
          requested.docker = candidateReleaseRequested
            && normalizeResult(process.env.CANDIDATE_VERIFY_RESULT) === 'success'
            && (forceDeploy || isTrue(process.env.CHANGED_UI) || isTrue(process.env.CHANGED_SERVER) || isTrue(process.env.CHANGED_CLI) || isTrue(process.env.CHANGED_SHARED));
          requested.npm = candidateReleaseRequested
            && normalizeResult(process.env.CANDIDATE_VERIFY_RESULT) === 'success'
            && (isTrue(process.env.PUBLISH_CLI) || isTrue(process.env.PUBLISH_HSTACK) || isTrue(process.env.PUBLISH_SERVER));
          requested['release-verification'] = candidateReleaseRequested
            && process.env.VALIDATION_PROFILE === 'stable'
            && normalizeResult(process.env.CANDIDATE_VERIFY_RESULT) === 'success'
            && [process.env.PROMOTE_HSTACK_RESULT, process.env.PROMOTE_CLI_RESULT, process.env.PROMOTE_SERVER_RESULT, process.env.PROMOTE_UI_WEB_RESULT, process.env.DOCKER_RESULT, process.env.NPM_RESULT]
              .map(normalizeResult)
              .every((result) => result === 'success' || result === 'skipped');
          const definitions = [
            { id: 'cli', envName: 'CLI_RESULT', product: 'cli', versionName: 'CLI_VERSION' },
            { id: 'hstack', envName: 'HSTACK_RESULT', product: 'stack', versionName: 'HSTACK_VERSION' },
            { id: 'server', envName: 'SERVER_RESULT', product: 'server', versionName: 'SERVER_VERSION' },
            { id: 'ui-web', envName: 'UI_WEB_RESULT', product: 'ui-web', versionName: 'UI_WEB_VERSION' },
            { id: 'supported-old-relay-compatibility', envName: 'OLD_RELAY_COMPATIBILITY_RESULT' },
            { id: 'candidate-verification', envName: 'CANDIDATE_VERIFY_RESULT' },
            { id: 'promote-server', envName: 'PROMOTE_SERVER_RESULT' },
            { id: 'promote-ui-web', envName: 'PROMOTE_UI_WEB_RESULT' },
            { id: 'promote-cli', envName: 'PROMOTE_CLI_RESULT' },
            { id: 'promote-hstack', envName: 'PROMOTE_HSTACK_RESULT' },
            { id: 'docker', envName: 'DOCKER_RESULT' },
            { id: 'npm', envName: 'NPM_RESULT' },
            { id: 'release-verification', envName: 'RELEASE_VERIFY_RESULT' },
          ];
          const input = {
            run: process.env.GITHUB_RUN_ID,
            channel: process.env.CHANNEL,
            sourceSha: process.env.SOURCE_SHA || 'unavailable',
            requestedSurfaces: definitions.map(({ id }) => ({ id, requested: requested[id], required: true })),
            surfaces: definitions.map(({ id, envName, product, versionName }) => {
              const result = normalizeResult(process.env[envName]);
              return {
                id,
                result,
                ...(result === 'success' ? { identity: {
                  verified: product
                    ? Boolean(process.env[versionName]) && normalizeResult(process.env.CANDIDATE_VERIFY_RESULT) === 'success'
                    : true,
                  sourceSha: process.env.SOURCE_SHA || 'unavailable',
                  ...(product ? { product, version: process.env[versionName] ?? '' } : {}),
                } } : {}),
              };
            }),
          };
          process.stdout.write(`${JSON.stringify(input)}\n`);
          NODE
          node scripts/pipeline/release/summarize-release-status.mjs \
            --input "$RUNNER_TEMP/release-status-input.json" \
            --out "$RUNNER_TEMP/release-status.json"
          {
            echo '## Release status'
            echo '```json'
            cat "$RUNNER_TEMP/release-status.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload terminal release status
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: happier-release-status
          path: ${{ runner.temp }}/release-status.json
          if-no-files-found: error
          overwrite: true

  sync_dev:
    if: ${{ inputs.dry_run != true && inputs.environment == 'production' && (vars.RELEASE_SYNC_DEV_FROM_MAIN == '' || vars.RELEASE_SYNC_DEV_FROM_MAIN == 'true') && needs.release_verify.result == 'success' }}
    needs: [plan, promote_main, bind_server_source, release_verify]
    uses: ./.github/workflows/promote-branch.yml
    secrets: inherit
    with:
      source: main
      source_sha: ${{ needs.bind_server_source.outputs.authorized_sha }}
      target: dev
      mode: fast_forward
      dry_run: false
      allow_reset: false
      confirm: promote dev from main
