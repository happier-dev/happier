name: RELEASE — Publish (preview + production)
run-name: ${{ inputs.hmaint_operation_id != '' && format('RELEASE — Publish ({0}, {1})', inputs.hmaint_operation_id, inputs.hmaint_attempt_id) || 'RELEASE — Publish (manual)' }}

on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: "Validation — Bounded public release profile"
        required: true
        type: choice
        default: integrated
        options:
          - integrated
          - stable
      waive_ci:
        description: "Maintainer override — accept this exact candidate without existing CI evidence"
        required: false
        default: false
        type: boolean
      approve_public_sdk_release:
        description: "Maintainer approval after reviewing this source's public API comparison, selected versions, and migration decision"
        required: false
        default: false
        type: boolean
      plugin_sdk_ready:
        description: "Plugin SDK/UI — PEP RB-A, SDK-EU-17, and RB-B are ready"
        required: false
        default: false
        type: boolean
      plugin_sdk_api_classification:
        description: "Plugin SDK/UI — classification of the displayed API comparison"
        required: false
        default: unreviewed
        type: choice
        options: [unreviewed, first_publication, compatible, breaking]
      plugin_sdk_migration_notes:
        description: "Plugin SDK/UI — not_required or the approved release notes ID"
        required: false
        default: not_required
        type: string
      sdk_auth_readiness:
        description: "External SDK — auth readiness"
        required: false
        default: not_ready
        type: choice
        options: [not_ready, ready, waived]
      sdk_auth_waiver:
        description: "External SDK — named auth waiver when readiness is waived"
        required: false
        default: ""
        type: string
      sdk_api_classification:
        description: "External SDK — classification of the displayed API comparison"
        required: false
        default: unreviewed
        type: choice
        options: [unreviewed, first_publication, compatible, breaking]
      sdk_migration_notes:
        description: "External SDK — not_required or the approved release notes ID"
        required: false
        default: not_required
        type: string
      include_validation_suites:
        description: "Maintainer refinement — comma-separated additional validation suite IDs"
        required: false
        default: ""
        type: string
      waive_validation_suites:
        description: "Maintainer override — comma-separated heavy validation suite IDs to mark WAIVED"
        required: false
        default: ""
        type: string
      override_reason:
        description: "Maintainer override — required bounded reason when evidence is waived"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Safety — Run checks and show plan, but do not push/deploy"
        required: true
        default: false
        type: boolean
      environment:
        description: "Deploy — Target environment (deploy/<env>/*)"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      deploy_targets:
        description: "Deploy — Comma-separated targets: ui,server,website,docs,cli,stack,server_runner"
        required: true
        default: ui,server,website,docs
        type: string
      force_deploy:
        description: "Deploy — Force promote + deploy for enabled targets even if no relevant changes are detected (useful after infra failures)"
        required: true
        default: false
        type: boolean
      ui_expo_action:
        description: "Deploy — UI Expo action (none|ota|native|native_submit) for the selected environment"
        required: true
        default: none
        type: choice
        options:
          - none
          - ota
          - native
          - native_submit
      desktop_mode:
        description: "Deploy — Desktop artifacts mode"
        required: true
        type: choice
        default: none
        options:
          - none
          - build_only
          - build_and_publish
      qualified_v4_activation_approval:
        description: "Qualified V4 activation — explicit irreversible-migration approval only: attests backup/restore readiness, all old API and worker writers are stopped and remain stopped if migration fails, and no old-server or old-daemon rollback."
        required: false
        default: false
        type: boolean
      confirm:
        description: "Confirm — Choose the exact branch-promotion action."
        required: true
        type: choice
        options:
          - release dev to preview
          - release preview to main
          - reset main from preview
          - release dev to main
          - reset main from dev
      candidate_run_id:
        description: "Preview CLI candidate — exact prior workflow run ID (requires candidate_version and candidate_source_sha)"
        required: false
        default: ""
        type: string
      candidate_version:
        description: "Preview CLI candidate — exact embedded CLI version"
        required: false
        default: ""
        type: string
      candidate_source_sha:
        description: "Preview CLI candidate — exact 40-character source SHA"
        required: false
        default: ""
        type: string
      authorized_promotion_source_sha:
        description: "Safety — exact source branch SHA approved for promotion"
        required: false
        default: ""
        type: string
      workflow_control_sha:
        description: "Safety — dispatcher-observed dev SHA; leave empty only for emergency direct manual dispatch"
        required: false
        default: ""
        type: string
      hmaint_operation_id:
        description: "Safety — conductor operation ID; leave empty only for emergency direct manual dispatch"
        required: false
        default: ""
        type: string
      hmaint_attempt_id:
        description: "Safety — conductor execution attempt identity"
        required: false
        default: "attempt_1"
        type: string
      release_notes_id:
        description: "Release notes — Exact approved project release ID"
        required: true
        type: string
      resume_run_id:
        description: "Resume — prior full-release run ID whose verified immutable candidates may be reused"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-unified
  cancel-in-progress: false

jobs:
  trusted_ref_guard:
    name: Admit trusted release workflow ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject cross-repository or untrusted release control
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = "$WORKFLOW_REPOSITORY"
          case "$WORKFLOW_REF" in
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/dev"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/preview"|\
            "$WORKFLOW_REPOSITORY/.github/workflows/release.yml@refs/heads/main") ;;
            *) echo "Untrusted release workflow ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac
      - name: Verify workflow-control SHA
        env:
          WORKFLOW_CONTROL_SHA: ${{ inputs.workflow_control_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_CONTROL_SHA" ]; then
            exit 0
          fi
          if ! [[ "$WORKFLOW_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow_control_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          if [ "$WORKFLOW_SHA" != "$WORKFLOW_CONTROL_SHA" ]; then
            echo "Workflow-control SHA drift: loaded '$WORKFLOW_SHA', expected '$WORKFLOW_CONTROL_SHA'." >&2
            exit 1
          fi

  release_actor_guard:
    name: Release actor guard
    needs: [trusted_ref_guard]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Authorize release actor
        uses: ./.github/actions/release-actor-guard
        with:
          team_slug: release-admins
          app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  snapshot_release_issues:
    name: Snapshot issues eligible for this channel release
    needs: [release_actor_guard]
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      eligible: ${{ steps.snapshot.outputs.eligible }}
      source_issues_json: ${{ steps.snapshot.outputs.source_issues_json }}
      dev_issues_json: ${{ steps.snapshot.outputs.dev_issues_json }}
      preview_issues_json: ${{ steps.snapshot.outputs.preview_issues_json }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Snapshot open issues from the source channel
        id: snapshot
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
          INCLUDE_DEVELOPMENT_STAGES: ${{ inputs.environment == 'preview' || (inputs.environment == 'production' && (inputs.confirm == 'release dev to main' || inputs.confirm == 'reset main from dev')) }}
          INCLUDE_PREVIEW_STAGE: ${{ inputs.environment == 'production' && (inputs.confirm == 'release preview to main' || inputs.confirm == 'reset main from preview') }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "source_issues_json=[]" >> "$GITHUB_OUTPUT"
            echo "dev_issues_json=[]" >> "$GITHUB_OUTPUT"
            echo "preview_issues_json=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_issues_json="[]"
          dev_issues_json="[]"
          preview_issues_json="[]"
          if [ "$INCLUDE_DEVELOPMENT_STAGES" = "true" ]; then
            source_issues_json="$(node scripts/pipeline/github/reconcile-issue-stage.mjs snapshot --repo "$GITHUB_REPOSITORY" --from-stage "stage:source")"
            dev_issues_json="$(node scripts/pipeline/github/reconcile-issue-stage.mjs snapshot --repo "$GITHUB_REPOSITORY" --from-stage "stage:dev")"
          fi
          if [ "$INCLUDE_PREVIEW_STAGE" = "true" ]; then
            preview_issues_json="$(node scripts/pipeline/github/reconcile-issue-stage.mjs snapshot --repo "$GITHUB_REPOSITORY" --from-stage "stage:preview")"
          fi
          echo "source_issues_json=$source_issues_json" >> "$GITHUB_OUTPUT"
          echo "dev_issues_json=$dev_issues_json" >> "$GITHUB_OUTPUT"
          echo "preview_issues_json=$preview_issues_json" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  resolve_resume:
    name: Resolve verified prior release candidates
    needs: [release_actor_guard, ci]
    if: ${{ needs.release_actor_guard.result == 'success' && needs.ci.result == 'success' }}
    uses: ./.github/workflows/resolve-release-resume.yml
    with:
      origin_run_id: ${{ inputs.resume_run_id }}
      expected_workflow: .github/workflows/release.yml
      expected_channel: ${{ inputs.environment }}
      expected_source_sha: ${{ inputs.authorized_promotion_source_sha }}
      expected_operation_id: ${{ inputs.hmaint_operation_id }}

  resolve_validation_profile:
    name: Resolve bounded release validation profile
    needs: [release_actor_guard]
    if: ${{ needs.release_actor_guard.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
      checks_profile: ${{ steps.resolve.outputs.checks_profile }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Resolve public profile
        id: resolve
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release-validation/resolve-profile.mjs "$VALIDATION_PROFILE"

  ci:
    name: Verify exact-SHA CI evidence
    needs: [resolve_validation_profile]
    if: ${{ needs.resolve_validation_profile.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_ref: ${{ steps.dispatch.outputs.source_ref }}
      base_ref: ${{ steps.dispatch.outputs.base_ref }}
      compare_label: ${{ steps.dispatch.outputs.compare_label }}
      ci_run_id: ${{ steps.existing_ci.outputs.ci_run_id }}
      ci_run_url: ${{ steps.existing_ci.outputs.ci_run_url }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Validate release dispatch
        id: dispatch
        env:
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          HMAINT_OPERATION_ID: ${{ inputs.hmaint_operation_id }}
          HMAINT_ATTEMPT_ID: ${{ inputs.hmaint_attempt_id }}
          RELEASE_NOTES_ID: ${{ inputs.release_notes_id }}
          BUMP: none
          CONFIRM: ${{ inputs.confirm }}
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          WAIVE_CI: ${{ inputs.waive_ci }}
          APPROVE_PUBLIC_SDK_RELEASE: ${{ inputs.approve_public_sdk_release }}
          INCLUDE_VALIDATION_SUITES: ${{ inputs.include_validation_suites }}
          WAIVE_VALIDATION_SUITES: ${{ inputs.waive_validation_suites }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/validate-release-dispatch.mjs
      - name: Record explicit maintainer overrides
        if: ${{ inputs.waive_ci == true || inputs.waive_validation_suites != '' }}
        env:
          WAIVE_CI: ${{ inputs.waive_ci }}
          WAIVE_VALIDATION_SUITES: ${{ inputs.waive_validation_suites }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          {
            echo '### Maintainer release overrides'
            if [ "$WAIVE_CI" = "true" ]; then echo '- Exact-SHA CI evidence: **WAIVED**'; fi
            if [ -n "$WAIVE_VALIDATION_SUITES" ]; then echo "- Validation suites: **WAIVED** ($WAIVE_VALIDATION_SUITES)"; fi
            echo "- Reason: $OVERRIDE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify successful existing CI for exact source
        id: existing_ci
        if: ${{ inputs.dry_run != true && inputs.waive_ci != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          SOURCE_BRANCH: ${{ steps.dispatch.outputs.source_ref }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/verify-existing-ci.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --workflow tests.yml \
            --source-sha "$SOURCE_SHA" \
            --source-branch "$SOURCE_BRANCH" \
            --github-output "$GITHUB_OUTPUT"

  plan:
    name: Release Plan (inputs + changes + bump/publish decisions)
    needs: [release_actor_guard, resolve_resume, resolve_validation_profile, ci]
    if: ${{ always() && needs.release_actor_guard.result == 'success' && needs.resolve_resume.result == 'success' && needs.resolve_validation_profile.result == 'success' && needs.ci.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed_ui: ${{ steps.plan.outputs.changed_ui }}
      changed_cli: ${{ steps.plan.outputs.changed_cli }}
      changed_server: ${{ steps.plan.outputs.changed_server }}
      changed_website: ${{ steps.plan.outputs.changed_website }}
      changed_docs: ${{ steps.plan.outputs.changed_docs }}
      changed_cli_stack_shared: ${{ steps.plan.outputs.changed_cli_stack_shared }}
      changed_shared: ${{ steps.plan.outputs.changed_shared }}
      changed_stack: ${{ steps.plan.outputs.changed_stack }}
      changed_plugin_sdk: ${{ steps.plan.outputs.changed_plugin_sdk }}
      changed_sdk: ${{ steps.plan.outputs.changed_sdk }}
      bump_app: ${{ steps.bump_plan.outputs.bump_app }}
      bump_cli: ${{ steps.bump_plan.outputs.bump_cli }}
      bump_stack: ${{ steps.bump_plan.outputs.bump_stack }}
      bump_server: ${{ steps.bump_plan.outputs.bump_server }}
      bump_website: ${{ steps.bump_plan.outputs.bump_website }}
      bump_plugin_sdk: ${{ steps.bump_plan.outputs.bump_plugin_sdk }}
      bump_sdk: ${{ steps.bump_plan.outputs.bump_sdk }}
      should_bump: ${{ steps.bump_plan.outputs.should_bump }}
      publish_cli: ${{ steps.bump_plan.outputs.publish_cli }}
      publish_stack: ${{ needs.resolve_resume.outputs.stack_requested == 'true' || steps.bump_plan.outputs.publish_stack == 'true' }}
      publish_server: ${{ steps.bump_plan.outputs.publish_server }}
      publish_plugin_sdk: ${{ steps.bump_plan.outputs.publish_plugin_sdk }}
      publish_sdk: ${{ steps.bump_plan.outputs.publish_sdk }}
      source_sha: ${{ steps.planning_source.outputs.source_sha }}
      publish_server_runtime_needed: ${{ needs.resolve_resume.outputs.server_requested == 'true' || inputs.force_deploy == true || steps.bump_plan.outputs.publish_server == 'true' || steps.plan.outputs.changed_ui == 'true' || steps.plan.outputs.changed_server == 'true' || steps.plan.outputs.changed_shared == 'true' }}
      publish_cli_binaries_needed: ${{ needs.resolve_resume.outputs.cli_requested == 'true' || inputs.candidate_run_id != '' || inputs.force_deploy == true || steps.bump_plan.outputs.publish_cli == 'true' || steps.plan.outputs.changed_cli == 'true' || steps.plan.outputs.changed_cli_stack_shared == 'true' || steps.plan.outputs.changed_shared == 'true' }}
      validation_profile: ${{ needs.resolve_validation_profile.outputs.profile }}
      checks_profile: ${{ needs.resolve_validation_profile.outputs.checks_profile }}
      compatibility_analysis_required: ${{ steps.plan.outputs.compatibility_analysis_required }}
      risk_cli_upgrade: ${{ steps.plan.outputs.risk_cli_upgrade }}
      risk_session_continuity: ${{ steps.plan.outputs.risk_session_continuity }}
      risk_relay_upgrade: ${{ steps.plan.outputs.risk_relay_upgrade }}
      risk_mysql_contract: ${{ steps.plan.outputs.risk_mysql_contract }}
      risk_platform_services: ${{ steps.plan.outputs.risk_platform_services }}
      risk_trust_roots: ${{ steps.plan.outputs.risk_trust_roots }}
      risk_plugin_sdk_package_changed: ${{ steps.plan.outputs.risk_plugin_sdk_package_changed }}
      risk_plugin_runtime_compatibility: ${{ steps.plan.outputs.risk_plugin_runtime_compatibility }}
      plugin_sdk_version: ${{ steps.public_sdk_versions.outputs.plugin_sdk_version }}
      sdk_version: ${{ steps.public_sdk_versions.outputs.sdk_version }}
      plugin_sdk_api_first_publication: ${{ steps.public_sdk_analysis.outputs.plugin_sdk_api_first_publication }}
      plugin_sdk_api_removed_symbols: ${{ steps.public_sdk_analysis.outputs.plugin_sdk_api_removed_symbols }}
      plugin_sdk_api_human_review_required: ${{ steps.public_sdk_analysis.outputs.plugin_sdk_api_human_review_required }}
      sdk_api_first_publication: ${{ steps.public_sdk_analysis.outputs.sdk_api_first_publication }}
      sdk_api_removed_symbols: ${{ steps.public_sdk_analysis.outputs.sdk_api_removed_symbols }}
      sdk_api_human_review_required: ${{ steps.public_sdk_analysis.outputs.sdk_api_human_review_required }}
    steps:
      - name: Checkout authorized release planning source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.authorized_promotion_source_sha || needs.ci.outputs.source_ref }}
          fetch-depth: 0

      - name: Verify authorized promotion source
        id: planning_source
        env:
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_REF: ${{ needs.ci.outputs.source_ref }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "source_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            exit 0
          fi
          current_source_sha="$(git ls-remote --exit-code origin "refs/heads/$SOURCE_REF" | awk 'NR == 1 { print $1 }')"
          if [ "$checked_out_sha" != "$AUTHORIZED_PROMOTION_SOURCE_SHA" ]; then
            echo "Release planning checkout does not match authorized promotion source SHA." >&2
            exit 1
          fi
          if [ "$current_source_sha" != "$AUTHORIZED_PROMOTION_SOURCE_SHA" ]; then
            echo "Source branch '$SOURCE_REF' no longer resolves to the authorized promotion source SHA." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Admit irreversible Qualified V4 activation
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          QUALIFIED_V4_ACTIVATION_APPROVAL: ${{ inputs.qualified_v4_activation_approval }}
        run: |
          set -euo pipefail
          deploy_branch="deploy/${DEPLOY_ENVIRONMENT}/server"
          baseline_ref="refs/remotes/origin/${deploy_branch}"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/${deploy_branch}" >/dev/null
          baseline_status=$?
          set -e
          case "$baseline_status" in
            0) git fetch --no-tags origin "refs/heads/${deploy_branch}:${baseline_ref}" ;;
            2) ;;
            *) echo "Unable to resolve deployed server migration baseline ${deploy_branch}." >&2; exit "$baseline_status" ;;
          esac
          node scripts/release/qualified-connected-accounts-v4-activation-admission.mjs \
            --baseline-ref "$baseline_ref" \
            --candidate-ref HEAD \
            --approval-kind explicit-checkbox \
            --approval-value "$QUALIFIED_V4_ACTIVATION_APPROVAL" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Compute changed components (current target..release source)
        id: plan
        env:
          PLAN_SOURCE_REF: ${{ needs.ci.outputs.source_ref }}
          PLAN_BASE_REF: ${{ needs.ci.outputs.base_ref }}
        run: |
          set -euo pipefail

          git fetch origin "${PLAN_BASE_REF}" "${PLAN_SOURCE_REF}" --prune --tags

          plan_head_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse "origin/${PLAN_BASE_REF}")"

          node scripts/pipeline/run.mjs release-compute-changed-components \
            --base "$base_sha" \
            --head "$plan_head_sha" \
            --out "$GITHUB_OUTPUT"

      - name: Compute versioned component changes (latest release tags..release head)
        id: versioned_plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          git fetch origin main dev preview --prune --tags

          plan_head_sha="$(git rev-parse HEAD)"

          node scripts/pipeline/run.mjs release-compute-versioned-component-changes \
            --environment "$ENVIRONMENT" \
            --head "$plan_head_sha" \
            --out "$GITHUB_OUTPUT"

      - name: Release plan summary
        env:
          APP_BASELINE_TAG: ${{ steps.versioned_plan.outputs.app_baseline_tag || 'none' }}
          CHANGED_CLI: ${{ steps.plan.outputs.changed_cli }}
          CHANGED_CLI_STACK_SHARED: ${{ steps.plan.outputs.changed_cli_stack_shared }}
          CHANGED_DOCS: ${{ steps.plan.outputs.changed_docs }}
          CHANGED_SERVER: ${{ steps.plan.outputs.changed_server }}
          CHANGED_SHARED: ${{ steps.plan.outputs.changed_shared }}
          CHANGED_STACK: ${{ steps.plan.outputs.changed_stack }}
          CHANGED_PLUGIN_SDK: ${{ steps.plan.outputs.changed_plugin_sdk }}
          CHANGED_SDK: ${{ steps.plan.outputs.changed_sdk }}
          CHANGED_UI: ${{ steps.plan.outputs.changed_ui }}
          CHANGED_WEBSITE: ${{ steps.plan.outputs.changed_website }}
          CHECKS_PROFILE: ${{ needs.resolve_validation_profile.outputs.checks_profile }}
          CLI_BASELINE_TAG: ${{ steps.versioned_plan.outputs.cli_baseline_tag || 'none' }}
          COMMIT_COUNT: ${{ steps.plan.outputs.commit_count }}
          COMPARE_LABEL: ${{ needs.ci.outputs.compare_label }}
          CONFIRM: ${{ inputs.confirm }}
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          DESKTOP_MODE: ${{ inputs.desktop_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ inputs.environment }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          PLAN_SOURCE_REF: ${{ needs.ci.outputs.source_ref }}
          RELEASE_BUMP: none
          STACK_BASELINE_TAG: ${{ steps.versioned_plan.outputs.stack_baseline_tag || 'none' }}
          UI_EXPO_ACTION: ${{ inputs.ui_expo_action }}
          VERSIONED_APP_CHANGED: ${{ steps.versioned_plan.outputs.changed_app }}
          VERSIONED_CLI_CHANGED: ${{ steps.versioned_plan.outputs.changed_cli }}
          VERSIONED_SERVER_CHANGED: ${{ steps.versioned_plan.outputs.changed_server }}
          VERSIONED_STACK_CHANGED: ${{ steps.versioned_plan.outputs.changed_stack }}
          VERSIONED_PLUGIN_SDK_CHANGED: ${{ steps.versioned_plan.outputs.changed_plugin_sdk }}
          VERSIONED_SDK_CHANGED: ${{ steps.versioned_plan.outputs.changed_sdk }}
          SERVER_BASELINE_TAG: ${{ steps.versioned_plan.outputs.server_baseline_tag || 'none' }}
        run: |
          set -euo pipefail

          {
            echo "## Release plan (\`$COMPARE_LABEL\`)"
            echo ""
            echo "- release planning source ref: \`$PLAN_SOURCE_REF\`"
            echo "- checks_profile: \`$CHECKS_PROFILE\`"
            echo "- environment: \`$ENVIRONMENT\`"
            echo "- confirm: \`$CONFIRM\`"
            echo "- dry_run: \`$DRY_RUN\`"
            echo "- deploy_targets: \`$DEPLOY_TARGETS\`"
            echo "- force_deploy: \`$FORCE_DEPLOY\`"
            echo "- bump: \`$RELEASE_BUMP\`"
            echo "- ui_expo_action: \`$UI_EXPO_ACTION\` (builder=\`eas_cloud\`, platform=\`all\`, profile=\`auto\`)"
            echo "- desktop_mode: \`$DESKTOP_MODE\`"
            echo ""
            echo "- commits to release ($COMPARE_LABEL): \`$COMMIT_COUNT\`"
            echo ""
            echo "### Changed components ($COMPARE_LABEL)"
            echo "- ui: \`$CHANGED_UI\`"
            echo "- cli: \`$CHANGED_CLI\`"
            echo "- server: \`$CHANGED_SERVER\`"
            echo "- stack: \`$CHANGED_STACK\`"
            echo "- website: \`$CHANGED_WEBSITE\`"
            echo "- docs: \`$CHANGED_DOCS\`"
            echo "- cli/stack shared (cli-common): \`$CHANGED_CLI_STACK_SHARED\`"
            echo "- shared (agents/protocol): \`$CHANGED_SHARED\`"
            echo "- plugin SDK pair: \`$CHANGED_PLUGIN_SDK\`"
            echo "- SDK: \`$CHANGED_SDK\`"
            echo ""
            echo "### Versioned components since latest release tags"
            echo "- app: \`$VERSIONED_APP_CHANGED\` (baseline=\`$APP_BASELINE_TAG\`)"
            echo "- cli: \`$VERSIONED_CLI_CHANGED\` (baseline=\`$CLI_BASELINE_TAG\`)"
            echo "- stack: \`$VERSIONED_STACK_CHANGED\` (baseline=\`$STACK_BASELINE_TAG\`)"
            echo "- server: \`$VERSIONED_SERVER_CHANGED\` (baseline=\`$SERVER_BASELINE_TAG\`)"
            echo "- plugin SDK pair: \`$VERSIONED_PLUGIN_SDK_CHANGED\`"
            echo "- SDK: \`$VERSIONED_SDK_CHANGED\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve publish + bump plan
        id: bump_plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUMP_PRESET: none
          BUMP_APP_OVERRIDE: preset
          BUMP_CLI_OVERRIDE: preset
          BUMP_STACK_OVERRIDE: preset
          BUMP_PLUGIN_SDK_OVERRIDE: preset
          BUMP_SDK_OVERRIDE: preset
          DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          CHANGED_UI: ${{ steps.plan.outputs.changed_ui }}
          CHANGED_CLI: ${{ steps.plan.outputs.changed_cli }}
          CHANGED_SERVER: ${{ steps.plan.outputs.changed_server }}
          CHANGED_WEBSITE: ${{ steps.plan.outputs.changed_website }}
          CHANGED_STACK: ${{ steps.plan.outputs.changed_stack }}
          CHANGED_CLI_STACK_SHARED: ${{ steps.plan.outputs.changed_cli_stack_shared }}
          CHANGED_SHARED: ${{ steps.plan.outputs.changed_shared }}
          CHANGED_PLUGIN_SDK: ${{ steps.plan.outputs.changed_plugin_sdk }}
          CHANGED_SDK: ${{ steps.plan.outputs.changed_sdk }}
          VERSIONED_APP_CHANGED: ${{ steps.versioned_plan.outputs.changed_app }}
          VERSIONED_CLI_CHANGED: ${{ steps.versioned_plan.outputs.changed_cli }}
          VERSIONED_STACK_CHANGED: ${{ steps.versioned_plan.outputs.changed_stack }}
          VERSIONED_SERVER_CHANGED: ${{ steps.versioned_plan.outputs.changed_server }}
          VERSIONED_PLUGIN_SDK_CHANGED: ${{ steps.versioned_plan.outputs.changed_plugin_sdk }}
          VERSIONED_SDK_CHANGED: ${{ steps.versioned_plan.outputs.changed_sdk }}
        run: |
          set -euo pipefail
          node scripts/pipeline/run.mjs release-resolve-bump-plan \
            --environment "${ENVIRONMENT}" \
            --bump-preset "${BUMP_PRESET}" \
            --bump-app-override "${BUMP_APP_OVERRIDE}" \
            --bump-cli-override "${BUMP_CLI_OVERRIDE}" \
            --bump-stack-override "${BUMP_STACK_OVERRIDE}" \
            --bump-plugin-sdk-override "${BUMP_PLUGIN_SDK_OVERRIDE}" \
            --bump-sdk-override "${BUMP_SDK_OVERRIDE}" \
            --deploy-targets "${DEPLOY_TARGETS}" \
            --changed-ui "${CHANGED_UI}" \
            --changed-cli "${CHANGED_CLI}" \
            --changed-stack "${CHANGED_STACK}" \
            --changed-server "${CHANGED_SERVER}" \
            --changed-website "${CHANGED_WEBSITE}" \
            --changed-cli-stack-shared "${CHANGED_CLI_STACK_SHARED}" \
            --changed-shared "${CHANGED_SHARED}" \
            --changed-plugin-sdk "${CHANGED_PLUGIN_SDK}" \
            --changed-sdk "${CHANGED_SDK}" \
            --versioned-app-changed "${VERSIONED_APP_CHANGED}" \
            --versioned-cli-changed "${VERSIONED_CLI_CHANGED}" \
            --versioned-stack-changed "${VERSIONED_STACK_CHANGED}" \
            --versioned-server-changed "${VERSIONED_SERVER_CHANGED}" \
            --versioned-plugin-sdk-changed "${VERSIONED_PLUGIN_SDK_CHANGED}" \
            --versioned-sdk-changed "${VERSIONED_SDK_CHANGED}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve selected public SDK versions before approval admission
        id: public_sdk_versions
        if: ${{ steps.bump_plan.outputs.publish_plugin_sdk == 'true' || steps.bump_plan.outputs.publish_sdk == 'true' }}
        env:
          RELEASE_CHANNEL: ${{ inputs.environment }}
          PUBLISH_PLUGIN_SDK: ${{ steps.bump_plan.outputs.publish_plugin_sdk }}
          PUBLISH_SDK: ${{ steps.bump_plan.outputs.publish_sdk }}
        run: |
          set -euo pipefail
          node scripts/pipeline/npm/resolve-release-metadata.mjs \
            --channel "$RELEASE_CHANNEL" \
            --source-ref "${{ inputs.environment == 'production' && 'main' || 'preview' }}" \
            --npm-tag "${{ inputs.environment == 'production' && 'latest' || 'next' }}" \
            --publish-cli false \
            --publish-stack false \
            --publish-server false \
            --publish-plugin-sdk "$PUBLISH_PLUGIN_SDK" \
            --publish-sdk "$PUBLISH_SDK" \
            --publish-channels-protocol false \
            --github-output "$GITHUB_OUTPUT"

      - name: Compare public SDK APIs for the exact planning source
        id: public_sdk_analysis
        if: ${{ steps.bump_plan.outputs.publish_plugin_sdk == 'true' || steps.bump_plan.outputs.publish_sdk == 'true' }}
        env:
          RELEASE_CHANNEL: ${{ inputs.environment }}
          PLAN_BASE_REF: ${{ needs.ci.outputs.base_ref }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse "origin/${PLAN_BASE_REF}")"
          head_sha="$(git rev-parse HEAD)"
          node scripts/pipeline/release/analyze-release-change.mjs \
            --base "$base_sha" \
            --head "$head_sha" \
            --profile "${{ needs.resolve_validation_profile.outputs.profile }}" \
            --channel "${{ inputs.environment == 'production' && 'stable' || 'preview' }}" \
            --has-cli-candidate false \
            --has-server-candidate false \
            --has-published-relay-predecessor false \
            --trust-checked-in-governance true \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  mysql_db_contract:
    name: Server DB Contract (MySQL 8)
    needs: [plan]
    if: ${{ needs.plan.outputs.publish_server_runtime_needed == 'true' && needs.plan.outputs.risk_mysql_contract == 'true' }}
    uses: ./.github/workflows/extended-db-tests.yml
    with:
      run_e2e_postgres: false
      run_e2e_mysql: false
      run_db_contract_postgres: false
      run_db_contract_mysql: true

  platform_service_validation:
    name: Platform service validation
    needs: [plan]
    if: ${{ needs.plan.outputs.risk_platform_services == 'true' && (needs.plan.outputs.publish_server_runtime_needed == 'true' || needs.plan.outputs.publish_cli_binaries_needed == 'true') }}
    uses: ./.github/workflows/tests.yml
    with:
      select_jobs_explicitly: true
      run_ui_e2e: false
      run_wsrepl_lima: false
      run_mobile_e2e_android: false
      run_mobile_e2e_ios: false
      run_ui: false
      run_plugin_workspaces: false
      run_server: false
      run_server_db_contract: false
      run_cli: false
      run_stack: false
      run_typecheck: false
      run_cli_daemon_e2e: false
      run_e2e_core: false
      run_e2e_core_slow: false
      run_providers: false
      run_stress: false
      run_release_contracts: false
      run_installers_smoke: false
      run_binary_smoke: false
      run_cli_update_continuity: false
      run_daemon_continuity: false
      run_session_continuity: false
      run_release_assets_docker: false
      run_self_host_systemd: true
      run_self_host_launchd: true
      run_self_host_schtasks: true
      run_self_host_daemon: true

  trust_root_validation:
    name: Installer and updater trust-root validation
    needs: [plan]
    if: ${{ needs.plan.outputs.risk_trust_roots == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact authorized release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.authorized_promotion_source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Validate installer and updater trust roots
        run: |
          set -euo pipefail
          node --test scripts/release/installers_security.test.mjs
          node scripts/pipeline/run.mjs release-sync-installers --check
          node scripts/pipeline/run.mjs tauri-validate-updater-pubkey --config-path apps/ui/src-tauri/tauri.conf.json

  release_notes_admission:
    name: Admit canonical release notes for authorized source
    needs: [plan]
    if: ${{ always() && needs.plan.result == 'success' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Checkout exact authorized release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.authorized_promotion_source_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-source

      - name: Verify exact authorized release source
        working-directory: release-source
        env:
          SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Validate approved release notes from exact source
        id: release_notes
        env:
          RELEASE_NOTES_ID: ${{ inputs.release_notes_id }}
          SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/pipeline/release/release-notes/project-release-notes.mjs" \
            --release-id "$RELEASE_NOTES_ID" \
            --source-sha "$SOURCE_SHA" \
            --repo-root "$GITHUB_WORKSPACE/release-source" \
            --changelog "$GITHUB_WORKSPACE/release-source/apps/ui/CHANGELOG.md" > /dev/null

  release_admission:
    name: Admit release mutation and publication
    needs: [plan, mysql_db_contract, platform_service_validation, trust_root_validation]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - name: Enforce stable and risk-selected publication admission
        env:
          WAIVE_CI: ${{ inputs.waive_ci }}
          CHECKS_PROFILE: ${{ needs.plan.outputs.checks_profile }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PUBLISH_SERVER_RUNTIME_NEEDED: ${{ needs.plan.outputs.publish_server_runtime_needed }}
          PUBLISH_CLI_BINARIES_NEEDED: ${{ needs.plan.outputs.publish_cli_binaries_needed }}
          RISK_MYSQL_CONTRACT: ${{ needs.plan.outputs.risk_mysql_contract }}
          RISK_PLATFORM_SERVICES: ${{ needs.plan.outputs.risk_platform_services }}
          RISK_TRUST_ROOTS: ${{ needs.plan.outputs.risk_trust_roots }}
          MYSQL_GATE_RESULT: ${{ needs.mysql_db_contract.result }}
          PLATFORM_GATE_RESULT: ${{ needs.platform_service_validation.result }}
          TRUST_ROOT_GATE_RESULT: ${{ needs.trust_root_validation.result }}
          PUBLISH_PLUGIN_SDK: ${{ needs.plan.outputs.publish_plugin_sdk }}
          PUBLISH_SDK: ${{ needs.plan.outputs.publish_sdk }}
          PLUGIN_SDK_VERSION: ${{ needs.plan.outputs.plugin_sdk_version }}
          SDK_VERSION: ${{ needs.plan.outputs.sdk_version }}
          APPROVE_PUBLIC_SDK_RELEASE: ${{ inputs.approve_public_sdk_release }}
          PLUGIN_SDK_READY: ${{ inputs.plugin_sdk_ready }}
          PLUGIN_SDK_API_FIRST_PUBLICATION: ${{ needs.plan.outputs.plugin_sdk_api_first_publication }}
          PLUGIN_SDK_API_REMOVED_SYMBOLS: ${{ needs.plan.outputs.plugin_sdk_api_removed_symbols }}
          PLUGIN_SDK_API_HUMAN_REVIEW_REQUIRED: ${{ needs.plan.outputs.plugin_sdk_api_human_review_required }}
          PLUGIN_SDK_API_CLASSIFICATION: ${{ inputs.plugin_sdk_api_classification }}
          PLUGIN_SDK_MIGRATION_NOTES: ${{ inputs.plugin_sdk_migration_notes }}
          SDK_AUTH_READINESS: ${{ inputs.sdk_auth_readiness }}
          SDK_AUTH_WAIVER: ${{ inputs.sdk_auth_waiver }}
          SDK_API_FIRST_PUBLICATION: ${{ needs.plan.outputs.sdk_api_first_publication }}
          SDK_API_REMOVED_SYMBOLS: ${{ needs.plan.outputs.sdk_api_removed_symbols }}
          SDK_API_HUMAN_REVIEW_REQUIRED: ${{ needs.plan.outputs.sdk_api_human_review_required }}
          SDK_API_CLASSIFICATION: ${{ inputs.sdk_api_classification }}
          SDK_MIGRATION_NOTES: ${{ inputs.sdk_migration_notes }}
          RELEASE_CHANNEL: ${{ inputs.environment }}
          NPM_TAG: ${{ inputs.environment == 'production' && 'latest' || 'next' }}
          RELEASE_NOTES_ID: ${{ inputs.release_notes_id }}
        run: |
          set -euo pipefail
          node scripts/pipeline/release/admit-release.mjs
          if [ "$PUBLISH_PLUGIN_SDK" = "true" ] || [ "$PUBLISH_SDK" = "true" ]; then
            {
              echo '### Public SDK publication approval'
              echo "- Approved: $APPROVE_PUBLIC_SDK_RELEASE"
              if [ "$PUBLISH_PLUGIN_SDK" = "true" ]; then
                echo "- Plugin SDK/UI: $PLUGIN_SDK_VERSION; readiness=$PLUGIN_SDK_READY; classification=$PLUGIN_SDK_API_CLASSIFICATION; migration_notes=$PLUGIN_SDK_MIGRATION_NOTES"
              fi
              if [ "$PUBLISH_SDK" = "true" ]; then
                echo "- External SDK: $SDK_VERSION; auth=$SDK_AUTH_READINESS; classification=$SDK_API_CLASSIFICATION; migration_notes=$SDK_MIGRATION_NOTES"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy_plan:
    name: deploy_plan (source → deploy branches)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      always() && needs.plan.result == 'success' && (
        (inputs.dry_run == true && needs.prepare_release_candidate.result == 'skipped') ||
        (inputs.dry_run != true && needs.prepare_release_candidate.result == 'success')
      ) && (
        contains(format(',{0},', inputs.deploy_targets), ',server,') ||
        contains(format(',{0},', inputs.deploy_targets), ',website,') ||
        contains(format(',{0},', inputs.deploy_targets), ',docs,') ||
        (inputs.environment == 'production' && contains(format(',{0},', inputs.deploy_targets), ',ui,'))
      )
    needs: [plan, release_notes_admission, promote_preview, promote_main, prepare_release_candidate]
    outputs:
      deploy_ui_needed: ${{ steps.plan.outputs.deploy_ui_needed }}
      deploy_server_needed: ${{ steps.plan.outputs.deploy_server_needed }}
      deploy_website_needed: ${{ steps.plan.outputs.deploy_website_needed }}
      deploy_docs_needed: ${{ steps.plan.outputs.deploy_docs_needed }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout release source as inert data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.dry_run == true && needs.plan.outputs.source_sha || needs.prepare_release_candidate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: release-source

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Compute deploy plan (deploy/<env>/* behind release source?)
        id: plan
        working-directory: release-source
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REF: ${{ inputs.dry_run == true && needs.plan.outputs.source_sha || needs.prepare_release_candidate.outputs.source_sha }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          DEPLOY_UI: ${{ contains(format(',{0},', inputs.deploy_targets), ',ui,') }}
          DEPLOY_SERVER: ${{ contains(format(',{0},', inputs.deploy_targets), ',server,') }}
          DEPLOY_WEBSITE: ${{ contains(format(',{0},', inputs.deploy_targets), ',website,') }}
          DEPLOY_DOCS: ${{ contains(format(',{0},', inputs.deploy_targets), ',docs,') }}
        run: |
          set -euo pipefail
          node ../scripts/pipeline/release/compute-deploy-plan.mjs \
            --deploy-environment "${ENVIRONMENT}" \
            --source-ref "${SOURCE_REF}" \
            --force-deploy "${FORCE_DEPLOY}" \
            --deploy-ui "${DEPLOY_UI}" \
            --deploy-server "${DEPLOY_SERVER}" \
            --deploy-website "${DEPLOY_WEBSITE}" \
            --deploy-docs "${DEPLOY_DOCS}" \
            --github-output "$GITHUB_OUTPUT"

  promote_main:
    if: always() && needs.plan.result == 'success' && needs.release_admission.result == 'success' && needs.release_notes_admission.result == 'success' && inputs.dry_run != true && inputs.environment == 'production'
    needs: [plan, release_admission, release_notes_admission]
    uses: ./.github/workflows/promote-branch.yml
    secrets: inherit
    with:
      source: ${{ (inputs.confirm == 'release preview to main' || inputs.confirm == 'reset main from preview') && 'preview' || 'dev' }}
      source_sha: ${{ inputs.authorized_promotion_source_sha }}
      target: main
      mode: ${{ (inputs.confirm == 'reset main from preview' || inputs.confirm == 'reset main from dev') && 'reset' || 'fast_forward' }}
      dry_run: ${{ inputs.dry_run }}
      allow_reset: ${{ inputs.confirm == 'reset main from preview' || inputs.confirm == 'reset main from dev' }}
      confirm: >-
        ${{
          (inputs.confirm == 'reset main from preview' || inputs.confirm == 'reset main from dev')
            && format('reset main from {0}', ((inputs.confirm == 'reset main from preview') && 'preview' || 'dev'))
            || format('promote main from {0}', ((inputs.confirm == 'release preview to main') && 'preview' || 'dev'))
        }}

  promote_preview:
    if: always() && needs.plan.result == 'success' && needs.release_admission.result == 'success' && needs.release_notes_admission.result == 'success' && inputs.dry_run != true && inputs.environment == 'preview'
    needs: [plan, release_admission, release_notes_admission]
    uses: ./.github/workflows/promote-branch.yml
    secrets: inherit
    with:
      source: dev
      source_sha: ${{ inputs.authorized_promotion_source_sha }}
      target: preview
      mode: fast_forward
      dry_run: ${{ inputs.dry_run }}
      allow_reset: false
      confirm: promote preview from dev

  prepare_release_candidate:
    name: Prepare exact promoted release candidate
    if: always() && needs.plan.result == 'success' && needs.release_admission.result == 'success' && inputs.dry_run != true && ((inputs.environment == 'production' && needs.promote_main.result == 'success') || (inputs.environment == 'preview' && needs.promote_preview.result == 'success'))
    needs: [plan, release_admission, promote_preview, promote_main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      build_run_id: ${{ steps.identity.outputs.build_run_id }}
      release_notes_github_markdown: ${{ steps.release_notes.outputs.github_markdown }}
      release_notes_expo_message: ${{ steps.release_notes.outputs.expo_message }}
    steps:
      - name: Resolve promoted branch once
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ inputs.environment == 'production' && 'main' || 'preview' }}
          AUTHORIZED_PROMOTION_SOURCE_SHA: ${{ inputs.authorized_promotion_source_sha }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/${GH_REPO}/branches/${SOURCE_BRANCH}" --jq '.commit.sha')"
          test "$(printf '%s' "$source_sha" | wc -c | tr -d ' ')" = "40"
          if [ "$AUTHORIZED_PROMOTION_SOURCE_SHA" != "$source_sha" ]; then
            echo "Promoted branch does not match the authorized promotion source SHA." >&2
            exit 1
          fi
          if [ -n "$CANDIDATE_SOURCE_SHA" ] && [ "$CANDIDATE_SOURCE_SHA" != "$source_sha" ]; then
            echo "CLI candidate source does not match the promoted preview source." >&2
            exit 1
          fi
          {
            echo "source_sha=$source_sha"
            echo "build_run_id=${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout trusted release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Checkout exact candidate release notes source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.identity.outputs.source_sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Project approved release notes from exact candidate
        id: release_notes
        env:
          RELEASE_NOTES_ID: ${{ inputs.release_notes_id }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/pipeline/release/release-notes/project-release-notes.mjs" \
            --release-id "$RELEASE_NOTES_ID" \
            --source-sha "$SOURCE_SHA" \
            --repo-root "$GITHUB_WORKSPACE/release-source" \
