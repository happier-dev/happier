<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happier · Voice lab</title>
<!-- Voice lab (2026-10-02, voice convergence program). Shared kit + shared lab host, loaded read-only from ../settings and
     ../app-surfaces; shell frames reuse the R1 shell, workspace top rail, session shell, Companion and phone kits.
     The planet is the Daybreak dot planet (../daybreak/engine.js); voice-planet.{css,js} binds voice states to it (window.VP).
     Shots (WebGL needs the software-GL flags): run `node shots.mjs [concept-id | c:v:theme ...]` from this folder; they land in ./shots. -->
<link rel="stylesheet" href="../settings/lab.css">
<link rel="stylesheet" href="../settings/craft.css">
<link rel="stylesheet" href="../app-surfaces/app.css">
<link rel="stylesheet" href="../app-surfaces/sidebar-lab.css">
<link rel="stylesheet" href="../app-surfaces/home-index.css">
<link rel="stylesheet" href="../app-surfaces/pane-states.css">
<link rel="stylesheet" href="../app-surfaces/session-tabs.css">
<link rel="stylesheet" href="../app-surfaces/companion-nav.css">
<link rel="stylesheet" href="../app-surfaces/cwidgets-lab.css">
<link rel="stylesheet" href="../app-surfaces/workspace-lab.css">
<link rel="stylesheet" href="../daybreak/daybreak.css">
<link rel="stylesheet" href="voice-planet.css">
<script>
/* ── Concept registry ──────────────────────────────────────────────────────────────────────────────────────────
   One line per concept page. Convention: concept id `x` loads `x.css` and `screens-x.js` from this folder and
   registers S['x'] (more ids from the same file: add `ids: [...]`). Tab order = this order.
   Concurrent lanes: edit ONLY your own line (they are pre-registered); add a new line at the end for a new page. */
window.VOICE_CONCEPTS = [
  { id: 'voice-presence' },   // lane A · live pill, Companion glance, composer planet, orb, phone pill/sheet, lock screen
  { id: 'voice-settings' },   // lane B · Settings → Voice
  { id: 'voice-moments' },    // lane C · Try voice, Brief me, hold-to-talk, handoff, Needs you aloud
];
for (const c of window.VOICE_CONCEPTS) document.write(`<link rel="stylesheet" href="${c.css || c.id + '.css'}">`);
</script>
</head>
<body>
<div class="lab" id="lab">
  <div class="labbar">
    <b>Voice</b>
    <div class="labgrp" id="concepts"></div>
    <div class="labgrp" id="variants"></div>
    <span style="flex:1"></span>
    <div class="labgrp" id="theme"><button data-v="light" class="on">Light</button><button data-v="dark">Dark</button></div>
    <div class="labgrp" id="notesT"><button data-v="on" class="on">Notes</button></div>
  </div>
  <div class="labstage"><div class="viewport" id="viewport"></div><aside class="notes" id="notes"></aside></div>
</div>
<script src="../settings/kit.js"></script>
<script src="../settings/screens-a.js"></script>
<script src="../settings/screens-craft-c.js"></script>
<script src="../settings/screens-craft-d.js"></script>
<script src="../app-surfaces/screens-sidebar.js"></script>
<script src="../app-surfaces/screens-rail.js"></script>
<script src="../app-surfaces/screens-hindex.js"></script>
<script src="../app-surfaces/screens-pane-states.js"></script>
<script src="../app-surfaces/screens-workspace.js"></script>
<!-- the Daybreak engine owns the planet (one model, one WebGL2 context, one clock); voice only binds states to it -->
<script src="../daybreak/qrcore.js"></script>
<script src="../daybreak/mark.js"></script>
<script src="../daybreak/engine.js"></script>
<script src="../daybreak/scenes.js"></script>
<script src="voice-planet.js"></script>
<script>
for (const c of window.VOICE_CONCEPTS) document.write(`<script src="${c.js || 'screens-' + c.id + '.js'}"><\/script>`);
</script>
<script>window.LAB_ORDER = window.VOICE_CONCEPTS.flatMap((c) => c.ids || [c.id]);</script>
<script src="../app-surfaces/lab-host.js"></script>
</body>
</html>
